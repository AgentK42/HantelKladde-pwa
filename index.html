<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E6E7E2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HantelKladde">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%231552B8'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='2' stroke-linecap='round'%3E%3Cpath d='M8 6.5v11M16 6.5v11M8 12h8M5 9.5v5M19 9.5v5'/%3E%3C/g%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<title>HantelKladde</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<meta name="application-name" content="HantelKladde">
<style>
:root {
  --bg:#E6E7E2; --surface:#FBFBF9; --raise:#F1F2EE;
  --ink:#101314; --muted:#6C736E; --line:#D2D6CE;
  --accent:#1552B8; --accent-ink:#FFFFFF; --record:#C8102E; --done:#1F7A4C;
  --shadow:0 1px 0 rgba(16,19,20,0.06);
  /* Einzelne Übungen im Entwurf der Planung, neben den Planfarben, siehe
     draftSources(), und die Volumenbalken im Verlauf, siehe volChart() */
  --extra:#0E7C86;
}
html[data-theme="dark"] {
  --bg:#151816; --surface:#1E2320; --raise:#262C28;
  --ink:#ECEEE9; --muted:#98A099; --line:#333A36;
  --accent:#5B93F5; --accent-ink:#0B1220; --record:#F0637A; --done:#5CC48D;
  --shadow:none;
  --extra:#3FB7C2;
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
/* Kein Pull-to-refresh. Die App holt nichts vom Server, die Geste kann also
   nichts auffrischen, wohl aber mitten im Training die Seite neu laden. Im
   Fokus-Modus passiert das besonders leicht: dort ist der Inhalt kürzer als der
   Bildschirm, der Scroll-Container steht also immer am oberen Anschlag, und ein
   leicht schräger Wisch auf der Rep-Reihe (touch-action:pan-y, siehe .repsrow)
   geht direkt in die Browser-Geste. Ein neues Update kommt weiterhin über den
   Knopf, siehe applyUpdate(). */
html, body { margin:0; background:var(--bg); overscroll-behavior-y:contain; }
body {
  color:var(--ink); padding-bottom:calc(96px + env(safe-area-inset-bottom));
  font-family:"SF Pro Text", "Segoe UI", Roboto, ui-sans-serif, system-ui, sans-serif;
  font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased;
}
button, input, textarea, select { font:inherit; color:inherit; }
button { cursor:pointer; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

.bar { position:sticky; top:0; z-index:5; background:var(--bg);
  border-bottom:1px solid var(--line); }
.bar-top { display:flex; align-items:center; gap:10px; padding:8px 12px 0; }
.brand { font-size:15px; font-weight:750; letter-spacing:-0.02em; display:flex;
  align-items:center; }
.brand .hmark { display:inline-flex; color:var(--accent); margin-right:1px; }
.brand .hmark svg { stroke-width:2.1; }
/* Fünf Reiter seit 1.23.0: 9px statt 10px seitlich, damit die Leiste auch auf
   360px neben der Marke Platz hat. */
.seg { display:flex; gap:2px; margin-left:auto; }
.seg button { border:none; background:none; padding:6px 9px 8px; color:var(--muted);
  border-bottom:2px solid transparent; display:flex; align-items:center; }
.seg button.on { color:var(--ink); border-bottom-color:var(--accent); }

.wrap { padding:0 16px; max-width:680px; margin:0 auto; }
.notice { margin:12px 0 0; padding:12px 13px; border-radius:13px; font-size:13px;
  background:var(--raise); border:1px solid var(--line); color:var(--muted); line-height:1.55; }
.notice.bad { color:var(--record); border-color:var(--record); }
.notice.act { display:flex; align-items:center; gap:10px; color:var(--ink); }
.notice.act button { margin-left:auto; white-space:nowrap; padding:9px 13px; border-radius:11px;
  border:1px solid var(--accent); background:var(--accent); color:var(--accent-ink);
  font-size:13px; font-weight:650; }
.linklike { border:none; background:none; padding:0; font:inherit; font-weight:650;
  color:var(--accent); text-decoration:underline; }

.dateline { display:flex; align-items:center; gap:8px; padding:12px 0 7px;
  font-size:12.5px; color:var(--muted); }
.dateline .dact { margin-left:auto; display:flex; align-items:center; gap:8px; }
.dateline .today { padding:5px 10px; border-radius:10px; border:1px solid var(--line);
  background:var(--surface); font-size:12px; font-weight:650; color:var(--ink); }

.week { display:flex; gap:5px; overflow-x:auto; padding:0 0 12px; scrollbar-width:none; }
.week::-webkit-scrollbar { display:none; }
.wday { flex:0 0 42px; display:flex; flex-direction:column; align-items:center; gap:2px;
  padding:7px 0 6px; border-radius:12px; border:1px solid var(--line);
  background:var(--surface); }
.wday .wd { font-size:10.5px; color:var(--muted); }
.wday .dd { font-size:15px; font-weight:700; letter-spacing:-0.02em; }
.wday .dot { width:5px; height:5px; border-radius:50%; background:transparent;
  box-sizing:border-box; }
.wday.has .dot { background:var(--accent); }
.wday.part .dot { border:1.5px solid var(--muted); }
.wday.on { border-color:var(--ink); background:var(--raise); }
/* In der Planung zugewiesener Plan, noch nicht absolviert: leerer Ring, die Farbe
   kommt inline vom Plan, siehe dayCell(). */
.wday.plan .dot { border:1.5px solid var(--accent); }
/* Künftige Tage stehen seit 1.24.0 mit im Streifen; die matte Zahl hält die
   Grenze zum heutigen Tag sichtbar, siehe dayCell(). */
.wday.future .dd { color:var(--muted); }
/* Streifen und der Knopf zur Wochenübersicht daneben. Der Knopf steht außerhalb
   des Scrollbereichs, damit er beim Wischen stehen bleibt, siehe weekStrip(). */
.weekrow { display:flex; align-items:flex-start; gap:8px; }
.weekrow .week { flex:1; min-width:0; }
.weekmore { flex:0 0 40px; height:52px; border-radius:12px; border:1px solid var(--line);
  background:var(--surface); color:var(--muted); display:flex; align-items:center;
  justify-content:center; padding:0; }
/* Punkt-Legende unter der Wochenübersicht. Nicht .legend: das sind die Striche
   der Diagramme im Verlauf. */
.dotleg { display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:14px;
  font-size:11.5px; color:var(--muted); }
.dotleg span { display:inline-flex; align-items:center; gap:6px; }
.dotleg i { width:9px; height:9px; border-radius:50%; box-sizing:border-box; flex:0 0 auto; }
.dotleg i.full { background:var(--accent); }
.dotleg i.ring { border:1.5px solid var(--accent); }
.dotleg i.part { border:1.5px solid var(--muted); }

.plansgoalcap { font-size:15px; font-weight:700; letter-spacing:-0.01em; color:var(--ink);
  margin:0 0 10px 2px; }
.plans { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
.plans button { flex:1 1 40%; padding:9px 6px; border-radius:12px; border:1px solid var(--line);
  background:var(--surface); font-size:14px; font-weight:650; display:flex;
  flex-direction:column; gap:1px; align-items:center; }
.plans button.on { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.plans .pa { font-size:11px; font-weight:600; color:var(--muted); }
.plans button.on .pa { color:var(--accent-ink); opacity:0.75; }
.plans .pn { display:inline-flex; align-items:center; gap:6px; }
/* Zweite Zeile mit dem Wochenziel-Fortschritt, siehe planGoalLine() */
.plans .pgoal { font-size:11px; font-weight:700; color:var(--accent); }
.plans .pgoal.done { color:var(--done); }
.plans button.on .pgoal { color:var(--accent-ink); }
.plans button.on .pgoal.done { color:var(--accent-ink); }
.pdot { width:8px; height:8px; border-radius:50%; display:inline-block; }

/* Progressionsvorschlag direkt unter „Letztes Top Set“, mit kompakter Entscheidung. */
.suggestion { display:flex; align-items:center; gap:8px; margin-top:8px; padding-top:9px;
  border-top:1px solid var(--line); color:var(--accent); }
.suggestion > svg { flex:0 0 auto; }
.suggestion-copy { flex:1; min-width:130px; display:flex; flex-direction:column; gap:1px; }
.suggestion-copy b { font-size:12.5px; font-weight:750; }
.suggestion-copy span { color:var(--muted); font-size:11.5px; line-height:1.35; }
.suggestion-actions { display:flex; flex:0 0 auto; gap:5px; }
.suggestion-actions button { min-height:30px; padding:4px 7px; border-radius:8px;
  border:1px solid var(--line); background:var(--surface); color:var(--muted);
  font-size:11.5px; font-weight:700; display:flex; align-items:center; gap:4px; }
.suggestion-actions .accept { color:var(--done); border-color:var(--done); }
@media (max-width:430px) {
  .suggestion { flex-wrap:wrap; }
  .suggestion-actions { width:auto; margin-left:25px; }
  .suggestion-actions button { flex:0 0 auto; }
}
.hero.warm { border-color:var(--record); }
.flag { margin-top:11px; padding:10px 12px; border-radius:12px; font-size:12.5px;
  line-height:1.55; color:var(--ink); background:var(--raise);
  border:1px solid var(--record); }
.plates { margin-top:9px; padding:9px 12px; border-radius:12px; font-size:12.5px;
  color:var(--muted); background:var(--raise); }
.plates b { color:var(--record); font-weight:700; }
.warmrow { display:flex; flex-wrap:nowrap; align-items:center; gap:4px; margin-top:9px; }
.warmrow > span { flex:0 0 auto; font-size:11px; font-weight:700; color:var(--muted);
  margin-right:1px; }
.warmrow button { flex:1 1 auto; min-width:0; padding:6px 5px; border-radius:999px;
  border:1px solid var(--line); background:var(--surface); font-size:11px;
  font-weight:650; white-space:nowrap; }
.warmrow button s { text-decoration:none; color:var(--muted); font-weight:600; }
.save.warm { background:var(--record); border-color:var(--record); }
.set.warm .fig { font-size:15px; font-weight:650; color:var(--muted); }
.set.warm .no { color:var(--record); border-color:var(--record); border-style:dashed; }
textarea.note { width:100%; margin-top:8px; padding:11px 12px; border-radius:13px;
  border:1px solid var(--line); background:var(--surface); color:var(--ink);
  font:inherit; font-size:13.5px; line-height:1.5; resize:vertical; }
.plchips { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.plchips button { padding:8px 12px; border-radius:999px; border:1px solid var(--line);
  background:var(--surface); font-size:12.5px; font-weight:650; color:var(--muted); }
.plchips button.on { background:var(--accent); border-color:var(--accent);
  color:var(--accent-ink); }
.crow .barb { width:34px; height:36px; border-radius:10px; border:1px solid var(--line);
  background:var(--surface); color:var(--muted); display:flex; align-items:center;
  justify-content:center; padding:0; }
.crow .barb.on { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
/* Neu in 1.5.2: Geräteeinstellung je Übung, Umbenennen, Rekord-Übersicht */
.exnote { width:100%; display:flex; align-items:center; gap:9px; margin-top:9px;
  padding:9px 12px; border-radius:12px; border:1px solid var(--line);
  background:var(--raise); color:var(--ink); font-size:12.5px; text-align:left; }
.exnote > span { flex:1; min-width:0; line-height:1.45; min-height:calc(1.45em * 2);
  display:flex; align-items:center; }
.exnote svg { flex:0 0 auto; color:var(--muted); }
.exnote.blank { color:var(--muted); border-style:dashed; }
.exnedit { margin-top:7px; }
.exnedit input { width:100%; padding:11px 12px; border-radius:12px;
  border:1px solid var(--accent); background:var(--surface); color:var(--ink);
  font-size:13.5px; }
.crow .nm.ren { display:flex; align-items:center; gap:6px; min-width:0; background:none;
  border:none; padding:0; color:inherit; font:inherit; font-weight:650; text-align:left; }
.crow .nm.ren .chv { display:flex; flex:0 0 auto; color:var(--muted);
  transform:rotate(90deg); }
.crow .nm.ren .chv.up { transform:rotate(-90deg); }
.crow .nm.ren > span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.cnote { display:flex; align-items:flex-start; gap:7px; padding:0 12px 9px;
  font-size:12px; color:var(--muted); line-height:1.45; }
.cnote svg { flex:0 0 auto; margin-top:1px; }
.exbox { padding:2px 12px 12px; background:var(--raise); }
.exbox label { display:block; margin:9px 0 5px; font-size:11.5px; font-weight:700;
  color:var(--muted); }
.exbox input, .exbox select { width:100%; padding:11px 12px; border-radius:12px;
  border:1px solid var(--line); background:var(--surface); color:var(--ink);
  font-size:14px; }
.exbox input.name { border-color:var(--accent); }
.exbox p { margin:8px 0 0; font-size:11.5px; color:var(--muted); line-height:1.55; }
.exbox .row { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:9px; }
.exbox .row button { padding:11px 8px; border-radius:11px; border:1px solid var(--line);
  background:var(--surface); font-size:13px; font-weight:650; }
.exbox .row button.go { background:var(--accent); border-color:var(--accent);
  color:var(--accent-ink); }
.prrow { display:grid; grid-template-columns:1fr auto; gap:2px 10px;
  padding:10px 13px; border-top:1px solid var(--line); }
.prrow:first-child { border-top:none; }
.prrow .nm { font-size:14px; font-weight:650; overflow:hidden; text-overflow:ellipsis;
  white-space:nowrap; }
.prrow .up { text-align:right; font-size:13px; font-weight:700; color:var(--done);
  white-space:nowrap; }
.prrow .hold { text-align:right; font-size:13px; font-weight:700; color:var(--record);
  white-space:nowrap; }
.prrow .fig { font-size:12.5px; color:var(--muted); }
.prrow .dt { text-align:right; font-size:12px; color:var(--muted); white-space:nowrap; }

/* Neu in 1.6.0: Trainings- und Auswahlbildschirm nach dem Android-Prototyp */
@keyframes hk-pop { 0%{transform:scale(.9);opacity:0} 60%{transform:scale(1.04);opacity:1}
  100%{transform:scale(1)} }
@keyframes hk-toast { 0%{transform:translateY(10px);opacity:0} 10%{transform:translateY(0);opacity:1}
  88%{transform:translateY(0);opacity:1} 100%{transform:translateY(10px);opacity:0} }

.loghead { display:flex; align-items:baseline; gap:8px; padding:0 2px 7px;
  font-size:11.5px; font-weight:650; color:var(--muted); }
.loghead em { margin-left:auto; font-style:normal; font-weight:600; }
.prog { display:flex; gap:4px; align-items:center; margin-bottom:14px; }
.prog button { flex:1; height:4px; min-width:0; padding:0; border:none; border-radius:2px;
  background:var(--line); transition:height .12s, background .12s; }
.prog button.part { background:var(--muted); }
.prog button.cur { height:8px; background:var(--accent); }
.prog button.done { background:var(--done); }

.setline { display:flex; align-items:center; gap:10px; font-size:11px; font-weight:700;
  color:var(--muted); letter-spacing:.12em; }
.hero-ex.tap { width:100%; display:flex; align-items:center; gap:8px; background:none;
  border:none; padding:0; margin-top:5px; color:inherit; font:inherit; font-size:27px;
  font-weight:800; letter-spacing:-.03em; line-height:1.12; text-align:left; }
.hero-ex.tap .chev { flex:0 0 auto; display:flex; color:var(--muted); }

/* Neu in 1.8.0: Kopfzeile der Übungskarte im Standard-Trainingsreiter, Name und
   Satzfortschritt nebeneinander statt der Satzanzeige mit den ±-Tasten darüber. */
.hero-top { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
.hero-top .hero-ex.tap { width:auto; flex:1; min-width:0; margin-top:0; }
.hero-top .hero-ex.tap span { flex:1; min-width:0; white-space:normal; word-break:break-word; }
.setprog { flex:0 0 auto; text-align:right; padding-top:6px; }
.setprog .bars { display:flex; gap:3px; justify-content:flex-end; }
.setprog .bars i { display:block; width:18px; height:4px; border-radius:2px; background:var(--line); }
/* Punkt 1+2: keine Textzeile "Satz X von Y" mehr, stattdessen blau der aktuelle
   und grün die erledigten Sätze - im Standard-Trainingsreiter wie im
   Fokus-Modus, siehe viewLog() und viewFocus(). */
.setprog .bars i.cur { background:var(--accent); }
.setprog .bars i.done { background:var(--done); }

.wdial { display:flex; align-items:center; justify-content:center; gap:14px;
  margin:20px 0 0; }
.wdial > button { width:62px; height:62px; flex:0 0 auto; border-radius:50%;
  border:1px solid var(--line); background:var(--raise); color:var(--ink);
  font-size:24px; font-weight:600; padding:0; }
.wdial > button.up { border:none; background:var(--accent); color:var(--accent-ink);
  font-size:26px; font-weight:750; }
.wdial > button:active { filter:brightness(0.92); }
.wdial .wmid { flex:1; min-width:0; min-height:62px; text-align:center;
  display:flex; flex-direction:column; justify-content:center; }
.wdial .val { display:block; }
.wdial input { width:100%; border:none; background:none; text-align:center; color:inherit;
  font:inherit; font-size:58px; font-weight:800; letter-spacing:-.05em; line-height:1;
  padding:0; }
.wdial input.pop { animation:hk-pop .18s ease-out; }
.wdial .wunit { font-size:12.5px; font-weight:700; color:var(--muted); margin-top:7px; }
.wdial .wnum { display:flex; align-items:baseline; justify-content:center; gap:3px; }
.wdial .wnum .val { display:block; flex:0 1 auto; min-width:0; max-width:100%;
  overflow:hidden; }
/* Eigene, kleinere Schriftgröße: bei 58px (wie beim alleinstehenden Gewicht) reicht
   der Platz neben "kg" auf einem Telefon nicht für einen mehrstelligen Wert mit
   Komma, siehe Kims Rückmeldung vom 08.09. Feste Breite statt des Attributs
   "size", das sich an dieser Schriftgröße als zu breit erwies und über den
   Plus-Knopf hinausragte. */
.wdial .wnum input { width:2.6em; text-align:center; font-size:40px; }
.wdial .wnum em { flex:0 0 auto; font-style:normal; font-size:14px; font-weight:700;
  color:var(--muted); }

/* Reps und RPE als zwei Stepper nebeneinander, nur im Standard-Trainingsreiter */
.steprow { display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:18px; }
.steprow.one { grid-template-columns:1fr; }
.stepbox { display:flex; align-items:center; justify-content:space-between; gap:6px;
  padding:8px 10px; border-radius:14px; border:1px solid var(--line); background:var(--raise); }
.stepbox button { width:32px; height:32px; flex:0 0 auto; border-radius:10px; border:none;
  background:var(--surface); color:var(--ink); font-size:17px; font-weight:700; padding:0; }
.stepbox button:active { filter:brightness(0.92); }
.stepbox .mid { flex:1; min-width:0; text-align:center; }
.stepbox .mid b { display:block; font-size:20px; font-weight:800; }
.stepbox .mid span { display:block; font-size:9.5px; font-weight:700; color:var(--muted);
  letter-spacing:.08em; text-transform:uppercase; margin-top:1px; }
.fieldlab { font-size:11px; font-weight:700; color:var(--muted); letter-spacing:.1em;
  margin:18px 0 8px; }
.pills { display:flex; gap:7px; }
.pills button { flex:1; min-width:0; padding:13px 0; border-radius:13px;
  border:1px solid var(--line); background:var(--raise); color:var(--muted);
  font-size:16px; font-weight:700; }
.pills button.on { background:var(--ink); border-color:var(--ink); color:var(--bg);
  font-weight:800; }
.pills button.on.rpe { background:var(--accent); border-color:var(--accent);
  color:var(--accent-ink); }
/* Ziel-Range der doppelten Progression, 1.13.0: Rahmen um die Tasten in der
   Range, sonst nichts. Nur in der Reps-Reihe des Fokus-Modus, siehe
   focusRepPills(). Die gewählte Taste bleibt farblich die gewählte, die Range
   färbt sie nur um, statt sie zu überdecken. */
.pills button.inrange { border-color:var(--accent); color:var(--ink); }
.pills button.inrange.on { background:var(--accent); border-color:var(--accent);
  color:var(--accent-ink); }

.savearea { position:relative; }
/* Nur im Standard-Trainingsreiter: derselbe Speichern-Knopf bleibt wie im
   Fokus-Modus am unteren Bildschirmrand stehen, statt mit der Übungskarte
   wegzuscrollen. */
.savearea.main { position:sticky; bottom:0; z-index:6; margin-top:3px;
  padding:3px 0 calc(3px + env(safe-area-inset-bottom)); background:var(--bg); }
/* Während der Pause hält sich die Zeile um die Höhe des Pausenbalkens höher,
   sonst liegt der Speichern-Knopf komplett darunter, siehe renderRest(). Hier der
   Haftpunkt statt zusätzlicher Polsterung wie bei .fx-foot.resting: die Fußzeile
   im Fokus-Modus steht fest, diese klebt und steht sonst im normalen Fluss - dort
   würde Polsterung ein Loch zwischen Knopf und nächstem Element aufreißen. */
.savearea.main.resting { bottom:calc(78px + env(safe-area-inset-bottom)); }
.savearea.main .save { margin-top:0; }
.toast { position:absolute; left:0; right:0; bottom:100%; margin-bottom:7px;
  text-align:center; padding:6px 10px; border-radius:10px; background:var(--raise);
  border:1px solid var(--line); font-size:11.5px; font-weight:650; color:var(--done);
  line-height:1.35; animation:hk-toast 2.6s ease-in-out forwards; }
/* Ein Rekord ist kein Routinesatz, die Meldung darf entsprechend auffallen.
   Eigene Zeile statt Anhängsel hinter dem Gewicht, siehe der <br> davor. */
.toast .hit { display:inline-block; margin-top:3px; font-size:16px; font-weight:800;
  letter-spacing:-0.01em; }
.subacts { display:flex; align-items:center; justify-content:space-between; gap:8px;
  margin-top:10px; }
.subacts button { background:none; border:none; padding:7px 2px; font-size:12.5px;
  font-weight:650; color:var(--muted); }
/* Satzziel erreicht: statt der zurückhaltenden Übersprung-Optik dieselbe Farbe
   und Rundung wie der Speichern-Knopf, weil es jetzt der nächste Schritt ist. */
.subacts button.go { flex:0 0 auto; padding:9px 16px; border-radius:13px;
  background:var(--accent); color:var(--accent-ink); font-weight:800; }

/* Neu in 1.7.0: Fokus-Modus, ein bildschirmfüllender Trainingsbildschirm ohne
   Reiter, Wochenstreifen oder Planliste. */
.focusgo { width:100%; display:flex; align-items:center; justify-content:center;
  gap:8px; margin-bottom:14px; padding:12px; border-radius:13px; border:1px solid var(--line);
  background:var(--raise); color:var(--ink); font-size:14px; font-weight:700; }
.focusgo svg { color:var(--accent); }
.fx { position:fixed; inset:0; z-index:20; background:var(--bg); color:var(--ink);
  display:flex; flex-direction:column; }
.fx-head { flex:0 0 auto; display:flex; align-items:center; gap:12px;
  padding:calc(10px + env(safe-area-inset-top)) 18px 10px; }
.fx-head .back { display:flex; padding:6px; margin:-6px; border:none; background:none;
  color:var(--muted); }
.fx-head .who { min-width:0; flex:1; }
.fx-head .who b { display:block; font-size:13px; font-weight:700; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; }
.fx-head .who span { display:block; font-size:11px; color:var(--muted); margin-top:1px; }
.fx-head .who .wholine { display:flex; gap:18px; }
.fx-head .who .wholine em, .fx-head .who .wholine i { display:block; min-width:0;
  flex:0 1 auto; font-style:normal; white-space:nowrap; overflow:hidden;
  text-overflow:ellipsis; }
.fx .prog { margin:0 18px 18px; }
/* overscroll-behavior: der Ausschlag am Ende der Liste bleibt in diesem Kasten,
   statt an das Dokument weitergereicht zu werden, siehe html/body oben. */
.fx-body { flex:1 1 auto; min-height:0; overflow-y:auto; padding:0 20px;
  overscroll-behavior:contain; }
.fx-body.pad { padding-top:2px; }
/* Der Verlaufsblock schließt die Karte im Fokus ab, siehe exHistBlock(). Ohne
   den Abstand stößt seine untere Kante beim Scrollen bis ans Ende direkt an die
   Trennlinie des Fußes. */
.fx-body > .planhead:last-child, .fx-body > .exhist:last-child { margin-bottom:12px; }
.fx-blank { padding:20px 0; text-align:center; }
.fx-blank .save { margin-top:16px; }
.fx-foot { flex:0 0 auto; position:relative; padding:10px 20px
  calc(10px + env(safe-area-inset-bottom)); border-top:1px solid var(--raise); }
.fx-foot .save { height:56px; margin-top:0; }
.fx-foot .subacts { margin-top:8px; }
/* Reserviert die Höhe des fest stehenden Pausenbalkens, siehe renderRest() */
.fx-foot.resting { padding-bottom:calc(10px + env(safe-area-inset-bottom) + 78px); }
/* Punkt 9: verschwindet von selbst nach 5s, siehe showQuickUndo() */
.undoquick { width:100%; display:flex; align-items:center; justify-content:center;
  gap:7px; margin-bottom:9px; padding:10px; border-radius:12px; border:1px solid var(--line);
  background:var(--raise); color:var(--muted); font-size:12.5px; font-weight:650; }
/* Bestätigung vor dem Abschluss, falls noch andere Übungen des Plans offen
   sind, siehe endWarnBlock() in viewFocus(). Ersetzt vorübergehend den
   Speichern-Knopf, statt ihn zu überlagern, damit kein Tipp danebengeht. */
.endwarn { text-align:center; padding:14px 10px 4px; }
.endwarn b { display:block; font-size:19px; font-weight:800; letter-spacing:-0.01em;
  color:var(--record); }
.endwarn p { margin:6px 0 16px; font-size:14px; color:var(--muted); }
.endwarn .row { display:flex; gap:10px; }
.endwarn .row button { flex:1; padding:13px; border-radius:13px; font-size:14.5px;
  font-weight:700; border:1px solid var(--line); background:var(--raise); color:var(--ink); }
.endwarn .row button.go { border-color:var(--record); background:var(--record);
  color:#fff; }
.repsrow { display:flex; align-items:center; gap:6px; touch-action:pan-y; }
.repsrow .pills { flex:1; }
.chev { flex:0 0 auto; width:30px; height:40px; border-radius:11px;
  border:1px solid var(--line); background:var(--surface); color:var(--muted);
  display:flex; align-items:center; justify-content:center; padding:0; }
.chev.fwd svg { transform:rotate(180deg); }

.pkhead { display:flex; align-items:center; gap:10px; padding:12px 0 12px; }
.pkhead button { display:flex; padding:6px; margin:-6px; border:none; background:none;
  color:var(--muted); }
.pkhead b { font-size:16px; font-weight:750; letter-spacing:-.02em; }
/* Umschalter Kategorie/Muskelgruppe in der Mehrfachauswahl, siehe pickGroupBy in
   viewPicker(). Nur dort, die einfache Übungsauswahl bleibt bei der Kategorie. */
.seg2 { display:flex; gap:2px; padding:3px; margin-bottom:12px; border-radius:12px;
  background:var(--raise); border:1px solid var(--line); }
.seg2 button { flex:1; padding:8px 4px; border-radius:9px; border:none; background:none;
  color:var(--muted); font-size:12.5px; font-weight:700; }
.seg2 button.on { background:var(--surface); color:var(--ink); box-shadow:var(--shadow); }
/* Zeilenumbruch statt horizontalem Scrollen: sonst blieben bei der
   Muskelgruppen-Einteilung (bis zu 12 Pillen) hintere Gruppen leicht
   unbemerkt außerhalb des sichtbaren Bereichs. */
.catpills { display:flex; flex-wrap:wrap; gap:7px; padding:0 0 14px; }
.catpills button { flex:0 0 auto; padding:9px 15px; border-radius:999px;
  border:1px solid var(--line); background:var(--raise); color:var(--muted);
  font-size:13px; font-weight:650; }
.catpills button.on { background:var(--ink); border-color:var(--ink); color:var(--bg); }
.pkfind input { width:100%; padding:12px 13px; border-radius:12px;
  border:1px solid var(--line); background:var(--surface); color:var(--ink);
  font-size:14px; }
.pksect { display:flex; align-items:baseline; gap:8px; padding:14px 2px 10px; }
.pksect span { font-size:12.5px; font-weight:700; }
.pksect em { margin-left:auto; font-style:normal; font-size:11.5px; color:var(--muted); }

.excards { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.excard { position:relative; display:flex; flex-direction:column; text-align:left;
  padding:13px 13px 11px; border-radius:16px; border:1px solid var(--line);
  background:var(--surface); color:var(--ink); }
.excard.inplan { border-color:var(--accent); }
.excard.on { background:var(--raise); }
.excard .tag { display:flex; align-items:center; gap:6px; font-size:10px; font-weight:750;
  color:var(--muted); letter-spacing:.06em; }
.excard.inplan .tag { color:var(--accent); }
.excard .tag .pdot { background:var(--accent); }
.excard .nm { font-size:14.5px; font-weight:750; margin-top:7px; line-height:1.25; }
.excard .bars { display:flex; align-items:flex-end; gap:3px; height:26px; margin-top:10px; }
.excard .bars i { flex:1; background:var(--line); border-radius:2px; }
.excard .bars i.last { background:var(--accent); }
.excard .bars i.pad { background:var(--line); opacity:0.3; }
.excard .meta { font-size:11.5px; color:var(--muted); margin-top:7px; line-height:1.35; }
.excard .meta.flat { color:var(--record); font-weight:650; }
/* Mehrfachauswahl beim Übungen-Hinzufügen im Pläne-Reiter, siehe pickmulti-Aktionen */
.excard.sel { border-color:var(--accent); background:var(--accent); }
.excard.sel .tag, .excard.sel .nm, .excard.sel .meta { color:var(--accent-ink); }
.excard.sel .tag .pdot { background:var(--accent-ink); }
.excard.sel .bars i { background:rgba(255,255,255,.35); }
.excard.sel .bars i.last { background:var(--accent-ink); }
.excard .chk { position:absolute; top:11px; right:11px; color:var(--accent-ink); display:flex; }
.pkmulti { display:flex; align-items:center; justify-content:space-between; gap:10px;
  margin-bottom:14px; padding:10px 10px 10px 14px; border-radius:13px;
  background:var(--raise); border:1px solid var(--line); font-size:13px;
  font-weight:650; color:var(--muted); }
.pkmulti button { padding:10px 16px; border-radius:11px; border:none; background:var(--accent);
  color:var(--accent-ink); font-weight:800; font-size:13px; }
.pkmulti button:disabled { opacity:0.4; }

.vol { margin-top:12px; display:grid; gap:9px; }
.volrow { display:grid; grid-template-columns:64px 1fr 86px; gap:8px; align-items:center; }
.volrow .vn { font-size:12px; font-weight:650; color:var(--muted); }
.volrow .vv { font-size:12.5px; font-weight:700; text-align:right; }
.volrow .vv s { display:block; text-decoration:none; font-size:10.5px; font-weight:600;
  color:var(--muted); }
/* Zeitraum 90 Tage: einfacher Anteilsbalken ohne Vergleich */
.volrow .vb { position:relative; height:14px; border-radius:7px; background:var(--raise);
  overflow:hidden; }
.volrow .vb i.abs { position:absolute; left:0; top:2px; height:10px; border-radius:5px;
  background:var(--accent); }
/* Plan-Reiter, Sätze je Muskelgruppe: ein Balken je Gruppe, in Planfarben
   gestapelt, damit sichtbar ist, welcher Plan wie viel beiträgt. */
/* Nicht ".plan": die Klasse gehört der Planliste im Training und bringt
   overflow:hidden mit. */
/* 118px statt 104px seit 1.23.0: "Schulter seitlich" wurde sonst abgeschnitten. */
.vol.bymuscle .volrow { grid-template-columns:118px 1fr 34px; }
/* Planung: Gruppe ohne einen Satz im Entwurf, siehe muscleBars() */
.volrow.zero .vn, .volrow.zero .vv { color:var(--record); }
.volrow .vb.stack { display:flex; gap:1px; padding:2px 0; }
.volrow .vb.stack i { display:block; height:10px; border-radius:5px; }
.planlegend { display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:12px;
  font-size:11.5px; color:var(--muted); }
.planlegend span { display:inline-flex; align-items:center; gap:6px; }
.pairline { margin:12px 0 0; font-size:12.5px; color:var(--muted); line-height:1.6; }
.pairline b { color:var(--ink); font-weight:700; }
.pairline b.off { color:var(--record); }
.pairline .why { display:block; margin-top:6px; font-size:11.5px; }
/* Zeitraum 7/30 Tage: Veränderung gegenüber der Vorperiode, je Gruppe eigene Skala */
.vb2 { display:flex; align-items:center; gap:6px; }
.vb2 .bar { position:relative; flex:1; height:14px; border-radius:7px;
  background:var(--raise); overflow:hidden; }
.vb2 .bar .mid { position:absolute; left:50%; top:0; bottom:0; width:1px;
  background:var(--line); }
.vb2 .bar i { position:absolute; top:2px; height:10px; }
.vb2 .bar i.pos { left:50%; border-radius:0 5px 5px 0; background:var(--done); }
.vb2 .bar i.neg { right:50%; border-radius:5px 0 0 5px; background:var(--record); }
.vb2 .pct { flex:0 0 auto; min-width:40px; text-align:right; font-size:11.5px;
  font-weight:700; color:var(--muted); }
.vb2 .pct.pos { color:var(--done); }
.vb2 .pct.neg { color:var(--record); }
.vb2 .pct.isnew { color:var(--accent); }
/* Zeitraum 30 Tage: 4 Wochen-Balken statt Vergleich mit der Vorperiode, je Gruppe
   eigene Skala. Zeigt eine Tendenz über die letzten 4 Wochen statt eines einzelnen
   Zwei-Punkte-Vergleichs, siehe volumeBlock(). */
.wk { margin-top:12px; display:grid; gap:9px; }
.wkrow { display:grid; grid-template-columns:64px 1fr; gap:8px; align-items:center; }
.wkrow .vn { font-size:12px; font-weight:650; color:var(--muted); }
.wkcols { display:flex; align-items:flex-end; gap:6px; height:34px; }
.wkcol { flex:1; display:flex; flex-direction:column; align-items:center;
  justify-content:flex-end; height:100%; }
.wkcol i { display:flex; align-items:center; justify-content:center; width:100%;
  border-radius:4px 4px 2px 2px; background:var(--muted); opacity:.45; }
.wkcol:last-child i { background:var(--accent); opacity:1; }
.wkval { font-size:9.5px; font-weight:700; font-style:normal; color:var(--accent-ink); }
.legend i.wkpast { background:var(--muted); opacity:.45; }
.legend i.wkcur { background:var(--accent); }
/* Je Kalenderwoche eine Zeile, siehe weekGoalBlock(). */
.wgrow { display:flex; align-items:center; justify-content:space-between;
  padding:10px 13px; border-top:1px solid var(--line); }
.wgrow:first-child { border-top:none; }
.wgrow .wgd { font-size:13px; color:var(--muted); }
.wgrow .wgs { font-size:12.5px; font-weight:700; color:var(--muted); text-align:right;
  max-width:62%; }
.wgrow .wgs.done { color:var(--done); }
.legend i.prev { background:var(--muted); }
.legend i.pos { background:var(--done); }
.legend i.neg { background:var(--record); }
.plan > button.part .stripe { background:var(--accent); opacity:0.45; }
.plansel { width:100%; display:flex; align-items:center; gap:8px; margin-bottom:14px;
  padding:11px 14px; border-radius:12px; border:1px solid var(--line);
  background:var(--surface); text-align:left; min-width:0; }
.plansel b { font-size:14px; font-weight:650; white-space:nowrap; overflow:hidden;
  text-overflow:ellipsis; }
.plansel span { font-size:12px; color:var(--muted); white-space:nowrap; }
.plansel em { margin-left:auto; font-style:normal; font-size:12px; font-weight:600;
  color:var(--accent); white-space:nowrap; }
.plansel .chev { color:var(--muted); display:flex; }
.colrow { display:grid; grid-template-columns:1fr 56px; gap:8px; align-items:center;
  padding:10px 12px; border-top:1px solid var(--line); }
.colrow:first-child { border-top:none; }
.colrow .nm { font-size:14px; font-weight:650; display:flex; align-items:center; gap:8px;
  min-width:0; overflow:hidden; }
.colrow .nm s { text-decoration:none; font-size:11px; font-weight:600; color:var(--record);
  white-space:nowrap; }
/* Muskelgruppen-Liste unter Daten, siehe muscleRows(). */
.mgroup { padding:9px 12px 4px; font-size:11px; font-weight:700; letter-spacing:.06em;
  text-transform:uppercase; color:var(--muted); }
.mrow { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,42%); gap:8px;
  align-items:baseline; padding:9px 12px; border-top:1px solid var(--line); }
.mrow:first-child, .mgroup + .mrow { border-top:none; }
.mrow .nm { font-size:13.5px; font-weight:650; overflow:hidden; text-overflow:ellipsis;
  white-space:nowrap; }
.mrow .mm { font-size:12px; color:var(--muted); text-align:right; line-height:1.35; }
.mrow .mm b { color:var(--ink); font-weight:650; }
/* Eigene/umbenannte Übungen ohne feste Zuordnung: Name und Dropdowns stehen
   untereinander, zwei Selects sind schmal genug nebeneinander zu eng zu wirken. */
.mrow.own { grid-template-columns:1fr; gap:8px; }
.msel { display:flex; gap:8px; }
.msel select { flex:1; min-width:0; padding:9px 10px; border-radius:10px;
  border:1px solid var(--line); background:var(--surface); color:var(--ink); font-size:13px; }
.msel select:disabled { opacity:0.5; }
.colrow input { width:100%; height:38px; padding:2px; border-radius:10px;
  border:1px solid var(--line); background:var(--raise); }

.hero { position:relative; background:var(--surface); border:1px solid var(--line);
  border-radius:18px; padding:18px 18px 16px 22px; overflow:hidden; box-shadow:var(--shadow); }
.hero::before { content:""; position:absolute; left:0; top:0; bottom:0; width:6px;
  background:var(--accent); }
.hero.blank::before { background:var(--line); }
.hero.edit::before { background:var(--record); }
.hero-ex { font-size:17px; font-weight:700; letter-spacing:-0.015em; margin-top:5px; }
.hero-meta { font-size:12.5px; color:var(--muted); line-height:1.6; margin-top:6px; }
.hero-meta b { color:var(--ink); font-weight:700; }

.save { width:100%; margin-top:18px; height:62px; border:none; border-radius:17px;
  background:var(--accent); color:var(--accent-ink); font-size:17px; font-weight:800;
  letter-spacing:-0.01em; }
.save:active { filter:brightness(0.94); }
.ghost { width:100%; margin-top:9px; height:46px; border-radius:13px;
  border:1px solid var(--line); background:var(--raise); font-size:14px; font-weight:650; }

.nextnav { display:grid; grid-template-columns:56px 1fr; gap:8px; margin-top:9px; }
.nextnav button { height:46px; border-radius:13px; border:1px solid var(--line);
  background:var(--raise); font-size:14px; font-weight:650; padding:0 12px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.nextnav button:disabled { opacity:0.4; }

.newrow { display:flex; gap:8px; margin-top:10px; }
.newrow input, .newrow select { flex:1; min-width:0; padding:12px 13px; border-radius:12px;
  border:1px solid var(--line); background:var(--surface); font-size:15px; }
.newrow button { padding:0 16px; border-radius:12px; border:1px solid var(--line);
  background:var(--raise); font-size:14px; font-weight:650; }
.newrow button.wide { flex:1; height:44px; }
/* Standardwerte im Pläne-Reiter, siehe viewPlans() */
.deffield { flex:1; min-width:0; }
.deffield label { display:block; margin-bottom:5px; font-size:11px; font-weight:700;
  color:var(--muted); letter-spacing:.06em; text-transform:uppercase; }
.deffield input { width:100%; padding:12px 13px; border-radius:12px;
  border:1px solid var(--line); background:var(--surface); color:var(--ink); font-size:15px; }
/* Eine gemeinsame Beschriftung über Primär- und Sekundärmuskel bei der
   Übungsanlage, gleicher Stil wie bei den Standardwerten - aber nur einmal für
   beide Felder, nicht je Dropdown. */
.mlabel { display:block; margin-bottom:5px; font-size:11px; font-weight:700;
  color:var(--muted); letter-spacing:.06em; text-transform:uppercase; }

/* Rahmen um die Anlage neuer Übungen: eigene Box mit Reiter-Label statt der
   sonst üblichen .sect-Überschrift, damit sich Anlegen klar von der Liste
   darüber abgrenzt, auch ohne die Beschriftung zu lesen. */
.newbox { margin-top:22px; background:var(--raise); border:1px solid var(--line);
  border-radius:14px; overflow:hidden; }
.newbox .tab { padding:10px 13px; font-size:11px; font-weight:700; letter-spacing:.06em;
  text-transform:uppercase; color:var(--muted); border-bottom:1px solid var(--line); }
.newbox .body { padding:13px; }
.newbox .newrow:first-child { margin-top:0; }

.sect { display:flex; align-items:baseline; gap:10px; margin:26px 0 10px; }
.sect h2 { margin:0; font-size:15px; font-weight:700; letter-spacing:-0.01em;
  display:inline-flex; align-items:center; gap:6px; }
.sect span { margin-left:auto; font-size:12.5px; color:var(--muted); }
.infob { flex:0 0 auto; width:20px; height:20px; padding:0; border-radius:50%; border:none;
  background:none; color:var(--muted); display:inline-flex; align-items:center;
  justify-content:center; }
.infob.on { color:var(--accent); }
/* Gleicher Stil wie die Sichtbarkeits- und Reihenfolgensperre-Icons je Plan
   (.phead h3 .eye/.lock): 28px-Kreis mit Rahmen statt Fläche, Akzentfarbe erst
   im aktiven Zustand. Für den globalen Zeilenumbruch-Schalter, siehe wraptoggle. */
.wrapbtn { width:28px; height:28px; border-radius:50%; padding:0; flex:0 0 auto;
  display:inline-flex; align-items:center; justify-content:center; background:none;
  border:1.5px solid var(--line); color:var(--muted); transition:background .15s, color .15s; }
.wrapbtn[aria-checked="true"] { background:var(--accent); border-color:var(--accent);
  color:var(--accent-ink); }

.planhead { width:100%; display:flex; align-items:center; gap:8px; margin-top:12px;
  padding:11px 13px; border:1px solid var(--line); border-radius:13px;
  background:var(--surface); text-align:left; }
.planhead b { font-size:13.5px; font-weight:700; }
.planhead span { font-size:12px; color:var(--muted); }
.planhead .chev { margin-left:auto; color:var(--muted); display:flex;
  transform:rotate(90deg); }
.planhead .chev.up { transform:rotate(-90deg); }
/* Verlauf dieser Uebung, aufgeklappt unter seinem Kopf: die Liste sitzt
   unmittelbar daran, also kein Abstand und keine doppelte Kante zwischen beiden.
   Die Zeilen stehen in festen Spalten, Reps und Gewicht rechtsbuendig, damit
   Einer unter Einern stehen (die 8 unter der 0 von 10). Satznummer, Datum und
   RPE tragen dieselbe graue Schrift wie in der Satzliste des Tages. */
.planhead.open { border-radius:13px 13px 0 0; border-bottom:none; }
.exhist { border:1px solid var(--line); border-top:none; border-radius:0 0 13px 13px;
  background:var(--surface); overflow:hidden; padding:0 0 6px; }
.exhist .hset { display:grid;
  grid-template-columns:14px 2.6ch max-content 5ch max-content 1fr 4.6em;
  align-items:baseline; column-gap:3px; padding:4px 13px; font-size:15px;
  line-height:1.2; font-variant-numeric:tabular-nums; }
.exhist .hset:first-child { padding-top:6px; }
.exhist .no { font-size:12px; font-weight:600; color:var(--muted); }
.exhist .val { font-weight:750; letter-spacing:-0.02em; text-align:right; }
.exhist .val.kg { margin-left:9px; }
.exhist .unit { font-size:11px; font-weight:600; color:var(--muted); margin-left:2px; }
.exhist .when { font-size:12px; color:var(--muted); text-align:right; }
.exhist .rpe { font-size:12px; color:var(--muted); text-align:right; }
.exhist .sep { height:1px; background:var(--line); margin:4px 0; }
.plan { margin-top:8px; border:1px solid var(--line); border-radius:16px; overflow:hidden;
  background:var(--surface); }
.plan > button { width:100%; display:flex; align-items:center; gap:12px; padding:13px 15px;
  border:none; border-top:1px solid var(--line); background:none; text-align:left; }
.plan > button:first-child { border-top:none; }
.plan .stripe { width:4px; align-self:stretch; border-radius:2px; background:var(--line); }
.plan > button.done .stripe { background:var(--done); }
.plan > button.on .stripe { background:var(--accent); }
.plan .nm { font-size:14.5px; font-weight:650; display:block; }
.plan .tg { font-size:12px; color:var(--muted); margin-top:2px; display:block; }
.plan .st { margin-left:auto; font-size:12px; color:var(--muted); }
.plan > button.done .st { color:var(--done); font-weight:650; }

.grp { margin-top:14px; border:1px solid var(--line); border-radius:16px;
  background:var(--surface); overflow:hidden; }
.grp header { display:flex; align-items:baseline; gap:8px; padding:12px 15px 10px; }
.grp header h3 { margin:0; font-size:14.5px; font-weight:700; }
.grp header span { margin-left:auto; font-size:12px; color:var(--muted); }
.set { display:flex; align-items:center; gap:11px; padding:0 6px 0 15px;
  border-top:1px solid var(--line); }
.set .tapzone { flex:1; display:flex; align-items:center; gap:11px; padding:13px 8px 13px 0;
  border:none; background:none; text-align:left; }
/* Punkt 8: statt des kaum wahrnehmbaren Prozentbalkens (.bar2, bis 1.8.2) jetzt
   eine nummerierte Badge - kompakter und mit mehr visuellem Impact. Rekorde werden
   hier nicht mehr farbig markiert, siehe Trainingszusammenfassung und Verlauf. */
.set .no { flex:0 0 auto; width:24px; height:24px; border-radius:50%; display:flex;
  align-items:center; justify-content:center; font-size:11.5px; color:var(--muted);
  font-weight:700; background:var(--raise); border:1px solid var(--line); }
.set .fig { font-size:17px; font-weight:750; letter-spacing:-0.02em; }
.set .fig s { text-decoration:none; font-size:11px; font-weight:600; color:var(--muted);
  margin-left:2px; }
.set .rpe { margin-left:auto; font-size:12px; color:var(--muted); }
.set.editing { background:var(--raise); }
.set .del { border:none; background:none; color:var(--muted); font-size:13px;
  padding:12px 8px; margin-left:10px; border-left:1px solid var(--line); }
.hfind { margin-top:4px; }
.hfind input { width:100%; padding:12px 13px; border-radius:12px;
  border:1px solid var(--line); background:var(--surface); font-size:14.5px; }
.set.fresh { animation:pop 0.9s ease-out; }
@keyframes pop { from { background:var(--raise); } to { background:transparent; } }
@media (prefers-reduced-motion: reduce) { .set.fresh { animation:none; } }

.totals { display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 12px; margin-top:16px;
  padding-top:11px; border-top:2px solid var(--ink); font-size:13px; }
.totals b { font-size:14px; font-weight:750; }
.totals span { color:var(--muted); }
.totals em { margin-left:auto; font-style:normal; font-size:12px; color:var(--muted); }
.totals em.ok { color:var(--done); font-weight:700; }

.ver { margin:28px 0 8px; text-align:center; font-size:11.5px; color:var(--muted);
  letter-spacing:0.01em; }
.empty { text-align:center; color:var(--muted); font-size:14px; padding:34px 10px;
  line-height:1.6; }

.card { border:1px solid var(--line); border-radius:16px; background:var(--surface);
  padding:15px; margin-top:12px; }
.card h3 { margin:0 0 2px; font-size:15px; font-weight:700; }
.card p { margin:0; font-size:12.5px; color:var(--muted); line-height:1.6; }
.card .big { font-size:26px; font-weight:800; letter-spacing:-0.03em; }
.card .open { width:100%; margin-top:10px; padding:10px; border-radius:11px;
  border:1px solid var(--line); background:var(--raise); font-size:13px; font-weight:650; }
.chart { margin-top:12px; }
/* Zwei Diagramme untereinander brauchen je eine Überschrift, sonst ist beim
   zweiten nicht zu sehen, was es zeigt. Siehe chart()/volChart(). */
.chart .clab { margin:0 0 4px; font-size:11px; font-weight:700; letter-spacing:.06em;
  text-transform:uppercase; color:var(--muted); }
.legend { display:flex; gap:14px; font-size:11.5px; color:var(--muted); margin-top:6px; }
.legend i { display:inline-block; width:14px; height:2px; background:var(--accent);
  vertical-align:middle; margin-right:5px; }
.legend i.dash { background:none; border-top:2px dashed var(--muted); }

.prow { display:grid; grid-template-columns:34px 1fr 46px 46px 62px 38px; gap:5px;
  align-items:center; padding:8px 10px; border-top:1px solid var(--line);
  background:var(--surface); }
.prow:first-child { border-top:none; }
.prow .nm { display:block; width:100%; padding:0; border:none; background:none;
  color:inherit; text-align:left; font-size:14px; font-weight:650; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap; }
/* Ein Tipp auf einen langen, abgeschnittenen Namen zeigt ihn vollständig, ein
   erneuter Tipp springt zurück in den abgeschnittenen "..."-Modus. */
.prow .nm.open { white-space:normal; overflow-wrap:break-word; overflow:visible; }
.prow input { width:100%; padding:9px 4px; border-radius:10px; border:1px solid var(--line);
  background:var(--raise); font-size:14px; text-align:center; }
.prow .handle { width:36px; height:38px; border-radius:10px; border:1px solid var(--line);
  background:var(--raise); color:var(--muted); font-size:13px; line-height:1;
  touch-action:none; cursor:grab; }
.prow .pdel { width:34px; height:38px; margin-left:6px; border-radius:10px; border:none;
  background:none; color:var(--muted); font-size:13px; }
.prow.drag { background:var(--raise); box-shadow:0 6px 16px rgba(0,0,0,0.18); opacity:0.92;
  position:relative; z-index:2; }
.prows { position:relative; }
.plabels { display:grid; grid-template-columns:34px 1fr 46px 46px 62px 38px; gap:5px;
  padding:0 10px 6px; font-size:11px; color:var(--muted); }
.plabels span { text-align:center; }
.plabels span:nth-child(2) { text-align:left; }
.phead { display:flex; align-items:center; gap:8px; padding:13px 12px 10px; }
.phead h3 { margin:0; font-size:15px; font-weight:700; display:flex; align-items:center;
  gap:8px; min-width:0; }
.phead button { margin-left:auto; border:none; background:none; color:var(--muted);
  font-size:13px; }
/* Übungszahl statt der Tabelle, solange alle Pläne eingeklappt sind, siehe
   "planfoldall" in viewPlans(). Steht zwischen dem Namen und "Plan löschen",
   das dank margin-left:auto weiterhin ganz rechts bleibt. */
.plancount { font-size:12px; color:var(--muted); white-space:nowrap; }
.phead h3 .nm { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.phead h3 .eye, .phead h3 .lock, .phead h3 .dup { width:28px; height:28px;
  border-radius:50%; padding:0;
  flex:0 0 auto; margin-left:0; display:flex; align-items:center; justify-content:center;
  background:none; border:1.5px solid var(--line); color:var(--muted);
  transition:background .15s, color .15s; }
/* Punkt 11: Sperre gegen versehentliches Umordnen, gleiche Farblogik wie das
   Sichtbarkeits-Auge - "true" heißt hier wie dort der aktive Grundzustand
   (sichtbar bzw. verschiebbar), nur gesperrt/ausgeblendet bleibt neutral. */
.phead h3 .eye[aria-checked="true"], .phead h3 .lock[aria-checked="true"] {
  background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.card.hidden-plan .phead h3 .nm { color:var(--muted); }
.card.hidden-plan .plabels, .card.hidden-plan .prows, .card.hidden-plan .newrow { opacity:0.45; }
.prow .handle.off { opacity:0.4; cursor:default; touch-action:auto; }

.chead { width:100%; display:flex; align-items:center; gap:8px; font-size:11.5px;
  font-weight:700; color:var(--muted); padding:10px 12px; background:var(--raise);
  border:none; border-top:1px solid var(--line); text-align:left; }
.chead:first-child { border-top:none; }
.chead .cc { margin-left:auto; font-weight:600; }
.chead .chv { display:flex; transform:rotate(90deg); }
.chead .chv.up { transform:rotate(-90deg); }
/* Klappknopf einer ganzen Überschrift im Daten-Reiter, siehe secFold(). Sitzt
   rechts wie die Zählung, die er ersetzt, und dreht das Zeichen wie oben. */
.sect .secfold { margin-left:auto; display:flex; align-items:center; gap:7px;
  padding:4px 0 4px 10px; border:none; background:none; font-size:12.5px;
  color:var(--muted); }
.sect .secfold .chv { display:flex; transform:rotate(90deg); }
.sect .secfold .chv.up { transform:rotate(-90deg); }
.crow { display:grid; grid-template-columns:1fr 58px 34px 26px; gap:6px; align-items:center;
  padding:8px 12px; border-top:1px solid var(--line); }
.movecat { padding:10px 12px 12px; border-top:1px solid var(--line); background:var(--raise); }
.movecat > span { display:block; font-size:11.5px; font-weight:650; color:var(--muted);
  margin-bottom:6px; }
.movecat .row { display:flex; gap:6px; }
.movecat select { flex:1; min-width:0; padding:9px 6px; border-radius:10px;
  border:1px solid var(--line); background:var(--surface); font-size:13px; }
.crow .xdel { width:30px; height:36px; border:none; background:none; color:var(--muted);
  font-size:13px; padding:0; }
.crow .nm { font-size:14px; font-weight:650; overflow:hidden; text-overflow:ellipsis;
  white-space:nowrap; }
.crow select { width:100%; padding:9px 6px; border-radius:10px; border:1px solid var(--line);
  background:var(--raise); font-size:13.5px; }
.tools { display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:12px; }
.tools button { padding:14px 10px; border-radius:13px; border:1px solid var(--line);
  background:var(--surface); font-size:14px; font-weight:650; }
.tools button.solid { background:var(--accent); border-color:var(--accent);
  color:var(--accent-ink); }
.tools button.mode { display:flex; align-items:center; justify-content:center; gap:7px; }
.tools button.mode.on { border-color:var(--accent); color:var(--accent); font-weight:700; }
.tools button.wide { grid-column:1 / -1; }
.tools button:disabled { opacity:0.4; }

/* ---------- Planung, Reiter 5 ---------- */
/* Zeile je Plan im Entwurf: Schalter, Name, Häufigkeit. Der Schalter folgt Auge
   und Sperre in .phead (28px-Kreis), mit Haken statt Symbol, siehe draftBlock(). */
.drow { display:grid; grid-template-columns:28px 1fr auto; gap:10px; align-items:center;
  padding:10px 12px; border-top:1px solid var(--line); }
.drow:first-child { border-top:none; }
.drow .nm { font-size:14px; font-weight:650; display:flex; align-items:center; gap:8px;
  min-width:0; flex-wrap:wrap; row-gap:1px; }
.drow .nm .t { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.drow .nm s { text-decoration:none; font-size:11px; font-weight:600; color:var(--record);
  white-space:nowrap; flex-basis:100%; padding-left:16px; }
.drow.off .nm { color:var(--muted); }
.drow.off .step { opacity:0.35; pointer-events:none; }
.tog { width:28px; height:28px; border-radius:50%; padding:0; display:inline-flex;
  align-items:center; justify-content:center; background:none; border:1.5px solid var(--line);
  color:transparent; }
.tog[aria-checked="true"] { background:var(--accent); border-color:var(--accent);
  color:var(--accent-ink); }
/* Minus, Wert, Plus, siehe stepper() */
.step { display:inline-flex; align-items:center; height:34px; border:1px solid var(--line);
  border-radius:10px; background:var(--raise); overflow:hidden; }
.step button { width:30px; height:100%; border:none; background:none; color:var(--muted);
  font-size:16px; font-weight:600; padding:0; }
.step button:disabled { opacity:0.3; }
.step b { min-width:44px; text-align:center; font-size:12.5px; font-weight:700; }
.step b small { font-weight:600; color:var(--muted); font-size:10.5px; }
/* Einzelne Übungen im Entwurf: Name und Muskelgruppe oben, die beiden Zähler
   darunter; nebeneinander wären sie auf 360px zu eng, siehe draftExtrasBlock(). */
.xrow { padding:10px 12px; border-top:1px solid var(--line); display:grid; gap:8px; }
.xrow:first-child { border-top:none; }
.xtop { display:flex; align-items:center; gap:8px; min-width:0; }
.xtop .nm { font-size:14px; font-weight:650; white-space:nowrap; overflow:hidden;
  text-overflow:ellipsis; }
.xtop .mm { margin-left:auto; font-size:11.5px; color:var(--muted); white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; }
.xtop .xdel { width:28px; height:28px; border:none; background:none; color:var(--muted);
  padding:0; display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto; }
.xsteps { display:flex; gap:8px; flex-wrap:wrap; }
.xsteps label { display:inline-flex; align-items:center; gap:7px; font-size:11.5px;
  color:var(--muted); font-weight:600; }
.dempty { padding:14px 12px; font-size:12.5px; color:var(--muted); }
/* Schalter im Kopf des Entwurfs, trennt die Wochen, siehe draftBlock(). Pille wie
   die Chips beim Zuweisen, nur kleiner, und rechts wie die Zählungen der anderen
   Überschriften. */
.wksplit { margin-left:auto; flex:0 0 auto; padding:5px 10px; border-radius:10px;
  border:1px solid var(--line); background:var(--surface); color:var(--muted);
  font-size:12px; font-weight:650; white-space:nowrap; }
.wksplit[aria-checked="true"] { border-color:var(--accent); color:var(--accent); }
/* Zuweisen: Kalenderwochen als Raster Mo bis So, dieselben Zellen wie im
   Wochenstreifen, siehe dayCell(). Seit 1.26.0 stehen nur volle kommende Wochen im
   Raster, vergangene Tage kommen darin nicht mehr vor. */
.cal { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
.cal .wday { flex:none; min-width:0; }
.cal .wday:disabled { opacity:0.45; cursor:default; }
.cal .wday.today .wd { color:var(--accent); font-weight:700; }
.cal .wday.we .dd { color:var(--muted); }
.kw { display:flex; justify-content:space-between; font-size:11px; font-weight:700;
  letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin:10px 2px 6px; }
.kw:first-child { margin-top:0; }
/* Rechte Seite der KW-Zeile in der Wochenübersicht: gewöhnlicher Satz, nicht in
   Versalien wie die Kalenderwoche links. */
.kw em { font-style:normal; font-weight:600; letter-spacing:0; text-transform:none;
  white-space:nowrap; }
.kw .now { color:var(--accent); }
/* Die Auswahl steht direkt unter der Woche des angetippten Tags; zwischen zwei
   Wochen ist sie auch unten abgesetzt, die nächste KW-Zeile rückt ohne eigenen
   Abstand nach. */
.assign { margin-top:14px; padding-top:12px; border-top:1px solid var(--line); }
.assign.mid { margin-bottom:14px; padding-bottom:12px; border-bottom:1px solid var(--line); }
.assign.mid + .kw { margin-top:0; }
.assign .lab { font-size:12.5px; color:var(--muted); margin-bottom:8px; }
.assign .lab b { color:var(--ink); font-weight:700; }
.chips { display:flex; flex-wrap:wrap; gap:6px; }
.chips button { padding:7px 10px; border-radius:10px; border:1px solid var(--line);
  background:var(--surface); font-size:12.5px; font-weight:650; display:inline-flex;
  align-items:center; gap:6px; }
.chips button.on { background:var(--raise); border-width:1.5px; }
.chips button.frei { color:var(--muted); }
/* Zugewiesen gegen Entwurf je Kalenderwoche; die Spaltenzahl kommt inline mit. */
.wsum { margin-top:14px; display:grid; gap:4px 8px; font-size:12.5px; align-items:center; }
.wsum .h { font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
  color:var(--muted); text-align:right; padding-bottom:4px; }
.wsum .h.l { text-align:left; }
.wsum .n { display:flex; align-items:center; gap:7px; font-weight:650; min-width:0; }
.wsum .n span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.wsum .c { text-align:right; font-weight:700; }
.wsum .c.ok { color:var(--done); }
.wsum .c.low { color:var(--muted); }
.wsum .c.over { color:var(--record); }
textarea { width:100%; margin-top:12px; height:130px; padding:11px; border-radius:13px;
  border:1px solid var(--line); background:var(--surface); font-size:12px;
  font-family:ui-monospace, SFMono-Regular, monospace; }
.file { display:none; }

.restbar { position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--surface);
  border-top:1px solid var(--line);
  padding:10px 16px calc(14px + env(safe-area-inset-bottom));
  box-shadow:0 -2px 12px rgba(0,0,0,0.08); }
.restbar .line { display:flex; align-items:center; gap:12px; }
.restbar .t { font-size:26px; font-weight:800; letter-spacing:-0.03em; min-width:74px; }
.restbar .lbl { font-size:12px; color:var(--muted); }
.restbar button { padding:10px 12px; border-radius:11px; border:1px solid var(--line);
  background:var(--raise); font-size:13px; font-weight:650; }
.restbar .track { height:4px; border-radius:2px; background:var(--line); margin-top:9px;
  overflow:hidden; }
.restbar .track i { display:block; height:100%; background:var(--accent); }
.restbar.over .t { color:var(--done); }
</style>
</head>
<body>
<div id="app"></div>
<div id="restbar"></div>
<input type="file" id="filein" class="file" accept="application/json,.json,text/plain,.txt">

<script>
"use strict";

var APP_VERSION = "1.30.7";

var KEY = "kraftlog:v1", CUSTOM_KEY = "kraftlog:custom", THEME_KEY = "kraftlog:theme",
    PLANS_KEY = "kraftlog:plans", SET_KEY = "kraftlog:settings", META_KEY = "kraftlog:meta",
    CATS_KEY = "kraftlog:cats", REST_KEY = "kraftlog:rest",
    SUGGEST_KEY = "kraftlog:suggest", SESSION_KEY = "kraftlog:session",
    COLOR_KEY = "kraftlog:plancolors",
    EXMETA_KEY = "kraftlog:exmeta", NOTES_KEY = "kraftlog:notes";

var PALETTE = ["#1552B8","#C8102E","#1F7A4C","#B26A00","#6B3FA0","#0E7C86"];
var DEFAULT_COLORS = { "Upper Body":"#1552B8", "Leg Day (UL)":"#C8102E",
  "Push Day":"#1F7A4C", "Pull Day":"#B26A00", "Leg Day (PPL)":"#6B3FA0" };

var CATS = {
  "Push": ["Flys","Benchpress Maschine","Schrägbankdrücken","Shoulderpress Maschine",
    "Trizeps","Seitheben","Trizepsdrücken über Kopf","Dips"],
  "Pull": ["Reverse Flys","Latzug Maschine","Preachercurls","Hammercurls","Rudern Maschine",
    "Kurzhantelrudern","Face Pulls","Shrugs","Deadlifts"],
  "Legs": ["Beincurls","Beinstrecker","Squats","Beinpresse","Romanian Deadlifts",
    "Hip Thrust","Hipabduction","Hipadduction","Wadenheben"],
  "Core": ["Bauch Crunch","Lower Back Crunch"]
};
var CATLIST = ["Push","Pull","Legs","Core"];
function safeCat(c) {
  return CATLIST.concat(["Sonstige"]).indexOf(c) >= 0 ? c : "Sonstige";
}
function safeColor(c) {
  return typeof c === "string" && /^#[0-9a-f]{6}$/i.test(c) ? c : "";
}
var PRESETS = [];
CATLIST.forEach(function (c) { PRESETS = PRESETS.concat(CATS[c]); });

/* Zielsätze je Übung, wenn im Plan nichts anderes hinterlegt ist. Zwei Arbeitssätze,
   weil davor bereits die Aufwärmrampe steht. Im Plan-Editor je Übung änderbar. */
var DEFAULT_SETS = 2;

/* Pause nach einem Satz, in Sekunden. Einen eigenen Wert tragen unten nur die
   Mehrgelenksübungen; alles andere fällt auf die Pause aus den Einstellungen
   zurück, damit ein einziger Regler weiterhin sämtliche Isolationsübungen und
   alle selbst angelegten Übungen verschiebt.
   Hintergrund: Der ACSM Position Stand empfiehlt für Mehrgelenksübungen zwei bis
   drei Minuten und für Assistenzübungen ein bis zwei. Die Metaanalyse von Singer
   u.a. (2024) findet unterhalb von 60 s einen Nachteil, oberhalb von 90 s aber
   keinen weiteren Vorteil mehr. Beides zusammen ergibt die zwei Stufen. Der
   Mechanismus ist die Volumenlast: Eine zu kurze Pause kostet Wiederholungen im
   Folgesatz, und genau an dieser Zahl hängen hier doppelte Progression und
   plateau().
   Aufwärmsätze bekommen WARM_REST, aber nie mehr als die Übung selbst. */
var REST_COMPOUND = 120;
var WARM_REST = 60;
var REST_CHOICES = [60, 75, 90, 105, 120, 150, 180];

/* Schrittweite der Plus- und Minus-Tasten je Übung, dazu die Übungen an der
   Langhantel, für die der Scheibenrechner gilt. Alles unter Daten änderbar. */

/* Primäre und sekundäre Muskelgruppe je mitgelieferter Übung, für die Liste
   unter Daten und die Verteilung im Verlauf, siehe muscleOf()/muscleRows()/
   volByMuscle(). Sekundär stehen hier nur Muskelgruppen, die die Bewegung als
   Synergist dynamisch mit ausführen und damit einen plausiblen Trainingsreiz
   erhalten. Reine Stabilisatoren bleiben außen vor; messbare Aktivität allein
   reicht nicht für einen halben Satz. Eigene oder umbenannte Übungen stehen
   hier nicht drin, genau wie bei DEFAULT_EXMETA oben - für sie trägt
   muscleRow() zwei Dropdowns ein, deren Wahl in S.exmeta landet.

   "Rücken" meint den ziehenden Rücken, also Latissimus, Trapez und Rhomboiden,
   der Gegenspieler zur Brust. Der Rückenstrecker steht seit 1.21.0 getrennt als
   "Unterer Rücken", sein Gegenspieler ist der Bauch, siehe MUSCLE_PAIRS. Bis
   dahin zählte jeder Satz Lower Back Crunch voll gegen die Brust. Kreuzheben
   bekommt den unteren Rücken bewusst nicht als Sekundärmuskel: bei neutraler
   Wirbelsäule hält er nur, und Stabilisatoren zählen hier nicht.

   Die Schulter steht seit 1.22.0 dreigeteilt, weil ihre Anteile durch getrennte
   Übungen trainiert werden und die Schieflage vorn gegen hinten durch das
   Drücken die häufigste echte ist: vorn über Schulterpresse und als Zweitmuskel
   jeder Brustübung, seitlich über Seitheben, hinten über Reverse Flys, Face Pulls
   und als Zweitmuskel beim Rudern. Als eine Gruppe verdeckte "Schulter" genau
   dieses Verhältnis. Ein gespeichertes "Schulter" aus älteren Ständen wird beim
   Lesen zu "Schulter vorn", siehe muscleAlias(). Feiner als das, etwa einzelne
   Muskelköpfe, geht das Zählmodell nicht her: primär voll, sekundär halb kann
   eine Betonung nicht ausdrücken. */

  "Bizeps", "Trizeps", "Unterarm", "Bauch", "Unterer Rücken", "Gesäß", "Quadrizeps",

/* Für mitgelieferte Übungen aus MUSCLE_GROUPS, für eigene oder umbenannte aus
   den beiden Dropdowns unter Daten, siehe muscleRows(). */
function muscleOf(name) {
  if (MUSCLE_GROUPS[name]) return MUSCLE_GROUPS[name];
  var own = S.exmeta[name];
  if (!own || !own.musclePrimary) return null;
  /* Nur Gruppen aus MUSCLE_LIST. volByMuscle() legt sein Ergebnis genau über
     diese Liste an und griff bis 1.14.5 bei einem fremden Wert aus dem Speicher
     ins Leere, was den ganzen Verlauf-Reiter abbrechen ließ. Die Dropdowns
     können nichts anderes liefern, ein beschädigter Speicher schon. */
  if (MUSCLE_LIST.indexOf(own.musclePrimary) < 0) return null;
  if (own.muscleSecondary && MUSCLE_LIST.indexOf(own.muscleSecondary) < 0) {
    return { primary:own.musclePrimary, secondary:[] };
  }
  /* Dieselbe Gruppe als Primär und Sekundär würde einen Satz mit 1,5 in genau
     eine Gruppe schreiben, siehe volByMuscle(). Ab 1.13.4 verhindern die
     Dropdowns das bereits bei der Eingabe; hier fällt die Doppelung zusätzlich
     beim Lesen weg, damit auch schon gespeicherte Stände richtig zählen. */
  var sec = (own.muscleSecondary && own.muscleSecondary !== own.musclePrimary)
    ? [own.muscleSecondary] : [];
  return { primary:own.musclePrimary, secondary:sec };
}

/* Die Einzelfelder der Einstellungen mit ihrer Regel, an einer Stelle. Drei Leser
   greifen darauf zu: load() beim Start (was nicht passt, wird still übergangen und
   behält den Ausgangswert), cleanSettings() beim Import (was nicht passt, lehnt
   die Datei ab) und mergeSettings() beim Zusammenführen (nur, wo hier noch der
   Ausgangswert steht). Bis 1.30.2 stand die Liste in allen drei ausgeschrieben,
   und beim Import fehlten notifySignal und vibeLong: ein Backup brachte die
   Signal-Einstellungen nicht mit. Ein neues Feld kommt jetzt hier dazu und sonst
   nirgends. Die Sammelfelder plates, descOpen, weekGoals, weekGoalLog und planDays
   haben je Leser eigene Regeln und stehen weiter dort.

   Regeln: bool; positive (Zahl über null); count (ganze Zahl über null); amount
   (Zahl ab null); names (Liste von Strings). */
var SETTING_FIELDS = {
  autoRest:"bool", autoProgress:"bool", repFirst:"bool", focusPlates:"bool",
  wrapNames:"bool", exHist:"bool", focusHist:"bool", notifySignal:"bool", vibeLong:"bool",
  rest:"positive", repFirstThresh:"positive", barWeight:"positive",
  repSpan:"count", defSets:"count", defReps:"count",
  defWeight:"amount",
  hiddenPlans:"names", lockedPlans:"names", hiddenEx:"names"
};
/* Prüft einen Wert gegen die Regel seines Felds. ok sagt, ob er streng gültig ist
   (Import); value ist der Wert, den ein nachsichtiger Leser übernimmt (Start,
   Zusammenführen), oder undefined. Bei names weichen beide ab: ein fremder
   Eintrag in der Liste macht sie für den Import ungültig, beim Start wird er
   nur ausgesiebt. */
function checkSetting(kind, v) {
  var ok = false, value;
  if (kind === "bool") ok = typeof v === "boolean";
  else if (kind === "positive") ok = finiteNumber(v) && v > 0;
  else if (kind === "count") ok = Number.isInteger(v) && v > 0;
  else if (kind === "amount") ok = finiteNumber(v) && v >= 0;
  else if (kind === "names" && Array.isArray(v)) {
    value = v.filter(function (x) { return typeof x === "string"; });
    ok = value.length === v.length;
    return { ok:ok, value:value };
  }
  if (ok) value = v;
  return { ok:ok, value:value };
}

/* Bis 1.12.3 ging ausschließlich das Gewicht hoch. Bei einer Schrittweite von
   3,75 kg auf 21,25 kg sind das 17,6 Prozent in einem Sprung - deutlich zu viel,
   um ihn in einer Einheit aufzufangen. Ab 1.13.0 klettern deshalb zuerst die
   Wiederholungen innerhalb einer Range um den Zielwert, und erst an ihrem
   oberen Rand steigt das Gewicht, während die Reps auf den unteren Rand
   zurückfallen.

   Die Range wird nicht eingestellt, sondern gerechnet: Zielwert ± S.settings.repSpan.
   Ob überhaupt erst die Reps steigen, entscheidet die Schrittweite im Verhältnis
   zum aktuellen Gewicht, verglichen mit S.settings.repFirstThresh. Das hat die
   angenehme Eigenschaft, sich selbst zu erledigen - dieselbe Übung wächst mit
   steigendem Gewicht aus der Rep-Range heraus, weil derselbe Schritt relativ
   immer kleiner wird (Shoulderpress Maschine mit 3,75 kg: bei 30 kg sind das
   12,5 Prozent und damit Reps zuerst, ab 50 kg nur noch 7,5 Prozent und damit
   direkt das Gewicht).

   Ab 1.13.1 stand die Schwelle auf 5 statt 7,5 Prozent, weil bei 7,5 Prozent
   Latzug Maschine und Reverse Flys (beide step 3,75 kg bei Zielgewicht 50 kg,
   also exakt 7,5 %) wegen des strikten Vergleichs unten in repFirstOn() knapp
   auf der falschen, der Gewichts-Seite lagen, obwohl sie rechnerisch auf der
   Grenze lagen. Bei 5 Prozent fällt praktisch jede Übung in die Rep-Range
   (Flys 5,8 %, Squats 6,25 %, Beinpresse 5,0 %) - die Schwelle trennt kaum noch,
   war aber bewusst in Kauf genommen, damit die beiden Grenzfälle zuverlässig in
   die Range rutschen. Ab 1.13.3 sind Schwelle und Range-Breite deshalb
   einstellbar (S.settings.repFirstThresh, S.settings.repSpan, siehe Bereich
   "Progression" in den Einstellungen), Default weiterhin 5 Prozent bzw. ±2. */

/* ---------- Helfer ---------- */
function todayISO() {
  var d = new Date();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0,10);
}
function shiftISO(iso, days) {
  var d = new Date(iso + "T12:00:00");
  d.setDate(d.getDate() + days);
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0,10);
}
function shortDate(iso) {
  return new Date(iso + "T12:00:00").toLocaleDateString("de-DE",
    { day:"2-digit", month:"2-digit", year:"2-digit" });
}
function tinyDate(iso) {
  return new Date(iso + "T12:00:00").toLocaleDateString("de-DE",
    { day:"2-digit", month:"2-digit" });
}
function longDay(iso) {
  return new Date(iso + "T12:00:00").toLocaleDateString("de-DE",
    { weekday:"long", day:"numeric", month:"long" });
}
function num(v) { return (Math.round(v*100)/100).toLocaleString("de-DE"); }
function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}
function deci(s) { return parseFloat(String(s).replace(",", ".")); }
function comma(v) { return String(v).replace(".", ","); }
function e1rm(w, r) { return w * (1 + r / 30); }
function mmss(sec) {
  var m = Math.floor(Math.abs(sec) / 60), s = Math.abs(sec) % 60;
  return (sec < 0 ? "+" : "") + m + ":" + (s < 10 ? "0" : "") + s;
}

/* ---------- Speicher ---------- */
function sysDark() {
  return !!(window.matchMedia &&
    window.matchMedia("(prefers-color-scheme: dark)").matches);
}
function applyTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute("content", t === "dark" ? "#151816" : "#E6E7E2");
}
function setTheme(t) {
  applyTheme(t);
  S.themeAuto = false;
  try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
}
function useSystemTheme() {
  S.themeAuto = true;
  try { localStorage.setItem(THEME_KEY, "auto"); } catch (e) {}
  applyTheme(sysDark() ? "dark" : "light");
}
function theme() { return document.documentElement.getAttribute("data-theme"); }

function storageOk() {
  try {
    localStorage.setItem("kraftlog:probe","1");
    localStorage.removeItem("kraftlog:probe");
    return true;
  } catch (e) { return false; }
}
function readJson(key, fallback) {
  try {
    var raw = localStorage.getItem(key);
    if (!raw) return fallback;
    var v = JSON.parse(raw);
    return v === null ? fallback : v;
  } catch (e) { return fallback; }

   Zuhause der Daten, und ein harter Abbruch ließ die App bis 1.14.5 gar nicht erst
   starten - ein Plan, dessen Wert kein Array war, reichte für eine weiße Seite.
   Hier wird deshalb repariert statt abgelehnt, und was dabei wegfällt, steht
   danach als Hinweis oben im Trainingsreiter, damit es nicht unbemerkt passiert. */
var loadRepairs = { entries:0, dropped:0, plans:0 };
function repairEntries(list) {
  var out = [];
  list.forEach(function (e) {
    if (!plainObject(e) || !validISODate(e.date)) { loadRepairs.dropped += 1; return; }
    if ((typeof e.id !== "string" && !finiteNumber(e.id)) || !String(e.id).trim()) {
      loadRepairs.dropped += 1; return;
    }
    if (typeof e.exercise !== "string" || !e.exercise.trim()) {
      loadRepairs.dropped += 1; return;
    }
    var fixed = false;
    if (!Number.isInteger(e.set) || e.set < 1) { e.set = 1; fixed = true; }
    if (!finiteNumber(e.weight) || e.weight < 0) { e.weight = 0; fixed = true; }
    if (!Number.isInteger(e.reps) || e.reps < 1) { e.reps = 1; fixed = true; }
    if (e.rpe != null && (!finiteNumber(e.rpe) || e.rpe < 1 || e.rpe > 10)) {
      e.rpe = null; fixed = true;
    }
    if (!finiteNumber(e.ts) || e.ts <= 0) {
      e.ts = Date.parse(e.date + "T12:00:00"); fixed = true;
    }
    if (e.warm != null && typeof e.warm !== "boolean") { e.warm = !!e.warm; fixed = true; }
    if (fixed) loadRepairs.entries += 1;
    out.push(e);
  });
  return out;
}
function repairPlans(src) {
  var out = {};
  Object.keys(src).forEach(function (p) {
    if (!safeObjectKey(p) || !p.trim()) { loadRepairs.plans += 1; return; }
    if (!Array.isArray(src[p])) { loadRepairs.plans += 1; return; }
    var items = src[p].filter(function (i) {
      var ok = plainObject(i) && typeof i.name === "string" && !!i.name.trim();
      if (!ok) loadRepairs.plans += 1;
      return ok;
    });
    out[p] = items;
  });
  return out;
}
/* Zielwerte eines Planeintrags. Steht direkt neben der Satzzahl-Ergänzung in
   load(), weil beide dieselben Standardwerte brauchen und die erst nach dem
   Lesen der Einstellungen feststehen. */
function repairPlanItem(i) {
  var fixed = false;
  var r = parseInt(i.reps, 10);
  if (!(r > 0)) { i.reps = defaultReps(); fixed = true; } else if (i.reps !== r) { i.reps = r; }
  var w = typeof i.weight === "number" ? i.weight : deci(i.weight);

/* Die gemerkte Darstellung anwenden, noch vor allem anderen: hell, dunkel oder

   der Speicherprüfung, damit auch ein Browser ohne Speicher nicht weiß startet.
   Bis 1.30.3 stand das am Anfang von load(). */
function readTheme() {
  var t = null;
  try { t = localStorage.getItem(THEME_KEY); } catch (e) {}
  if (t === "light" || t === "dark") {
    S.themeAuto = false;
    applyTheme(t);
  } else if (t === "auto") {
    S.themeAuto = true;
    applyTheme(sysDark() ? "dark" : "light");
  } else {
    /* Ganz frisch, noch nie eine Wahl getroffen: startet dunkel, nicht nach System */
    S.themeAuto = false;
    applyTheme("dark");
  }
  if (window.matchMedia) {
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    var onSys = function () {
      if (!S.themeAuto) return;
      applyTheme(sysDark() ? "dark" : "light");
      render();
    };
    if (mq.addEventListener) mq.addEventListener("change", onSys);
    else if (mq.addListener) mq.addListener(onSys);

}
/* Der Startleser: holt den gesamten Datenbestand aus dem localStorage in S, mit
   Prüfung und Reparatur je Feld, und sät mitgelieferte Pläne nach, die auf diesem
   Gerät noch nie da waren. Läuft genau einmal, am Ende der Datei. */
function load() {
  readTheme();
  S.storeOk = storageOk();
  S.plans = JSON.parse(JSON.stringify(DEFAULT_PLANS));
  if (!S.storeOk) return;

  var e = readJson(KEY, []);
  if (Array.isArray(e)) S.entries = repairEntries(e);
  var c = readJson(CUSTOM_KEY, []);
  if (Array.isArray(c)) {
    S.custom = c.map(function (x) {
      if (typeof x === "string" && x.trim()) return { name:x, cat:"Sonstige" };
      if (!x || typeof x !== "object" || typeof x.name !== "string" || !x.name.trim()) {
        return null;
      }
      return { name:x.name, cat:safeCat(x.cat) };
    }).filter(function (x) { return !!x; });
  }
  var p = readJson(PLANS_KEY, null);
  if (p && typeof p === "object" && !Array.isArray(p) && Object.keys(p).length) {
    var repaired = repairPlans(p);
    if (Object.keys(repaired).length) S.plans = repaired;
  }
  var st = readJson(SET_KEY, null);
  if (st && typeof st === "object") {
    /* Einzelfelder nach SETTING_FIELDS: was nicht passt, behält den Ausgangswert.
       Ein Start darf an einem kaputten Feld nicht scheitern, anders als der Import. */
    Object.keys(SETTING_FIELDS).forEach(function (k) {
      var r = checkSetting(SETTING_FIELDS[k], st[k]);
      if (r.value !== undefined) S.settings[k] = r.value;
    });
    if (Array.isArray(st.plates) && st.plates.length) {
      S.settings.plates = st.plates.filter(function (x) { return typeof x === "number" && x > 0; });
    }
    if (st.descOpen && typeof st.descOpen === "object") {
      Object.keys(st.descOpen).forEach(function (k) { S.settings.descOpen[k] = !!st.descOpen[k]; });
    }
    if (st.weekGoals && typeof st.weekGoals === "object") {
      Object.keys(st.weekGoals).forEach(function (k) {
        var n = st.weekGoals[k];
        if (typeof n === "number" && n >= 0) S.settings.weekGoals[k] = n;
      });
    }
    if (st.weekGoalLog && typeof st.weekGoalLog === "object") {
      Object.keys(st.weekGoalLog).forEach(function (k) {
        var log = st.weekGoalLog[k];
        if (!Array.isArray(log)) return;
        S.settings.weekGoalLog[k] = log.filter(function (e) {
          return e && typeof e.since === "string" && typeof e.value === "number";
        });
      });
    }
    if (st.planDays && typeof st.planDays === "object") {
      S.settings.planDays = cleanPlanDays(st.planDays);
    }
  }
  var em = readJson(EXMETA_KEY, null);
  if (em && typeof em === "object") {
    S.exmeta = em;
    Object.keys(S.exmeta).forEach(function (k) {
      var x = S.exmeta[k];
      if (!x || typeof x !== "object") return;
      if (x.musclePrimary) x.musclePrimary = muscleAlias(x.musclePrimary);
      if (x.muscleSecondary) x.muscleSecondary = muscleAlias(x.muscleSecondary);
    });
  }
  var nt = readJson(NOTES_KEY, null);
  if (nt && typeof nt === "object") S.notes = nt;
  var cl = readJson(COLOR_KEY, null);
  if (cl && typeof cl === "object") {
    S.colors = {};
    Object.keys(cl).forEach(function (k) {
      var color = safeColor(cl[k]);
      if (color) S.colors[k] = color;
    });
  }
  var ct = readJson(CATS_KEY, null);
  if (ct && typeof ct === "object") {
    S.cats = {};
    Object.keys(ct).forEach(function (k) { S.cats[k] = safeCat(ct[k]); });
  }
  S.custom.forEach(function (x) {
    if (x && typeof x === "object") x.cat = safeCat(x.cat);
  });
  var mt = readJson(META_KEY, null);
  if (mt && typeof mt === "object") S.meta = { lastBackup: mt.lastBackup || "",
    lastCount: mt.lastCount || 0, seeded: Array.isArray(mt.seeded) ? mt.seeded : [] };

  /* seedChanged merkt, ob beim Lesen etwas berichtigt oder nachgetragen wurde.
     Nur dann wird am Ende geschrieben. */
  var seedChanged = false;

  /* Keine Migration, sondern eine Reparatur: ein Planeintrag ohne brauchbare
     Satzzahl stünde sonst als "NaN" in Zielzeile, Vorschlag und Plan-Editor.
     Dasselbe gilt für Reps und Gewicht, siehe repairPlanItem(). */
  Object.keys(S.plans).forEach(function (p) {
    if (!Array.isArray(S.plans[p])) return;
    S.plans[p].forEach(function (i) {
      if (!i || typeof i !== "object") return;
      var n = parseInt(i.sets, 10);
      if (!(n > 0)) { i.sets = defaultSets(); seedChanged = true; }
      if (repairPlanItem(i)) { loadRepairs.plans += 1; seedChanged = true; }
    });

  var seeded = S.meta.seeded || [];
  Object.keys(DEFAULT_PLANS).forEach(function (p) {
    if (seeded.indexOf(p) < 0) {
      seeded.push(p);
      seedChanged = true;
      if (!S.plans[p]) S.plans[p] = JSON.parse(JSON.stringify(DEFAULT_PLANS[p]));
    }
  });
  if (seedChanged) { S.meta.seeded = seeded; persist(); }

/* Was beim Lesen repariert oder verworfen wurde, kommt einmal als Hinweis oben
