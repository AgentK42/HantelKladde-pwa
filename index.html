}

/* ---------- Planung, Reiter 5, 1.23.0 ---------- */
/* Der Pläne-Reiter rechnet die Sätze je Muskelgruppe aus dem, was gespeichert
   ist. Wer wissen wollte, wie ein anderer Mix aussähe, musste dort die
   Wochenziele umstellen und ein neues Wochenziel speichern - ein Eintrag in der
   Historie, nur zum Nachsehen. Die Planung rechnet stattdessen auf einem
   Entwurf: welche Pläne wie oft, dazu einzelne Übungen außerhalb der Pläne. Erst
   "Als Wochenziel übernehmen" schreibt etwas in die Wochenziele.

   Der Entwurf ist kein Datenbestand und liegt deshalb unter einem eigenen
   Schlüssel statt in S.settings, wie Pausentimer und Sitzung - er gehört nicht
   ins Backup. Anders als die Sitzung verfällt er nicht: wer abends plant, findet
   ihn morgens wieder. Leer heißt: die aktuellen Wochenziele, siehe draftEntry().

   Seit 1.26.0 lassen sich die Wochen trennen: dann hat jede angezeigte
   Kalenderwoche ihren eigenen Entwurf, wählbar über die Reiter unter der
   Überschrift, und Entwurf, einzelne Übungen und Sätze je Muskelgruppe zeigen die
   gewählte Woche. Eine Woche ohne eigene Änderung zeigt die erste mit, siehe
   weekDraft().

   Darunter lassen sich die Pläne des Entwurfs auf Tage legen. Das ist ein Vorhaben
   und gehört ins Backup, deshalb S.settings.planDays. Im Wochenstreifen des
   Trainings steht so ein Tag als leerer Ring in der Planfarbe, bis der Plan dort
   als voll absolviert gilt, siehe weekStrip(). */
var DRAFT_KEY = "kraftlog:entwurf";
/* Ziel der Mehrfachauswahl (pickmulti), wenn Übungen in den Entwurf statt in
   einen Plan sollen. Das führende Leerzeichen kann kein Planname tragen: addplan
   und cleanName() trimmen. */
var DRAFT_TARGET = " Entwurf";
var DRAFT_MAX_TIMES = 7, DRAFT_MAX_SETS = 12;
/* Ab diesem Verhältnis der Sätze zwischen zwei Gegenspielern wird das Paar im
   Entwurf rot, siehe muscleBars(). Für das tatsächliche Training gilt im Verlauf
   eine eigene Regel (imbalanceFlags), hier geht es um den Plan. */
var DRAFT_PAIR_RATIO = 1.5;
/* Zugewiesene Tage älter als vier Wochen fallen beim Laden weg: die Zuweisung
   sagt, was vorhat, nicht, was war - dafür gibt es die Sätze. */
var PLAN_DAYS_KEEP = 28;
/* So viele volle Kalenderwochen zeigt das Zuweisen-Raster, siehe planWeeks(). */
var PLAN_WEEKS = 2;

/* Welcher Entwurf für eine Woche gilt. Ohne Trennung und für die erste angezeigte
   Woche ist das der obere Stand; eine spätere Woche bekommt erst mit der ersten
   Änderung einen eigenen Eintrag und zeigt bis dahin die erste mit. */
function weekDraft(mon) {
  if (!S.draft.split) return S.draft;
  return S.draft.weeks[mon] || S.draft;
}
/* Wie weekDraft(), aber zum Schreiben: legt die Abweichung an, wenn es noch keine
   gibt, mit dem Stand, der bis dahin galt. So ändert der erste Tipp in einer
   späteren Woche genau das Angetippte und nicht die erste Woche mit. */
function weekDraftEdit(mon) {
  if (!S.draft.split) return S.draft;
  /* Eine vorhandene Abweichung gewinnt, auch für die erste Woche: rückt das Raster
     bei offener App über Nacht vor, liest weekDraft() bereits weeks[mon], und ohne
     diese Zeile schriebe ein Tipp in S.draft - also in eine andere Liste als die
     angezeigte. Zusammengeführt wird erst beim nächsten Start in loadDraft(). */
  if (S.draft.weeks[mon]) return S.draft.weeks[mon];
  if (mon === planWeeks()[0].monday) return S.draft;
  if (!S.draft.weeks[mon]) {
    S.draft.weeks[mon] = { plans:JSON.parse(JSON.stringify(S.draft.plans)),
      extras:JSON.parse(JSON.stringify(S.draft.extras)) };
  }
  return S.draft.weeks[mon];
}
/* Die Woche, die der Reiter über dem Entwurf gerade zeigt. Ohne Trennung gibt es
   nur eine, und eine Woche, die aus dem Raster gelaufen ist, fällt auf die erste
   zurück. */
function selWeek() {
  var weeks = planWeeks();
  if (!S.draft.split) return weeks[0].monday;
  for (var i = 0; i < weeks.length; i++) {
    if (weeks[i].monday === S.planWeekSel) return S.planWeekSel;
  }
  return weeks[0].monday;
}
/* Der Eintrag eines Plans im Entwurf einer Woche. Ohne eigenen Eintrag gilt das
   Wochenziel: an, wenn eines gesetzt ist, so oft wie dort. Ein leerer Entwurf
   zeigt damit genau das, was der Pläne-Reiter zeigt. */
function draftEntry(p, mon) {
  var e = weekDraft(mon || selWeek()).plans[p];
  if (e) return e;
  var g = weekGoal(p);
  return { on:g > 0, times:g || 1 };
}
function draftPlans(mon) {
  return Object.keys(S.plans).filter(function (p) {
    return S.plans[p].length && draftEntry(p, mon).on;
  });
}
/* Weicht der Entwurf der Woche bei einem Plan von den Wochenzielen ab? Steuert
   den Knopf "Als Wochenziel übernehmen". */
function draftChanged(mon) {
  return Object.keys(S.plans).some(function (p) {
    var e = draftEntry(p, mon);
    return (e.on ? e.times : 0) !== weekGoal(p);
  });
}
function saveDraft() { persistKey(DRAFT_KEY, S.draft); }
/* Einen gespeicherten Stand in ein Entwurfsobjekt lesen. Was nicht passt, fällt
   still weg: der Entwurf ist kein Datenbestand, und ohne Eintrag gelten die
   Wochenziele. */
function readDraftInto(dst, src) {
  if (!src || typeof src !== "object" || Array.isArray(src)) return;
  if (src.plans && typeof src.plans === "object") {
    Object.keys(src.plans).forEach(function (p) {
      var e = src.plans[p];
      if (!safeObjectKey(p) || !e || typeof e !== "object" || typeof e.on !== "boolean") return;
      if (!Number.isInteger(e.times) || e.times < 1 || e.times > DRAFT_MAX_TIMES) return;
      dst.plans[p] = { on:e.on, times:e.times };
    });
  }
  if (Array.isArray(src.extras)) {
    src.extras.forEach(function (x) {
      if (!x || typeof x !== "object" || typeof x.name !== "string" || !x.name) return;
      if (!Number.isInteger(x.sets) || x.sets < 1 || x.sets > DRAFT_MAX_SETS) return;
      if (!Number.isInteger(x.times) || x.times < 1 || x.times > DRAFT_MAX_TIMES) return;
      if (dst.extras.some(function (y) { return y.name === x.name; })) return;
      dst.extras.push({ name:x.name, sets:x.sets, times:x.times });
    });
  }
}
function loadDraft() {
  var d = readJson(DRAFT_KEY, null);
  if (!d || typeof d !== "object" || Array.isArray(d)) return;
  readDraftInto(S.draft, d);
  if (d.split !== true) return;
  S.draft.split = true;
  if (!d.weeks || typeof d.weeks !== "object" || Array.isArray(d.weeks)) return;
  var first = planWeeks()[0].monday;
  Object.keys(d.weeks).forEach(function (mon) {
    /* Vergangene Wochen fallen weg. Die erste angezeigte Woche ist immer der obere
       Stand: rutscht eine geplante Woche nach vorn, zieht ihre Abweichung dorthin
       um, sonst wäre sie mit dem Wochenwechsel verloren. */
    if (!validISODate(mon) || mon < first) return;
    var w = { plans:{}, extras:[] };
    readDraftInto(w, d.weeks[mon]);
    if (mon === first) { S.draft.plans = w.plans; S.draft.extras = w.extras; }
    else S.draft.weeks[mon] = w;
  });
}
/* Zugewiesene Tage aus dem Speicher oder einem Backup: nur gültige Daten mit
   einem Plannamen und nichts, was älter als PLAN_DAYS_KEEP ist. Ob es den Plan
   noch gibt, entscheidet erst die Anzeige (plannedPlan()), ein Backup kann den
   Plan noch nachliefern. */
function cleanPlanDays(src) {
  var out = {}, floor = shiftISO(todayISO(), -PLAN_DAYS_KEEP);
  Object.keys(src).forEach(function (d) {
    if (!validISODate(d) || d < floor) return;
    var p = src[d];
    if (typeof p !== "string" || !p.trim() || !safeObjectKey(p)) return;
    out[d] = p;
  });
  return out;
}

/* Minus, Wert, Plus in einer Zeile, für Häufigkeit und Sätze im Entwurf. Die
   Knöpfe tragen data-act, data-v und optional data-f, dazu data-d mit -1 oder 1. */
function stepper(act, v, f, val, min, max, unit) {
  var attrs = ' data-act="' + act + '" data-v="' + esc(v) + '"' +
    (f ? ' data-f="' + f + '"' : "");
  return '<span class="step">' +
    '<button' + attrs + ' data-d="-1"' + (val <= min ? " disabled" : "") +
    ' aria-label="weniger">−</button>' +
    '<b>' + val + (unit ? ' <small>' + unit + '</small>' : "") + '</b>' +
    '<button' + attrs + ' data-d="1"' + (val >= max ? " disabled" : "") +
    ' aria-label="mehr">+</button></span>';
}
/* Die Reiter über dem Entwurf, einer je angezeigter Kalenderwoche. Nur bei
   getrennten Wochen; sonst gibt es nur einen Entwurf und nichts zu wählen. */
function weekTabs() {
  if (!S.draft.split) return "";
  var sel = selWeek();
  return '<div class="seg2">' + planWeeks().map(function (w) {
    return '<button class="' + (w.monday === sel ? "on" : "") + '" data-act="planweek" ' +
      'data-v="' + w.monday + '" aria-pressed="' + (w.monday === sel ? "true" : "false") +
      '">KW ' + isoWeekNo(w.monday) + '</button>';
  }).join("") + '</div>';
}
/* Für die Überschriften der beiden folgenden Abschnitte: bei getrennten Wochen
   steht dort mit, welche gerade gezeigt wird. */
function weekMark() { return S.draft.split ? "KW " + isoWeekNo(selWeek()) : ""; }
function draftBlock() {
  var mon = selWeek(), names = Object.keys(S.plans);
  var h = '<div class="sect"><h2>Entwurf' + infoBtn("entwurf") + '</h2>' +
    '<button class="wksplit" role="switch" aria-checked="' + (S.draft.split ? "true" : "false") +
    '" data-act="draftsplit" title="' + (S.draft.split
      ? "Plant wieder alle Wochen gleich und nimmt die Unterschiede heraus"
      : "Plant jede Kalenderwoche einzeln, mit einem Reiter je Woche") + '">' +
    (S.draft.split ? "Trennung aufheben" : "Wochen trennen") + '</button></div>' +
    descText("entwurf", '<p class="notice">Welche Pläne wie oft pro Woche laufen sollen. ' +
      'Vorbelegt mit den aktuellen Wochenzielen. Was hier steht, bleibt ein Entwurf und ' +
      'ändert kein Wochenziel, bis unten „Als Wochenziel übernehmen“ gedrückt wird. ' +
      'Ausgeblendete Pläne stehen mit dabei, damit sie sich einplanen lassen, ohne sie ' +
      'erst einzublenden. „Wochen trennen“ gibt jeder Kalenderwoche einen eigenen ' +
      'Entwurf; eine Woche ohne eigene Änderung zeigt die erste mit.</p>') +
    weekTabs() + '<div class="card" style="padding:0">';
  if (!names.length) h += '<div class="dempty">Noch kein Plan angelegt.</div>';
  names.forEach(function (p) {
    var e = draftEntry(p, mon);
    h += '<div class="drow' + (e.on ? "" : " off") + '">' +
      '<button class="tog" role="switch" aria-checked="' + (e.on ? "true" : "false") +
      '" data-act="drafttoggle" data-v="' + esc(p) + '" aria-label="' + esc(p) +
      ' im Entwurf">' + svg("haken", 14) + '</button>' +
      '<div class="nm"><span class="pdot" style="background:' + planColor(p) + '"></span>' +
      '<span class="t">' + esc(p) + '</span>' +
      (planHidden(p) ? '<s>ausgeblendet</s>' : "") + '</div>' +
      stepper("draftstep", p, "", e.times, 1, DRAFT_MAX_TIMES, "/Wo") + '</div>';
  });
  return h + '</div>';
}
function draftExtrasBlock() {
  var xs = weekDraft(selWeek()).extras, mark = weekMark();
  var cap = [mark, xs.length ? xs.length + (xs.length === 1 ? " Übung" : " Übungen") : ""]
    .filter(function (t) { return t; }).join(", ");
  var h = '<div class="sect"><h2>Einzelne Übungen' + infoBtn("entwurfextras") + '</h2>' +
    (cap ? '<span>' + cap + '</span>' : "") + '</div>' +
    descText("entwurfextras", '<p class="notice">Übungen, die in keinem der gewählten ' +
      'Pläne stehen, aber mitgerechnet werden sollen, etwa um zu sehen, was eine Gruppe ' +
      'noch braucht. Zählen mit Satzzahl mal Häufigkeit und stehen in den Balken petrol. ' +
      'Wer eine behalten will, nimmt sie unter Pläne in einen Plan auf, der Entwurf ' +
      'ersetzt keinen Plan.</p>') +
    '<div class="card" style="padding:0">';
  if (!xs.length) h += '<div class="dempty">Noch keine einzelne Übung im Entwurf.</div>';
  xs.forEach(function (x, i) {
    var mo = muscleOf(x.name);
    var mm = mo
      ? esc(mo.primary) + (mo.secondary.length ? ", halb " + mo.secondary.map(esc).join(", ") : "")
      : "ohne Muskelgruppe";
    h += '<div class="xrow"><div class="xtop">' +
      '<span class="pdot" style="background:var(--extra)"></span>' +
      '<span class="nm">' + esc(x.name) + '</span><span class="mm">' + mm + '</span>' +
      '<button class="xdel" data-act="draftxdel" data-v="' + i + '" aria-label="' +
      esc(x.name) + ' aus dem Entwurf nehmen">' + svg("kreuz", 13) + '</button></div>' +
      '<div class="xsteps"><label>Sätze ' +
      stepper("draftxstep", String(i), "sets", x.sets, 1, DRAFT_MAX_SETS, "") + '</label>' +
      '<label>pro Woche ' +
      stepper("draftxstep", String(i), "times", x.times, 1, DRAFT_MAX_TIMES, "") +
      '</label></div></div>';
  });
  h += '</div><div class="tools"><button class="wide" data-act="pickmulti" data-v="' +
    esc(DRAFT_TARGET) + '">Übung hinzufügen</button></div>';
  return h;
}
/* Quellen für muscleTally(): die Pläne des Entwurfs mit ihrer Häufigkeit, dazu die
   einzelnen Übungen als eine Quelle, jede schon mit Sätzen mal Häufigkeit. */
function draftSources(mon) {
  var xs = weekDraft(mon || selWeek()).extras;
  var src = draftPlans(mon).map(function (p) {
    return { key:p, label:p, color:planColor(p), times:draftEntry(p, mon).times,
      items:S.plans[p] };
  });
  if (xs.length) {
    src.push({ key:DRAFT_TARGET, label:"Einzelne Übungen", color:"var(--extra)", times:1,
      items:xs.map(function (x) { return { name:x.name, sets:x.sets * x.times }; }) });
  }
  return src;
}
function draftMuscleBlock() {
  var mon = selWeek(), sources = draftSources(mon), mark = weekMark();
  var h = '<div class="sect"><h2>Sätze je Muskelgruppe' + infoBtn("entwurfsaetze") + '</h2>' +
    '<span>' + (mark ? mark + ", " : "") + 'pro Woche</span></div>' +
    descText("entwurfsaetze", '<p class="notice">Wochensumme über den Entwurf, gezählt wie ' +
      'im Verlauf: Primärmuskel voll, Sekundärmuskel halb, jeder Plan so oft wie oben ' +
      'eingestellt. Gruppen ohne einen Satz stehen rot mit dabei. Ein Gegenspieler-Paar ' +
      'wird rot, sobald eine Seite mindestens anderthalb mal so viele Sätze hat wie die ' +
      'andere oder ganz leer ausgeht.</p>');
  if (!sources.length) {
    return h + '<p class="notice">Kein Plan und keine Übung im Entwurf' +
      (mark ? " der " + mark : "") + '.</p>';
  }
  return h + muscleBars(muscleTally(sources), sources,
    { showZero:true, flagRatio:DRAFT_PAIR_RATIO });
}

/* Die nächsten PLAN_WEEKS vollen Kalenderwochen, Montag bis Sonntag. Eine Woche,
   in der schon ein Tag vergangen ist, lässt sich nicht mehr ganz planen und zählt
   deshalb nicht mit; nur montags ist die laufende noch voll. Die restlichen Tage
   der laufenden Woche bleiben über die Wochenübersicht im Training zuweisbar,
   siehe viewWeekOverview(). Bis 1.25.1 waren es die 14 Tage ab heute, was je nach
   Wochentag über drei Kalenderwochen reichte, die letzte davon mit einem einzigen
   Tag. */
function planWeeks() {
  var td = todayISO(), mon = mondayOf(td);
  if (mon !== td) mon = shiftISO(mon, 7);
  var weeks = [];
  for (var i = 0; i < PLAN_WEEKS; i++) {
    var days = [];
    for (var k = 0; k < 7; k++) days.push(shiftISO(mon, k));
    weeks.push({ monday:mon, days:days });
    mon = shiftISO(mon, 7);
  }
  return weeks;
}
/* ISO-Kalenderwoche: der Donnerstag derselben Woche bestimmt das Jahr. */
function isoWeekNo(iso) {
  var d = new Date(iso + "T12:00:00Z");
  d.setUTCDate(d.getUTCDate() - ((d.getUTCDay() + 6) % 7) + 3);
  var first = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
  return 1 + Math.round(((d - first) / 86400000 - 3 + ((first.getUTCDay() + 6) % 7)) / 7);
}
function planDayLabel(iso) {
  var dt = new Date(iso + "T12:00:00");
  return WEEKDAY_SHORT[dt.getDay()] + " " + dt.getDate() + "." + (dt.getMonth() + 1) + ".";
}
/* Die Auswahl für einen Tag, im Reiter Planung unter seiner Woche und seit 1.25.0
   genauso in der Wochenübersicht. Der Tag steht an jedem Knopf, damit beide Orte
   ihre eigene Auswahl behalten; hint sagt, was zu tun ist, wenn hier gar kein Plan
   zur Wahl steht. */
function assignPanel(sel, plans, mid, hint) {
  var cur = plannedPlan(sel);
  var h = '<div class="assign' + (mid ? " mid" : "") + '"><div class="lab"><b>' +
    planDayLabel(sel) + '</b>' + (cur ? ', ' + esc(cur) : ', frei') + '</div>' +
    '<div class="chips">' +
    plans.map(function (p) {
      return '<button class="' + (cur === p ? "on" : "") + '" data-act="planassign" data-day="' +
        sel + '" data-v="' + esc(p) + '"' +
        (cur === p ? ' style="border-color:' + planColor(p) + '"' : "") + '>' +
        '<span class="pdot" style="background:' + planColor(p) + '"></span>' + esc(p) +
        '</button>';
    }).join("") +
    '<button class="frei' + (cur ? "" : " on") + '" data-act="planassign" data-day="' + sel +
    '" data-v="">Frei</button></div>';
  if (!plans.length) h += '<p class="pairline" style="margin-top:8px">' + hint + '</p>';
  return h + '</div>';
}
function planDaysBlock() {
  var td = todayISO(), weeks = planWeeks();
  var first = weeks[0].days[0], last = weeks[weeks.length - 1].days[6];
  var sel = S.planDaySel;
  if (!sel || sel < first || sel > last) sel = S.planDaySel = first;
  var h = '<div class="sect"><h2>Zuweisen' + infoBtn("zuweisen") + '</h2>' +
    '<span>' + tinyDate(first) + ' bis ' + tinyDate(last) + '</span></div>' +
    descText("zuweisen", '<p class="notice">Tag antippen, die Auswahl erscheint direkt ' +
      'unter seiner Woche und zeigt die Pläne aus dem Entwurf dieser Woche. Ein Tag trägt ' +
      'höchstens einen Plan, gespeichert wird beim Antippen. Zugewiesene Tage stehen im ' +
      'Wochenstreifen des Trainings als leerer Ring in der Planfarbe, der sich nach dem ' +
      'Training füllt. Die Tabelle zeigt je Kalenderwoche, wie oft ein Plan zugewiesen ' +
      'ist, gegen die Häufigkeit aus dem Entwurf: grün passt, grau fehlt noch, rot ist ' +
      'mehr. Die laufende Woche steht nur montags mit im Raster, sonst ist sie schon ' +
      'angebrochen; ihre restlichen Tage lassen sich über die Wochenübersicht im ' +
      'Training belegen.</p>') +
    '<div class="card">';
  weeks.forEach(function (w, wi) {
    h += '<div class="kw"><span>KW ' + isoWeekNo(w.monday) + '</span>' +
      (w.days.indexOf(td) >= 0 ? '<span>heute ' + tinyDate(td) + '</span>' : "") + '</div>' +
      '<div class="cal">' + w.days.map(function (d) {
        return dayCell(d, td, "planday", sel);
      }).join("") + '</div>';
    if (w.days.indexOf(sel) >= 0) {
      /* Die Auswahl zeigt den Entwurf genau dieser Woche. Ein zugewiesener Plan,
         der dort nicht (mehr) steht, bleibt wählbar, sonst ließe er sich an diesem
         Tag nur noch auf Frei setzen. */
      var plans = draftPlans(w.monday), cur = plannedPlan(sel);
      if (cur && plans.indexOf(cur) < 0) plans = plans.concat([cur]);
      h += assignPanel(sel, plans, wi < weeks.length - 1, "Kein Plan im Entwurf dieser " +
        "Woche. Oben einen einschalten, dann lässt er sich hier zuweisen.");
    }
  });
  /* Zeilen sind alle Pläne, die in mindestens einer der Wochen im Entwurf stehen:
     bei getrennten Wochen können das je Woche andere sein. */
  var rows = Object.keys(S.plans).filter(function (p) {
    return weeks.some(function (w) { return draftPlans(w.monday).indexOf(p) >= 0; });
  });
  if (rows.length) {
    h += '<div class="wsum" style="grid-template-columns:1fr repeat(' + weeks.length +
      ',56px)"><span class="h l">Zugewiesen / Entwurf</span>' +
      weeks.map(function (w) {
        return '<span class="h">KW ' + isoWeekNo(w.monday) + '</span>';
      }).join("");
    rows.forEach(function (p) {
      h += '<div class="n"><span class="pdot" style="background:' + planColor(p) + '"></span>' +
        '<span>' + esc(p) + '</span></div>';
      weeks.forEach(function (w) {
        var e = draftEntry(p, w.monday), goal = e.on ? e.times : 0;
        var n = w.days.filter(function (d) { return S.settings.planDays[d] === p; }).length;
        /* Weder geplant noch zugewiesen: ein Strich sagt mehr als "0 / 0". */
        var cls = (!goal && !n) ? "low" : (n === goal ? "ok" : (n < goal ? "low" : "over"));
        h += '<span class="c ' + cls + '">' + ((!goal && !n) ? "–" : n + ' / ' + goal) +
          '</span>';
      });
    });
    h += '</div>';
  }
  return h + '</div>';
}
function draftToolsBlock() {
  var mon = selWeek(), mark = weekMark();
  var stored = Object.keys(S.draft.plans).length > 0 || S.draft.extras.length > 0 ||
    Object.keys(S.draft.weeks).length > 0 || S.draft.split;
  return '<div class="sect"><h2>Übernehmen</h2></div>' +
    '<div class="tools">' +
    '<button' + (draftChanged(mon) ? "" : " disabled") + ' data-act="drafttake" ' +
    'title="Schreibt die Häufigkeiten aus dem Entwurf' + (mark ? " der " + mark : "") +
    ' als Wochenziele fest, wie der Knopf Neues Wochenziel speichern unter Pläne">' +
    (mark ? mark + ' als Wochenziel' : 'Als Wochenziel übernehmen') + '</button>' +
    '<button' + (stored ? "" : " disabled") + ' data-act="draftreset" ' +
    'title="Setzt alle Wochen auf die aktuellen Wochenziele zurück, nimmt die einzelnen ' +
    'Übungen heraus und hebt eine Trennung der Wochen auf">Entwurf verwerfen</button></div>';
}
function viewPlanung() {
  return draftBlock() + draftExtrasBlock() + draftMuscleBlock() + planDaysBlock() +
    draftToolsBlock();
}

/* Last je Muskelgruppe für 7, 30 oder 90 Tage, wählbar über den Zeitraum-Schalter.
   Bei 90 Tagen entfällt der Vergleich mit dem vorherigen Zeitraum, das wäre über so
   lange Spannen wenig aussagekräftig und würde die Karte nur aufblähen. */
function fmtEff(x) { return num(Math.round(x * 10) / 10); }
/* Kategorien tragen jeden Satz voll (immer ganzzahlig), Muskelgruppen können
   durch die hälftige Sekundärmuskel-Gewichtung auf x,5 landen, siehe
   volByMuscle(). Eine Stelle, die beides sauber formatiert. */
function fmtCount(x) { return x % 1 === 0 ? String(x) : fmtEff(x); }
/* Dezenter Hinweis, wenn zwei antagonistische Gruppen im gewählten Zeitraum
   deutlich auseinander laufen - relevant für Gelenkhaltung und -gesundheit.
   Bei Kategorien nur Push/Pull, bei Muskelgruppen die üblichen Antagonisten-
   Paare, siehe imbalanceFlags(). Die Schwelle wird mit wachsendem Zeitraum
   bewusst niedriger: eine Schieflage, die sich über 30 oder 90 Tage hält, ist
   ein stärkeres Signal als dieselbe Schieflage in nur einer Woche, die auch
   reines Programm-Timing sein kann (z. B. zufällig kein Rückentag diese
   Woche). Der Mindestabstand steigt parallel etwas an, sonst würde bei den
   größeren Summen jede kleine Abweichung schon anschlagen. Welche der drei
   Stufen tatsächlich gilt, entscheidet nicht der Schalter allein, sondern auch
   die Datenlage des jeweiligen Paares, siehe imbalanceThresh(). */
var IMBALANCE_THRESH = { 7: { factor:1.5, minDiff:3 }, 30: { factor:1.35, minDiff:5 },
  90: { factor:1.25, minDiff:8 } };
var IMBALANCE_RANGES = [7, 30, 90];
/* Tage von einem Datum bis heute, einschließlich beider Enden. */
function daysSince(iso) {
  var span = Math.round((Date.parse(todayISO() + "T12:00:00") -
    Date.parse(iso + "T12:00:00")) / 86400000);
  return Math.max(0, span + 1);
}
/* Wie lange wird dieses Antagonisten-Paar überhaupt beobachtet: vom ersten
   Arbeitssatz, der eine der beiden Gruppen trifft, bis heute.

   Bewusst die frühere der beiden Gruppen und nicht die spätere. Trainierst du
   Rücken seit einem Jahr und Brust erst seit zwei Wochen, dann ist "Brust-Volumen
   niedrig" über 90 Tage eine belegte Aussage - über die ganzen 90 Tage lag Brust
   tatsächlich hinten, und genau dieser Fall soll die feinere Stufe bekommen.
   Erst wenn beide Gruppen neu sind, ist die Strecke wirklich kurz.

   Ein Satz zählt für jede Gruppe, zu der er Volumen beiträgt, also auch als
   Sekundärmuskel mit seinem halben Satz - dieselbe Zuordnung wie in
   volByMuscle() bzw. volByCat(), damit Beobachtungsdauer und gezähltes Volumen
   nicht auseinanderlaufen. */
function pairHistoryDays(nameA, nameB, group) {
  var first = "";
  S.entries.forEach(function (e) {
    if (!isWork(e)) return;
    var hit;
    if (group === "muscle") {
      var mo = muscleOf(e.exercise);
      hit = !!mo && (mo.primary === nameA || mo.primary === nameB ||
        mo.secondary.indexOf(nameA) >= 0 || mo.secondary.indexOf(nameB) >= 0);
    } else {
      var c = catOf(e.exercise);
      hit = (c === nameA || c === nameB);
    }
    if (!hit) return;
    if (!first || e.date < first) first = e.date;
  });
  return first ? daysSince(first) : 0;
}
/* Die niedrigeren Faktoren bei 30 und 90 Tagen sind allein damit begründet, dass
   sich eine Schieflage über diese Zeit gehalten hat. Reicht die Beobachtung des
   Paares noch nicht so weit, ist diese Begründung nicht belegt: bis 1.13.4 traf
   im 90-Tage-Blick der empfindlichste Faktor auf womöglich zwei Wochen Daten und
   schlug entsprechend früh an. Ab 1.13.5 zählt deshalb der kleinere Wert aus
   gewähltem Zeitraum und erfasster Strecke, und dazu die passende Stufe - die
   Regel stuft sich mit wachsenden Daten von selbst hoch, statt den Hinweis bis
   dahin ganz zu sperren. Unter sieben Tagen bleibt die strengste Stufe die
   Untergrenze, eine noch strengere gibt es nicht.

   Ab 1.13.6 wird die Strecke je Paar bestimmt, siehe pairHistoryDays(), nicht
   mehr über die gesamte Aufzeichnung: wer seit einem Jahr Beine trainiert und
   erst seit zwei Wochen Bizeps und Trizeps, bekam für dieses Paar sonst die
   feinste Stufe auf zwei Wochen Daten. */
function imbalanceThresh(range, covered) {
  var cap = Math.min(range, covered);
  var pick = IMBALANCE_RANGES[0];
  IMBALANCE_RANGES.forEach(function (r) { if (r <= cap) pick = r; });
  return IMBALANCE_THRESH[pick];
}
/* Satzzahl samt Einheit, in beiden Zählweisen und immer mit deutschem
   Dezimalkomma. Muskelgruppen landen durch die hälftige Sekundär-Gewichtung auf
   x,5, deshalb nie roh konkatenieren, siehe fmtCount(). */
function setCount(v, mode) {
  if (mode === "eff") return fmtEff(v) + " eff. Sätze";
  return fmtCount(v) + (v === 1 ? " Satz" : " Sätze");
}
/* Vergleicht die beiden Gruppen in der gerade gewählten Zählweise, damit die
   Zahlen im Hinweis zu den Zahlen in den Zeilen darunter passen. Die Schwellen
   sind an rohen Sätzen kalibriert; effektive Sätze liegen etwas darunter, der
   Hinweis ist in dieser Zählweise also einen Hauch zurückhaltender - passend,
   weil effektive Sätze das strengere Maß sind. */
function imbalanceFlag(a, nameA, nameB, t, mode) {
  var key = mode === "eff" ? "eff" : "sets";
  var A = a[nameA] ? a[nameA][key] : 0, B = a[nameB] ? a[nameB][key] : 0;
  if (!A && !B) return "";
  var hi = Math.max(A, B), lo = Math.min(A, B);
  /* Der Mindestabstand kommt zuerst und gilt immer. Das Verhältnis entfällt bei
     lo = 0, sonst würde durch Null geteilt. Bis 1.13.3 stieg die Funktion in
     diesem Fall mit "if (!A || !B) return" ganz aus - genau die krasseste
     Schieflage (eine Gruppe fehlt ganz) blieb damit stumm. Der Mindestabstand
     allein hält den Fall trotzdem von Bagatellen frei: bei 7 Tagen braucht die
     stärkere Seite mindestens 3 Sätze, bei 90 Tagen 8. */
  if (hi - lo < t.minDiff) return "";
  if (lo > 0 && hi / lo < t.factor) return "";
  var heavier = A > B ? nameA : nameB, lighter = heavier === nameA ? nameB : nameA;
  return '<div class="flag">' + heavier + ' ' + setCount(hi, mode) + ', ' +
    lighter + ' ' + setCount(lo, mode) + ' &ndash; ' + lighter +
    '-Volumen niedrig.</div>';
}
var CAT_PAIRS = [["Push", "Pull"]];
var MUSCLE_PAIRS = [["Brust", "Rücken"], ["Bizeps", "Trizeps"], ["Quadrizeps", "Beinbeuger"],
  ["Bauch", "Unterer Rücken"], ["Schulter vorn", "Schulter hinten"]];
function imbalanceFlags(a, group, range, mode) {
  var pairs = group === "muscle" ? MUSCLE_PAIRS : CAT_PAIRS;
  return pairs.map(function (p) {
    var t = imbalanceThresh(range, pairHistoryDays(p[0], p[1], group));
    return imbalanceFlag(a, p[0], p[1], t, mode);
  }).join("");
}
/* Wahlweise nach den vier Trainingskategorien oder nach den feineren
   Muskelgruppen aus muscleOf() gruppiert, siehe volByCat()/volByMuscle().
   Je Gruppe zählen Arbeitssätze oder, als Variante, effektive Sätze nach
   Anstrengung. Bei 7 Tagen zeigt der Balken die Veränderung zur Vorperiode,
   bei 30 Tagen die letzten vier Wochen einzeln, je Gruppe auf eigener Skala,
   damit eine kleine Gruppe nicht neben einer großen verschwindet. Bei 90 Tagen
   gibt es keinen Vergleich, dort zeigt er den Anteil am größten Wert. Die
   Gesamtlast in kg bleibt als eine Summenzeile erhalten. */
function volumeBlock() {
  var range = S.volRange || 7;
  var mode = S.volMode === "eff" ? "eff" : "sets";
  var group = S.volGroup === "muscle" ? "muscle" : "cat";
  var groupList = group === "muscle" ? MUSCLE_LIST : CATLIST.concat(["Sonstige"]);
  var dataFn = group === "muscle" ? volByMuscle : volByCat;
  var compare = range < 90;
  var td = todayISO();
  var aFrom = shiftISO(td, -(range - 1));
  var a = dataFn(aFrom, td);
  var bFrom, bTo, b;
  if (compare) {
    bTo = shiftISO(aFrom, -1);
    bFrom = shiftISO(bTo, -(range - 1));
    b = dataFn(bFrom, bTo);
  }
  var cats = groupList.filter(function (c) {
    return a[c].sets || (compare && b[c].sets);
  });
  var h = '<div class="sect"><h2>Letzte ' + range + ' Tage</h2></div>' +
    '<div class="tools" style="grid-template-columns:1fr 1fr">' +
    [["cat", "Kategorien"], ["muscle", "Muskelgruppen"]].map(function (g) {
      return '<button class="mode' + (group === g[0] ? " on" : "") + '" data-act="volgroup" ' +
        'data-v="' + g[0] + '">' + g[1] + '</button>';
    }).join("") + '</div>' +
    '<div class="tools" style="grid-template-columns:1fr 1fr 1fr; margin-top:8px">' +
    [7, 30, 90].map(function (r) {
      return '<button class="mode' + (range === r ? " on" : "") + '" data-act="volrange" ' +
        'data-v="' + r + '">' + r + ' Tage</button>';
    }).join("") + '</div>' +
    '<div class="tools" style="grid-template-columns:1fr 1fr; margin-top:8px">' +
    '<button class="mode' + (mode === "sets" ? " on" : "") + '" data-act="volmode" ' +
    'data-v="sets">Sätze</button>' +
    '<button class="mode' + (mode === "eff" ? " on" : "") + '" data-act="volmode" ' +
    'data-v="eff">Effektive Sätze</button></div>' +
    (mode === "eff"
      ? '<p class="notice">Effektive Sätze zählen jeden Satz nach Anstrengung statt nach ' +
        'Gewicht: ab RPE 9 zu 100 Prozent, RPE 8 zu 90, RPE 7 zu 70, darunter kaum. Ohne ' +
        'erfassten RPE wird ein mittlerer Wert angenommen.</p>'
      : "");
  if (!cats.length) {
    return h + '<p class="notice">' + (group === "muscle"
      ? "Noch keine Übung in diesem Zeitraum lässt sich einer Muskelgruppe zuordnen."
      : "Noch keine Arbeitssätze in diesem Zeitraum.") + '</p>';
  }
  var totA = volTotals(aFrom, td);
  var totB = compare ? volTotals(bFrom, bTo) : null;
  var dl = totA.days;
  var mins = dl.reduce(function (acc, d) { return acc + dayMinutes(d); }, 0);
  h += '<div class="card"><p>' + dl.length +
    (dl.length === 1 ? " Training, " : " Trainings, ") +
    num(Math.round(totA.vol)) + ' kg Gesamtlast aus ' + totA.sets +
    (totA.sets === 1 ? ' Arbeitssatz' : ' Arbeitssätzen') +
    (mins ? ', ' + mins + ' Minuten' : '') + '.' +
    (compare
      ? '<br>Vorheriger Zeitraum ' + num(Math.round(totB.vol)) + ' kg' +
        (totB.vol > 0 ? ', das sind ' + (totA.vol >= totB.vol ? "+" : "") +
          Math.round((totA.vol - totB.vol) / totB.vol * 100) + ' Prozent' : '') + '.'
      : '') + '</p>' +
    imbalanceFlags(a, group, range, mode);
  if (range === 30) {
    var weeks = [];
    for (var w = 0; w < 4; w++) {
      var wTo = shiftISO(td, -(3 - w) * 7);
      weeks.push(dataFn(shiftISO(wTo, -6), wTo));
    }
    h += '<div class="wk">';
    cats.forEach(function (c) {
      var vals = weeks.map(function (wd) { return mode === "eff" ? wd[c].eff : wd[c].sets; });
      var maxW = Math.max.apply(null, vals) || 1;
      h += '<div class="wkrow"><span class="vn">' + esc(c) + '</span><div class="wkcols">' +
        vals.map(function (v, i) {
          var isCur = i === 3;
          var barH = Math.max(isCur ? 16 : 3, Math.round(v / maxW * 34));
          var label = mode === "eff" ? fmtEff(v) : fmtCount(v);
          return '<div class="wkcol"><i style="height:' + barH + 'px">' +
            (isCur ? '<span class="wkval">' + label + '</span>' : '') + '</i></div>';
        }).join("") + '</div></div>';
    });
    h += '</div><div class="legend"><span><i class="wkpast"></i>frühere Wochen</span>' +
      '<span><i class="wkcur"></i>aktuelle Woche</span></div>';
  } else {
    h += '<div class="vol">';
    var maxAbs = 1;
    if (!compare) {
      cats.forEach(function (c) {
        var v = mode === "eff" ? a[c].eff : a[c].sets;
        if (v > maxAbs) maxAbs = v;
      });
    }
    cats.forEach(function (c) {
      var aVal = mode === "eff" ? a[c].eff : a[c].sets;
      var mainVal = mode === "eff" ? fmtEff(a[c].eff) : fmtCount(a[c].sets);
      var mainUnit = mode === "eff" ? "eff. Sätze" : (a[c].sets === 1 ? "Satz" : "Sätze");
      var capParts = [];
      if (mode === "eff") {
        capParts.push(fmtCount(a[c].sets) + (a[c].sets === 1 ? " Satz" : " Sätze"));
      }
      if (a[c].heavy > 0) capParts.push(fmtCount(a[c].heavy) + " schwer");
      var caption = capParts.length ? '<s>' + capParts.join(", ") + '</s>' : "";
      var barHtml;
      if (compare) {
        var bVal = mode === "eff" ? b[c].eff : b[c].sets;
        /* Mindestbasis wie bei imbalanceFlag(): unter minDiff Sätzen macht ein
           Prozentsprung (1 auf 3 Sätze = "+200 %") die kleinste Gruppe fälschlich
           zur auffälligsten. Maßgeblich sind die rohen Sätze, nicht der im Modus
           "Effektive Sätze" gewichtete Wert, sonst würde die Schwelle je nach
           RPE-Erfassung wandern. */
        var hiSets = Math.max(a[c].sets, b[c].sets);
        var minDiff = (IMBALANCE_THRESH[range] || IMBALANCE_THRESH[30]).minDiff;
        if (bVal < 0.05) {
          barHtml = '<span class="vb2"><span class="bar"><i class="mid"></i></span>' +
            '<span class="pct isnew">neu</span></span>';
        } else if (hiSets < minDiff) {
          barHtml = '<span class="vb2"><span class="bar"><i class="mid"></i></span>' +
            '<span class="pct">zu wenig</span></span>';
        } else {
          var pct = Math.round((aVal - bVal) / bVal * 100);
          var clamped = Math.max(-100, Math.min(100, pct));
          var cls = pct > 0 ? "pos" : (pct < 0 ? "neg" : "");
          var fill = pct === 0 ? "" :
            (pct > 0
              ? '<i class="pos" style="width:' + (clamped / 2) + '%"></i>'
              : '<i class="neg" style="width:' + (Math.abs(clamped) / 2) + '%"></i>');
          barHtml = '<span class="vb2"><span class="bar"><i class="mid"></i>' + fill +
            '</span><span class="pct ' + cls + '">' + (pct > 0 ? "+" : "") + pct +
            ' %</span></span>';
        }
      } else {
        var pctAbs = Math.round(aVal / maxAbs * 100);
        barHtml = '<span class="vb"><i class="abs" style="width:' + pctAbs + '%"></i></span>';
      }
      h += '<div class="volrow"><span class="vn">' + esc(c) + '</span>' + barHtml +
        '<span class="vv">' + mainVal + ' ' + mainUnit + caption + '</span></div>';
    });
    h += '</div>';
    if (compare) {
      h += '<div class="legend"><span><i class="pos"></i>mehr als im Zeitraum davor</span>' +
        '<span><i class="neg"></i>weniger</span></div>';
    }
  }
  if (group === "muscle") {
    var unmapped = volUnmapped(aFrom, td);
    if (unmapped.sets > 0) {
      h += '<p class="notice">' + fmtCount(unmapped.sets) +
        (unmapped.sets === 1 ? ' Satz' : ' Sätze') + ' aus ' + unmapped.exCount +
        (unmapped.exCount === 1 ? ' Übung ohne Muskelzuordnung' :
          ' Übungen ohne Muskelzuordnung') +
        ' stecken in der Summe oben, erscheinen aber in keiner Balkengruppe.' +
        ' <button class="linklike" data-act="tab" data-v="daten">Zu den Übungen</button></p>';
    }
  }
  h += '</div>';
  return h;
}

/* Punkt 7 in 1.5.2: Was hat sich im gewählten Zeitraum verbessert? Verglichen wird
   der beste Wert im Zeitraum mit dem besten Wert davor. Je Übung erscheint höchstens
   eine Zeile, das Höchstgewicht hat Vorrang vor der Schätzung, weil es die klarere
   Aussage ist. Übungen ohne Vorgeschichte stehen als "neu" drin, ein Zuwachs lässt
   sich für sie nicht angeben. Der Zeitraum kommt vom Schalter über dem Volumenblock. */
function recordBlock() {
  var range = S.volRange || 7;
  var td = todayISO(), from = shiftISO(td, -(range - 1));
  var byEx = {};
  S.entries.forEach(function (e) {
    if (!isWork(e)) return;
    if (!byEx[e.exercise]) byEx[e.exercise] = [];
    byEx[e.exercise].push(e);
  });
  var out = [];
  Object.keys(byEx).forEach(function (n) {
    var all = byEx[n].filter(function (e) { return e.date <= td; });
    var before = all.filter(function (e) { return e.date < from; });
    var inRange = all.filter(function (e) { return e.date >= from; });
    if (!inRange.length) return;
    var baseline = before, later = inRange;
    if (!before.length) {
      /* Die Übung gibt es erst seit diesem Zeitraum. Dann ist ihr erster Tag der
         Ausgangswert und verglichen wird, was danach kam; ohne einen zweiten Tag
         gibt es nichts zu vergleichen. Bis 1.26.0 stand so eine Übung hier als
         "neu", also als Rekord ohne Vorher-Wert. Gemeint ist eine Verbesserung. */
      var firstDay = inRange.reduce(function (a, e) {
        return (!a || e.date < a) ? e.date : a;
      }, "");
      baseline = inRange.filter(function (e) { return e.date === firstDay; });
      later = inRange.filter(function (e) { return e.date > firstDay; });
      if (!later.length) return;
    }
    var oldW = 0, oldE = 0, topW = null, topE = null;
    baseline.forEach(function (e) {
      if (e.weight > oldW) oldW = e.weight;
      if (e1rm(e.weight, e.reps) > oldE) oldE = e1rm(e.weight, e.reps);
    });
    later.forEach(function (e) {
      if (!topW || e.weight > topW.weight ||
          (Math.abs(e.weight - topW.weight) < 0.001 && e.reps > topW.reps)) topW = e;
      if (!topE || e1rm(e.weight, e.reps) > e1rm(topE.weight, topE.reps)) topE = e;
    });
    if (!topW) return;
    if (topW.weight > oldW + 0.001) {
      out.push({ name:n, date:topW.date,
        fig: num(topW.weight) + " kg × " + topW.reps + " Reps",
        gain: "+" + num(topW.weight - oldW) + " kg" });
      return;
    }
    var e1 = e1rm(topE.weight, topE.reps);
    if (e1 > oldE + 0.05) {
      out.push({ name:n, date:topE.date,
        fig: "~1RM " + num(e1) + " kg, aus " + num(topE.weight) + " kg × " +
          topE.reps + " Reps",
        gain: "+" + num(e1 - oldE) + " kg" });
    }
  });
  out.sort(function (a, b) { return a.date < b.date ? 1 : (a.date > b.date ? -1 : 0); });
  var h = '<div class="sect"><h2>Neue Rekorde</h2><span>' +
    (out.length ? out.length + " in " + range + " Tagen" : "keine") + '</span></div>';
  if (!out.length) {
    return h + '<p class="notice">In den letzten ' + range + ' Tagen kein neues ' +
      'Höchstgewicht und keine bessere Schätzung fürs 1 Rep Max.</p>';
  }
  h += '<div class="card" style="padding:0">';
  out.forEach(function (r) {
    h += '<div class="prrow"><span class="nm">' + esc(r.name) + '</span>' +
      '<span class="up">' + r.gain + '</span>' +
      '<span class="fig">' + r.fig + '</span>' +
      '<span class="dt">' + tinyDate(r.date) + '</span></div>';
  });
  return h + '</div>';
}

/* Neu in 1.5.3: das Gegenstück zu den Rekorden. Gezeigt wird, was seit mindestens
   vier Wochen beim gleichen Höchstgewicht steht, aber nur für Übungen, die im
   gewählten Zeitraum auch trainiert wurden. Eine Übung, die seit Monaten liegt, hat
   kein Plateau, sie ist schlicht nicht mehr im Programm. Der längste Stillstand
   steht oben, dort lohnt sich das Eingreifen am ehesten. */
function plateauBlock() {
  var range = S.volRange || 7;
  var td = todayISO(), from = shiftISO(td, -(range - 1));
  var seen = {}, out = [];
  S.entries.forEach(function (e) {
    if (!isWork(e) || seen[e.exercise]) return;
    seen[e.exercise] = 1;
    var wk = plateau(e.exercise);
    if (!wk) return;
    /* Bis einschließlich heute, damit "zuletzt am" nicht in der Zukunft steht -
       dieselbe Grenze, mit der plateau() rechnet. */
    var ls = lastSession(e.exercise, shiftISO(td, 1));
    if (!ls || ls.day < from) return;
    out.push({ name:e.exercise, weeks:wk, weight:ls.top, day:ls.day });
  });
  out.sort(function (a, b) {
    return b.weeks - a.weeks || a.name.localeCompare(b.name, "de");
  });
  var h = '<div class="sect"><h2>Plateau</h2><span>' +
    (out.length ? out.length : "nichts") + '</span></div>';
  if (!out.length) {
    return h + '<p class="notice">Keine Übung, die du in den letzten ' + range +
      ' Tagen trainiert hast, steht seit vier Wochen oder länger beim gleichen ' +
      'Gewicht.</p>';
  }
  h += '<div class="card" style="padding:0">';
  out.forEach(function (r) {
    h += '<div class="prrow"><span class="nm">' + esc(r.name) + '</span>' +
      '<span class="hold">' + r.weeks + ' Wochen</span>' +
      '<span class="fig">' + num(r.weight) + ' kg</span>' +
      '<span class="dt">zuletzt am ' + tinyDate(r.day) + '</span></div>';
  });
  return h + '</div>';
}

/* Prüft je vollständiger Kalenderwoche (Mo-So), ob ALLE Pläne, die laut ihrer
   Historie (weekGoalLog, siehe weekGoalAt()) zu dem Zeitpunkt ein Ziel hatten,
   dieses auch erreicht haben. Eine Woche ohne einen einzigen damals gültigen
   Plan zählt als "kein Ziel" und fließt nicht in die Trefferquote ein, weder
   als erreicht noch als verfehlt. Nur bei 30 und 90 Tagen: die laufende Woche
   ist noch nicht abgeschlossen und bleibt deshalb außen vor, bei 7 Tagen passt
   keine volle Vorwoche hinein. Bei 30 Tagen erscheinen die 4 Wochen einzeln,
   bei 90 Tagen nur die reine Trefferzahl (Nenner gedeckelt auf 12 Wochen). */
function weekGoalBlock() {
  var range = S.volRange || 7;
  if (range < 30) return "";
  var plans = Object.keys(S.plans).filter(function (p) {
    var log = S.settings.weekGoalLog[p];
    return !!(log && log.length);
  });
  var curMon = mondayOf(todayISO());
  var maxWeeks = Math.floor(range / 7);
  var weeks = [], met = 0, counted = 0;
  for (var w = 1; w <= maxWeeks; w++) {
    var mon = shiftISO(curMon, -7 * w), sun = shiftISO(mon, 6);
    var applicable = plans.filter(function (p) { return weekGoalAt(p, mon) > 0; });
    var hasGoal = applicable.length > 0;
    /* Welcher Plan genau gerissen wurde, statt nur "nicht erreicht" für die ganze
       Woche: applicable.every() allein sagt bei mehreren Plänen mit Ziel nicht,
       wer von ihnen verantwortlich ist. */
    var missed = applicable.filter(function (p) {
      return planDoneOnWeek(p, mon) < weekGoalAt(p, mon);
    });
    var ok = hasGoal && !missed.length;
    if (hasGoal) { counted += 1; if (ok) met += 1; }
    weeks.push({ mon:mon, sun:sun, ok:ok, hasGoal:hasGoal, missed:missed });
  }
  var h = '<div class="sect"><h2>Wochenziele</h2><span>' +
    (counted ? met + ' von ' + counted : "kein Ziel") + '</span></div>';
  if (range === 90) {
    var text = counted
      ? met + ' von ' + counted + (counted === 1 ? ' Woche' : ' Wochen') + ' erreicht.'
      : "kein Ziel";
    return h + '<div class="card"><p>' + text + '</p></div>';
  }
  h += '<div class="card" style="padding:0">';
  weeks.forEach(function (wk) {
    var status = !wk.hasGoal ? "kein Ziel" : (wk.ok ? "erreicht" :
      "nicht erreicht: " + wk.missed.map(esc).join(", "));
    h += '<div class="wgrow"><span class="wgd">' + tinyDate(wk.mon) + '–' +
      tinyDate(wk.sun) + '</span><span class="wgs' + (wk.ok ? " done" : "") + '">' +
      status + '</span></div>';
  });
  return h + '</div>';
}

/* Plateau-Hinweis in der Übungskarte, siehe viewHistory(). "Seit" behauptet einen
   Stillstand bis heute, und das stimmt nur, wenn die Übung auch gerade läuft:
   plateau() misst von der ersten bis zur letzten Einheit mit dem Gewicht, nicht
   bis heute. Liegt die letzte Einheit länger zurück, nennt der Hinweis deshalb
   ihr Datum statt "Seit" - dieselbe Offenlegung wie in den Zeilen von
   plateauBlock(). Bis 1.13.3 stand hier immer "Seit X Wochen", auch bei einer
   Übung, deren Streak ein halbes Jahr zurücklag. */
function plateauFlag(weeks, lastDay) {
  if (!weeks) return "";
  var fresh = lastDay >= shiftISO(todayISO(), -7);
  /* tinyDate() endet selbst auf einem Punkt (Tag.Monat.), deshalb steht der
     Schlusspunkt nur im "Seit"-Zweig. */
  return '<div class="flag">' + (fresh
    ? "Seit " + weeks + " Wochen beim gleichen Gewicht."
    : weeks + " Wochen beim gleichen Gewicht, zuletzt am " + tinyDate(lastDay)) +
    '</div>';
}
/* ---------- Verlauf, Punkte 12 und 13 ---------- */
function viewHistory() {
  /* Der Zeitraum-Schalter über volumeBlock() galt bis 1.14.1 nur für die Blöcke
     darüber, während Rekord, ~1RM, Satzzahl und Diagramm der Übungskarten
     darunter immer all-time waren - optisch stand der Schalter aber über dem
     ganzen Reiter. Ab jetzt gilt er auch hier: nur Sätze aus dem gewählten
     Zeitraum fließen in map, rec und er ein, Übungen ohne Satz in diesem
     Fenster tauchen entsprechend gar nicht in der Liste auf, wie schon bei
     volumeBlock()/plateauBlock()/recordBlock(). */
  /* Nach oben wird genauso begrenzt wie nach unten. Über die Datumswahl lässt sich
     ein Satz auf morgen legen - der Wochenstreifen unterstützt das ausdrücklich -,
     und bis 1.14.6 tauchte so ein Satz hier als "Bestleistung in diesem Zeitraum"
     unter der Überschrift "Letzte 30 Tage" auf, während Volumen-, Rekord- und
     Plateau-Block ihn korrekt ausließen. Jetzt gilt überall dasselbe Fenster. */
  var td = todayISO();
  var from = shiftISO(td, -((S.volRange || 7) - 1));
  var map = {};
  S.entries.forEach(function (e) {
    if (!isWork(e) || e.date < from || e.date > td) return;
    if (!map[e.exercise]) map[e.exercise] = { sets:0, last:"", ts:0, days:{} };
    var g = map[e.exercise];
    g.sets += 1;
    /* „Zuletzt trainiert“ richtet sich nach dem Trainingstag. Der Zeitstempel
       entscheidet nur noch zwischen Sätzen desselben Tages, damit ein später
       nachgetragenes altes Training nicht plötzlich als jüngstes gilt. */
    if (e.date > g.last || (e.date === g.last && e.ts > g.ts)) {
      g.ts = e.ts; g.last = e.date;
    }
    if (!g.days[e.date]) g.days[e.date] = { top:-1, topReps:0, e1:0, vol:0, sets:0 };
    var d = g.days[e.date];
    d.sets += 1;
    /* Reps am Höchstgewicht des Tages, fürs Diagramm - dieselbe Regel wie
       repsAt in plateau(): bei mehreren Sätzen mit demselben Höchstgewicht
       zählt die kleinste Wiederholungszahl, die konservativere Aussage. */
    if (e.weight > d.top) { d.top = e.weight; d.topReps = e.reps; }
    else if (Math.abs(e.weight - d.top) < 0.001 && e.reps < d.topReps) d.topReps = e.reps;
    if (e1rm(e.weight, e.reps) > d.e1) d.e1 = e1rm(e.weight, e.reps);
    d.vol += e.weight * e.reps;
  });
  var names = Object.keys(map).sort(function (a,b) {
    if (map[a].last !== map[b].last) return map[a].last < map[b].last ? 1 : -1;
    return map[b].ts - map[a].ts;
  });
  if (!names.length) {
    /* volumeBlock() zeigt in diesem Fall passend seine eigene Leermeldung.
       Zwei verschiedene Leerfälle: gar keine Trainings erfasst, oder welche,
       nur nicht im gewählten Zeitraum - dafür lohnt sich ein größeres Fenster
       eher als "noch nie trainiert". */
    var anyEver = S.entries.some(isWork);
    return volumeBlock() + weekGoalBlock() + recordBlock() + plateauBlock() +
      '<div class="sect"><h2>Übungen</h2></div>' +
      (anyEver
        ? '<p class="empty">Keine Übung in den letzten ' + (S.volRange || 7) +
          ' Tagen trainiert.<br>Ein größerer Zeitraum oben zeigt ältere Einträge.</p>'
        : '<p class="empty">Noch keine Trainings erfasst.<br>' +
          'Erfasste Sätze erscheinen hier nach Übung zusammengefasst.</p>');
  }
  var total = names.length;
  var hq = S.hsearch.trim().toLowerCase();
  if (hq) names = names.filter(function (n) { return n.toLowerCase().indexOf(hq) >= 0; });
  var h = volumeBlock() + weekGoalBlock() + recordBlock() + plateauBlock();
  h += '<div class="sect"><h2>Übungen</h2><span>' +
    (hq ? names.length + " von " + total : total + " in " + (S.volRange || 7) + " Tagen") +
    '</span></div>';
  if (total > 6) {
    h += '<div class="hfind"><input id="histSearch" data-act="hsearch" ' +
      'placeholder="Übung suchen" value="' + esc(S.hsearch) + '"></div>';
  }
  if (!names.length) {
    h += '<p class="empty">Kein Treffer für ' + esc(S.hsearch) + '.</p>';
    return h;
  }
  names.forEach(function (n) {
    var g = map[n], rec = bestOf(n, from, td), er = bestE1rm(n, from, td);
    var days = Object.keys(g.days).sort();
    var open = S.openEx === n;
    var lastDay = days[days.length - 1];
    /* map ist bereits auf den Zeitraum gefiltert, jede gelistete Übung wurde
       also im Fenster trainiert - der frühere Extra-Check auf lastDay entfiel
       damit, plateau() selbst bleibt bewusst all-time (siehe dortiger
       Kommentar), unabhängig vom Zeitraum-Schalter. */
    var flat = plateau(n);
    h += '<div class="card"><h3>' + esc(n) + '</h3>' +
      '<div class="big">' + num(rec.weight) + ' kg</div>' +
      '<p>Bestleistung in diesem Zeitraum mit ' + rec.reps + ' Reps am ' +
      shortDate(rec.date) + '.<br>' +
      '~1 Rep Max <b>' + num(e1rm(er.weight, er.reps)) + ' kg</b>, ' +
      'aus ' + num(er.weight) + ' kg mit ' + er.reps + ' Reps.<br>' +
      g.sets + (g.sets === 1 ? ' Satz' : ' Sätze') + ' in diesem Zeitraum, zuletzt am ' +
      shortDate(g.last) + '.</p>' +
      plateauFlag(flat, lastDay) +
      (days.length > 1
        ? '<button class="open" data-act="openex" data-v="' + esc(n) + '">' +
          (open ? "Diagramm ausblenden" : "Verlauf anzeigen") + '</button>'
        : "") +
      (open ? chart(days, g.days) + volChart(days, g.days) : "") +
      '</div>';
  });
  return h;
}

/* Tage zwischen zwei ISO-Daten, Mittag als Anker gegen Zeitzonen-/Sommerzeitsprünge. */
function isoDayDiff(fromIso, toIso) {
  return Math.round((Date.parse(toIso + "T12:00:00") -
    Date.parse(fromIso + "T12:00:00")) / 86400000);
}
/* Rasterlinie mit Wert am linken Rand und die Datumszeile unter der x-Achse,
   gemeinsam für chart() und volChart(). Beide Diagramme stehen untereinander auf
   derselben Zeitachse und sollen bis ins Detail gleich aussehen. */
function gridLine(y, label, padL, right) {
  return '<line x1="' + padL + '" y1="' + y.toFixed(1) + '" x2="' + right +
    '" y2="' + y.toFixed(1) + '" stroke="var(--line)" stroke-width="1"/>' +
    '<text x="' + (padL - 5) + '" y="' + (y + 3.5).toFixed(1) +
    '" font-size="9" fill="var(--muted)" text-anchor="end">' + label + '</text>';
}
function dateRow(days, padL, right, y) {
  return '<text x="' + padL + '" y="' + y + '" font-size="9" fill="var(--muted)">' +
    tinyDate(days[0]) + '</text>' +
    '<text x="' + right + '" y="' + y + '" font-size="9" fill="var(--muted)" ' +
    'text-anchor="end">' + tinyDate(days[days.length - 1]) + '</text>';
}
function chart(days, byDay) {
  /* padT auf 16 angehoben (statt 12), damit über der Volllinie noch Platz für
     die Rep-Beschriftung an jedem Punkt bleibt, ohne am oberen Rand des
     viewBox abgeschnitten zu werden. */
  var w = 320, hh = 170, padL = 34, padR = 8, padT = 16, padB = 22;
  var tops = days.map(function (d) { return byDay[d].top; });
  var e1s = days.map(function (d) { return byDay[d].e1; });
  var max = Math.max.apply(null, e1s.concat(tops));
  var min = Math.min.apply(null, tops);
  var lo = Math.max(0, min - (max - min) * 0.25 - 1), hi = max + (max - lo) * 0.1 + 1;
  var span = (hi - lo) || 1;
  /* Zeitbasiert statt indexbasiert: der Abstand zwischen zwei Trainings auf der
     x-Achse entspricht dem echten Tagesabstand, damit z.B. drei Monate Pause
     auch als Lücke sichtbar sind statt wie zwei benachbarte Tage auszusehen. */
  var totalSpan = isoDayDiff(days[0], days[days.length - 1]) || 1;
  function px(i) {
    return days.length === 1 ? padL
      : padL + isoDayDiff(days[0], days[i]) / totalSpan * (w - padL - padR);
  }
  function py(v) { return padT + (1 - (v - lo) / span) * (hh - padT - padB); }
  function poly(vals) {
    return vals.map(function (v, i) { return px(i).toFixed(1) + "," + py(v).toFixed(1); })
      .join(" ");
  }
  var dots = tops.map(function (v, i) {
    return '<circle cx="' + px(i).toFixed(1) + '" cy="' + py(v).toFixed(1) +
      '" r="2.6" fill="var(--accent)"/>';
  }).join("");
  /* Rep-Zahl am Höchstgewicht jedes Tages über dem Punkt. Ohne das wirkt eine
     laufende Rep-Progression im Diagramm wie Stillstand: die Volllinie bleibt
     flach, weil bei doppelter Progression zuerst die Wiederholungen steigen,
     nicht das Gewicht (siehe Kommentar bei repFirstOn()/plateau()). */
  var repLabels = tops.map(function (v, i) {
    return '<text x="' + px(i).toFixed(1) + '" y="' + (py(v) - 7).toFixed(1) +
      '" font-size="9.5" font-weight="700" fill="var(--ink)" text-anchor="middle">' +
      byDay[days[i]].topReps + '</text>';
  }).join("");
  var gridVals = [lo + span * 0.05, lo + span * 0.5, hi - span * 0.05];
  var grid = gridVals.map(function (v) {
    return gridLine(py(v), Math.round(v), padL, w - padR);
  }).join("");
  var first = tinyDate(days[0]), lastd = tinyDate(days[days.length-1]);
  return '<div class="chart"><p class="clab">Gewicht</p>' +
    '<svg viewBox="0 0 ' + w + ' ' + hh + '" width="100%" ' +
    'style="display:block;height:auto" preserveAspectRatio="xMidYMid meet" role="img" ' +
    'aria-label="Gewichtsverlauf">' + grid +
    '<polyline points="' + poly(e1s) + '" fill="none" stroke="var(--muted)" ' +
    'stroke-width="1.6" stroke-dasharray="4 3"/>' +
    '<polyline points="' + poly(tops) + '" fill="none" stroke="var(--accent)" ' +
    'stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>' + dots + repLabels +
    dateRow(days, padL, w - padR, hh - 6) + '</svg>' +
    '<div class="legend"><span><i></i>schwerstes Gewicht</span>' +
    '<span><i class="dash"></i>geschätztes 1RM</span></div>' +
    '<p style="margin-top:8px">' + days.length + ' Trainings, ' + first + ' bis ' +
    lastd + '</p></div>';
}

/* Runde Obergrenze, deren Hälfte ebenfalls rund ist. Ohne das stünden an den drei
   Rasterlinien Werte wie 531,25 und 1062,5. */
function niceTop(max) {
  var want = max / 2;
  var mag = Math.pow(10, Math.floor(Math.log10(want)));
  var steps = [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10];
  for (var i = 0; i < steps.length; i++) {
    if (steps[i] * mag >= want) return steps[i] * mag * 2;
  }
  return mag * 20;
}
/* Tagesvolumen als Balken unter dem Gewichtsverlauf, auf derselben Zeitachse: ein
   Trainingstag steht in beiden Bildern an derselben Stelle, der Blick wandert nur
   senkrecht. Damit ist zu sehen, was die Gewichtslinie allein verschweigt - das
   Volumen fällt bei jeder Gewichtssteigerung, weil die Reps wieder unten anfangen,
   und ein zusätzlicher Satz bewegt die Linie oben überhaupt nicht.

   Balken statt Linie, weil Volumen eine Menge je Einheit ist: eine Linie würde
   Werte an Tagen ohne Training behaupten. Nullbasiert, weil bei einer Menge ein
   abgeschnittener Sockel jeden Unterschied optisch verdoppelt - die Gewichtslinie
   darf weiter zoomen, dort geht es um Abstände.

   Bewusst zwei Bilder und nicht Balken hinter der Linie: das bräuchte zwei
   y-Skalen in einem Diagramm, die sich gegeneinander beliebig verschieben lassen,
   und jede Verschiebung zeigt einen anderen scheinbaren Zusammenhang. */
function volChart(days, byDay) {
  var vols = days.map(function (d) { return byDay[d].vol; });
  var max = Math.max.apply(null, vols);
  /* Ohne Gewicht gibt es nichts zu zeichnen, etwa bei Klimmzügen mit 0 kg. Das
     Gewichtsdiagramm darüber bleibt davon unberührt. */
  if (!(max > 0)) return "";
  var w = 320, hh = 150, padL = 34, padR = 8, padT = 16, padB = 22;
  var bw = 15, half = bw / 2;
  var hi = niceTop(max);
  /* Der Zeichenbereich rückt um eine halbe Balkenbreite ein, sonst ragte der
     erste Balken in die Achsenbeschriftung und der letzte aus dem Bild. */
  var left = padL + half, right = w - padR - half, base = hh - padB;
  var totalSpan = isoDayDiff(days[0], days[days.length - 1]) || 1;
  function px(i) {
    return days.length === 1 ? left
      : left + isoDayDiff(days[0], days[i]) / totalSpan * (right - left);
  }
  function py(v) { return padT + (1 - v / hi) * (base - padT); }
  var grid = [0, hi / 2, hi].map(function (v) {
    return gridLine(py(v), num(v), padL, w - padR);
  }).join("");
  var bars = vols.map(function (v, i) {
    var x = px(i) - half, y = py(v), r = Math.min(4, Math.max(0, (base - y) / 2));
    return '<path d="M' + x.toFixed(1) + ' ' + base + ' V' + (y + r).toFixed(1) +
      ' a' + r + ' ' + r + ' 0 0 1 ' + r + ' -' + r + ' h' + (bw - 2 * r) +
      ' a' + r + ' ' + r + ' 0 0 1 ' + r + ' ' + r + ' V' + base +
      ' Z" fill="var(--extra)"/>';
  }).join("");
  /* Beschriftet werden nur der höchste und der letzte Balken. Eine Zahl über jedem
     Balken liest niemand, und bei engen Tagesabständen überlappen sie. */
  var sum = vols.reduce(function (a, v) { return a + v; }, 0);
  var marks = [vols.indexOf(max), vols.length - 1]
    .filter(function (v, i, a) { return a.indexOf(v) === i; })
    .map(function (i) {
      var lx = Math.max(padL + 12, Math.min(w - padR - 12, px(i)));
      return '<text x="' + lx.toFixed(1) + '" y="' + (py(vols[i]) - 5).toFixed(1) +
        '" font-size="9.5" font-weight="700" fill="var(--ink)" text-anchor="middle">' +
        num(vols[i]) + '</text>';
    }).join("");
  var sets = days.reduce(function (a, d) { return a + (byDay[d].sets || 0); }, 0);
  return '<div class="chart"><p class="clab">Volumen je Training, kg</p>' +
    '<svg viewBox="0 0 ' + w + ' ' + hh + '" width="100%" ' +
    'style="display:block;height:auto" preserveAspectRatio="xMidYMid meet" role="img" ' +
    'aria-label="Volumen je Training in Kilogramm">' + grid + bars + marks +
    dateRow(days, padL, w - padR, hh - 6) + '</svg>' +
    '<p>Zusammen ' + num(sum) + ' kg aus ' + sets +
    (sets === 1 ? ' Satz' : ' Sätzen') + ', im Schnitt ' +
    num(Math.round(sum / vols.length)) + ' kg je Training.</p></div>';
}

/* ---------- Daten ---------- */
/* Der Daten-Reiter, ein Abschnitt je Funktion. Die Reihenfolge folgt dem, was am
   häufigsten gebraucht wird: Darstellung, Speicher, Backup, Pause, danach die
   selteneren Einstellungen und ganz unten die Fassung, siehe README. Bis 1.30.0
   war das ein einziger Ausdruck über 254 Zeilen. */
function viewData() {
  return dataDisplay() + dataStorage() + dataBackup() + dataPause() + dataColors() +
    dataExercises() + dataProgression() + dataExHist() + dataFocus() + dataBarbell() +
    dataMuscles() + dataVersion();
}

/* Pause */

    descText("pause", '<p style="margin-top:10px">Während der Pause bleibt der ' +

/* Vier Zustände im Abschnitt Pause. "denied" ist der unangenehme: Chrome fragt
   danach nicht mehr von selbst, zurückholen lässt es sich nur über die
   Seiteneinstellungen des Browsers. Deshalb steht der Knopf unter Daten und
   nicht mitten im Training, wo er im Vorbeigehen weggetippt würde. */
function notifyBlock() {
  var st = notifyState();
  if (st === "unsupported") {
    return '<p style="margin-top:10px">Benachrichtigungen beherrscht dieser Browser ' +
      'nicht. Das Signal kommt nur, solange die App im Vordergrund ist.</p>';
  }
  if (st === "denied") {
    return '<p style="margin-top:10px">Benachrichtigungen sind für diese Seite ' +
      'abgelehnt, das Signal kommt deshalb nur im Vordergrund. Chrome fragt von sich ' +
      'aus nicht noch einmal; erlauben lässt es sich über das Schloss-Symbol in der ' +
      'Adressleiste oder in den Seiteneinstellungen des Browsers.</p>';
  }
  if (st === "default") {
    /* Dieselbe Knopfform wie der Schalter, der danach an dieser Stelle steht,
       und wie "Automatischer Start" darüber. In der zweispaltigen Werkzeugleiste
       bräche die Beschriftung auf vier Zeilen um. */
    return '<button class="open" data-act="notifyask">' +
      'Signal bei ausgeschaltetem Bildschirm erlauben</button>' +
      '<p style="margin-top:10px">Bisher kommt das Signal nur, solange die App im ' +
      'Vordergrund ist.</p>';
  }
  return '<button class="open" data-act="notifytoggle">' +
    'Signal bei ausgeschaltetem Bildschirm: ' +
    (S.settings.notifySignal ? "an" : "aus") + '</button>' +
    (S.settings.notifySignal
      ? '<button class="open" data-act="notifytest">Signal in 5 Sekunden testen' +
        '</button>'
      : "");
}

/* Liste unter Daten: jede Übung mit ihrer hinterlegten Muskelgruppe, gruppiert
   wie die Übungsliste weiter oben nach Push/Pull/Legs/Core. */
function muscleRows() {
  var order = CATLIST.concat(["Sonstige"]);
  var byCat = {};
  order.forEach(function (c) { byCat[c] = []; });
  allNames().forEach(function (n) {
    var c = catOf(n);
    if (!byCat[c]) byCat[c] = [];
    byCat[c].push(n);
  });
  var h = "";
  order.forEach(function (c) {
    var items = byCat[c] || [];
    if (!items.length) return;
    items.sort(function (a, b) { return a.localeCompare(b, "de"); });
    h += '<div class="mgroup">' + esc(c) + '</div>';
    items.forEach(function (n) { h += muscleRow(n); });
  });
  return h;
}
/* Mitgelieferte Übungen zeigen ihre feste Zuordnung nur als Text. Eigene oder
   umbenannte Übungen haben keine, hier lassen sich Primär- und eine
   Sekundärgruppe per Dropdown selbst setzen, siehe muscleOf()/"muscleset". */
function muscleRow(n) {
  var hard = MUSCLE_GROUPS[n];
  if (hard) {
    return '<div class="mrow"><span class="nm">' + esc(n) + '</span><span class="mm">' +
      '<b>' + esc(hard.primary) + '</b>' +
      (hard.secondary.length ? ' · ' + hard.secondary.map(esc).join(", ") : "") +
      '</span></div>';
  }
  var own = S.exmeta[n] || {};
  return '<div class="mrow own"><span class="nm">' + esc(n) + '</span>' +
    '<div class="msel">' +
    '<select data-act="muscleset" data-f="primary" data-v="' + esc(n) +
    '" aria-label="Primäre Muskelgruppe für ' + esc(n) + '">' +
    muscleOptionList("Primär", own.musclePrimary) + '</select>' +
    '<select data-act="muscleset" data-f="secondary" data-v="' + esc(n) + '"' +
    (own.musclePrimary ? "" : " disabled") +
    ' aria-label="Sekundäre Muskelgruppe für ' + esc(n) + '" title="' +
    (own.musclePrimary ? "" : "Erst Primär wählen") + '">' +
    muscleOptionList("Sekundär", own.muscleSecondary, own.musclePrimary) + '</select>' +
    '</div></div>';
}
/* Zwei Listen im Daten-Reiter sind lang: die Übungen mit allen Gruppen und die
   Muskelgruppen mit jeder Übung einzeln. Zusammen schieben sie alles darunter
   weit nach unten, obwohl beide selten gebraucht werden. Sie starten deshalb
   zugeklappt.

   Der Zustand liegt in S und nicht in den Einstellungen: er soll bei jedem
   Besuch wieder zu sein, wie beim Zuklappen einzelner Gruppen (S.dataClosed)
   und der Plankarten (S.planCardsFold). */
function secOpen(key) { return !!S.secOpen[key]; }
function secFold(key, label) {
  var open = secOpen(key);
  return '<button class="secfold" data-act="secfold" data-v="' + key +
    '" aria-expanded="' + (open ? "true" : "false") + '"><span>' + label +
    '</span><span class="chv' + (open ? " up" : "") + '">' + svg("chev", 13) +
    '</span></button>';
}
function catRows() {
  var order = CATLIST.concat(["Sonstige"]);
  var byCat = {};
  order.forEach(function (c) { byCat[c] = []; });
  allNames().forEach(function (n) {
    var c = catOf(n);
    if (!byCat[c]) byCat[c] = [];
    byCat[c].push(n);
  });
  var h = "";
  order.forEach(function (c, ci) {
    var items = byCat[c] || [];
    if (!items.length) return;
    items.sort(function (a, b) { return a.localeCompare(b, "de"); });
    var closed = !!S.dataClosed[c];
    h += '<button class="chead" data-act="datacat" data-v="' + esc(c) +
      '" aria-expanded="' + (closed ? "false" : "true") + '"><span>' + esc(c) +
      '</span><span class="cc">' + items.length + '</span>' +
      '<span class="chv' + (closed ? "" : " up") + '">' + svg("chev", 13) +
      '</span></button>';
    if (closed) return;
    items.forEach(function (n) { h += catRow(n); });
    h += moveRow(c, items, order, ci);
  });
  return h;
}
/* Die Gruppe steht schon in der Überschrift, deshalb hat die Zeile kein eigenes
   Kategoriefeld mehr. Umsortiert wird am Ende der Gruppe. */
function moveRow(c, items, order, ci) {
  /* "Sonstige" ist seit 1.14.6 auch Ziel, nicht nur Ausgangspunkt. Vorher war die
     Zuordnung eine Einbahnstraße: einmal nach Push verschoben, kam eine Übung nie
     wieder in die Sammelgruppe zurück. */
  var targets = order.filter(function (o) { return o !== c; });
  if (!targets.length) return "";
  return '<div class="movecat"><span>Übung in eine andere Gruppe verschieben</span>' +
    '<div class="row"><select id="mv-' + ci + '" aria-label="Übung aus ' + esc(c) +
    ' verschieben"><option value="">Übung wählen</option>' +
    items.map(function (n) {
      return '<option value="' + esc(n) + '">' + esc(n) + '</option>';
    }).join("") + '</select>' +
    '<select data-act="catmove" data-i="' + ci + '" aria-label="Zielgruppe">' +
    '<option value="">Ziel wählen</option>' +
    targets.map(function (o) {
      return '<option value="' + esc(o) + '">nach ' + esc(o) + '</option>';
    }).join("") + '</select></div></div>';
}
function catRow(n) {
    var m = exMeta(n);
    var open = S.exOpen === n;
    var use = open ? exUsage(n) : null;
    return '<div class="crow">' +
      '<button class="nm ren" data-act="exopen" data-v="' + esc(n) +
      '" aria-expanded="' + (open ? "true" : "false") + '" title="' + esc(n) +
      ' umbenennen oder Geräteeinstellung notieren">' +
      '<i class="chv' + (open ? " up" : "") + '">' + svg("chev", 12) + '</i>' +
      '<span>' + esc(n) + '</span></button>' +
      '<select data-act="stepset" aria-label="Schrittweite für ' + esc(n) + '" data-v="' +
      esc(n) + '">' +
      STEP_CHOICES.map(function (o) {
        return '<option value="' + o + '"' +
          (Math.abs(o - m.step) < 0.001 ? " selected" : "") + '>' + num(o) + '</option>';
      }).join("") + '</select>' +
      '<button class="barb' + (m.bar ? " on" : "") + '" role="switch" aria-checked="' +
      (m.bar ? "true" : "false") + '" aria-label="' + esc(n) +
      ' an der Langhantel" data-act="barset" data-v="' + esc(n) + '">' +
      svg("hantelh", 15) + '</button>' +
      (removable(n)
        ? '<button class="xdel" data-act="exdel" data-v="' + esc(n) +
          '" aria-label="' + esc(n) + ' löschen">\u2715</button>'
        : '<span></span>') +
      '</div>' +
      (!open && m.note
        ? '<div class="cnote">' + svg("regler", 13) + '<span>' + esc(m.note) +
          '</span></div>'
        : "") +
      /* Eigene Zeile statt neben der Geräteeinstellung: die kann lang werden und
         würde die Pause sonst aus der Zeile drängen. */
      (!open && m.rest
        ? '<div class="cnote">' + svg("uhr", 13) + '<span>Pause ' + mmss(m.rest) +
          '</span></div>'
        : "") +
      (open
        ? '<div class="exbox">' +
          '<label for="ren-name">Name</label>' +

      if (!safeObjectKey(k) || typeof src.descOpen[k] !== "boolean") {
        importError("Ein Beschreibungszustand ist ungültig.");
      }
      out.descOpen[k] = src.descOpen[k];
    });
  }
  if (src.weekGoals != null) {
    if (!plainObject(src.weekGoals)) importError("Wochenziele sind ungültig.");
    out.weekGoals = {};
    Object.keys(src.weekGoals).forEach(function (p) {
      cleanName(p, "Ein Wochenziel");
      if (!Number.isInteger(src.weekGoals[p]) || src.weekGoals[p] < 0) {
        importError("Wochenziel für „" + p + "“ ist ungültig.");
      }
      out.weekGoals[p] = src.weekGoals[p];
    });
  }
  if (src.weekGoalLog != null) {
    if (!plainObject(src.weekGoalLog)) importError("Wochenziel-Historie ist ungültig.");
    out.weekGoalLog = {};
    Object.keys(src.weekGoalLog).forEach(function (p) {
      cleanName(p, "Eine Wochenziel-Historie");
      var log = src.weekGoalLog[p];
      if (!Array.isArray(log)) importError("Wochenziel-Historie für „" + p + "“ ist ungültig.");
      out.weekGoalLog[p] = log.map(function (x) {
        if (!plainObject(x) || !validISODate(x.since) || !Number.isInteger(x.value) || x.value < 0) {
          importError("Ein Wochenziel-Eintrag für „" + p + "“ ist ungültig.");
        }
        return { since:x.since, value:x.value };
      }).sort(function (a, b) { return a.since < b.since ? -1 : (a.since > b.since ? 1 : 0); });
    });
  }
  if (src.planDays != null) {
    if (!plainObject(src.planDays)) importError("Zugewiesene Tage sind ungültig.");
    out.planDays = {};
    Object.keys(src.planDays).forEach(function (d) {
      if (!validISODate(d)) importError("Ein zugewiesener Tag hat ein ungültiges Datum.");
      out.planDays[d] = cleanName(src.planDays[d], "Ein zugewiesener Tag");
    });

}
function prepareBackup(parsed) {
  if (!plainObject(parsed)) importError("oberste Ebene ist kein Objekt.");
  var src = parsed;
  if (src.app != null && src.app !== "kraftlog") importError("gehört nicht zu HantelKladde.");
  /* Fehlt die Nummer, ist die Datei älter als 1.12.3 und damit älter als alles,
     was diese Fassung noch lesen kann, siehe BACKUP_VERSION. Lieber klar
     ablehnen als die Hälfte einlesen und den Rest verschweigen. */
  if (typeof src.version !== "number" || src.version < BACKUP_VERSION) {
    importError("stammt aus einer zu alten Fassung (Format " +
      (src.version == null ? "ohne Angabe" : String(src.version)) +
      ", erwartet wird " + BACKUP_VERSION + ").");
  }
  if (!Array.isArray(src.entries)) importError("enthält keine Satzliste.");
  var out = { entries:src.entries.map(cleanEntry) };
  var ids = Object.create(null);
  out.entries.forEach(function (e) {
    if (ids[e.id]) importError("enthält die Satz-ID „" + e.id + "“ doppelt.");
    ids[e.id] = 1;
  });
  if (src.custom != null) out.custom = cleanCustom(src.custom);
  if (src.plans != null) out.plans = cleanPlans(src.plans);
  if (src.cats != null) out.cats = cleanCats(src.cats);
  if (src.colors != null) out.colors = cleanColors(src.colors);
  if (src.exmeta != null) out.exmeta = cleanExmeta(src.exmeta);
  if (src.notes != null) out.notes = cleanNotes(src.notes);
  if (src.settings != null) out.settings = cleanSettings(src.settings);
  if (src.exported != null) {
    if (typeof src.exported !== "string" || isNaN(Date.parse(src.exported))) {
      importError("hat einen ungültigen Exportzeitpunkt.");
    }
    out.exported = src.exported;
  }
  return out;
}

function mergeBackup(raw) {
  var data = prepareBackup(JSON.parse(raw));
  var list = data.entries;
  var known = Object.create(null), added = 0;
  S.entries.forEach(function (e) { known[e.id] = 1; });
  list.forEach(function (e) {
    if (e && e.id && e.date && e.exercise && !known[e.id]) {
      S.entries.push(e); known[e.id] = 1; added += 1;
    }
  });
  if (data && Array.isArray(data.custom)) {
    data.custom.forEach(function (x) {
      var nm = typeof x === "string" ? x : (x && x.name);
      if (!nm || allNames().indexOf(nm) >= 0) return;
      S.custom.push({ name:nm, cat:safeCat(x && x.cat) });
    });
  }
  if (data && data.plans && typeof data.plans === "object") {
    Object.keys(data.plans).forEach(function (p) {
      if (!Array.isArray(data.plans[p])) return;
      var untouched = S.plans[p] && DEFAULT_PLANS[p] &&
        JSON.stringify(S.plans[p]) === JSON.stringify(DEFAULT_PLANS[p]);
      if (!S.plans[p] || untouched) S.plans[p] = data.plans[p];
    });
  }
  if (data && data.cats && typeof data.cats === "object") {
    Object.keys(data.cats).forEach(function (k) {
      if (!S.cats[k]) S.cats[k] = safeCat(data.cats[k]);
    });
  }
  if (data && data.exmeta && typeof data.exmeta === "object") {
    /* Feldweise ergänzen statt je Übung. Sonst käme die Geräteeinstellung aus dem
       Backup nicht an, sobald für dieselbe Übung hier schon eine Schrittweite steht.
       Vorhandene Werte werden dabei nie überschrieben. */
    Object.keys(data.exmeta).forEach(function (k) {
      var src = data.exmeta[k];
      if (!src || typeof src !== "object") return;
      ["step", "bar", "rest", "note", "sets", "reps", "weight", "musclePrimary",
        "muscleSecondary"].forEach(function (f) {
        if (src[f] == null) return;
        if (S.exmeta[k] && S.exmeta[k][f] != null) return;
        if (!S.exmeta[k]) S.exmeta[k] = {};
        S.exmeta[k][f] = src[f];
      });
    });
  }
  if (data && data.notes && typeof data.notes === "object") {
    Object.keys(data.notes).forEach(function (k) {
      if (!S.notes[k]) S.notes[k] = data.notes[k];
    });
  }
  if (data && data.colors && typeof data.colors === "object") {
    Object.keys(data.colors).forEach(function (k) {
      var color = safeColor(data.colors[k]);
      if (!S.colors[k] && color) S.colors[k] = color;
    });
  }
  mergeSettings(data && data.settings);
  /* Steht hier noch kein Backup-Zeitpunkt, gilt der des eingelesenen Backups.
     Sonst behauptet die Erinnerung im Trainingsreiter direkt nach einem Restore
     "Es gibt noch kein Backup deiner Sätze", obwohl gerade eines eingelesen wurde. */
  if (!S.meta.lastBackup && data && typeof data.exported === "string" &&
      !isNaN(Date.parse(data.exported))) {
    S.meta.lastBackup = data.exported;
    S.meta.lastCount = S.entries.length;
  }
  persist();
  return added;
}

/* Jede Aktion der Oberfläche ist eine eigene Funktion in dieser Tabelle, der
   Schlüssel ist das data-act des angetippten Elements. Bis 1.29.1 war das eine
   else-if-Kette mit 106 Zweigen in einer 840-Zeilen-Funktion; weil var für die
   ganze Funktion gilt, brauchte jeder Zweig Namen, die in keinem anderen vorkamen
   (dupBase, dsMon, dxX). Jetzt hat jede Aktion ihren eigenen Gültigkeitsbereich.

   Nach der Aktion baut der Verteiler die Seite neu auf. Gibt die Funktion false
   zurück, unterbleibt das: entweder hat sie schon selbst neu aufgebaut (etwa nach
   einer Fehlermeldung), oder es gibt nichts neu aufzubauen (Pausentimer, Update,
   Dateidialog). Das entspricht dem früheren return mitten im Zweig.
   Object.create(null): ein data-act wie "constructor" darf nichts vom Prototyp
   treffen. */

    var wk = weekDraftEdit(selWeek());

      var d = planItemDefaults(name);

      addedN++;

ACTIONS.suggestaccept = function () {
  var acceptTarget = planTarget(S.exercise);
  var acceptWeight = deci(S.weight), acceptReps = parseInt(S.reps, 10);
  if (acceptTarget) {
    /* Die Rep-Spanne bleibt um das bewusst gesetzte Planziel zentriert. Deshalb
       wird bei doppelter Progression nur das neue Gewicht übernommen; eine
       einzelne vorgeschlagene Wiederholung verschiebt die Range nicht. */
    var hadRange = !!repRange(S.exercise, acceptTarget.weight);
    if (isFinite(acceptWeight) && acceptWeight >= 0) acceptTarget.weight = acceptWeight;
    if (!hadRange && acceptReps > 0) acceptTarget.reps = acceptReps;
    persist();
  }
  var acceptRpe = deci(S.rpe);
  S.suggestionHandled[S.date + "\n" + S.exercise] = {

ACTIONS.suggestreject = function () {

    rejectTarget ? rejectTarget.weight : NaN);
  var previousSet = previousBlock ? previousBlock.last : null;
  if (previousSet) {
    S.reps = String(previousSet.reps);
    S.weight = comma(previousSet.weight);
    if (previousSet.rpe != null) S.rpe = comma(previousSet.rpe);
  } else if (rejectTarget) {
    S.reps = String(rejectTarget.reps);
    S.weight = comma(rejectTarget.weight);

  var rejectWeight = deci(S.weight), rejectReps = parseInt(S.reps, 10);
  var rejectRpe = deci(S.rpe);
  S.suggestionHandled[S.date + "\n" + S.exercise] = {

  if (f === "reps") S.reps = String(Math.max(1, Math.round(cur + d)));
  else if (f === "weight") S.weight = comma(Math.max(0, Math.round((cur + d)*100)/100));
  else S.rpe = comma(Math.min(10, Math.max(1, Math.round((cur + d)*2)/2)));
  if (f === "reps" || f === "weight") S.source = "";
};
ACTIONS.save = function () {
  var w = deci(S.weight), r = parseInt(S.reps,10), p = deci(S.rpe);
  if (!S.exercise) { S.note = "Wähle zuerst eine Übung."; render(); return false; }
  if (isNaN(r) || r < 1) {
    S.note = "Reps fehlen oder sind keine Zahl."; render(); return false;
  }
  if (!isFinite(w) || w < 0) {
    S.note = "Das Gewicht muss eine Zahl ab 0 kg sein."; render(); return false;
  }
  if (Date.now() - lastSave < 900) {
    S.note = "Der Satz wurde eben schon gespeichert."; render(); return false;
  }
  lastSave = Date.now();
  var wasWarm = S.warm;
  var prevBest = wasWarm ? null : bestOf(S.exercise);
  var prevE1 = wasWarm ? null : bestE1rm(S.exercise);
  var id = Date.now() + "-" + Math.random().toString(36).slice(2,7);
  /* Ein Aufwärmsatz trägt seit 1.27.1 keinen RPE mehr. Er ist bewusst leicht,
     eine Anstrengungsangabe dazu sagt nichts und stand vorher nur als Zahl in
     der Satzliste. Gezählt hat sie ohnehin nie, siehe isWork(). */
  var rec0 = { id:id, date:S.date, exercise:S.exercise, set:nextSet(), weight:w,
    reps:r, rpe:(wasWarm || isNaN(p)) ? null : p, ts:Date.now() };
  if (wasWarm) rec0.warm = true;
  else if (S.plan && S.plans[S.plan]) rec0.plan = S.plan;
  S.entries.push(rec0);
  S.freshId = id; S.note = "";
  /* Punkt 9: nur im Fokus-Modus, dort und nur dort für 5s als eigener Knopf
     sichtbar, siehe showQuickUndo(). Im Standard-Trainingsreiter bleibt ein
     gespeicherter Satz wie bisher ohne eigenen Rückgängig-Hinweis. */
  if (S.focus) {
    S.undo = { kind:"newset", item:rec0,
      label:"Satz " + rec0.set + " bei " + rec0.exercise + " gespeichert." };
    showQuickUndo();
  } else {
    S.undo = null;
  }
  /* Nach einem Aufwärmsatz zurück auf das Arbeitsgewicht */
  if (wasWarm) {
    backToWork();
    showToast("Aufwärmsatz gesichert: " + num(w) + " kg × " + r);
  } else {
    /* Ein Rekord bekommt in der Meldung eigenes Gewicht, siehe .toast .hit: die
       Bestätigung eines Satzes ist Routine, ein Rekord ist der Moment, der
       auffallen soll. */
    var extra = "";
    /* Ohne früheren Satz ist nichts geschlagen: der erste Satz einer Übung ist
       seit 1.26.1 kein Rekord, siehe trainingSummary(). */
    if (prevBest && (w > prevBest.weight ||
        (Math.abs(w - prevBest.weight) < 0.001 && r > prevBest.reps))) {
      extra = '<b class="hit">Neuer Rekord</b>';
    } else if (prevE1 && e1rm(w, r) > e1rm(prevE1.weight, prevE1.reps)) {
      extra = '<b class="hit">Bestes ~1RM ' + num(e1rm(w, r)) + ' kg</b>';
    }
    var doneNow = doneSets(S.exercise, S.date), needNow = targetSets(S.exercise);
    if (doneNow === needNow) {
      extra = (extra ? extra + " · " : "") + "alle " + needNow + " Zielsätze erledigt";
    }
    showToast("Satz " + rec0.set + " gesichert: " + num(w) + " kg × " + r +
      (extra ? "<br>" + extra : ""));
    S.note = "";
    /* Nur im Fokus-Modus: die gewählte Wiederholungszahl bleibt erhalten. Der
       sichtbare Ausschnitt der Reps-Reihe springt aber wieder zum Planziel,
       damit die Zielregion für den nächsten Satz direkt erreichbar ist. */
    if (S.focus) {
      var tgt = planTarget(S.exercise);
      var tgtReps = tgt ? parseInt(tgt.reps, 10) : 0;
      repWinCenter = tgtReps > 0 ? tgtReps : null;
    }
  }
  persist();
  if (S.settings.autoRest && S.date === todayISO()) {
    startRest(wasWarm ? warmRest(S.exercise) : exRest(S.exercise));
  }
};
ACTIONS.edit = function (v) {
  var e0 = S.entries.filter(function (e) { return e.id === v; })[0];
  if (!e0) return false;
  S.editId = v; S.exercise = e0.exercise;
  S.reps = String(e0.reps); S.weight = comma(e0.weight);
