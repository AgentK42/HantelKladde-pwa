        'Reps oder eine andere Übung.</div>' : "") +
      heroWeightDial(S.exercise) +
      (split ? '<div class="plates">Stange ' + num(split.bar) + ' kg, pro Seite ' +
        split.side.map(num).join(' + ') +
        (split.rest > 0.001 ? '<b> und ' + num(split.rest) + ' kg fehlen</b>' : '') +
        '</div>' : "") +
      heroSteppers() +
      (ramp.length
        ? '<div class="warmrow"><span>Warmup</span>' +
          ramp.map(function (r, ri) {
            /* Mit Einheit, wie im Fokus-Modus: ohne "kg" steht die Zahl allein
               neben der Wiederholungszahl und liest sich wie ein zweiter Faktor. */
            return '<button data-act="warmpick" data-i="' + ri + '">' + num(r.weight) +
              ' kg <s>&times;' + r.reps + '</s></button>';
          }).join("") + '</div>'
        : "") +
      exNoteBlock() +
      '</div>' +
      /* Wie im Fokus-Modus: der Speichern-Knopf bleibt am unteren Bildschirmrand
         stehen, statt mit der Übungskarte wegzuscrollen, siehe BACKLOG. */
      '<div class="savearea main">' +
      (S.toast ? '<div class="toast">' + S.toast + '</div>' : "") +
      '<button class="save' + (S.warm ? " warm" : "") + '" data-act="save">' +
      (S.warm ? "Aufwärmsatz speichern" : "Satz " + n + " speichern") + ': ' +
      esc(S.weight) + ' kg × ' + esc(S.reps) + '</button>' +
      /* Im Standard-Trainingsreiter bleibt nur die Rückzugsmöglichkeit aus einem
         Zustand stehen, in den man geraten ist (Aufwärmen, letzte Planübung).
         Der aktive Einstieg dorthin (manuell Aufwärmen erfassen, eine Übung
         bewusst überspringen) ist hier entfernt, siehe BACKLOG. */
      (S.warm || !(planIndex() >= 0 && planIndex() < S.plans[S.plan].length - 1)
        ? '<div class="subacts">' +
          (S.warm ? '<button data-act="warmoff">Doch ein Arbeitssatz</button>' : "") +
          (!(planIndex() >= 0 && planIndex() < S.plans[S.plan].length - 1)
            ? '<button data-act="pickopen">Andere Übung</button>' : "") +
          '</div>'
        : "") + '</div>' +
      planNav();
  } else {
    h += '<div class="hero blank"><div class="hero-ex">Bereit für den ersten Satz</div>' +
      '<div class="hero-meta">Wähle einen Plan oder eine einzelne Übung. Reps ' +
      'und Gewicht werden dann aus deinem letzten Training vorgeschlagen.</div>' +
      '<div class="savearea"><button class="save" data-act="pickopen">Übung wählen</button>' +
      '</div></div>';
  }

  if (S.plan && S.plans[S.plan]) {
    var items = S.plans[S.plan];
    var offen = items.filter(function (i) {
      return doneSets(i.name, S.date) < (i.sets > 0 ? i.sets : defaultSets());
    }).length;
    h += '<button class="planhead" data-act="planlist"><b>' + esc(S.plan) + '</b><span>' +
      (offen ? offen + " von " + items.length + " offen" : "alle Zielsätze erledigt") +
      '</span><i class="chev' + (S.planOpen ? " up" : "") + '">' + svg("chev", 15) +
      '</i></button>';
    if (S.planOpen) {
      h += '<div class="plan">';
      items.forEach(function (i) {
        var need = i.sets > 0 ? i.sets : defaultSets();
        var c = doneSets(i.name, S.date);
        var full = c >= need;
        h += '<button class="' + (full ? "done " : c ? "part " : "") +
          (i.name === S.exercise ? "on" : "") +
          '" data-act="planpick" data-v="' + esc(i.name) + '"><span class="stripe"></span>' +
          '<span><span class="nm">' + esc(i.name) + '</span>' +
          '<span class="tg">' + need + 'x ' + i.reps + ' Reps mit ' + num(i.weight) +
          ' kg</span></span>' +
          '<span class="st">' + c + ' von ' + need + '</span></button>';
      });
      h += '</div>';
    }
  }

  h += '<div class="sect"><h2>Erfasste Sätze</h2><span>' +
    (day.length ? day.length + (day.length === 1 ? " Satz" : " Sätze") : "noch keine") +
    '</span></div>';

  if (!day.length) {
    h += '<p class="empty">Hier erscheint jeder gespeicherte Satz,<br>' +
      'antippen zum Korrigieren.</p>';
  } else {
    var order = [], groups = {};
    day.forEach(function (e) {
      if (!groups[e.exercise]) { groups[e.exercise] = []; order.push(e.exercise); }
      groups[e.exercise].push(e);
    });
    order.forEach(function (name) {
      var sets = groups[name];
      var wsets = sets.filter(isWork);
      var vol = wsets.reduce(function (a, e) { return a + e.weight * e.reps; }, 0);
      var need = targetSets(name);
      h += '<div class="grp"><header><h3>' + esc(name) + '</h3><span>' +
        wsets.length + ' von ' + need + ', ' + num(vol) + ' kg Last</span></header>';
      sets.forEach(function (s) {
        h += '<div class="set' +
          (s.warm ? " warm" : "") +
          (s.id === S.freshId ? " fresh" : "") + (s.id === S.editId ? " editing" : "") + '">' +
          '<button class="tapzone" data-act="edit" data-v="' + s.id + '">' +
          '<span class="no">' + (s.warm ? "A" : "") + s.set + '</span>' +
          '<span class="fig">' + s.reps + '<s>Reps</s></span>' +
          '<span class="fig">' + num(s.weight) + '<s>kg</s></span>' +
          (s.warm ? '<span class="rpe">Warmup</span>'
                  : (s.rpe != null ? '<span class="rpe">RPE ' + num(s.rpe) + '</span>' : '')) +
          '</button>' +
          '<button class="del" data-act="del" data-v="' + s.id +
          '" aria-label="Satz löschen">✕</button></div>';
      });
      h += '</div>';
    });
    var wday = day.filter(isWork);
    var workExercises = {};
    wday.forEach(function (e) { workExercises[e.exercise] = 1; });
    var workExerciseCount = Object.keys(workExercises).length;
    var total = wday.reduce(function (a, e) { return a + e.weight * e.reps; }, 0);
    var mins = dayMinutes(S.date);
    /* Aufwärmsätze bleiben in der Satzliste sichtbar, zählen den Trainingstag aber
       weder als Übung noch als erledigt. Maßgeblich sind nur Arbeitsätze.
       "erledigt" kommt jetzt aus derselben Quelle wie der Punkt im Wochenstreifen
       (dayPlan()): MIN_DONE zählt dort nur Übungen aus dem erkannten Plan, nicht
       beliebige Bonus-Übungen. Ohne erkannten Plan gibt es dafür keine Grundlage,
       die Marke bleibt dann weg statt eine Zahl zu zeigen, die nichts über einen
       Plantag aussagt. */
    var dp = dayPlan(S.date);
    var mark = (dp && dp.plan)
      ? '<em class="' + (dp.done ? "ok" : "") + '">' +
        (dp.done ? "erledigt" : "noch " + (dp.need - dp.touched)) + '</em>'
      : "";
    h += '<div class="totals"><b>' + workExerciseCount + ' Übungen</b>' +
      '<span>' + wday.length + ' Sätze</span><span>' + num(total) + ' kg</span>' +
      (mins ? '<span>' + mins + ' min</span>' : '') + mark + '</div>';

    h += '<button class="planhead" data-act="noteopen"><b>Notiz zum Tag</b><span>' +
      (S.notes[S.date] ? "vorhanden" : "keine") + '</span>' +
      '<i class="chev' + (S.noteOpen ? " up" : "") + '">' + svg("chev", 15) +
      '</i></button>';
    if (S.noteOpen) {
      h += '<textarea id="dayNote" class="note" data-act="noteinput" rows="3" ' +
        'placeholder="Wie lief es? Etwa: Knie gezwickt, Bank besetzt, Gurt benutzt.">' +
        esc(S.notes[S.date] || "") + '</textarea>';
    }
    h += '<div class="tools"><button class="solid wide" data-act="finish">' +
      'Training abschließen und sichern</button></div>';
  }
  return h;
}

/* Die Geräteeinstellung der gewählten Übung, direkt über den Eingabefeldern.
   Ein Tipp öffnet das Feld, ohne dass man den Reiter wechseln muss. */
function exNoteBlock() {
  var n = noteOf(S.exercise), open = S.exNoteFor === S.exercise;
  return '<button class="exnote' + (n ? "" : " blank") + '" data-act="exnote" ' +
    'aria-expanded="' + (open ? "true" : "false") + '">' + svg("regler", 15) +
    '<span>' + (n ? esc(n) : "Geräteeinstellung notieren") + '</span>' +
    svg("stift", 14) + '</button>' +
    (open
      ? '<div class="exnedit"><input id="exNote" data-act="exnoteinput" value="' +
        esc(n) + '" placeholder="Sitz 4, Griff eng, Polster Loch 3" ' +
        'aria-label="Geräteeinstellung für ' + esc(S.exercise) + '"></div>'
      : "");
}

/* Nur noch für den Standard-Trainingsreiter, der Fokus-Modus hat dafür die
   eigenen Knöpfe unten in der Fußzeile. */
/* Ohne Zählung "X von Y" dahinter: die Planübersicht mit Fortschrittsbalken
   direkt über der Übungskarte zeigt die Position im Plan bereits an. */
function planNav() {
  var i = planIndex();
  if (i < 0) return "";
  var list = S.plans[S.plan];
  var prev = i > 0 ? list[i-1] : null;
  var next = i < list.length - 1 ? list[i+1] : null;
  return '<div class="nextnav">' +
    '<button data-act="planstep" data-d="-1"' + (prev ? "" : " disabled") +
    ' aria-label="Vorherige Übung">&#8249;</button>' +
    '<button data-act="planstep" data-d="1"' + (next ? "" : " disabled") + '>' +
    (next ? "Weiter zu " + esc(next.name) : "Letzte Übung im Plan") +
    '</button></div>';
}

/* ---------- Fokus-Modus, 1.7.0 ---------- */
/* Plan und Position, oben im Fokus-Kopf. Anders als logHead() nennt diese Zeile
   den Plannamen mit, weil im Fokus kein Planwähler mehr darüber steht. */
function focusWho() {
  var mins = currentSessionMinutes(S.date);
  if (S.plan && S.plans[S.plan] && S.plans[S.plan].length) {
    var list = S.plans[S.plan], i = planIndex();
    var next = (i >= 0 && i < list.length - 1) ? list[i + 1].name : "";
    return '<div class="who"><b>' + esc(S.plan) + '</b><span class="wholine"><em>' +
      (i >= 0 ? "Übung " + (i + 1) + " von " + list.length
              : list.length + (list.length === 1 ? " Übung" : " Übungen")) +
      (mins ? " · " + mins + " min" : "") + '</em>' +
      (next ? '<i>Next: ' + esc(next) + '</i>' : "") + '</span></div>';
  }
  return '<div class="who"><b>Freies Training</b>' +
    (mins ? '<span>' + mins + ' min</span>' : '') + '</div>';
}

/* Bildschirmfüllender Trainingsbildschirm ohne Reiter, Wochenstreifen oder
   Planauswahl. Nutzt dieselben Datenfelder und denselben Klick-Handler wie
   der normale Trainingsreiter, ist also nur eine andere Ansicht desselben
   Zustands, keine zweite Datenquelle. */
function viewFocus() {
  if (S.pickOpen) {
    return '<div class="fx"><div class="fx-body pad">' + viewPicker() + '</div></div>';
  }
  var h = '<div class="fx"><div class="fx-head">' +
    '<button class="back" data-act="focusoff" aria-label="Fokus verlassen">' +
    svg("zurueck", 22) + '</button>' + focusWho() + '</div>' + planProgress() +
    '<div class="fx-body">';

  if (!S.exercise) {
    h += '<div class="fx-blank"><div class="hero-ex">Bereit für den ersten Satz</div>' +
      '<p class="notice">Wähle eine Übung, Reps und Gewicht werden dann ' +
      'aus deinem letzten Training vorgeschlagen.</p>' +
      '<button class="save" data-act="pickopen">Übung wählen</button></div></div></div>';
    return h;
  }

  var n = nextSet(), last = lastSession(S.exercise, S.date);
  var tg = planTarget(S.exercise);
  /* "Letztes Top Set" zeigt den besten Arbeitssatz der letzten früheren Einheit,
     nicht deren chronologisch letzten Satz. Ein leichter Auslaufsatz verfälscht
     die Zeile deshalb nicht. */
  var lastSet = last ? bestSet(last.sets) : null;
  var doneN = doneSets(S.exercise, S.date), needN = targetSets(S.exercise);
  var isToday = S.date === todayISO();
  var flat = isToday ? plateau(S.exercise) : 0;
  var curW = deci(S.weight) || 0;
  var wBase = S.warm && S.warmBase > 0 ? S.warmBase : curW;
  var ramp = doneSets(S.exercise, S.date) ? [] : warmupPlan(S.exercise, wBase);
  var split = isBar(S.exercise) ? plateSplit(curW) : null;
  var showPlates = S.settings.focusPlates;
  var done = doneN >= needN;
  var fxRng = repRange(S.exercise, curW);

  /* Pillenanzeige aus dem Standard-Trainingsreiter übernommen (.setprog), hier
     anstelle der Textzeile "Satz X von Y": blau der aktuelle, grün die erledigten
     Sätze. Immer needN Pillen, auch wenn mehr Sätze als geplant erfasst wurden -
     der zusätzliche Satz bleibt allein Sache des Speichern-Knopfs. */
  var setBars = "";
  for (var si = 0; si < needN; si++) {
    setBars += '<i class="' + (si < doneN ? "done" : (si === doneN ? "cur" : "")) + '"></i>';
  }

  h += '<div class="hero-top">' +
    '<button class="hero-ex tap" data-act="pickopen" title="Andere Übung wählen">' +
    '<span>' + esc(S.exercise) + '</span><i class="chev">' + svg("chev", 16) + '</i></button>' +
    '<div class="setprog"><div class="bars">' + setBars + '</div></div>' +
    '</div>' +
    '<div class="hero-meta">' +
    /* Wie im Standard-Trainingsreiter: bei doppelter Progression die Range
       statt der einen Zielzahl, siehe repRange(). */
    (tg ? "Ziel <b>" + needN + "x " +
      (fxRng ? rangeText(fxRng) : tg.reps) + " Reps</b> mit <b>" +
      num(tg.weight) + " kg</b><br>" : "") +
    (lastSet ? "Letztes Top Set <b>" + lastSet.reps + "x " + num(lastSet.weight) + " kg</b> am " +
      tinyDate(last.day) + (lastSet.rpe != null ? " bei RPE " + num(lastSet.rpe) : "") +
      "" : "Erste Aufzeichnung für diese Übung") +
    /* Kein Rekord im Fokus, siehe BACKLOG. Im normalen Trainingsbildschirm steht
       er weiterhin über planTarget()/bestOf() in derselben Zeile. */
    '</div>' +
    (isToday ? suggestionBlock() : "") +
    (isToday && flat ? '<div class="flag">Seit ' + flat + ' Wochen unverändert bei ' +
      num(lastSet ? lastSet.weight : 0) + ' kg. Zeit für mehr Gewicht, mehr ' +
      'Reps oder eine andere Übung.</div>' : "") +
    exNoteBlock() +
    weightDial(S.exercise) +
    (showPlates && split ? '<div class="plates">Stange ' + num(split.bar) + ' kg, pro Seite ' +
      split.side.map(num).join(' + ') +
      (split.rest > 0.001 ? '<b> und ' + num(split.rest) + ' kg fehlen</b>' : '') +
      '</div>' : "") +
    '<div class="fieldlab">REPS</div>' + focusRepPills() +
    '<div class="fieldlab">RPE</div>' + rpePills() +
    (showPlates && ramp.length
      ? '<div class="warmrow"><span>Warmup</span>' +
        ramp.map(function (r, ri) {
          return '<button data-act="warmpick" data-i="' + ri + '">' + num(r.weight) +
            ' kg <s>&times;' + r.reps + '</s></button>';
        }).join("") + '</div>'
      : "") +
    '</div>';

  var pIdx = planIndex();
  var inPlan = pIdx >= 0;
  var hasNext = S.plan && S.plans[S.plan] && inPlan &&
    pIdx < S.plans[S.plan].length - 1;
  /* Links: Aufwärmsatz nur anbieten, solange noch kein Arbeitssatz dieser Übung
     erfasst ist, danach macht der Umstieg auf ein Aufwärmgewicht keinen Sinn
     mehr - stattdessen Wechsel zu einer anderen Übung. Rechts: sobald ein
     Arbeitssatz erfasst ist, heißt "Überspringen" schon "Nächste Übung", auch
     bevor das Satzziel erreicht ist; die Akzentfarbe kommt erst mit dem Ziel. */
  var leftBtn = S.warm
    ? '<button data-act="warmoff">Doch ein Arbeitssatz</button>'
    : doneN === 0
      ? '<button data-act="warmon">Aufwärmsatz erfassen</button>'
      : '<button data-act="pickopen">Andere Übung</button>';
  var rightBtn;
  if (planAllDone()) {
    /* Ist der ganze Plan erledigt, gilt das für jede seiner Übungen, nicht nur
       für die letzte in der Reihenfolge - sonst zeigt nur die letzte Übung den
       Abschluss an, obwohl längst alle Zielsätze stehen. */
    rightBtn = '<button class="go" data-act="focusfinish">Trainingsplan abschließen</button>';
  } else if (hasNext) {
    rightBtn = '<button class="' + (done ? "go" : "") + '" data-act="planstep" data-d="1">' +
      (doneN > 0 ? "Nächste Übung" : "Übung überspringen") + '</button>';
  } else if (S.plan && S.plans[S.plan] && S.plans[S.plan].length && !inPlan) {
    /* Übung außerhalb des aktiven Plans gewählt, etwa über "Andere Übung": ihr
       eigenes Satzziel sagt nichts über den Plan aus, der läuft also weiter,
       solange er noch offene Übungen hat. */
    var openItem = nextPlanOpen();
    rightBtn = openItem
      ? '<button class="go" data-act="planpick" data-v="' + esc(openItem.name) +
        '">Weiter mit Plan</button>'
      : '<button class="go" data-act="focusfinish">Trainingsplan abschließen</button>';
  } else if (done) {
    /* Letzte Übung der Plan-Reihenfolge fertig, aber andere Übungen können noch
       offen sein, etwa nach "Übung überspringen" oder "Andere Übung". Statt
       sofort abzuschließen, erst nachfragen, siehe endWarnBlock() unten. */
    rightBtn = '<button class="go" data-act="focusfinishask">Trainingsplan abschließen</button>';
  } else {
    rightBtn = doneN === 0 ? '<button data-act="pickopen">Andere Übung</button>' : "";
  }
  h += '<div class="fx-foot">' +
    (S.focusEndConfirm ? endWarnBlock() :
    (S.toast ? '<div class="toast">' + S.toast + '</div>' : "") +
    (S.quickUndo && S.undo && S.undo.kind === "newset"
      ? '<button class="undoquick" data-act="undo">' + svg("zurueck", 15) +
        '<span>Letzten Satz löschen</span></button>'
      : "") +
    '<button class="save' + (S.warm ? " warm" : "") + '" data-act="save">' +
    (S.warm ? "Aufwärmsatz speichern" : "Satz " + n + " speichern") + ': ' +
    esc(S.weight) + ' kg × ' + esc(S.reps) + '</button>' +
    '<div class="subacts">' + leftBtn + rightBtn + '</div>') + '</div></div>';
  return h;
}
/* Großer Hinweis statt des sofortigen Abschlusses, wenn beim Antippen von
   "Trainingsplan abschließen" noch andere Übungen des Plans offen sind. */
function endWarnBlock() {
  var n = openPlanCount();
  return '<div class="endwarn"><b>Noch ' + n + (n === 1 ? ' Übung offen' : ' Übungen offen') +
    '</b><p>Training wirklich beenden?</p>' +
    '<div class="row">' +
    '<button data-act="focusfinishcancel">Weiter trainieren</button>' +
    '<button class="go" data-act="focusfinish">Ja, beenden</button>' +
    '</div></div>';
}

/* Punkt 10: bildschirmfüllende Zusammenfassung nach "Trainingsplan abschließen"
   bzw. "Training abschließen und sichern", dieselbe Datengrundlage wie
   trainingSummary(). Nutzt denselben ".fx"-Rahmen wie der Fokus-Modus. */
function viewSummary() {
  var sum = S.summaryData || trainingSummary(S.date);
  var h = '<div class="fx"><div class="fx-head"><div class="who"><b>Training ' +
    'abgeschlossen</b><span>' + longDay(S.date) + '</span></div></div>' +
    '<div class="fx-body pad">' +
    '<div class="hero-ex">Gute Arbeit!</div>' +
    '<div class="hero-meta">' + sum.exCount + (sum.exCount === 1 ? " Übung, " : " Übungen, ") +
    sum.sets + (sum.sets === 1 ? " Satz, " : " Sätze, ") + num(sum.volume) +
    ' kg Gesamtlast' + (sum.mins ? ', ' + sum.mins + ' min Trainingsdauer' : '') + '.</div>';
  if (sum.records.length) {
    h += '<div class="fieldlab">NEUE REKORDE</div><div class="card" style="padding:0">' +
      sum.records.map(function (r) {
        return '<div class="prrow"><span class="nm">' + esc(r.exercise) + '</span>' +
          '<span class="up">' + num(r.weight) + ' kg × ' + r.reps + '</span>' +
          '<span class="fig">' + (r.prevWeight != null
            ? "vorher " + num(r.prevWeight) + " kg × " + r.prevReps
            : "erste Aufzeichnung") + '</span></div>';
      }).join("") + '</div>';
  } else {
    h += '<p class="notice">Keine neuen Rekorde heute, aber jeder Satz zählt.<br><br>' +
      '<span style="display:block; text-align:center">Consistency is key 💪</span></p>';
  }
  h += '<div class="savearea"><button class="save" data-act="summaryok">Fertig</button>' +
    '</div></div></div>';
  return h;
}

/* ---------- Pläne, Punkt 8 ---------- */
function viewPlans() {
  var h = '<div class="sect"><h2>Wochenziele' + infoBtn("wochenziele") + '</h2></div>' +
    descText("wochenziele", '<p class="notice">Wie oft ein Plan pro Woche trainiert werden ' +
      'soll. 0 bedeutet kein Ziel. Erscheint im Trainingsreiter, solange dort noch kein Plan ' +
      'ausgewählt ist. Gezählt wird wie im Wochenstreifen: ein Tag zählt erst, wenn der Plan ' +
      'dort als voll absolviert gilt.</p>') +
    '<div class="card" style="padding:0">' +
    weekGoalPlans().map(function (p) {
      return '<div class="colrow"><div class="nm"><span class="pdot" style="background:' +
        planColor(p) + '"></span>' + esc(p) + (planHidden(p) ? ' <s>ausgeblendet</s>' : '') +
        '</div>' +
        '<input inputmode="numeric" value="' + weekGoal(p) + '" data-act="weekgoaledit" ' +
        'data-v="' + esc(p) + '" aria-label="Wochenziel für ' + esc(p) + '"></div>';
    }).join("") + '</div>' +
    '<div class="tools"><button class="wide"' + (weekGoalPending() ? "" : " disabled") +
    ' data-act="weekgoalrestart" title="Schreibt die aktuellen Zahlen für die laufende ' +
    'Woche fest, frühere Wochen behalten ihren damaligen Wert in der Auswertung">' +
    'Neues Wochenziel speichern</button></div>';

  h += '<div class="sect"><h2>Pläne bearbeiten' + infoBtn("plaene") +
    '<button class="wrapbtn" role="switch" aria-checked="' +
    (S.settings.wrapNames ? "true" : "false") + '" aria-label="Lange Übungsnamen umbrechen" ' +
    'title="' + (S.settings.wrapNames
      ? "Lange Übungsnamen umbrechen, tippen zum Abschalten"
      : "Lange Übungsnamen abgeschnitten, tippen zum Umbrechen") +
    '" data-act="wraptoggle">' + svg("wrap", 15) + '</button>' +
    '</h2><span>' +
    Object.keys(S.plans).length + ' Pläne</span></div>' +
    descText("plaene", '<p class="notice">Änderungen wirken sofort im Training. Die ' +
      'Zielwerte dienen als Vorschlag, sobald es für eine Übung noch kein früheres ' +
      'Training gibt. Reihenfolge ändern: den Griff links gedrückt halten und ziehen, ' +
      'ein kurzer Tipp schiebt die Übung eine Position nach oben. Der Griff-Knopf neben ' +
      'dem Plannamen sperrt die Reihenfolge gegen versehentliches Umordnen. Das Auge ' +
      'daneben blendet einen Plan im Training aus oder wieder ein.</p>') +
    '<div class="tools"><button class="wide" data-act="planfoldall">' +
    (S.planCardsFold ? "Alle Pläne ausklappen" : "Alle Pläne einklappen") + '</button></div>';

  h += '<div class="sect"><h2>Standardwerte' + infoBtn("standardwerte") + '</h2></div>' +
    '<div class="card">' +
    descText("standardwerte", '<p>Gelten für eine neu zu einem Plan hinzugefügte Übung, ' +
      'solange noch kein früheres Training vorliegt.</p>') +
    '<div class="newrow">' +
    '<div class="deffield"><label for="defSets">Sätze</label><input id="defSets" ' +
    'inputmode="numeric" value="' + S.settings.defSets + '" data-act="defedit" data-f="sets"></div>' +
    '<div class="deffield"><label for="defReps">Reps</label><input id="defReps" ' +
    'inputmode="numeric" value="' + S.settings.defReps + '" data-act="defedit" data-f="reps"></div>' +
    '<div class="deffield"><label for="defWeight">kg</label><input id="defWeight" ' +
    'inputmode="decimal" value="' + comma(S.settings.defWeight) +
    '" data-act="defedit" data-f="weight"></div>' +
    '</div></div>';

  Object.keys(S.plans).forEach(function (p) {
    var list = S.plans[p], locked = planLocked(p);
    h += '<div class="card' + (planHidden(p) ? " hidden-plan" : "") + '" style="padding:0">' +
      '<div class="phead"><h3><span class="nm">' + esc(p) + '</span>' +
      '<button class="lock" role="switch" aria-checked="' + (locked ? "false" : "true") +
      '" aria-label="Reihenfolge von ' + esc(p) + ' sperren" title="' +
      (locked ? "Reihenfolge gesperrt, tippen zum Entsperren"
              : "Reihenfolge ungesperrt, tippen zum Sperren gegen versehentliches Umordnen") +
      '" data-act="planlock" data-v="' + esc(p) + '">' +
      svg(locked ? "griffgesperrt" : "griff", 15) + '</button>' +
      '<button class="eye" role="switch" aria-checked="' + (planHidden(p) ? "false" : "true") +
      '" aria-label="' + esc(p) + ' im Training anzeigen" title="' +
      (planHidden(p) ? "Im Training ausgeblendet, tippen zum Einblenden"
                     : "Im Training sichtbar, tippen zum Ausblenden") +
      '" data-act="planvis" data-v="' + esc(p) + '">' +
      svg(planHidden(p) ? "augeaus" : "auge", 16) + '</button></h3>' +
      (S.planCardsFold ? '<span class="plancount">' + list.length +
        (list.length === 1 ? " Übung" : " Übungen") + '</span>' : "") +
      '<button data-act="delplan" data-v="' + esc(p) + '">Plan löschen</button></div>';
    if (!S.planCardsFold) {
    h += '<div class="plabels"><span></span><span>Übung</span><span>Sätze</span>' +
      '<span>Reps</span><span>kg</span>' +
      '<span></span></div><div class="prows" data-plan="' + esc(p) + '">';
    list.forEach(function (i, idx) {
      h += '<div class="prow" data-i="' + idx + '">' +
        (locked
          ? '<button class="handle off" disabled aria-label="Reihenfolge gesperrt">' +
            svg("griffgesperrt", 13) + '</button>'
          : '<button class="handle" data-act="phandle" data-p="' + esc(p) + '" data-i="' + idx +
            '" aria-label="Position ändern">\u2261</button>') +
        '<button class="nm' +
        ((S.settings.wrapNames || S.prowNameOpen === p + "|" + idx) ? " open" : "") +
        '" data-act="prownm" data-p="' + esc(p) + '" data-i="' + idx + '">' +
        esc(i.name) + '</button>' +
        '<input inputmode="numeric" value="' + (i.sets > 0 ? i.sets : defaultSets()) +
        '" data-act="pedit" data-p="' + esc(p) + '" data-i="' + idx + '" data-f="sets">' +
        '<input inputmode="numeric" value="' + i.reps + '" data-act="pedit" data-p="' +
        esc(p) + '" data-i="' + idx + '" data-f="reps">' +
        '<input inputmode="decimal" value="' + comma(i.weight) + '" data-act="pedit" data-p="' +
        esc(p) + '" data-i="' + idx + '" data-f="weight">' +
        '<button class="pdel" data-act="pdel" data-p="' + esc(p) + '" data-i="' + idx +
        '" aria-label="Übung entfernen">\u2715</button></div>';
    });
    h += '</div>';
    h += '<div class="newrow" style="padding:10px 12px 13px"><button class="wide" ' +
      'data-act="pickmulti" data-v="' + esc(p) + '">Übung hinzufügen</button></div>';
    }
    h += '</div>';
  });

  h += '<div class="sect"><h2>Neuer Plan</h2></div>' +
    '<div class="newrow"><input id="newPlan" placeholder="Name, etwa Push Day">' +
    '<button data-act="addplan">Anlegen</button></div>' +
    '<div class="tools"><button class="wide" data-act="resetplans">' +
    'Pläne auf Ausgangsstand zurücksetzen</button></div>' +
    "";
  return h;
}

/* Last je Muskelgruppe für 7, 30 oder 90 Tage, wählbar über den Zeitraum-Schalter.
   Bei 90 Tagen entfällt der Vergleich mit dem vorherigen Zeitraum, das wäre über so
   lange Spannen wenig aussagekräftig und würde die Karte nur aufblähen. */
function fmtEff(x) { return num(Math.round(x * 10) / 10); }
/* Kategorien tragen jeden Satz voll (immer ganzzahlig), Muskelgruppen können
   durch die hälftige Sekundärmuskel-Gewichtung auf x,5 landen, siehe
   volByMuscle(). Eine Stelle, die beides sauber formatiert. */
function fmtCount(x) { return x % 1 === 0 ? String(x) : fmtEff(x); }
/* Dezenter Hinweis, wenn zwei antagonistische Gruppen im gewählten Zeitraum
   deutlich auseinander laufen - relevant für Gelenkhaltung und -gesundheit.
   Bei Kategorien nur Push/Pull, bei Muskelgruppen die üblichen Antagonisten-
   Paare, siehe imbalanceFlags(). Die Schwelle wird mit wachsendem Zeitraum
   bewusst niedriger: eine Schieflage, die sich über 30 oder 90 Tage hält, ist
   ein stärkeres Signal als dieselbe Schieflage in nur einer Woche, die auch
   reines Programm-Timing sein kann (z. B. zufällig kein Rückentag diese
   Woche). Der Mindestabstand steigt parallel etwas an, sonst würde bei den
   größeren Summen jede kleine Abweichung schon anschlagen. Welche der drei
   Stufen tatsächlich gilt, entscheidet nicht der Schalter allein, sondern auch
   die Datenlage des jeweiligen Paares, siehe imbalanceThresh(). */
var IMBALANCE_THRESH = { 7: { factor:1.5, minDiff:3 }, 30: { factor:1.35, minDiff:5 },
  90: { factor:1.25, minDiff:8 } };
var IMBALANCE_RANGES = [7, 30, 90];
/* Tage von einem Datum bis heute, einschließlich beider Enden. */
function daysSince(iso) {
  var span = Math.round((Date.parse(todayISO() + "T12:00:00") -
    Date.parse(iso + "T12:00:00")) / 86400000);
  return Math.max(0, span + 1);
}
/* Wie lange wird dieses Antagonisten-Paar überhaupt beobachtet: vom ersten
   Arbeitssatz, der eine der beiden Gruppen trifft, bis heute.

   Bewusst die frühere der beiden Gruppen und nicht die spätere. Trainierst du
   Rücken seit einem Jahr und Brust erst seit zwei Wochen, dann ist "Brust-Volumen
   niedrig" über 90 Tage eine belegte Aussage - über die ganzen 90 Tage lag Brust
   tatsächlich hinten, und genau dieser Fall soll die feinere Stufe bekommen.
   Erst wenn beide Gruppen neu sind, ist die Strecke wirklich kurz.

   Ein Satz zählt für jede Gruppe, zu der er Volumen beiträgt, also auch als
   Sekundärmuskel mit seinem halben Satz - dieselbe Zuordnung wie in
   volByMuscle() bzw. volByCat(), damit Beobachtungsdauer und gezähltes Volumen
   nicht auseinanderlaufen. */
function pairHistoryDays(nameA, nameB, group) {
  var first = "";
  S.entries.forEach(function (e) {
    if (!isWork(e)) return;
    var hit;
    if (group === "muscle") {
      var mo = muscleOf(e.exercise);
      hit = !!mo && (mo.primary === nameA || mo.primary === nameB ||
        mo.secondary.indexOf(nameA) >= 0 || mo.secondary.indexOf(nameB) >= 0);
    } else {
      var c = catOf(e.exercise);
      hit = (c === nameA || c === nameB);
    }
    if (!hit) return;
    if (!first || e.date < first) first = e.date;
  });
  return first ? daysSince(first) : 0;
}
/* Die niedrigeren Faktoren bei 30 und 90 Tagen sind allein damit begründet, dass
   sich eine Schieflage über diese Zeit gehalten hat. Reicht die Beobachtung des
   Paares noch nicht so weit, ist diese Begründung nicht belegt: bis 1.13.4 traf
   im 90-Tage-Blick der empfindlichste Faktor auf womöglich zwei Wochen Daten und
   schlug entsprechend früh an. Ab 1.13.5 zählt deshalb der kleinere Wert aus
   gewähltem Zeitraum und erfasster Strecke, und dazu die passende Stufe - die
   Regel stuft sich mit wachsenden Daten von selbst hoch, statt den Hinweis bis
   dahin ganz zu sperren. Unter sieben Tagen bleibt die strengste Stufe die
   Untergrenze, eine noch strengere gibt es nicht.

   Ab 1.13.6 wird die Strecke je Paar bestimmt, siehe pairHistoryDays(), nicht
   mehr über die gesamte Aufzeichnung: wer seit einem Jahr Beine trainiert und
   erst seit zwei Wochen Bizeps und Trizeps, bekam für dieses Paar sonst die
   feinste Stufe auf zwei Wochen Daten. */
function imbalanceThresh(range, covered) {
  var cap = Math.min(range, covered);
  var pick = IMBALANCE_RANGES[0];
  IMBALANCE_RANGES.forEach(function (r) { if (r <= cap) pick = r; });
  return IMBALANCE_THRESH[pick];
}
/* Satzzahl samt Einheit, in beiden Zählweisen und immer mit deutschem
   Dezimalkomma. Muskelgruppen landen durch die hälftige Sekundär-Gewichtung auf
   x,5, deshalb nie roh konkatenieren, siehe fmtCount(). */
function setCount(v, mode) {
  if (mode === "eff") return fmtEff(v) + " eff. Sätze";
  return fmtCount(v) + (v === 1 ? " Satz" : " Sätze");
}
/* Vergleicht die beiden Gruppen in der gerade gewählten Zählweise, damit die
   Zahlen im Hinweis zu den Zahlen in den Zeilen darunter passen. Die Schwellen
   sind an rohen Sätzen kalibriert; effektive Sätze liegen etwas darunter, der
   Hinweis ist in dieser Zählweise also einen Hauch zurückhaltender - passend,
   weil effektive Sätze das strengere Maß sind. */
function imbalanceFlag(a, nameA, nameB, t, mode) {
  var key = mode === "eff" ? "eff" : "sets";
  var A = a[nameA] ? a[nameA][key] : 0, B = a[nameB] ? a[nameB][key] : 0;
  if (!A && !B) return "";
  var hi = Math.max(A, B), lo = Math.min(A, B);
  /* Der Mindestabstand kommt zuerst und gilt immer. Das Verhältnis entfällt bei
     lo = 0, sonst würde durch Null geteilt. Bis 1.13.3 stieg die Funktion in
     diesem Fall mit "if (!A || !B) return" ganz aus - genau die krasseste
     Schieflage (eine Gruppe fehlt ganz) blieb damit stumm. Der Mindestabstand
     allein hält den Fall trotzdem von Bagatellen frei: bei 7 Tagen braucht die
     stärkere Seite mindestens 3 Sätze, bei 90 Tagen 8. */
  if (hi - lo < t.minDiff) return "";
  if (lo > 0 && hi / lo < t.factor) return "";
  var heavier = A > B ? nameA : nameB, lighter = heavier === nameA ? nameB : nameA;
  return '<div class="flag">' + heavier + ' ' + setCount(hi, mode) + ', ' +
    lighter + ' ' + setCount(lo, mode) + ' &ndash; ' + lighter +
    '-Volumen niedrig.</div>';
}
var CAT_PAIRS = [["Push", "Pull"]];
var MUSCLE_PAIRS = [["Brust", "Rücken"], ["Bizeps", "Trizeps"], ["Quadrizeps", "Beinbeuger"]];
function imbalanceFlags(a, group, range, mode) {
  var pairs = group === "muscle" ? MUSCLE_PAIRS : CAT_PAIRS;
  return pairs.map(function (p) {
    var t = imbalanceThresh(range, pairHistoryDays(p[0], p[1], group));
    return imbalanceFlag(a, p[0], p[1], t, mode);
  }).join("");
}
/* Wahlweise nach den vier Trainingskategorien oder nach den feineren
   Muskelgruppen aus muscleOf() gruppiert, siehe volByCat()/volByMuscle().
   Je Gruppe zählen Arbeitssätze oder, als Variante, effektive Sätze nach
   Anstrengung. Bei 7 Tagen zeigt der Balken die Veränderung zur Vorperiode,
   bei 30 Tagen die letzten vier Wochen einzeln, je Gruppe auf eigener Skala,
   damit eine kleine Gruppe nicht neben einer großen verschwindet. Bei 90 Tagen
   gibt es keinen Vergleich, dort zeigt er den Anteil am größten Wert. Die
   Gesamtlast in kg bleibt als eine Summenzeile erhalten. */
function volumeBlock() {
  var range = S.volRange || 7;
  var mode = S.volMode === "eff" ? "eff" : "sets";
  var group = S.volGroup === "muscle" ? "muscle" : "cat";
  var groupList = group === "muscle" ? MUSCLE_LIST : CATLIST.concat(["Sonstige"]);
  var dataFn = group === "muscle" ? volByMuscle : volByCat;
  var compare = range < 90;
  var td = todayISO();
  var aFrom = shiftISO(td, -(range - 1));
  var a = dataFn(aFrom, td);
  var bFrom, bTo, b;
  if (compare) {
    bTo = shiftISO(aFrom, -1);
    bFrom = shiftISO(bTo, -(range - 1));
    b = dataFn(bFrom, bTo);
  }
  var cats = groupList.filter(function (c) {
    return a[c].sets || (compare && b[c].sets);
  });
  var h = '<div class="sect"><h2>Letzte ' + range + ' Tage</h2></div>' +
    '<div class="tools" style="grid-template-columns:1fr 1fr">' +
    [["cat", "Kategorien"], ["muscle", "Muskelgruppen"]].map(function (g) {
      return '<button class="mode' + (group === g[0] ? " on" : "") + '" data-act="volgroup" ' +
        'data-v="' + g[0] + '">' + g[1] + '</button>';
    }).join("") + '</div>' +
    '<div class="tools" style="grid-template-columns:1fr 1fr 1fr; margin-top:8px">' +
    [7, 30, 90].map(function (r) {
      return '<button class="mode' + (range === r ? " on" : "") + '" data-act="volrange" ' +
        'data-v="' + r + '">' + r + ' Tage</button>';
    }).join("") + '</div>' +
    '<div class="tools" style="grid-template-columns:1fr 1fr; margin-top:8px">' +
    '<button class="mode' + (mode === "sets" ? " on" : "") + '" data-act="volmode" ' +
    'data-v="sets">Sätze</button>' +
    '<button class="mode' + (mode === "eff" ? " on" : "") + '" data-act="volmode" ' +
    'data-v="eff">Effektive Sätze</button></div>' +
    (mode === "eff"
      ? '<p class="notice">Effektive Sätze zählen jeden Satz nach Anstrengung statt nach ' +
        'Gewicht: ab RPE 9 zu 100 Prozent, RPE 8 zu 90, RPE 7 zu 70, darunter kaum. Ohne ' +
        'erfassten RPE wird ein mittlerer Wert angenommen.</p>'
      : "");
  if (!cats.length) {
    return h + '<p class="notice">' + (group === "muscle"
      ? "Noch keine Übung in diesem Zeitraum lässt sich einer Muskelgruppe zuordnen."
      : "Noch keine Arbeitssätze in diesem Zeitraum.") + '</p>';
  }
  var totA = volTotals(aFrom, td);
  var totB = compare ? volTotals(bFrom, bTo) : null;
  var dl = totA.days;
  var mins = dl.reduce(function (acc, d) { return acc + dayMinutes(d); }, 0);
  h += '<div class="card"><p>' + dl.length +
    (dl.length === 1 ? " Training, " : " Trainings, ") +
    num(Math.round(totA.vol)) + ' kg Gesamtlast aus ' + totA.sets +
    (totA.sets === 1 ? ' Arbeitssatz' : ' Arbeitssätzen') +
    (mins ? ', ' + mins + ' Minuten' : '') + '.' +
    (compare
      ? '<br>Vorheriger Zeitraum ' + num(Math.round(totB.vol)) + ' kg' +
        (totB.vol > 0 ? ', das sind ' + (totA.vol >= totB.vol ? "+" : "") +
          Math.round((totA.vol - totB.vol) / totB.vol * 100) + ' Prozent' : '') + '.'
      : '') + '</p>' +
    imbalanceFlags(a, group, range, mode);
  if (range === 30) {
    var weeks = [];
    for (var w = 0; w < 4; w++) {
      var wTo = shiftISO(td, -(3 - w) * 7);
      weeks.push(dataFn(shiftISO(wTo, -6), wTo));
    }
    h += '<div class="wk">';
    cats.forEach(function (c) {
      var vals = weeks.map(function (wd) { return mode === "eff" ? wd[c].eff : wd[c].sets; });
      var maxW = Math.max.apply(null, vals) || 1;
      h += '<div class="wkrow"><span class="vn">' + esc(c) + '</span><div class="wkcols">' +
        vals.map(function (v, i) {
          var isCur = i === 3;
          var barH = Math.max(isCur ? 16 : 3, Math.round(v / maxW * 34));
          var label = mode === "eff" ? fmtEff(v) : fmtCount(v);
          return '<div class="wkcol"><i style="height:' + barH + 'px">' +
            (isCur ? '<span class="wkval">' + label + '</span>' : '') + '</i></div>';
        }).join("") + '</div></div>';
    });
    h += '</div><div class="legend"><span><i class="wkpast"></i>frühere Wochen</span>' +
      '<span><i class="wkcur"></i>aktuelle Woche</span></div>';
  } else {
    h += '<div class="vol">';
    var maxAbs = 1;
    if (!compare) {
      cats.forEach(function (c) {
        var v = mode === "eff" ? a[c].eff : a[c].sets;
        if (v > maxAbs) maxAbs = v;
      });
    }
    cats.forEach(function (c) {
      var aVal = mode === "eff" ? a[c].eff : a[c].sets;
      var mainVal = mode === "eff" ? fmtEff(a[c].eff) : fmtCount(a[c].sets);
      var mainUnit = mode === "eff" ? "eff. Sätze" : (a[c].sets === 1 ? "Satz" : "Sätze");
      var capParts = [];
      if (mode === "eff") {
        capParts.push(fmtCount(a[c].sets) + (a[c].sets === 1 ? " Satz" : " Sätze"));
      }
      if (a[c].heavy > 0) capParts.push(fmtCount(a[c].heavy) + " schwer");
      var caption = capParts.length ? '<s>' + capParts.join(", ") + '</s>' : "";
      var barHtml;
      if (compare) {
        var bVal = mode === "eff" ? b[c].eff : b[c].sets;
        /* Mindestbasis wie bei imbalanceFlag(): unter minDiff Sätzen macht ein
           Prozentsprung (1 auf 3 Sätze = "+200 %") die kleinste Gruppe fälschlich
           zur auffälligsten. Maßgeblich sind die rohen Sätze, nicht der im Modus
           "Effektive Sätze" gewichtete Wert, sonst würde die Schwelle je nach
           RPE-Erfassung wandern. */
        var hiSets = Math.max(a[c].sets, b[c].sets);
        var minDiff = (IMBALANCE_THRESH[range] || IMBALANCE_THRESH[30]).minDiff;
        if (bVal < 0.05) {
          barHtml = '<span class="vb2"><span class="bar"><i class="mid"></i></span>' +
            '<span class="pct isnew">neu</span></span>';
        } else if (hiSets < minDiff) {
          barHtml = '<span class="vb2"><span class="bar"><i class="mid"></i></span>' +
            '<span class="pct">zu wenig</span></span>';
        } else {
          var pct = Math.round((aVal - bVal) / bVal * 100);
          var clamped = Math.max(-100, Math.min(100, pct));
          var cls = pct > 0 ? "pos" : (pct < 0 ? "neg" : "");
          var fill = pct === 0 ? "" :
            (pct > 0
              ? '<i class="pos" style="width:' + (clamped / 2) + '%"></i>'
              : '<i class="neg" style="width:' + (Math.abs(clamped) / 2) + '%"></i>');
          barHtml = '<span class="vb2"><span class="bar"><i class="mid"></i>' + fill +
            '</span><span class="pct ' + cls + '">' + (pct > 0 ? "+" : "") + pct +
            ' %</span></span>';
        }
      } else {
        var pctAbs = Math.round(aVal / maxAbs * 100);
        barHtml = '<span class="vb"><i class="abs" style="width:' + pctAbs + '%"></i></span>';
      }
      h += '<div class="volrow"><span class="vn">' + esc(c) + '</span>' + barHtml +
        '<span class="vv">' + mainVal + ' ' + mainUnit + caption + '</span></div>';
    });
    h += '</div>';
    if (compare) {
      h += '<div class="legend"><span><i class="pos"></i>mehr als im Zeitraum davor</span>' +
        '<span><i class="neg"></i>weniger</span></div>';
    }
  }
  if (group === "muscle") {
    var unmapped = volUnmapped(aFrom, td);
    if (unmapped.sets > 0) {
      h += '<p class="notice">' + fmtCount(unmapped.sets) +
        (unmapped.sets === 1 ? ' Satz' : ' Sätze') + ' aus ' + unmapped.exCount +
        (unmapped.exCount === 1 ? ' Übung ohne Muskelzuordnung' :
          ' Übungen ohne Muskelzuordnung') +
        ' stecken in der Summe oben, erscheinen aber in keiner Balkengruppe.' +
        ' <button class="linklike" data-act="tab" data-v="daten">Zu den Übungen</button></p>';
    }
  }
  h += '</div>';
  return h;
}

/* Punkt 7 in 1.5.2: Was hat sich im gewählten Zeitraum verbessert? Verglichen wird
   der beste Wert im Zeitraum mit dem besten Wert davor. Je Übung erscheint höchstens
   eine Zeile, das Höchstgewicht hat Vorrang vor der Schätzung, weil es die klarere
   Aussage ist. Übungen ohne Vorgeschichte stehen als "neu" drin, ein Zuwachs lässt
   sich für sie nicht angeben. Der Zeitraum kommt vom Schalter über dem Volumenblock. */
function recordBlock() {
  var range = S.volRange || 7;
  var td = todayISO(), from = shiftISO(td, -(range - 1));
  var byEx = {};
  S.entries.forEach(function (e) {
    if (!isWork(e)) return;
    if (!byEx[e.exercise]) byEx[e.exercise] = [];
    byEx[e.exercise].push(e);
  });
  var out = [];
  Object.keys(byEx).forEach(function (n) {
    var oldW = 0, oldE = 0, seenBefore = false, topW = null, topE = null;
    byEx[n].forEach(function (e) {
      if (e.date < from) {
        seenBefore = true;
        if (e.weight > oldW) oldW = e.weight;
        if (e1rm(e.weight, e.reps) > oldE) oldE = e1rm(e.weight, e.reps);
      } else if (e.date <= td) {
        if (!topW || e.weight > topW.weight ||
            (Math.abs(e.weight - topW.weight) < 0.001 && e.reps > topW.reps)) topW = e;
        if (!topE || e1rm(e.weight, e.reps) > e1rm(topE.weight, topE.reps)) topE = e;
      }
    });
    if (!topW) return;
    /* Auch 0 kg ist bei einer neuen Körpergewichtsübung eine echte erste
       Aufzeichnung. Vorher fiel sie durch den Vergleich mit oldW = 0. */
    if (!seenBefore) {
      out.push({ name:n, date:topW.date,
        fig:num(topW.weight) + " kg × " + topW.reps + " Reps", gain:"neu" });
      return;
    }
    if (topW.weight > oldW + 0.001) {
      out.push({ name:n, date:topW.date,
        fig: num(topW.weight) + " kg × " + topW.reps + " Reps",
        gain: "+" + num(topW.weight - oldW) + " kg" });
      return;
    }
    var e1 = e1rm(topE.weight, topE.reps);
    if (e1 > oldE + 0.05) {
      out.push({ name:n, date:topE.date,
        fig: "~1RM " + num(e1) + " kg, aus " + num(topE.weight) + " kg × " +
          topE.reps + " Reps",
        gain: "+" + num(e1 - oldE) + " kg" });
    }
  });
  out.sort(function (a, b) { return a.date < b.date ? 1 : (a.date > b.date ? -1 : 0); });
  var h = '<div class="sect"><h2>Neue Rekorde</h2><span>' +
    (out.length ? out.length + " in " + range + " Tagen" : "keine") + '</span></div>';
  if (!out.length) {
    return h + '<p class="notice">In den letzten ' + range + ' Tagen kein neues ' +
      'Höchstgewicht und keine bessere Schätzung fürs 1 Rep Max.</p>';
  }
  h += '<div class="card" style="padding:0">';
  out.forEach(function (r) {
    h += '<div class="prrow"><span class="nm">' + esc(r.name) + '</span>' +
      '<span class="up">' + r.gain + '</span>' +
      '<span class="fig">' + r.fig + '</span>' +
      '<span class="dt">' + tinyDate(r.date) + '</span></div>';
  });
  return h + '</div>';
}

/* Neu in 1.5.3: das Gegenstück zu den Rekorden. Gezeigt wird, was seit mindestens
   vier Wochen beim gleichen Höchstgewicht steht, aber nur für Übungen, die im
   gewählten Zeitraum auch trainiert wurden. Eine Übung, die seit Monaten liegt, hat
   kein Plateau, sie ist schlicht nicht mehr im Programm. Der längste Stillstand
   steht oben, dort lohnt sich das Eingreifen am ehesten. */
function plateauBlock() {
  var range = S.volRange || 7;
  var td = todayISO(), from = shiftISO(td, -(range - 1));
  var seen = {}, out = [];
  S.entries.forEach(function (e) {
    if (!isWork(e) || seen[e.exercise]) return;
    seen[e.exercise] = 1;
    var wk = plateau(e.exercise);
    if (!wk) return;
    /* Bis einschließlich heute, damit "zuletzt am" nicht in der Zukunft steht -
       dieselbe Grenze, mit der plateau() rechnet. */
    var ls = lastSession(e.exercise, shiftISO(td, 1));
    if (!ls || ls.day < from) return;
    out.push({ name:e.exercise, weeks:wk, weight:ls.top, day:ls.day });
  });
  out.sort(function (a, b) {
    return b.weeks - a.weeks || a.name.localeCompare(b.name, "de");
  });
  var h = '<div class="sect"><h2>Plateau</h2><span>' +
    (out.length ? out.length : "nichts") + '</span></div>';
  if (!out.length) {
    return h + '<p class="notice">Keine Übung, die du in den letzten ' + range +
      ' Tagen trainiert hast, steht seit vier Wochen oder länger beim gleichen ' +
      'Gewicht.</p>';
  }
  h += '<div class="card" style="padding:0">';
  out.forEach(function (r) {
    h += '<div class="prrow"><span class="nm">' + esc(r.name) + '</span>' +
      '<span class="hold">' + r.weeks + ' Wochen</span>' +
      '<span class="fig">' + num(r.weight) + ' kg</span>' +
      '<span class="dt">zuletzt am ' + tinyDate(r.day) + '</span></div>';
  });
  return h + '</div>';
}

/* Prüft je vollständiger Kalenderwoche (Mo-So), ob ALLE Pläne, die laut ihrer
   Historie (weekGoalLog, siehe weekGoalAt()) zu dem Zeitpunkt ein Ziel hatten,
   dieses auch erreicht haben. Eine Woche ohne einen einzigen damals gültigen
   Plan zählt als "kein Ziel" und fließt nicht in die Trefferquote ein, weder
   als erreicht noch als verfehlt. Nur bei 30 und 90 Tagen: die laufende Woche
   ist noch nicht abgeschlossen und bleibt deshalb außen vor, bei 7 Tagen passt
   keine volle Vorwoche hinein. Bei 30 Tagen erscheinen die 4 Wochen einzeln,
   bei 90 Tagen nur die reine Trefferzahl (Nenner gedeckelt auf 12 Wochen). */
function weekGoalBlock() {
  var range = S.volRange || 7;
  if (range < 30) return "";
  var plans = Object.keys(S.plans).filter(function (p) {
    var log = S.settings.weekGoalLog[p];
    return !!(log && log.length);
  });
  var curMon = mondayOf(todayISO());
  var maxWeeks = Math.floor(range / 7);
  var weeks = [], met = 0, counted = 0;
  for (var w = 1; w <= maxWeeks; w++) {
    var mon = shiftISO(curMon, -7 * w), sun = shiftISO(mon, 6);
    var applicable = plans.filter(function (p) { return weekGoalAt(p, mon) > 0; });
    var hasGoal = applicable.length > 0;
    /* Welcher Plan genau gerissen wurde, statt nur "nicht erreicht" für die ganze
       Woche: applicable.every() allein sagt bei mehreren Plänen mit Ziel nicht,
       wer von ihnen verantwortlich ist. */
    var missed = applicable.filter(function (p) {
      return planDoneOnWeek(p, mon) < weekGoalAt(p, mon);
    });
    var ok = hasGoal && !missed.length;
    if (hasGoal) { counted += 1; if (ok) met += 1; }
    weeks.push({ mon:mon, sun:sun, ok:ok, hasGoal:hasGoal, missed:missed });
  }
  var h = '<div class="sect"><h2>Wochenziele</h2><span>' +
    (counted ? met + ' von ' + counted : "kein Ziel") + '</span></div>';
  if (range === 90) {
    var text = counted
      ? met + ' von ' + counted + (counted === 1 ? ' Woche' : ' Wochen') + ' erreicht.'
      : "kein Ziel";
    return h + '<div class="card"><p>' + text + '</p></div>';
  }
  h += '<div class="card" style="padding:0">';
  weeks.forEach(function (wk) {
    var status = !wk.hasGoal ? "kein Ziel" : (wk.ok ? "erreicht" :
      "nicht erreicht: " + wk.missed.map(esc).join(", "));
    h += '<div class="wgrow"><span class="wgd">' + tinyDate(wk.mon) + '–' +
      tinyDate(wk.sun) + '</span><span class="wgs' + (wk.ok ? " done" : "") + '">' +
      status + '</span></div>';
  });
  return h + '</div>';
}

/* Plateau-Hinweis in der Übungskarte, siehe viewHistory(). "Seit" behauptet einen
   Stillstand bis heute, und das stimmt nur, wenn die Übung auch gerade läuft:
   plateau() misst von der ersten bis zur letzten Einheit mit dem Gewicht, nicht
   bis heute. Liegt die letzte Einheit länger zurück, nennt der Hinweis deshalb
   ihr Datum statt "Seit" - dieselbe Offenlegung wie in den Zeilen von
   plateauBlock(). Bis 1.13.3 stand hier immer "Seit X Wochen", auch bei einer
   Übung, deren Streak ein halbes Jahr zurücklag. */
function plateauFlag(weeks, lastDay) {
  if (!weeks) return "";
  var fresh = lastDay >= shiftISO(todayISO(), -7);
  /* tinyDate() endet selbst auf einem Punkt (Tag.Monat.), deshalb steht der
     Schlusspunkt nur im "Seit"-Zweig. */
  return '<div class="flag">' + (fresh
    ? "Seit " + weeks + " Wochen beim gleichen Gewicht."
    : weeks + " Wochen beim gleichen Gewicht, zuletzt am " + tinyDate(lastDay)) +
    '</div>';
}
/* ---------- Verlauf, Punkte 12 und 13 ---------- */
function viewHistory() {
  /* Der Zeitraum-Schalter über volumeBlock() galt bis 1.14.1 nur für die Blöcke
     darüber, während Rekord, ~1RM, Satzzahl und Diagramm der Übungskarten
     darunter immer all-time waren - optisch stand der Schalter aber über dem
     ganzen Reiter. Ab jetzt gilt er auch hier: nur Sätze aus dem gewählten
     Zeitraum fließen in map, rec und er ein, Übungen ohne Satz in diesem
     Fenster tauchen entsprechend gar nicht in der Liste auf, wie schon bei
     volumeBlock()/plateauBlock()/recordBlock(). */
  /* Nach oben wird genauso begrenzt wie nach unten. Über die Datumswahl lässt sich
     ein Satz auf morgen legen - der Wochenstreifen unterstützt das ausdrücklich -,
     und bis 1.14.6 tauchte so ein Satz hier als "Bestleistung in diesem Zeitraum"
     unter der Überschrift "Letzte 30 Tage" auf, während Volumen-, Rekord- und
     Plateau-Block ihn korrekt ausließen. Jetzt gilt überall dasselbe Fenster. */
  var td = todayISO();
  var from = shiftISO(td, -((S.volRange || 7) - 1));
  var map = {};
  S.entries.forEach(function (e) {
    if (!isWork(e) || e.date < from || e.date > td) return;
    if (!map[e.exercise]) map[e.exercise] = { sets:0, last:"", ts:0, days:{} };
    var g = map[e.exercise];
    g.sets += 1;
    /* „Zuletzt trainiert“ richtet sich nach dem Trainingstag. Der Zeitstempel
       entscheidet nur noch zwischen Sätzen desselben Tages, damit ein später
       nachgetragenes altes Training nicht plötzlich als jüngstes gilt. */
    if (e.date > g.last || (e.date === g.last && e.ts > g.ts)) {
      g.ts = e.ts; g.last = e.date;
    }
    if (!g.days[e.date]) g.days[e.date] = { top:-1, topReps:0, e1:0, vol:0 };
    var d = g.days[e.date];
    /* Reps am Höchstgewicht des Tages, fürs Diagramm - dieselbe Regel wie
       repsAt in plateau(): bei mehreren Sätzen mit demselben Höchstgewicht
       zählt die kleinste Wiederholungszahl, die konservativere Aussage. */
    if (e.weight > d.top) { d.top = e.weight; d.topReps = e.reps; }
    else if (Math.abs(e.weight - d.top) < 0.001 && e.reps < d.topReps) d.topReps = e.reps;
    if (e1rm(e.weight, e.reps) > d.e1) d.e1 = e1rm(e.weight, e.reps);
    d.vol += e.weight * e.reps;
  });
  var names = Object.keys(map).sort(function (a,b) {
    if (map[a].last !== map[b].last) return map[a].last < map[b].last ? 1 : -1;
    return map[b].ts - map[a].ts;
  });
  if (!names.length) {
    /* volumeBlock() zeigt in diesem Fall passend seine eigene Leermeldung.
       Zwei verschiedene Leerfälle: gar keine Trainings erfasst, oder welche,
       nur nicht im gewählten Zeitraum - dafür lohnt sich ein größeres Fenster
       eher als "noch nie trainiert". */
    var anyEver = S.entries.some(isWork);
    return volumeBlock() + weekGoalBlock() + recordBlock() + plateauBlock() +
      '<div class="sect"><h2>Übungen</h2></div>' +
      (anyEver
        ? '<p class="empty">Keine Übung in den letzten ' + (S.volRange || 7) +
          ' Tagen trainiert.<br>Ein größerer Zeitraum oben zeigt ältere Einträge.</p>'
        : '<p class="empty">Noch keine Trainings erfasst.<br>' +
          'Erfasste Sätze erscheinen hier nach Übung zusammengefasst.</p>');
  }
  var total = names.length;
  var hq = S.hsearch.trim().toLowerCase();
  if (hq) names = names.filter(function (n) { return n.toLowerCase().indexOf(hq) >= 0; });
  var h = volumeBlock() + weekGoalBlock() + recordBlock() + plateauBlock();
  h += '<div class="sect"><h2>Übungen</h2><span>' +
    (hq ? names.length + " von " + total : total + " in " + (S.volRange || 7) + " Tagen") +
    '</span></div>';
  if (total > 6) {
    h += '<div class="hfind"><input id="histSearch" data-act="hsearch" ' +
      'placeholder="Übung suchen" value="' + esc(S.hsearch) + '"></div>';
  }
  if (!names.length) {
    h += '<p class="empty">Kein Treffer für ' + esc(S.hsearch) + '.</p>';
    return h;
  }
  names.forEach(function (n) {
    var g = map[n], rec = bestOf(n, from, td), er = bestE1rm(n, from, td);
    var days = Object.keys(g.days).sort();
    var open = S.openEx === n;
    var lastDay = days[days.length - 1];
    /* map ist bereits auf den Zeitraum gefiltert, jede gelistete Übung wurde
       also im Fenster trainiert - der frühere Extra-Check auf lastDay entfiel
       damit, plateau() selbst bleibt bewusst all-time (siehe dortiger
       Kommentar), unabhängig vom Zeitraum-Schalter. */
    var flat = plateau(n);
    h += '<div class="card"><h3>' + esc(n) + '</h3>' +
      '<div class="big">' + num(rec.weight) + ' kg</div>' +
      '<p>Bestleistung in diesem Zeitraum mit ' + rec.reps + ' Reps am ' +
      shortDate(rec.date) + '.<br>' +
      '~1 Rep Max <b>' + num(e1rm(er.weight, er.reps)) + ' kg</b>, ' +
      'aus ' + num(er.weight) + ' kg mit ' + er.reps + ' Reps.<br>' +
      g.sets + (g.sets === 1 ? ' Satz' : ' Sätze') + ' in diesem Zeitraum, zuletzt am ' +
      shortDate(g.last) + '.</p>' +
      plateauFlag(flat, lastDay) +
      (days.length > 1
        ? '<button class="open" data-act="openex" data-v="' + esc(n) + '">' +
          (open ? "Diagramm ausblenden" : "Verlauf anzeigen") + '</button>'
        : "") +
      (open ? chart(days, g.days) : "") +
      '</div>';
  });
  return h;
}

/* Tage zwischen zwei ISO-Daten, Mittag als Anker gegen Zeitzonen-/Sommerzeitsprünge. */
function isoDayDiff(fromIso, toIso) {
  return Math.round((Date.parse(toIso + "T12:00:00") -
    Date.parse(fromIso + "T12:00:00")) / 86400000);
}
function chart(days, byDay) {
  /* padT auf 16 angehoben (statt 12), damit über der Volllinie noch Platz für
     die Rep-Beschriftung an jedem Punkt bleibt, ohne am oberen Rand des
     viewBox abgeschnitten zu werden. */
  var w = 320, hh = 170, padL = 34, padR = 8, padT = 16, padB = 22;
  var tops = days.map(function (d) { return byDay[d].top; });
  var e1s = days.map(function (d) { return byDay[d].e1; });
  var max = Math.max.apply(null, e1s.concat(tops));
  var min = Math.min.apply(null, tops);
  var lo = Math.max(0, min - (max - min) * 0.25 - 1), hi = max + (max - lo) * 0.1 + 1;
  var span = (hi - lo) || 1;
  /* Zeitbasiert statt indexbasiert: der Abstand zwischen zwei Trainings auf der
     x-Achse entspricht dem echten Tagesabstand, damit z.B. drei Monate Pause
     auch als Lücke sichtbar sind statt wie zwei benachbarte Tage auszusehen. */
  var totalSpan = isoDayDiff(days[0], days[days.length - 1]) || 1;
  function px(i) {
    return days.length === 1 ? padL
      : padL + isoDayDiff(days[0], days[i]) / totalSpan * (w - padL - padR);
  }
  function py(v) { return padT + (1 - (v - lo) / span) * (hh - padT - padB); }
  function poly(vals) {
    return vals.map(function (v, i) { return px(i).toFixed(1) + "," + py(v).toFixed(1); })
      .join(" ");
  }
  var dots = tops.map(function (v, i) {
    return '<circle cx="' + px(i).toFixed(1) + '" cy="' + py(v).toFixed(1) +
      '" r="2.6" fill="var(--accent)"/>';
  }).join("");
  /* Rep-Zahl am Höchstgewicht jedes Tages über dem Punkt. Ohne das wirkt eine
     laufende Rep-Progression im Diagramm wie Stillstand: die Volllinie bleibt
     flach, weil bei doppelter Progression zuerst die Wiederholungen steigen,
     nicht das Gewicht (siehe Kommentar bei repFirstOn()/plateau()). */
  var repLabels = tops.map(function (v, i) {
    return '<text x="' + px(i).toFixed(1) + '" y="' + (py(v) - 7).toFixed(1) +
      '" font-size="9.5" font-weight="700" fill="var(--ink)" text-anchor="middle">' +
      byDay[days[i]].topReps + '</text>';
  }).join("");
  var gridVals = [lo + span * 0.05, lo + span * 0.5, hi - span * 0.05];
  var grid = gridVals.map(function (v) {
    return '<line x1="' + padL + '" y1="' + py(v).toFixed(1) + '" x2="' + (w - padR) +
      '" y2="' + py(v).toFixed(1) + '" stroke="var(--line)" stroke-width="1"/>' +
      '<text x="' + (padL - 5) + '" y="' + (py(v) + 3.5).toFixed(1) +
      '" font-size="9" fill="var(--muted)" text-anchor="end">' + Math.round(v) + '</text>';
  }).join("");
  var first = tinyDate(days[0]), lastd = tinyDate(days[days.length-1]);
  return '<div class="chart"><svg viewBox="0 0 ' + w + ' ' + hh + '" width="100%" ' +
    'style="display:block;height:auto" preserveAspectRatio="xMidYMid meet" role="img" ' +
    'aria-label="Gewichtsverlauf">' + grid +
    '<polyline points="' + poly(e1s) + '" fill="none" stroke="var(--muted)" ' +
    'stroke-width="1.6" stroke-dasharray="4 3"/>' +
    '<polyline points="' + poly(tops) + '" fill="none" stroke="var(--accent)" ' +
    'stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>' + dots + repLabels +
    '<text x="' + padL + '" y="' + (hh - 6) + '" font-size="9" fill="var(--muted)">' +
    first + '</text>' +
    '<text x="' + (w - padR) + '" y="' + (hh - 6) + '" font-size="9" fill="var(--muted)" ' +
    'text-anchor="end">' + lastd + '</text></svg>' +
    '<div class="legend"><span><i></i>schwerstes Gewicht</span>' +
    '<span><i class="dash"></i>geschätztes 1RM</span></div>' +
    '<p style="margin-top:8px">' + days.length + ' Trainings, ' + first + ' bis ' +
    lastd + '</p></div>';
}

/* Vier Zustände im Abschnitt Pause. "denied" ist der unangenehme: Chrome fragt
   danach nicht mehr von selbst, zurückholen lässt es sich nur über die
   Seiteneinstellungen des Browsers. Deshalb steht der Knopf unter Daten und
   nicht mitten im Training, wo er im Vorbeigehen weggetippt würde. */
function notifyBlock() {
  var st = notifyState();
  if (st === "unsupported") {
    return '<p style="margin-top:10px">Benachrichtigungen beherrscht dieser Browser ' +
      'nicht. Das Signal kommt nur, solange die App im Vordergrund ist.</p>';
  }
  if (st === "denied") {
    return '<p style="margin-top:10px">Benachrichtigungen sind für diese Seite ' +
      'abgelehnt, das Signal kommt deshalb nur im Vordergrund. Chrome fragt von sich ' +
      'aus nicht noch einmal; erlauben lässt es sich über das Schloss-Symbol in der ' +
      'Adressleiste oder in den Seiteneinstellungen des Browsers.</p>';
  }
  if (st === "default") {
    /* Dieselbe Knopfform wie der Schalter, der danach an dieser Stelle steht,
       und wie "Automatischer Start" darüber. In der zweispaltigen Werkzeugleiste
       bräche die Beschriftung auf vier Zeilen um. */
    return '<button class="open" data-act="notifyask">' +
      'Signal bei ausgeschaltetem Bildschirm erlauben</button>' +
      '<p style="margin-top:10px">Bisher kommt das Signal nur, solange die App im ' +
      'Vordergrund ist.</p>';
  }
  return '<button class="open" data-act="notifytoggle">' +
    'Signal bei ausgeschaltetem Bildschirm: ' +
    (S.settings.notifySignal ? "an" : "aus") + '</button>' +
    (S.settings.notifySignal
      ? '<button class="open" data-act="notifytest">Signal in 5 Sekunden testen' +
        '</button>'
      : "");
}

/* Liste unter Daten: jede Übung mit ihrer hinterlegten Muskelgruppe, gruppiert
   wie die Übungsliste weiter oben nach Push/Pull/Legs/Core. */
function muscleRows() {
  var order = CATLIST.concat(["Sonstige"]);
  var byCat = {};
  order.forEach(function (c) { byCat[c] = []; });
  allNames().forEach(function (n) {
    var c = catOf(n);
    if (!byCat[c]) byCat[c] = [];
    byCat[c].push(n);
  });
  var h = "";
  order.forEach(function (c) {
    var items = byCat[c] || [];
    if (!items.length) return;
    items.sort(function (a, b) { return a.localeCompare(b, "de"); });
    h += '<div class="mgroup">' + esc(c) + '</div>';
    items.forEach(function (n) { h += muscleRow(n); });
  });
  return h;
}

   umbenannte Übungen haben keine, hier lassen sich Primär- und eine
   Sekundärgruppe per Dropdown selbst setzen, siehe muscleOf()/"muscleset". */

  }
  var own = S.exmeta[n] || {};
  return '<div class="mrow own"><span class="nm">' + esc(n) + '</span>' +
    '<div class="msel">' +
    '<select data-act="muscleset" data-f="primary" data-v="' + esc(n) +
    '" aria-label="Primäre Muskelgruppe für ' + esc(n) + '">' +

    (own.musclePrimary ? "" : "Erst Primär wählen") + '">' +
    muscleOptionList("Sekundär", own.muscleSecondary, own.musclePrimary) + '</select>' +

}
function catRows() {
  var order = CATLIST.concat(["Sonstige"]);
  var byCat = {};
  order.forEach(function (c) { byCat[c] = []; });
  allNames().forEach(function (n) {
    var c = catOf(n);
    if (!byCat[c]) byCat[c] = [];
    byCat[c].push(n);
  });
  var h = "";
  order.forEach(function (c, ci) {
    var items = byCat[c] || [];
    if (!items.length) return;
    items.sort(function (a, b) { return a.localeCompare(b, "de"); });
    var closed = !!S.dataClosed[c];
    h += '<button class="chead" data-act="datacat" data-v="' + esc(c) +
      '" aria-expanded="' + (closed ? "false" : "true") + '"><span>' + esc(c) +
      '</span><span class="cc">' + items.length + '</span>' +
      '<span class="chv' + (closed ? "" : " up") + '">' + svg("chev", 13) +
      '</span></button>';
    if (closed) return;
    items.forEach(function (n) { h += catRow(n); });
    h += moveRow(c, items, order, ci);
  });
  return h;
}
/* Die Gruppe steht schon in der Überschrift, deshalb hat die Zeile kein eigenes
   Kategoriefeld mehr. Umsortiert wird am Ende der Gruppe. */
function moveRow(c, items, order, ci) {
  /* "Sonstige" ist seit 1.14.6 auch Ziel, nicht nur Ausgangspunkt. Vorher war die
     Zuordnung eine Einbahnstraße: einmal nach Push verschoben, kam eine Übung nie
     wieder in die Sammelgruppe zurück. */
  var targets = order.filter(function (o) { return o !== c; });
  if (!targets.length) return "";
  return '<div class="movecat"><span>Übung in eine andere Gruppe verschieben</span>' +
    '<div class="row"><select id="mv-' + ci + '" aria-label="Übung aus ' + esc(c) +
    ' verschieben"><option value="">Übung wählen</option>' +
    items.map(function (n) {
      return '<option value="' + esc(n) + '">' + esc(n) + '</option>';
    }).join("") + '</select>' +
    '<select data-act="catmove" data-i="' + ci + '" aria-label="Zielgruppe">' +
    '<option value="">Ziel wählen</option>' +
    targets.map(function (o) {
      return '<option value="' + esc(o) + '">nach ' + esc(o) + '</option>';
    }).join("") + '</select></div></div>';
}
function catRow(n) {

            ? " und " + use.plans + (use.plans === 1 ? " Plan werden" : " Pläne werden")
            : ", kein Plan wird") +

/* Eine Übung darf nur weg, wenn sie selbst angelegt, ungenutzt und in keinem Plan ist */
function removable(n) {
  if (customNames().indexOf(n) < 0) return false;
  if (S.entries.some(function (e) { return e.exercise === n; })) return false;
  var used = false;
  Object.keys(S.plans).forEach(function (p) {
    if (S.plans[p].some(function (i) { return i.name === n; })) used = true;
  });
  return !used;
}
/* Wie viele Sätze und Pläne hängen an einer Übung? Wird vor dem Umbenennen
   angezeigt, damit die Tragweite vorher sichtbar ist. */
function exUsage(n) {
  var sets = S.entries.filter(function (e) { return e.exercise === n; }).length;
  var plans = Object.keys(S.plans).filter(function (p) {
    return S.plans[p].some(function (i) { return i.name === n; });
  }).length;
  return { sets:sets, plans:plans };
}
/* Punkt 6 in 1.5.2: Übung umbenennen. Gibt es den Zielnamen schon, werden beide
   zusammengeführt: die Sätze wandern unter den Zielnamen, ein doppelter Planeintrag
   fällt weg und die Einstellungen des Zielnamens behalten Vorrang. Zurückgegeben
   werden die verschobenen Satz-IDs, damit sich das rückgängig machen lässt. */
function renameExercise(from, to) {
  var toExisted = allNames().indexOf(to) >= 0;
  var fromCat = catOf(from);
  var ids = [], affectedDays = Object.create(null);
  S.entries.forEach(function (e) {
    if (e.exercise === from) {
      e.exercise = to; ids.push(e.id); affectedDays[e.date] = 1;
    }
  });
  /* Beim Zusammenführen können beide Übungen am selben Tag mit Satz 1 beginnen.
     Nach dem Verschieben Arbeits- und Aufwärmsätze des Zielnamens neu nummerieren. */
  Object.keys(affectedDays).forEach(function (date) { renumber(date, to); });
  Object.keys(S.plans).forEach(function (p) {
    if (S.plans[p].some(function (i) { return i.name === to; })) {
      S.plans[p] = S.plans[p].filter(function (i) { return i.name !== from; });
    } else {
      S.plans[p].forEach(function (i) { if (i.name === from) i.name = to; });
    }
  });
  /* Der alte Name verschwindet aus der Liste eigener Übungen. Ist der Zielname neu
     und keine mitgelieferte Übung, tritt er an seine Stelle. */
  S.custom = S.custom.filter(function (c) {
    return (typeof c === "string" ? c : c.name) !== from;
  });
  if (!toExisted && PRESETS.indexOf(to) < 0) S.custom.push({ name:to, cat:fromCat });
  /* Eine mitgelieferte Übung lässt sich nicht löschen, nur ausblenden. Der alte Name
     verschwindet damit aus dem Auswahlmenü, der neue kommt aus der Liste zurück. */
  var hid = S.settings.hiddenEx;
  if (PRESETS.indexOf(from) >= 0 && hid.indexOf(from) < 0) hid.push(from);
  var hix = hid.indexOf(to);
  if (hix >= 0) hid.splice(hix, 1);
  if (!toExisted) {
    S.cats[to] = fromCat;
    if (S.exmeta[from]) S.exmeta[to] = S.exmeta[from];
  }
  delete S.cats[from];
  delete S.exmeta[from];
  if (S.exercise === from) S.exercise = to;
  if (S.openEx === from) S.openEx = to;
  if (S.exNoteFor === from) S.exNoteFor = to;
  return ids;
}

function csvText() {
  var out = "Datum;Uebung;Art;Satz;Gewicht_kg;Wiederholungen;RPE;e1RM_kg;Notiz\n";
  S.entries.slice().sort(function (a,b) { return a.ts-b.ts; }).forEach(function (e) {
    out += e.date + ";" + String(e.exercise).replace(/;/g,",") + ";" +
      (e.warm ? "Aufwaermen" : "Arbeit") + ";" + e.set + ";" +
      comma(e.weight) + ";" + e.reps + ";" +
      (e.rpe == null ? "" : comma(e.rpe)) + ";" +
      comma(Math.round(e1rm(e.weight, e.reps) * 10) / 10) + ";" +
      String(S.notes[e.date] || "").replace(/[;\r\n]/g, " ") + "\n";
  });
  return out;
}
/* Ab 1.12.3 stehen auch die Einstellungen mit drin (version 5). Ab 1.14.1
   speichert version 6 zusätzlich die optionale Planangabe neuer Arbeitssätze. Bis 1.12.2
   fehlten sie, weshalb nach einem Wiederherstellen auf einem neuen Gerät
   Pausenlänge, Stange, Scheibensatz, Standardwerte und vor allem die Wochenziele
   samt ihrer Historie weg waren - und mit weekGoalLog auch die komplette
   Wochenziel-Auswertung im Verlauf, siehe weekGoalBlock(). Ältere Backups ohne
   settings bleiben lesbar, mergeBackup() prüft das Feld einzeln. */
function backupText() {
  return JSON.stringify({
    app:"kraftlog", version:6, appVersion:APP_VERSION,
    exported:new Date().toISOString(),
    custom:S.custom, cats:S.cats, colors:S.colors, plans:S.plans,
    exmeta:S.exmeta, notes:S.notes, settings:S.settings, entries:S.entries
  }, null, 1);
}
function backupName() { return "hantelkladde-" + todayISO() + ".json"; }
/* Ab 1.14.8 heißt dieselbe Datei beim Teilen .txt. Chrome lässt über die
   Teilen-Funktion nur eine feste Liste von Dateitypen durch, und .json steht
   nicht darauf, text/plain schon: bis 1.14.7 scheiterte das Teilen deshalb mit
   NotAllowedError. Der Inhalt bleibt unverändert JSON, mergeBackup liest ihn
   über JSON.parse und schert sich nicht um die Endung. Der Download-Weg bleibt
   bei .json, dort gibt es diese Beschränkung nicht. */
function shareName() { return "hantelkladde-" + todayISO() + ".txt"; }
function markBackup() {
  S.meta.lastBackup = new Date().toISOString();
  S.meta.lastCount = S.entries.length;
  persist();
}
/* Backup über die Teilen-Funktion von Android, damit die Datei nicht im
   Download-Ordner versandet. Muss synchron aus dem Tippen heraus starten. */
function canShareBackup() {
  try {
    if (!navigator.share || !navigator.canShare || typeof File !== "function") return false;
    return navigator.canShare({ files: [new File(["{}"], "t.txt", { type:"text/plain" })] });
  } catch (e) { return false; }
}
function shareBackup() {
  if (!canShareBackup()) return false;
  var name = backupName(), sname = shareName(), text = backupText();
  try {
    var file = new File([text], sname, { type:"text/plain" });
    navigator.share({ files:[file], title:sname }).then(function () {
      markBackup();
      S.note = "Backup geteilt: " + sname;

    var flist = S.plans[S.plan] || [];

      var fopen = flist.filter(function (i) {

    var focusSaved = saveBackup();

      var plist = S.plans[v] || [];
      var pday = dayEntries();

        return !pday.some(function (e) { return e.exercise === i.name; });
      })[0] || plist[0];

    window.scrollTo({ top:0 });

    S.pickOpen = false; S.pickPlanTarget = ""; S.pickSel = []; S.search = "";
  }

    var addedN = 0, alreadyN = 0;

      S.pickSel.forEach(function (name) {
        if (S.plans[mplan].some(function (i) { return i.name === name; })) { alreadyN++; return; }
        var d = planItemDefaults(name);
        S.plans[mplan].push({ name: name, reps: d.reps, weight: d.weight, sets: d.sets });
        addedN++;
      });

    S.pickOpen = false; S.pickPlanTarget = ""; S.pickSel = []; S.search = "";

       "Keine Übung ausgewählt" schlicht falsch - ausgewählt war etwas, es kam nur
       nichts dazu. Deshalb drei Fälle statt zwei. */
    S.note = addedN
      ? addedN + (addedN === 1 ? " Übung zu " : " Übungen zu ") + mplan + " hinzugefügt." +

          " schon im Plan." : "")

  else if (act === "pickgroupby") { S.pickGroupBy = v; S.search = ""; }

    var dselc = document.getElementById("dataNewCat");

  }

      var extra = "";

      if (S.focus) {

      Object.keys(renameDays).forEach(function (date) {

  else if (act === "repthresh") {
    /* In Prozentpunkten rechnen und erst am Ende durch 100 teilen, sonst
       akkumuliert sich durch die 0,5-Schritte binärer Rundungsfehler in der
       gespeicherten Bruchzahl. */
    var pctNow = Math.round(S.settings.repFirstThresh * 1000) / 10;
    var pctNext = Math.max(1, Math.min(25, pctNow + parseFloat(el.getAttribute("data-d"))));
    S.settings.repFirstThresh = Math.round(pctNext * 10) / 1000;
    persist();
  }
  else if (act === "repspan") {
    S.settings.repSpan = Math.max(1, Math.min(5,
      S.settings.repSpan + parseInt(el.getAttribute("data-d"), 10)));
    persist();
  }
  else if (act === "focusplates") {
    S.settings.focusPlates = !S.settings.focusPlates; persist();
  }
  else if (act === "volrange") { S.volRange = parseInt(v, 10); }
  else if (act === "volmode") { S.volMode = v; }
  else if (act === "volgroup") { S.volGroup = v; }
  else if (act === "datacat") { S.dataClosed[v] = !S.dataClosed[v]; }
  else if (act === "barw") {
    var bw = S.settings.barWeight + parseFloat(el.getAttribute("data-d"));
    S.settings.barWeight = Math.min(40, Math.max(2.5, Math.round(bw * 100) / 100));
    persist();
  }
  else if (act === "plate") {
    var pv = parseFloat(v);
    var pi2 = -1;
    S.settings.plates.forEach(function (x, ix) { if (Math.abs(x - pv) < 0.001) pi2 = ix; });
    if (pi2 >= 0) { if (S.settings.plates.length > 1) S.settings.plates.splice(pi2, 1); }
    else S.settings.plates.push(pv);
    S.settings.plates.sort(function (a,b) { return b - a; });
    persist();
  }
  else if (act === "barset") {
    if (!S.exmeta[v]) S.exmeta[v] = {};
    S.exmeta[v].bar = !exMeta(v).bar;
    persist();
  }
  else if (act === "savefile") { saveBackup(); }
  else if (act === "loadfile") { document.getElementById("filein").click(); return; }
  else if (act === "dlcsv") {
    download("hantelkladde-" + todayISO() + ".csv", csvText(), "text/csv");
    S.note = "CSV gespeichert.";
  }
  else if (act === "showtext") { S.out = backupText(); S.note = ""; }
  else if (act === "clear") { S.out = ""; S.note = ""; }
  else if (act === "importtext") {
    var ta = document.getElementById("out");
    try {
      var added = mergeBackup(ta.value);
      S.note = added + " Sätze ergänzt, " + S.entries.length + " insgesamt.";
    } catch (e) {
      S.note = e && e.message && e.message.indexOf("Backup ungültig:") === 0
        ? e.message : "Der Text ist kein gültiges Backup.";
    }
  }
  else if (act === "restplus") { addRest(15); return; }
  else if (act === "reststop") { stopRest(); return; }
  else if (act === "today") { S.date = todayISO(); S.editId = ""; S.note = ""; }
  else if (act === "exdel") {
    if (!removable(v)) return;
    var ci = -1;
    S.custom.forEach(function (c, i) {
      if ((typeof c === "string" ? c : c.name) === v) ci = i;
    });
    if (ci < 0) return;
    S.undo = { kind:"custom", index:ci, item:S.custom[ci], meta:S.exmeta[v],
      label:v + " gelöscht." };
    S.custom.splice(ci, 1);
    delete S.cats[v];
    delete S.exmeta[v];
    if (S.exercise === v) S.exercise = "";
    S.note = "";
    persist();
  }
  else if (act === "restlen") {
    S.settings.rest = Math.max(15, Math.min(600,
      S.settings.rest + parseInt(el.getAttribute("data-d"),10)));
    persist();
  }
  else if (act === "autorest") { S.settings.autoRest = !S.settings.autoRest; persist(); }
  else if (act === "vibepattern") { S.settings.vibeLong = !S.settings.vibeLong; persist(); }
  else if (act === "notifyask") { askNotify(); }
  else if (act === "notifytoggle") {
    S.settings.notifySignal = !S.settings.notifySignal;
    if (!S.settings.notifySignal) clearRestNotification();
    persist();
  }
  /* Fünf Sekunden reichen, um den Bildschirm zu sperren. Danach läuft genau
     derselbe Weg wie am Ende einer Pause, samt der Regel, dass die Meldung nur
     bei versteckter Seite kommt. */
  else if (act === "notifytest") {
    audioOn();
    S.note = "Das Signal kommt in fünf Sekunden. Sperre bis dahin den " +
      "Bildschirm oder wechsle zu einer anderen App.";
    setTimeout(function () { signal(true); }, 5000);
  }
  else if (act === "openex") {
    var exWasOpen = !!S.openEx;
    S.openEx = (S.openEx === v ? "" : v);
    /* Nur das Auf- und Zuklappen selbst ist eine Ebene. Direkt von einer Übung
       zur nächsten zu wechseln bleibt dieselbe Ebene. */
    if (S.openEx && !exWasOpen) navOpen("openex");
    else if (!S.openEx && exWasOpen) navBack("openex");
  }
  else if (act === "pdel") {
    var pp = el.getAttribute("data-p"), pi = parseInt(el.getAttribute("data-i"),10);
    if (!S.plans[pp] || !S.plans[pp][pi]) return;
    var removed = S.plans[pp][pi];
    S.undo = { kind:"planrow", plan:pp, index:pi, item:removed,
      label:removed.name + " aus " + pp + " entfernt." };
    S.plans[pp].splice(pi, 1);
    S.note = "";
    persist();
  }
  else if (act === "prownm") {
    var nmKey = el.getAttribute("data-p") + "|" + el.getAttribute("data-i");
    S.prowNameOpen = S.prowNameOpen === nmKey ? "" : nmKey;
  }
  else if (act === "addplan") {
    var np = document.getElementById("newPlan");
    var pn = np ? np.value.trim() : "";
    if (!pn) return;
    if (S.plans[pn]) { S.note = "Ein Plan mit diesem Namen existiert bereits."; }
    else { S.plans[pn] = []; S.note = "Plan " + pn + " angelegt."; persist(); }
  }
  else if (act === "planvis") {
    var hp = S.settings.hiddenPlans, hix = hp.indexOf(v);
    if (hix >= 0) { hp.splice(hix, 1); }
    else {
      hp.push(v);
      if (S.plan === v) { S.plan = ""; S.plansFold = false; }
    }
    persist();
  }
  else if (act === "planlock") {
    var lp = S.settings.lockedPlans, lix = lp.indexOf(v);
    if (lix >= 0) lp.splice(lix, 1); else lp.push(v);
    persist();
  }
  else if (act === "weekgoalrestart") {
    var wgMon = mondayOf(todayISO()), wgAny = false;
    weekGoalPlans().forEach(function (p) {
      var wgVal = weekGoal(p);
      var wgLog = S.settings.weekGoalLog[p] || [];
      var wgLast = wgLog.length ? wgLog[wgLog.length - 1] : null;
      if (wgLast && wgLast.value === wgVal) return;
      /* Ein Plan ohne Ziel und ohne Historie bekommt keinen Eintrag mit Wert 0.
         Der wäre für die Auswertung wirkungslos (weekGoalAt() > 0) und stünde nur
         als Ballast in jedem Backup. */
      if (!wgVal && !wgLast) return;
      if (!S.settings.weekGoalLog[p]) S.settings.weekGoalLog[p] = wgLog;
      if (wgLast && wgLast.since === wgMon) wgLast.value = wgVal;
      else wgLog.push({ since:wgMon, value:wgVal });
      wgAny = true;
    });
    if (wgAny) {
      S.note = "Neues Wochenziel aktiviert";
      persist();
    }
  }
  else if (act === "delplan") {
    if (!window.confirm("Plan " + v + " mit " + (S.plans[v] ? S.plans[v].length : 0) +
        " Übungen wirklich löschen?")) return;
    S.undo = { kind:"plan", plan:v, item:S.plans[v], color:S.colors[v],
      goal:S.settings.weekGoals[v], goalLog:S.settings.weekGoalLog[v],
      label:"Plan " + v + " gelöscht." };
    delete S.plans[v];
    delete S.colors[v];
    delete S.settings.weekGoals[v];
    delete S.settings.weekGoalLog[v];
    var dhx = S.settings.hiddenPlans.indexOf(v);
    if (dhx >= 0) S.settings.hiddenPlans.splice(dhx, 1);
    var dlx = S.settings.lockedPlans.indexOf(v);
    if (dlx >= 0) S.settings.lockedPlans.splice(dlx, 1);
    if (S.plan === v) { S.plan = ""; S.plansFold = false; }
    S.note = "";
    persist();
  }
  else if (act === "resetplans") {
    if (!window.confirm("Alle Pläne auf den Ausgangsstand zurücksetzen? " +
        "Eigene Zielwerte und selbst angelegte Pläne gehen dabei verloren.")) return;
    S.plans = JSON.parse(JSON.stringify(DEFAULT_PLANS));
    S.settings.hiddenPlans = [];
    S.settings.lockedPlans = [];
    S.settings.weekGoals = {};
    S.settings.weekGoalLog = {};
    S.plan = ""; S.plansFold = false;
    S.undo = null;
    S.note = "Pläne auf den Ausgangsstand zurückgesetzt.";
    persist();
  }
  else return;

  render();
});

document.getElementById("filein").addEventListener("change", function (ev) {

  if (!f) return;
  var reader = new FileReader();

    } catch (e) {

    }
