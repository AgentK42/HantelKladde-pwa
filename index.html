/* Die einzelnen Übungen bilden eine Quelle mit times 1, weil jede ihre
   Häufigkeit schon in den Sätzen trägt. */
function draftSources(mon) {
  var xs = weekDraft(mon || selWeek()).extras;
  var src = draftPlans(mon).map(function (p) {
    return { key:p, label:p, color:planColor(p), times:draftEntry(p, mon).times,
      items:S.plans[p] };
  });
  if (xs.length) {
    src.push({ key:DRAFT_TARGET, label:"Einzelne Übungen", color:"var(--extra)", times:1,
      items:xs.map(function (x) { return { name:x.name, sets:x.sets * x.times }; }) });
  }
  return src;
}
function draftMuscleBlock() {
  var mon = selWeek(), sources = draftSources(mon), mark = weekMark();
  var h = '<div class="sect"><h2>Sätze je Muskelgruppe' + infoBtn("entwurfsaetze") + '</h2>' +
    '<span>' + (mark ? mark + ", " : "") + 'pro Woche</span></div>' +
    descText("entwurfsaetze", '<p class="notice">Wochensumme über den Entwurf, gezählt wie ' +
      'im Verlauf: Primärmuskel voll, Sekundärmuskel halb, jeder Plan so oft wie oben ' +
      'eingestellt. Gruppen ohne einen Satz stehen rot mit dabei. Ein Gegenspieler-Paar ' +
      'wird rot, sobald eine Seite mindestens anderthalb mal so viele Sätze hat wie die ' +
      'andere oder ganz leer ausgeht. Die zwei Striche im Balken markieren 10 und 20 ' +
      'Sätze je Woche, den Bereich, in dem die Metaanalysen den Zuwachs sehen ' +
      '(Schoenfeld 2017, Baz-Valle 2022).</p>');
  if (!sources.length) {
    return h + '<p class="notice">Kein Plan und keine Übung im Entwurf' +
      (mark ? " der " + mark : "") + '.</p>';
  }
  return h + muscleBars(muscleTally(sources), sources,
    { showZero:true, flagRatio:DRAFT_PAIR_RATIO });
}

/* Nur volle Kalenderwochen: eine angebrochene lässt sich nicht mehr ganz
   planen, die laufende zählt also nur montags mit. Ihre restlichen Tage bleiben
   über die Wochenübersicht zuweisbar, siehe README, Zuweisen. */
function planWeeks() {
  var td = todayISO(), mon = mondayOf(td);
  if (mon !== td) mon = shiftISO(mon, 7);
  var weeks = [];
  for (var i = 0; i < PLAN_WEEKS; i++) {
    var days = [];
    for (var k = 0; k < 7; k++) days.push(shiftISO(mon, k));
    weeks.push({ monday:mon, days:days });
    mon = shiftISO(mon, 7);
  }
  return weeks;
}
/* ISO-Kalenderwoche: der Donnerstag derselben Woche bestimmt das Jahr. */
function isoWeekNo(iso) {
  var d = new Date(iso + "T12:00:00Z");
  d.setUTCDate(d.getUTCDate() - ((d.getUTCDay() + 6) % 7) + 3);
  var first = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
  return 1 + Math.round(((d - first) / 86400000 - 3 + ((first.getUTCDay() + 6) % 7)) / 7);
}
function planDayLabel(iso) {
  var dt = new Date(iso + "T12:00:00");
  return WEEKDAY_SHORT[dt.getDay()] + " " + dt.getDate() + "." + (dt.getMonth() + 1) + ".";
}
/* Gemeinsam für Planung und Wochenübersicht. Der Tag steht an jedem Knopf,
   damit beide Orte ihre eigene Auswahl behalten. */
function assignPanel(sel, plans, mid, hint) {
  var cur = plannedPlan(sel);
  var h = '<div class="assign' + (mid ? " mid" : "") + '"><div class="lab"><b>' +
    planDayLabel(sel) + '</b>' + (cur ? ', ' + esc(cur) : ', frei') + '</div>' +
    '<div class="chips">' +
    plans.map(function (p) {
      return '<button class="' + (cur === p ? "on" : "") + '" data-act="planassign" data-day="' +
        sel + '" data-v="' + esc(p) + '"' +
        (cur === p ? ' style="border-color:' + planColor(p) + '"' : "") + '>' +
        '<span class="pdot" style="background:' + planColor(p) + '"></span>' + esc(p) +
        '</button>';
    }).join("") +
    '<button class="frei' + (cur ? "" : " on") + '" data-act="planassign" data-day="' + sel +
    '" data-v="">Frei</button></div>';
  if (!plans.length) h += '<p class="pairline" style="margin-top:8px">' + hint + '</p>';
  return h + '</div>';
}
function planDaysBlock() {
  var td = todayISO(), weeks = planWeeks();
  var first = weeks[0].days[0], last = weeks[weeks.length - 1].days[6];
  var sel = S.planDaySel;
  if (!sel || sel < first || sel > last) sel = S.planDaySel = first;
  var h = '<div class="sect"><h2>Zuweisen' + infoBtn("zuweisen") + '</h2>' +

    descText("zuweisen", '<p class="notice">Tag antippen, die Auswahl erscheint direkt ' +
      'unter seiner Woche und zeigt die Pläne aus dem Entwurf dieser Woche. Ein Tag trägt ' +
      'höchstens einen Plan, gespeichert wird beim Antippen. Zugewiesene Tage stehen im ' +
      'Wochenstreifen des Trainings als leerer Ring in der Planfarbe, der sich nach dem ' +
      'Training füllt. Die Tabelle zeigt je Kalenderwoche, wie oft ein Plan zugewiesen ' +
      'ist, gegen die Häufigkeit aus dem Entwurf: grün passt, grau fehlt noch, rot ist ' +
      'mehr. Die laufende Woche steht nur montags mit im Raster, sonst ist sie schon ' +
      'angebrochen; ihre restlichen Tage lassen sich über die Wochenübersicht im ' +
      'Training belegen.</p>') +
    '<div class="card">';
  weeks.forEach(function (w, wi) {
    h += '<div class="kw"><span>KW ' + isoWeekNo(w.monday) + '</span>' +
      (w.days.indexOf(td) >= 0 ? '<span>heute ' + tinyDate(td) + '</span>' : "") + '</div>' +
      '<div class="cal">' + w.days.map(function (d) {
        return dayCell(d, td, "planday", sel);
      }).join("") + '</div>';
    if (w.days.indexOf(sel) >= 0) {
      /* Ein zugewiesener Plan, der nicht mehr im Entwurf dieser Woche steht,
         bleibt wählbar, sonst ließe er sich nur noch auf Frei setzen. */
      var plans = draftPlans(w.monday), cur = plannedPlan(sel);
      if (cur && plans.indexOf(cur) < 0) plans = plans.concat([cur]);
      h += assignPanel(sel, plans, wi < weeks.length - 1, "Kein Plan im Entwurf dieser " +
        "Woche. Oben einen einschalten, dann lässt er sich hier zuweisen.");
    }
  });
  var rows = Object.keys(S.plans).filter(function (p) {
    return weeks.some(function (w) { return draftPlans(w.monday).indexOf(p) >= 0; });
  });
  if (rows.length) {
    h += '<div class="wsum" style="grid-template-columns:1fr repeat(' + weeks.length +
      ',56px)"><span class="h l">Zugewiesen / Entwurf</span>' +
      weeks.map(function (w) {
        return '<span class="h">KW ' + isoWeekNo(w.monday) + '</span>';
      }).join("");
    rows.forEach(function (p) {
      h += '<div class="n"><span class="pdot" style="background:' + planColor(p) + '"></span>' +
        '<span>' + esc(p) + '</span></div>';
      weeks.forEach(function (w) {
        var e = draftEntry(p, w.monday), goal = e.on ? e.times : 0;
        var n = w.days.filter(function (d) { return S.settings.planDays[d] === p; }).length;
        /* Weder geplant noch zugewiesen: ein Strich sagt mehr als "0 / 0". */
        var cls = (!goal && !n) ? "low" : (n === goal ? "ok" : (n < goal ? "low" : "over"));
        h += '<span class="c ' + cls + '">' + ((!goal && !n) ? "–" : n + ' / ' + goal) +
          '</span>';

function draftToolsBlock() {
  var mon = selWeek(), mark = weekMark();
  var stored = Object.keys(S.draft.plans).length > 0 || S.draft.extras.length > 0 ||
    Object.keys(S.draft.weeks).length > 0 || S.draft.split;
  return '<div class="sect"><h2>Übernehmen</h2></div>' +
    '<div class="tools">' +
    '<button' + (draftChanged(mon) ? "" : " disabled") + ' data-act="drafttake" ' +
    'title="Schreibt die Häufigkeiten aus dem Entwurf' + (mark ? " der " + mark : "") +
    ' als Wochenziele fest, wie der Knopf Neues Wochenziel speichern unter Pläne">' +
    (mark ? mark + ' als Wochenziel' : 'Als Wochenziel übernehmen') + '</button>' +
    '<button' + (stored ? "" : " disabled") + ' data-act="draftreset" ' +
    'title="Setzt alle Wochen auf die aktuellen Wochenziele zurück, nimmt die einzelnen ' +
    'Übungen heraus und hebt eine Trennung der Wochen auf">Entwurf verwerfen</button></div>';
}
function viewPlanung() {
  return draftBlock() + draftExtrasBlock() + draftMuscleBlock() + planDaysBlock() +
    draftToolsBlock();
}

/* Zeitraum des Verlauf-Reiters in Tagen, gilt für alle Blöcke dort. */
function volRange() { return S.volRange || 7; }
/* Sätze je Muskelgruppe landen durch den halben Sekundärmuskel auf x,5, siehe
   volByMuscle(). */
function fmtCount(x) { return x % 1 === 0 ? String(x) : num(Math.round(x * 10) / 10); }
/* factor: Verhältnis, ab dem ein Gegenspieler-Paar als Schieflage gilt;
   minDiff: Mindestabstand in Sätzen. Der Faktor sinkt mit dem Zeitraum, weil
   eine Schieflage über 30 oder 90 Tage mehr sagt als eine Woche, die auch
   bloßes Timing sein kann, etwa zufällig kein Rückentag. minDiff steigt, damit
   bei größeren Summen nicht jede kleine Abweichung anschlägt. Die Stufe hängt
   auch an der Datenlage des Paares, siehe imbalanceThresh(). */
var IMBALANCE_THRESH = { 7: { factor:1.5, minDiff:3 }, 30: { factor:1.35, minDiff:5 },
  90: { factor:1.25, minDiff:8 } };
var IMBALANCE_RANGES = [7, 30, 90];
/* Tage von einem Datum bis heute, einschließlich beider Enden. */
function daysSince(iso) {
  var span = Math.round((Date.parse(todayISO() + "T12:00:00") -
    Date.parse(iso + "T12:00:00")) / 86400000);
  return Math.max(0, span + 1);
}
/* Beobachtet ab dem ersten Arbeitssatz, der eine der beiden Gruppen trifft.
   Bewusst die frühere: wer Rücken seit einem Jahr und Brust seit zwei Wochen
   trainiert, bei dem lag Brust über die ganzen 90 Tage wirklich hinten.
   Sekundärmuskeln zählen mit wie in volByMuscle(), damit Dauer und gezähltes
   Volumen zusammenpassen. */
function pairHistoryDays(nameA, nameB) {
  var first = "";
  S.entries.forEach(function (e) {
    if (!isWork(e)) return;
    var mo = muscleOf(e.exercise);
    var hit = !!mo && (mo.primary === nameA || mo.primary === nameB ||
      mo.secondary.indexOf(nameA) >= 0 || mo.secondary.indexOf(nameB) >= 0);
    if (!hit) return;
    if (!first || e.date < first) first = e.date;
  });
  return first ? daysSince(first) : 0;
}
/* Die niedrigeren Faktoren setzen voraus, dass sich die Schieflage so lange
   gehalten hat. Deshalb gilt der kleinere Wert aus gewähltem Zeitraum und
   Beobachtung dieses Paares: die Regel stuft sich mit den Daten hoch, statt den
   Hinweis zu sperren. Unter sieben Tagen bleibt die strengste Stufe. */
function imbalanceThresh(range, covered) {
  var cap = Math.min(range, covered);
  var pick = IMBALANCE_RANGES[0];
  IMBALANCE_RANGES.forEach(function (r) { if (r <= cap) pick = r; });
  return IMBALANCE_THRESH[pick];
}
function setCount(v) {
  return fmtCount(v) + (v === 1 ? " Satz" : " Sätze");
}
/* Nimmt dieselben Summen wie die Zeilen darunter, damit die Zahlen im Hinweis
   zu ihnen passen. */
function imbalanceFlag(a, nameA, nameB, t) {
  var A = a[nameA] ? a[nameA].sets : 0, B = a[nameB] ? a[nameB].sets : 0;
  if (!A && !B) return "";
  var hi = Math.max(A, B), lo = Math.min(A, B);
  /* Der Mindestabstand gilt immer, das Verhältnis nur, wenn lo nicht null ist.
     Fehlt eine Gruppe ganz, ist das die krasseste Schieflage und muss
     anschlagen; Bagatellen hält der Mindestabstand fern, bei 7 Tagen 3 Sätze,
     bei 90 Tagen 8. */
  if (hi - lo < t.minDiff) return "";
  if (lo > 0 && hi / lo < t.factor) return "";
  var heavier = A > B ? nameA : nameB, lighter = heavier === nameA ? nameB : nameA;
  return '<div class="flag">' + heavier + ' ' + setCount(hi) + ', ' +
    lighter + ' ' + setCount(lo) + ', ' + lighter +
    '-Volumen niedrig.</div>';
}
var MUSCLE_PAIRS = [["Brust", "Rücken"], ["Bizeps", "Trizeps"], ["Quadrizeps", "Beinbeuger"],
  ["Bauch", "Unterer Rücken"], ["Schulter vorn", "Schulter hinten"]];
function imbalanceFlags(a, range) {
  return MUSCLE_PAIRS.map(function (p) {
    var t = imbalanceThresh(range, pairHistoryDays(p[0], p[1]));
    return imbalanceFlag(a, p[0], p[1], t);
  }).join("");
}
/* Bei 30 Tagen hat jede Gruppe ihre eigene Skala, damit eine kleine neben einer
   großen nicht verschwindet. Bei 90 Tagen entfällt der Vergleich mit dem
   Zeitraum davor, über so lange Spannen sagt er wenig. */
function volumeBlock() {
  var range = volRange();
  var compare = range < 90;
  var td = todayISO();
  var aFrom = shiftISO(td, -(range - 1));
  var a = volByMuscle(aFrom, td);
  var bTo = compare ? shiftISO(aFrom, -1) : "";
  var bFrom = compare ? shiftISO(bTo, -(range - 1)) : "";
  var b = compare ? volByMuscle(bFrom, bTo) : null;
  var cats = MUSCLE_LIST.filter(function (c) {
    return a[c].sets || (compare && b[c].sets);
  });
  var h = '<div class="sect"><h2>Letzte ' + range + ' Tage</h2></div>' +
    '<div class="tools" style="grid-template-columns:1fr 1fr 1fr">' +
    [7, 30, 90].map(function (r) {
      return '<button class="mode' + (range === r ? " on" : "") + '" data-act="volrange" ' +
        'data-v="' + r + '">' + r + ' Tage</button>';
    }).join("") + '</div>';
  if (!cats.length) {
    return h + '<p class="notice">Noch keine Übung in diesem Zeitraum lässt sich einer ' +
      'Muskelgruppe zuordnen.</p>';
  }
  return h + '<div class="card">' +
    volSummary(volTotals(aFrom, td), compare ? volTotals(bFrom, bTo) : null) +
    imbalanceFlags(a, range) +
    (range === 30 ? volWeekCols(cats, td) : volBars(cats, a, b, range)) +
    volUnmappedNote(aFrom, td) + '</div>';
}
/* totB fehlt bei 90 Tagen, dort gibt es keinen Vergleich. */
function volSummary(totA, totB) {
  var dl = totA.days;
  var mins = dl.reduce(function (acc, d) { return acc + dayMinutes(d); }, 0);
  return '<p>' + plural(dl.length, "Training", "Trainings") + ", " +
    num(Math.round(totA.vol)) + ' kg Gesamtlast aus ' +
    plural(totA.sets, "Arbeitssatz", "Arbeitssätzen") +
    (mins ? ', ' + mins + ' Minuten' : '') + '.' +
    (totB
      ? '<br>Vorheriger Zeitraum ' + num(Math.round(totB.vol)) + ' kg' +
        (totB.vol > 0 ? ', das sind ' + (totA.vol >= totB.vol ? "+" : "") +
          Math.round((totA.vol - totB.vol) / totB.vol * 100) + ' Prozent' : '') + '.'
      : '') + '</p>';
}
function volWeekCols(cats, td) {
  var weeks = [];
  for (var w = 0; w < 4; w++) {
    var wTo = shiftISO(td, -(3 - w) * 7);
    weeks.push(volByMuscle(shiftISO(wTo, -6), wTo));
  }
  return '<div class="wk">' + cats.map(function (c) {
    var vals = weeks.map(function (wd) { return wd[c].sets; });
    var maxW = Math.max.apply(null, vals) || 1;
    return '<div class="wkrow"><span class="vn">' + esc(c) + '</span><div class="wkcols">' +
      vals.map(function (v, i) {
        var isCur = i === 3;
        var barH = Math.max(isCur ? 16 : 3, Math.round(v / maxW * 34));
        return '<div class="wkcol"><i style="height:' + barH + 'px">' +
          (isCur ? '<span class="wkval">' + fmtCount(v) + '</span>' : '') + '</i></div>';
      }).join("") + '</div></div>';
  }).join("") + '</div><div class="legend"><span><i class="wkpast"></i>frühere Wochen</span>' +
    '<span><i class="wkcur"></i>aktuelle Woche</span></div>';
}
/* Mit b der Vergleich mit dem Zeitraum davor, ohne ein Anteilsbalken. */
function volBars(cats, a, b, range) {
  var maxAbs = 1;
  if (!b) {
    cats.forEach(function (c) {
      if (a[c].sets > maxAbs) maxAbs = a[c].sets;
    });
  }
  return '<div class="vol">' + cats.map(function (c) {
    var aVal = a[c].sets;
    var bar = b ? volCompareBar(aVal, b[c].sets, range)
      : '<span class="vb"><i class="abs" style="width:' + Math.round(aVal / maxAbs * 100) +
        '%"></i></span>';
    return '<div class="volrow"><span class="vn">' + esc(c) + '</span>' + bar +
      '<span class="vv">' + setCount(aVal) + '</span></div>';
  }).join("") + '</div>' +
    (b ? '<div class="legend"><span><i class="pos"></i>mehr als im Zeitraum davor</span>' +
      '<span><i class="neg"></i>weniger</span></div>' : "");
}
function volCompareBar(aVal, bVal, range) {
  /* Mindestbasis wie bei imbalanceFlag(): unter minDiff Sätzen machte ein
     Sprung wie 1 auf 3 Sätze, plus 200 Prozent, die kleinste Gruppe zur
     auffälligsten. */
  var hiSets = Math.max(aVal, bVal);
  var minDiff = (IMBALANCE_THRESH[range] || IMBALANCE_THRESH[30]).minDiff;
  if (bVal < 0.05) {
    return '<span class="vb2"><span class="bar"><i class="mid"></i></span>' +
      '<span class="pct isnew">neu</span></span>';
  }
  if (hiSets < minDiff) {
    return '<span class="vb2"><span class="bar"><i class="mid"></i></span>' +
      '<span class="pct">zu wenig</span></span>';
  }
  var pct = Math.round((aVal - bVal) / bVal * 100);
  var clamped = Math.max(-100, Math.min(100, pct));
  var cls = pct > 0 ? "pos" : (pct < 0 ? "neg" : "");
  var fill = pct === 0 ? "" :
    (pct > 0
      ? '<i class="pos" style="width:' + (clamped / 2) + '%"></i>'
      : '<i class="neg" style="width:' + (Math.abs(clamped) / 2) + '%"></i>');
  return '<span class="vb2"><span class="bar"><i class="mid"></i>' + fill +
    '</span><span class="pct ' + cls + '">' + (pct > 0 ? "+" : "") + pct + ' %</span></span>';
}
function volUnmappedNote(from, to) {
  var unmapped = volUnmapped(from, to);
  if (!(unmapped.sets > 0)) return "";
  return '<p class="notice">' + setCount(unmapped.sets) + ' aus ' +
    plural(unmapped.exCount, "Übung", "Übungen") + ' ohne Muskelzuordnung' +
    ' stecken in der Summe oben, erscheinen aber in keiner Balkengruppe.' +
    ' <button class="linklike" data-act="tab" data-v="daten">Zu den Übungen</button></p>';
}

/* Verglichen wird der beste Wert im Zeitraum mit dem besten davor. Je Übung
   höchstens eine Zeile, das Höchstgewicht hat Vorrang vor der Schätzung, weil
   es die klarere Aussage ist. */
function recordBlock() {
  var range = volRange();
  var td = todayISO(), from = shiftISO(td, -(range - 1));
  var byEx = {};
  S.entries.forEach(function (e) {
    if (!isWork(e)) return;
    if (!byEx[e.exercise]) byEx[e.exercise] = [];
    byEx[e.exercise].push(e);
  });
  var out = Object.keys(byEx).map(function (n) { return recordOf(n, byEx[n], from, td); })
    .filter(function (r) { return r; });
  out.sort(function (a, b) { return a.date < b.date ? 1 : (a.date > b.date ? -1 : 0); });
  var h = '<div class="sect"><h2>Neue Rekorde</h2><span>' +
    (out.length ? out.length + " in " + range + " Tagen" : "keine") + '</span></div>';
  if (!out.length) {
    return h + '<p class="notice">In den letzten ' + range + ' Tagen kein neues ' +
      'Höchstgewicht und keine bessere Schätzung fürs 1 Rep Max.</p>';
  }
  h += '<div class="card" style="padding:0">';
  out.forEach(function (r) {
    h += '<div class="prrow"><span class="nm">' + esc(r.name) + '</span>' +
      '<span class="up">' + r.gain + '</span>' +
      '<span class="fig">' + r.fig + '</span>' +
      '<span class="dt">' + tinyDate(r.date) + '</span></div>';
  });
  return h + '</div>';
}

/* Rekordzeile einer Übung im Zeitraum ab from, oder null. list sind ihre
   Arbeitssätze. */
function recordOf(n, list, from, td) {
  var all = list.filter(function (e) { return e.date <= td; });
  var before = all.filter(function (e) { return e.date < from; });
  var inRange = all.filter(function (e) { return e.date >= from; });
  if (!inRange.length) return null;
  var baseline = before, later = inRange;
  if (!before.length) {
    /* Ohne Vorgeschichte ist der erste Tag im Zeitraum der Ausgangswert:
       gemeint ist eine Verbesserung, kein Rekord ohne Vorher-Wert. */
    var firstDay = inRange.reduce(function (a, e) {
      return (!a || e.date < a) ? e.date : a;
    }, "");
    baseline = inRange.filter(function (e) { return e.date === firstDay; });
    later = inRange.filter(function (e) { return e.date > firstDay; });
    if (!later.length) return null;
  }
  var oldW = 0, oldE = 0, topW = null, topE = null;
  baseline.forEach(function (e) {
    if (e.weight > oldW) oldW = e.weight;
    if (e1rm(e.weight, e.reps) > oldE) oldE = e1rm(e.weight, e.reps);
  });
  later.forEach(function (e) {
    if (!topW || e.weight > topW.weight ||
        (Math.abs(e.weight - topW.weight) < 0.001 && e.reps > topW.reps)) topW = e;
    if (!topE || e1rm(e.weight, e.reps) > e1rm(topE.weight, topE.reps)) topE = e;
  });
  if (!topW) return null;
  if (topW.weight > oldW + 0.001) {
    return { name:n, date:topW.date,
      fig: num(topW.weight) + " kg × " + topW.reps + " Reps",
      gain: "+" + num(topW.weight - oldW) + " kg" };
  }
  var e1 = e1rm(topE.weight, topE.reps);
  if (!(e1 > oldE + 0.05)) return null;
  return { name:n, date:topE.date,
    fig: "~1RM " + num(e1) + " kg, aus " + num(topE.weight) + " kg × " +
      topE.reps + " Reps",
    gain: "+" + num(e1 - oldE) + " kg" };
}

/* Gegenstück zu den Rekorden, nur für Übungen, die im gewählten Zeitraum
   trainiert wurden: eine Übung, die seit Monaten liegt, hat kein Plateau, sie
   ist nicht mehr im Programm. Der längste Stillstand steht oben, dort lohnt
   sich das Eingreifen am ehesten. */
function plateauBlock() {
  var range = volRange();
  var td = todayISO(), from = shiftISO(td, -(range - 1));
  var seen = {}, out = [];
  S.entries.forEach(function (e) {
    if (!isWork(e) || seen[e.exercise]) return;
    seen[e.exercise] = 1;
    var wk = plateau(e.exercise);
    if (!wk) return;
    /* Bis einschließlich heute, damit "zuletzt am" nicht in der Zukunft steht,
       dieselbe Grenze wie in plateau(). */
    var ls = lastSession(e.exercise, shiftISO(td, 1));
    if (!ls || ls.day < from) return;
    out.push({ name:e.exercise, weeks:wk, weight:ls.top, day:ls.day });
  });
  out.sort(function (a, b) {
    return b.weeks - a.weeks || a.name.localeCompare(b.name, "de");
  });
  var h = '<div class="sect"><h2>Plateau</h2><span>' +
    (out.length ? out.length : "nichts") + '</span></div>';
  if (!out.length) {
    return h + '<p class="notice">Keine Übung, die du in den letzten ' + range +
      ' Tagen trainiert hast, steht seit vier Wochen oder länger beim gleichen ' +
      'Gewicht.</p>';
  }
  h += '<div class="card" style="padding:0">';
  out.forEach(function (r) {
    h += '<div class="prrow"><span class="nm">' + esc(r.name) + '</span>' +
      '<span class="hold">' + r.weeks + ' Wochen</span>' +
      '<span class="fig">' + num(r.weight) + ' kg</span>' +
      '<span class="dt">zuletzt am ' + tinyDate(r.day) + '</span></div>';
  });
  return h + '</div>';
}

/* Je abgeschlossener Kalenderwoche von Montag bis Sonntag: erreicht nur, wenn
   jeder Plan, der damals laut weekGoalLog ein Ziel hatte, es erfüllt hat. Eine
   Woche ohne damals gültiges Ziel zählt weder als erreicht noch als verfehlt.
   Erst ab 30 Tagen, weil die laufende Woche nicht mitzählt und in 7 Tage keine
   volle Vorwoche passt. */
function weekGoalBlock() {
  var range = volRange();
  if (range < 30) return "";
  var plans = Object.keys(S.plans).filter(function (p) {
    var log = S.settings.weekGoalLog[p];
    return !!(log && log.length);
  });
  var curMon = mondayOf(todayISO());
  var maxWeeks = Math.floor(range / 7);
  var weeks = [], met = 0, counted = 0;
  for (var w = 1; w <= maxWeeks; w++) {
    var mon = shiftISO(curMon, -7 * w), sun = shiftISO(mon, 6);
    var applicable = plans.filter(function (p) { return weekGoalAt(p, mon) > 0; });
    var hasGoal = applicable.length > 0;
    var missed = applicable.filter(function (p) {
      return planDoneOnWeek(p, mon) < weekGoalAt(p, mon);
    });
    var ok = hasGoal && !missed.length;
    if (hasGoal) { counted += 1; if (ok) met += 1; }
    weeks.push({ mon:mon, sun:sun, ok:ok, hasGoal:hasGoal, missed:missed });
  }
  var h = '<div class="sect"><h2>Wochenziele</h2><span>' +
    (counted ? met + ' von ' + counted : "kein Ziel") + '</span></div>';
  if (range === 90) {
    var text = counted
      ? met + ' von ' + plural(counted, "Woche", "Wochen") + ' erreicht.'
      : "kein Ziel";
    return h + '<div class="card"><p>' + text + '</p></div>';
  }
  h += '<div class="card" style="padding:0">';
  weeks.forEach(function (wk) {
    var status = !wk.hasGoal ? "kein Ziel" : (wk.ok ? "erreicht" :
      "nicht erreicht: " + wk.missed.map(esc).join(", "));
    h += '<div class="wgrow"><span class="wgd">' + tinyDate(wk.mon) + '–' +
      tinyDate(wk.sun) + '</span><span class="wgs' + (wk.ok ? " done" : "") + '">' +
      status + '</span></div>';
  });
  return h + '</div>';
}

/* "Seit" behauptet einen Stillstand bis heute, plateau() misst aber nur bis zur
   letzten Einheit mit dem Gewicht. Liegt die länger als eine Woche zurück,
   nennt der Hinweis ihr Datum, wie die Zeilen in plateauBlock(). */
function plateauFlag(weeks, lastDay) {
  if (!weeks) return "";
  var fresh = lastDay >= shiftISO(todayISO(), -7);
  /* tinyDate() endet selbst auf einem Punkt (Tag.Monat.), deshalb steht der
     Schlusspunkt nur im "Seit"-Zweig. */
  return '<div class="flag">' + (fresh
    ? "Seit " + weeks + " Wochen beim gleichen Gewicht."
    : weeks + " Wochen beim gleichen Gewicht, zuletzt am " + tinyDate(lastDay)) +
    '</div>';
}
/* ---------- Verlauf ---------- */
function viewHistory() {
  /* Der Zeitraum-Schalter steht über dem ganzen Reiter und gilt deshalb auch
     für die Übungskarten, mit demselben Fenster wie die Blöcke darüber. Nach
     oben begrenzt, weil sich über die Datumswahl ein Satz auf morgen legen
     lässt. */
  var td = todayISO();
  var from = shiftISO(td, -(volRange() - 1));
  var map = historyMap(from, td);
  var names = Object.keys(map).sort(function (a,b) {
    if (map[a].last !== map[b].last) return map[a].last < map[b].last ? 1 : -1;
    return map[b].ts - map[a].ts;
  });
  var h = volumeBlock() + weekGoalBlock() + recordBlock() + plateauBlock();
  if (!names.length) {
    return h + '<div class="sect"><h2>Übungen</h2></div>' +
      (S.entries.some(isWork)
        ? '<p class="empty">Keine Übung in den letzten ' + volRange() +
          ' Tagen trainiert.<br>Ein größerer Zeitraum oben zeigt ältere Einträge.</p>'
        : '<p class="empty">Noch keine Trainings erfasst.<br>' +
          'Erfasste Sätze erscheinen hier nach Übung zusammengefasst.</p>');
  }
  var total = names.length;
  var hq = S.hsearch.trim().toLowerCase();
  if (hq) names = names.filter(function (n) { return n.toLowerCase().indexOf(hq) >= 0; });
  h += '<div class="sect"><h2>Übungen</h2><span>' +
    (hq ? names.length + " von " + total : total + " in " + volRange() + " Tagen") +
    '</span></div>';
  if (total > 6) {
    h += '<div class="hfind"><input id="histSearch" data-act="hsearch" ' +
      'placeholder="Übung suchen" value="' + esc(S.hsearch) + '"></div>';
  }
  if (!names.length) return h + '<p class="empty">Kein Treffer für ' + esc(S.hsearch) + '.</p>';
  return h + names.map(function (n) { return historyCard(n, map[n], from, td); }).join("");
}
/* Je Übung Satzzahl, letzter Trainingstag und je Tag die Werte für die
   Diagramme, im Fenster von from bis td. */
function historyMap(from, td) {
  var map = {};
  S.entries.forEach(function (e) {
    if (!isWork(e) || e.date < from || e.date > td) return;
    if (!map[e.exercise]) map[e.exercise] = { sets:0, last:"", ts:0, days:{} };
    var g = map[e.exercise];
    g.sets += 1;
    /* „Zuletzt trainiert“ richtet sich nach dem Trainingstag, der Zeitstempel
       entscheidet nur zwischen Sätzen desselben Tages. Sonst gälte ein später
       nachgetragenes altes Training als jüngstes. */
    if (e.date > g.last || (e.date === g.last && e.ts > g.ts)) {
      g.ts = e.ts; g.last = e.date;
    }
    if (!g.days[e.date]) g.days[e.date] = { top:-1, topReps:0, e1:0, vol:0, sets:0 };
    var d = g.days[e.date];
    d.sets += 1;
    /* Reps am Höchstgewicht des Tages fürs Diagramm, nach derselben Regel wie
       repsAt in plateau(): bei gleichem Gewicht zählt die kleinste
       Wiederholungszahl, die konservativere Aussage. */
    if (e.weight > d.top) { d.top = e.weight; d.topReps = e.reps; }
    else if (Math.abs(e.weight - d.top) < 0.001 && e.reps < d.topReps) d.topReps = e.reps;
    if (e1rm(e.weight, e.reps) > d.e1) d.e1 = e1rm(e.weight, e.reps);
    d.vol += e.weight * e.reps;
  });
  return map;
}
function historyCard(n, g, from, td) {
  var rec = bestOf(n, from, td), er = bestE1rm(n, from, td);
  var days = Object.keys(g.days).sort();
  var open = S.openEx === n;
  /* plateau() bleibt bewusst unabhängig vom Zeitraum und misst den ganzen
     Stillstand. */
  var flat = plateau(n);
  return '<div class="card"><h3>' + esc(n) + '</h3>' +
    '<div class="big">' + num(rec.weight) + ' kg</div>' +
    '<p>Bestleistung in diesem Zeitraum mit ' + rec.reps + ' Reps am ' +
    shortDate(rec.date) + '.<br>' +
    '~1 Rep Max <b>' + num(e1rm(er.weight, er.reps)) + ' kg</b>, ' +
    'aus ' + num(er.weight) + ' kg mit ' + er.reps + ' Reps.<br>' +
    plural(g.sets, "Satz", "Sätze") + ' in diesem Zeitraum, zuletzt am ' +
    shortDate(g.last) + '.</p>' +
    plateauFlag(flat, days[days.length - 1]) +
    (days.length > 1
      ? '<button class="open" data-act="openex" data-v="' + esc(n) + '">' +
        (open ? "Diagramm ausblenden" : "Verlauf anzeigen") + '</button>'
      : "") +
    (open ? chart(days, g.days) + volChart(days, g.days) : "") +
    '</div>';
}

/* Mittag als Anker gegen Sprünge bei Sommerzeit und Zeitzone. */
function isoDayDiff(fromIso, toIso) {
  return Math.round((Date.parse(toIso + "T12:00:00") -
    Date.parse(fromIso + "T12:00:00")) / 86400000);
}
/* Gemeinsam für chart() und volChart(): beide stehen untereinander auf
   derselben Zeitachse und sollen bis ins Detail gleich aussehen. */
function gridLine(y, label, padL, right) {
  return '<line x1="' + padL + '" y1="' + y.toFixed(1) + '" x2="' + right +
    '" y2="' + y.toFixed(1) + '" stroke="var(--line)" stroke-width="1"/>' +
    '<text x="' + (padL - 5) + '" y="' + (y + 3.5).toFixed(1) +
    '" font-size="9" fill="var(--muted)" text-anchor="end">' + label + '</text>';
}
function dateRow(days, padL, right, y) {
  return '<text x="' + padL + '" y="' + y + '" font-size="9" fill="var(--muted)">' +
    tinyDate(days[0]) + '</text>' +
    '<text x="' + right + '" y="' + y + '" font-size="9" fill="var(--muted)" ' +
    'text-anchor="end">' + tinyDate(days[days.length - 1]) + '</text>';
}
function chart(days, byDay) {
  /* padT 16 lässt über dem höchsten Punkt Platz für die Rep-Beschriftung, sonst
     schnitte der viewBox sie ab. */
  var w = 320, hh = 170, padL = 34, padR = 8, padT = 16, padB = 22;
  var tops = days.map(function (d) { return byDay[d].top; });
  var e1s = days.map(function (d) { return byDay[d].e1; });
  var max = Math.max.apply(null, e1s.concat(tops));
  var min = Math.min.apply(null, tops);
  var lo = Math.max(0, min - (max - min) * 0.25 - 1), hi = max + (max - lo) * 0.1 + 1;
  var span = (hi - lo) || 1;
  /* Zeitbasiert statt nach Index, damit eine lange Trainingspause auch als
     Lücke sichtbar ist. */
  var totalSpan = isoDayDiff(days[0], days[days.length - 1]) || 1;
  function px(i) {
    return days.length === 1 ? padL
      : padL + isoDayDiff(days[0], days[i]) / totalSpan * (w - padL - padR);
  }
  function py(v) { return padT + (1 - (v - lo) / span) * (hh - padT - padB); }
  function poly(vals) {
    return vals.map(function (v, i) { return px(i).toFixed(1) + "," + py(v).toFixed(1); })
      .join(" ");
  }
  var dots = tops.map(function (v, i) {
    return '<circle cx="' + px(i).toFixed(1) + '" cy="' + py(v).toFixed(1) +
      '" r="2.6" fill="var(--accent)"/>';
  }).join("");
  /* Die Rep-Zahl über jedem Punkt, weil bei doppelter Progression erst die
     Wiederholungen steigen: ohne sie sähe eine laufende Progression wie
     Stillstand aus. */
  var repLabels = tops.map(function (v, i) {
    return '<text x="' + px(i).toFixed(1) + '" y="' + (py(v) - 7).toFixed(1) +
      '" font-size="9.5" font-weight="700" fill="var(--ink)" text-anchor="middle">' +
      byDay[days[i]].topReps + '</text>';
  }).join("");
  var gridVals = [lo + span * 0.05, lo + span * 0.5, hi - span * 0.05];
  var grid = gridVals.map(function (v) {
    return gridLine(py(v), Math.round(v), padL, w - padR);
  }).join("");
  var first = tinyDate(days[0]), lastd = tinyDate(days[days.length-1]);
  return '<div class="chart"><p class="clab">Gewicht</p>' +
    '<svg viewBox="0 0 ' + w + ' ' + hh + '" width="100%" ' +
    'style="display:block;height:auto" preserveAspectRatio="xMidYMid meet" role="img" ' +
    'aria-label="Gewichtsverlauf">' + grid +
    '<polyline points="' + poly(e1s) + '" fill="none" stroke="var(--muted)" ' +
    'stroke-width="1.6" stroke-dasharray="4 3"/>' +
    '<polyline points="' + poly(tops) + '" fill="none" stroke="var(--accent)" ' +
    'stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>' + dots + repLabels +
    dateRow(days, padL, w - padR, hh - 6) + '</svg>' +
    '<div class="legend"><span><i></i>schwerstes Gewicht</span>' +
    '<span><i class="dash"></i>geschätztes 1RM</span></div>' +
    '<p style="margin-top:8px">' + days.length + ' Trainings, ' + first + ' bis ' +
    lastd + '</p></div>';
}

/* Runde Obergrenze, deren Hälfte ebenfalls rund ist. Ohne das stünden an den drei
   Rasterlinien Werte wie 531,25 und 1062,5. */
function niceTop(max) {
  var want = max / 2;
  var mag = Math.pow(10, Math.floor(Math.log10(want)));
  var steps = [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10];
  for (var i = 0; i < steps.length; i++) {
    if (steps[i] * mag >= want) return steps[i] * mag * 2;
  }
  return mag * 20;
}
/* Tagesvolumen als Balken unter dem Gewichtsverlauf, auf derselben Zeitachse.
   Warum Balken, nullbasiert und als eigenes Bild statt hinter der Linie: siehe
   README, Volumen im Diagramm. */
function volChart(days, byDay) {
  var vols = days.map(function (d) { return byDay[d].vol; });
  var max = Math.max.apply(null, vols);
  /* Ohne Gewicht, etwa bei Klimmzügen mit 0 kg, gibt es kein Volumen. Dann
     entfällt nur dieses Diagramm. */
  if (!(max > 0)) return "";
  var w = 320, hh = 150, padL = 34, padR = 8, padT = 16, padB = 22;
  var bw = 15, half = bw / 2;
  var hi = niceTop(max);
  /* Der Zeichenbereich rückt um eine halbe Balkenbreite ein, sonst ragte der
     erste Balken in die Achsenbeschriftung und der letzte aus dem Bild. */
  var left = padL + half, right = w - padR - half, base = hh - padB;
  var totalSpan = isoDayDiff(days[0], days[days.length - 1]) || 1;
  function px(i) {
    return days.length === 1 ? left
      : left + isoDayDiff(days[0], days[i]) / totalSpan * (right - left);
  }
  function py(v) { return padT + (1 - v / hi) * (base - padT); }
  var grid = [0, hi / 2, hi].map(function (v) {
    return gridLine(py(v), num(v), padL, w - padR);
  }).join("");
  var bars = vols.map(function (v, i) {
    var x = px(i) - half, y = py(v), r = Math.min(4, Math.max(0, (base - y) / 2));
    return '<path d="M' + x.toFixed(1) + ' ' + base + ' V' + (y + r).toFixed(1) +
      ' a' + r + ' ' + r + ' 0 0 1 ' + r + ' -' + r + ' h' + (bw - 2 * r) +
      ' a' + r + ' ' + r + ' 0 0 1 ' + r + ' ' + r + ' V' + base +
      ' Z" fill="var(--vol)"/>';
  }).join("");
  /* Beschriftet werden nur der höchste und der letzte Balken. Eine Zahl über jedem
     Balken liest niemand, und bei engen Tagesabständen überlappen sie. */
  var sum = vols.reduce(function (a, v) { return a + v; }, 0);
  var marks = [vols.indexOf(max), vols.length - 1]
    .filter(function (v, i, a) { return a.indexOf(v) === i; })
    .map(function (i) {
      var lx = Math.max(padL + 12, Math.min(w - padR - 12, px(i)));
      return '<text x="' + lx.toFixed(1) + '" y="' + (py(vols[i]) - 5).toFixed(1) +
        '" font-size="9.5" font-weight="700" fill="var(--ink)" text-anchor="middle">' +
        num(vols[i]) + '</text>';
    }).join("");
  var sets = days.reduce(function (a, d) { return a + (byDay[d].sets || 0); }, 0);
  return '<div class="chart"><p class="clab">Volumen je Training, kg</p>' +
    '<svg viewBox="0 0 ' + w + ' ' + hh + '" width="100%" ' +
    'style="display:block;height:auto" preserveAspectRatio="xMidYMid meet" role="img" ' +
    'aria-label="Volumen je Training in Kilogramm">' + grid + bars + marks +
    dateRow(days, padL, w - padR, hh - 6) + '</svg>' +
    '<p>Zusammen ' + num(sum) + ' kg aus ' + plural(sets, "Satz", "Sätzen") + ', im Schnitt ' +
    num(Math.round(sum / vols.length)) + ' kg je Training.</p></div>';
}

function notifyBlock() {

  if (st === "unsupported") {
    return '<p style="margin-top:10px">Benachrichtigungen beherrscht dieser Browser ' +
      'nicht. Das Signal kommt nur, solange die App im Vordergrund ist.</p>';

  if (st === "denied") {

      'abgelehnt, das Signal kommt deshalb nur im Vordergrund. Chrome fragt von sich ' +
      'aus nicht noch einmal; erlauben lässt es sich über das Schloss-Symbol in der ' +
      'Adressleiste oder in den Seiteneinstellungen des Browsers.</p>';
  }
  if (st === "default") {
    /* Breiter Knopf wie der Schalter, der danach hier steht: in der
       zweispaltigen Werkzeugleiste bräche die Beschriftung auf vier Zeilen
       um. */
    return '<button class="open" data-act="notifyask">' +
      'Signal bei ausgeschaltetem Bildschirm erlauben</button>' +
      '<p style="margin-top:10px">Bisher kommt das Signal nur, solange die App im ' +
      'Vordergrund ist.</p>';
  }
  return '<button class="open" data-act="notifytoggle">' +
    'Signal bei ausgeschaltetem Bildschirm: ' +

    (S.settings.notifySignal

function removable(n) {
  if (customNames().indexOf(n) < 0) return false;
  if (S.entries.some(function (e) { return e.exercise === n; })) return false;
  var used = false;
  Object.keys(S.plans).forEach(function (p) {
    if (S.plans[p].some(function (i) { return i.name === n; })) used = true;
  });
  return !used;
}
function exUsage(n) {
  var sets = S.entries.filter(function (e) { return e.exercise === n; }).length;
  var plans = Object.keys(S.plans).filter(function (p) {
    return S.plans[p].some(function (i) { return i.name === n; });
  }).length;
  return { sets:sets, plans:plans };
}
/* Gibt es den Zielnamen schon, werden beide zusammengeführt, und die
   Einstellungen des Zielnamens behalten Vorrang. Zurück kommen die verschobenen
   Satz-IDs, damit sich das rückgängig machen lässt. */
function renameExercise(from, to) {
  var toExisted = allNames().indexOf(to) >= 0;
  var fromCat = catOf(from);
  var ids = [], affectedDays = Object.create(null);
  S.entries.forEach(function (e) {
    if (e.exercise === from) {
      e.exercise = to; ids.push(e.id); affectedDays[e.date] = 1;
    }
  });
  /* Beim Zusammenführen können beide Übungen am selben Tag mit Satz 1 beginnen,
     deshalb neu nummerieren. */
  Object.keys(affectedDays).forEach(function (date) { renumber(date, to); });
  Object.keys(S.plans).forEach(function (p) {
    if (S.plans[p].some(function (i) { return i.name === to; })) {
      S.plans[p] = S.plans[p].filter(function (i) { return i.name !== from; });
    } else {
      S.plans[p].forEach(function (i) { if (i.name === from) i.name = to; });
    }
  });
  S.custom = S.custom.filter(function (c) {
    return (typeof c === "string" ? c : c.name) !== from;
  });
  if (!toExisted && PRESETS.indexOf(to) < 0) S.custom.push({ name:to, cat:fromCat });
  /* Eine mitgelieferte Übung lässt sich nicht löschen, nur ausblenden. Ein
     ausgeblendeter Zielname kommt dagegen zurück. */
  var hid = S.settings.hiddenEx;
  if (PRESETS.indexOf(from) >= 0 && hid.indexOf(from) < 0) hid.push(from);
  dropFrom(hid, to);
  if (!toExisted) {
    S.cats[to] = fromCat;
    if (S.exmeta[from]) S.exmeta[to] = S.exmeta[from];
  }
  delete S.cats[from];
  delete S.exmeta[from];
  if (S.exercise === from) S.exercise = to;
  if (S.openEx === from) S.openEx = to;
  if (S.exNoteFor === from) S.exNoteFor = to;
  return ids;
}

function csvText() {
  var out = "Datum;Uebung;Art;Satz;Gewicht_kg;Wiederholungen;RPE;e1RM_kg;Notiz\n";
  S.entries.slice().sort(function (a,b) { return a.ts-b.ts; }).forEach(function (e) {
    out += e.date + ";" + String(e.exercise).replace(/;/g,",") + ";" +
      (e.warm ? "Aufwaermen" : "Arbeit") + ";" + e.set + ";" +
      comma(e.weight) + ";" + e.reps + ";" +
      (e.rpe == null ? "" : comma(e.rpe)) + ";" +
      comma(Math.round(e1rm(e.weight, e.reps) * 10) / 10) + ";" +
      String(S.notes[e.date] || "").replace(/[;\r\n]/g, " ") + "\n";
  });
  return out;
}
/* Nummer des Dateiformats, nicht der App-Fassung, die steht in appVersion.
   prepareBackup() lehnt jede kleinere Nummer ab: wer sie anhebt, sperrt alle
   älteren Backups aus und notiert hier, was sich geändert hat.

   6, seit 1.14.1: Arbeitssätze tragen optional den Plan, unter dem sie
   entstanden sind. */
var BACKUP_VERSION = 6;
function backupText() {
  return JSON.stringify({
    app:"kraftlog", version:BACKUP_VERSION, appVersion:APP_VERSION,
    exported:new Date().toISOString(),
    custom:S.custom, cats:S.cats, colors:S.colors, plans:S.plans,
    exmeta:S.exmeta, notes:S.notes, settings:S.settings, entries:S.entries
  }, null, 1);
}
function backupName() { return "hantelkladde-" + todayISO() + ".json"; }
/* Beim Teilen heißt die Datei .txt: Chrome lässt über die Teilen-Funktion nur
   eine feste Liste von Dateitypen durch, .json scheitert mit NotAllowedError,
   text/plain nicht. Der Inhalt bleibt JSON, der Import achtet nicht auf die
   Endung. */
function shareName() { return "hantelkladde-" + todayISO() + ".txt"; }
function markBackup() {
  S.meta.lastBackup = new Date().toISOString();
  S.meta.lastCount = S.entries.length;
  persist();
}
/* Teilen über Android, damit die Datei nicht im Download-Ordner versandet.
   shareBackup() muss synchron aus dem Tippen heraus starten, navigator.share()
   verlangt eine Nutzergeste. */
function canShareBackup() {
  try {
    if (!navigator.share || !navigator.canShare || typeof File !== "function") return false;
    return navigator.canShare({ files: [new File(["{}"], "t.txt", { type:"text/plain" })] });
  } catch (e) { return false; }
}
function shareBackup() {
  if (!canShareBackup()) return false;
  var name = backupName(), sname = shareName(), text = backupText();
  try {
    var file = new File([text], sname, { type:"text/plain" });
    navigator.share({ files:[file], title:sname }).then(function () {
      markBackup();
      S.note = "Backup geteilt: " + sname;
      render();
    }, function (err) {
      /* Weggewischt (AbortError) ist eine Entscheidung und bleibt still. Jeder
         andere Fehler heißt, das Teilen geht auf diesem Gerät nicht: dann
         ersatzweise in den Download-Ordner, mit Hinweis, damit das Backup nicht
         unbemerkt ausbleibt. */

  var target = S.plans[S.plan][idx + parseInt(el.getAttribute("data-d"),10)];
  if (!target) return false;
  S.exercise = target.name; S.pickOpen = false; S.editId = "";

};

/* Mehrfachauswahl für einen Plan im Pläne-Reiter oder, über DRAFT_TARGET, für
   den Entwurf unter Planung. */
ACTIONS.pickmulti = function (v) {
  S.pickPlanTarget = v; S.pickSel = []; S.pickOpen = true; S.search = "";
  S.pickCat = ""; S.pickMuscle = ""; S.editId = "";

};

};
ACTIONS.pickmultidone = function () {
  var plan = S.pickPlanTarget, toDraft = plan === DRAFT_TARGET;
  var addedN = 0, alreadyN = 0;
  if (toDraft) {
    /* Standard-Satzzahl und einmal pro Woche, beides in draftExtrasBlock()
       änderbar. */
    var wk = weekDraftEdit(selWeek());
    S.pickSel.forEach(function (name) {
      if (wk.extras.some(function (x) { return x.name === name; })) { alreadyN++; return; }
      wk.extras.push({ name:name, sets:defaultSets(), times:1 });
      addedN++;
    });
    if (addedN) saveDraft();
  } else if (plan && S.plans[plan]) {
    S.pickSel.forEach(function (name) {
      if (S.plans[plan].some(function (i) { return i.name === name; })) { alreadyN++; return; }
      var d = planItemDefaults(name);
      S.plans[plan].push({ name: name, reps: d.reps, weight: d.weight, sets: d.sets });
      addedN++;
    });
  }
  S.pickOpen = false; S.pickPlanTarget = ""; S.pickSel = []; S.search = "";
  /* Drei Fälle statt zwei: standen alle gewählten Übungen schon im Plan, wäre
     "Keine Übung ausgewählt" falsch. */
  var mTo = toDraft ? "in den Entwurf" : "zu " + plan;
  var mIn = toDraft ? "im Entwurf" : "in " + plan;
  S.note = addedN
    ? plural(addedN, "Übung", "Übungen") + " " + mTo + " hinzugefügt." +
      (alreadyN ? " " + plural(alreadyN, "stand", "standen") +
        " schon " + (toDraft ? "im Entwurf" : "im Plan") + "." : "")
    : alreadyN
      ? plural(alreadyN, "Übung stand", "Übungen standen") +
        " schon " + mIn + "."
      : "Keine Übung ausgewählt.";
  if (addedN && !toDraft) persist();
};

/* Die jetzt eingestellten Werte gelten als Antwort auf den Vorschlag des Tages,
   siehe applySuggestion(). */
function markSuggestion() {
  var rpe = deci(S.rpe);
  S.suggestionHandled[S.date + "\n" + S.exercise] = {
    reps:parseInt(S.reps, 10), weight:deci(S.weight), rpe:isNaN(rpe) ? null : rpe
  };
  saveSuggestions();
  S.source = "";
  repWinCenter = null;
}
ACTIONS.suggestaccept = function () {
  var target = planTarget(S.exercise);
  var w = deci(S.weight), r = parseInt(S.reps, 10);
  if (target) {
    /* Die Rep-Spanne bleibt um das bewusst gesetzte Planziel zentriert. Bei
       doppelter Progression wird deshalb nur das neue Gewicht übernommen, eine
       einzelne vorgeschlagene Wiederholung verschiebt die Spanne nicht. */
    var hadRange = !!repRange(S.exercise, target.weight);
    if (isFinite(w) && w >= 0) target.weight = w;
    if (!hadRange && r > 0) target.reps = r;
    persist();
  }
  markSuggestion();
};
ACTIONS.suggestreject = function () {
  var target = planTarget(S.exercise);
  var previous = lastSession(S.exercise, S.date);
  var goalSets = target && target.sets > 0
    ? target.sets : (previous ? previous.sets.length : 1);
  var block = mainWorkBlock(previous, goalSets, target ? target.weight : NaN);
  var last = block ? block.last : null;
  if (last) {
    S.reps = String(last.reps);
    S.weight = comma(last.weight);
    if (last.rpe != null) S.rpe = comma(last.rpe);
  } else if (target) {
    S.reps = String(target.reps);
    S.weight = comma(target.weight);
  }
  markSuggestion();
};
ACTIONS.pillrep = function (v) { S.reps = v; S.source = ""; repWinCenter = null; };
ACTIONS.pillrpe = function (v) { S.rpe = v; };
ACTIONS.warmon = function () {
  if (!S.warm) {
    enterWarm(deci(S.weight) || 0);
    var half = warmWeight(S.exercise, S.warmBase, 0.5);
    if (half > 0) S.weight = comma(half);
  }
};
/* Legt die Übung aus der Anlegebox mit den Feldern prefix an, siehe
   newExerciseBox(). Ohne Namen null, sonst der Name und ob sie neu ist. */
function createExercise(prefix) {
  function field(f) { return document.getElementById(prefix + f); }
  var inp = field("Name"), selc = field("Cat");
  var name = inp ? inp.value.trim() : "";
  if (!name) return null;
  /* Eine weggebenannte mitgelieferte Übung ist nur ausgeblendet und kommt über
     ihren Namen zurück. */
  dropFrom(S.settings.hiddenEx, name);
  var fresh = allNames().indexOf(name) < 0;
  if (fresh) {
    S.custom.push({ name:name, cat:(selc && selc.value) ? selc.value : "Sonstige" });
    setExStart(name, field("Sets"), field("Reps"), field("Weight"));
    setExMuscle(name, field("MusclePrimary"), field("MuscleSecondary"));
  }
  return { name:name, fresh:fresh };
}
ACTIONS.addex = function () {
  var made = createExercise("new");
  if (!made) return false;
  if (S.pickPlanTarget) {
    /* Neue Übung gleich mit auswählen, der Picker bleibt für weitere offen. */
    if (S.pickSel.indexOf(made.name) < 0) S.pickSel.push(made.name);
  } else {
    S.exercise = made.name; S.pickOpen = false; S.editId = ""; S.search = "";
    applySuggestion(made.name);
  }
  persist();
};
/* Ohne Übungswahl und Picker, die im Daten-Reiter keinen Sinn ergeben. */

ACTIONS.rendo = function (v) {
  var inp = document.getElementById("ren-name");
  var to = inp ? inp.value.trim() : "";
  if (!to) { S.note = "Der neue Name darf nicht leer sein."; render(); return false; }
  if (to === v) { S.exOpen = ""; render(); return false; }
  var merge = allNames().indexOf(to) >= 0;
  if (merge) {
    var uf = exUsage(v).sets, ut = exUsage(to).sets;
    if (!window.confirm("„" + to + "“ gibt es bereits.\n\n" +
        v + ": " + plural(uf, "Satz", "Sätze") + "\n" +
        to + ": " + plural(ut, "Satz", "Sätze") + "\n" +
        "ergibt " + (uf + ut) + " Sätze unter „" + to + "“.\n\n" +
        "Rekorde und Verlauf werden neu berechnet. Schrittweite, Langhantel und " +
        "Geräteeinstellung von „" + to + "“ bleiben erhalten. " +
        "Rückgängig über Wiederherstellen.")) return false;
  }
  /* Pläne, eigene Übungen, Gruppen und Einstellungen sind klein genug, um sie
     vollständig zu sichern. Bei den Sätzen genügen die verschobenen IDs. */
  S.undo = { kind:"rename", from:v, to:to, ids:[],
    plans:JSON.parse(JSON.stringify(S.plans)),
    custom:JSON.parse(JSON.stringify(S.custom)),
    cats:JSON.parse(JSON.stringify(S.cats)),
    exmeta:JSON.parse(JSON.stringify(S.exmeta)),
    hiddenEx:S.settings.hiddenEx.slice(),
    exercise:S.exercise,
    label:(merge ? v + " mit " + to + " zusammengeführt."
                 : v + " heißt jetzt " + to + ".") };
  S.undo.ids = renameExercise(v, to);
  S.exOpen = "";
  S.note = "";
  persist();
};
ACTIONS.warmoff = function () { backToWork(); };
ACTIONS.warmpick = function (v, el) {
  var base = S.warm && S.warmBase > 0 ? S.warmBase : (deci(S.weight) || 0);
  var wr = warmupPlan(S.exercise, base)[parseInt(el.getAttribute("data-i"),10)];
  if (!wr) return false;
  enterWarm(base);
  S.weight = comma(wr.weight);
  S.reps = String(wr.reps);
  repWinCenter = null;
};
ACTIONS.step = function (v, el) {
  var f = el.getAttribute("data-f"), d = parseFloat(el.getAttribute("data-d"));
  var cur = deci(S[f]) || 0;
  if (f === "reps") S.reps = String(Math.max(1, Math.round(cur + d)));
  else if (f === "weight") S.weight = comma(Math.max(0, Math.round((cur + d)*100)/100));
  else S.rpe = comma(Math.min(10, Math.max(1, Math.round((cur + d)*2)/2)));
  if (f === "reps" || f === "weight") S.source = "";
};
ACTIONS.save = function () {
  var w = deci(S.weight), r = parseInt(S.reps,10), p = deci(S.rpe);
  if (!S.exercise) { S.note = "Wähle zuerst eine Übung."; render(); return false; }
  if (isNaN(r) || r < 1) {
    S.note = "Reps fehlen oder sind keine Zahl."; render(); return false;
  }
  if (!isFinite(w) || w < 0) {
    S.note = "Das Gewicht muss eine Zahl ab 0 kg sein."; render(); return false;
  }
  if (Date.now() - lastSave < 900) {
    S.note = "Der Satz wurde eben schon gespeichert."; render(); return false;
  }
  lastSave = Date.now();
  var wasWarm = S.warm;
  var prevBest = wasWarm ? null : bestOf(S.exercise);
  var prevE1 = wasWarm ? null : bestE1rm(S.exercise);
  var id = Date.now() + "-" + Math.random().toString(36).slice(2,7);
  /* Aufwärmsätze tragen keinen RPE: sie sind bewusst leicht, eine
     Anstrengungsangabe sagt dort nichts. */
  var rec = { id:id, date:S.date, exercise:S.exercise, set:nextSet(), weight:w,
    reps:r, rpe:(wasWarm || isNaN(p)) ? null : p, ts:Date.now() };
  if (wasWarm) rec.warm = true;
  else if (S.plan && S.plans[S.plan]) rec.plan = S.plan;
  S.entries.push(rec);
  S.freshId = id; S.note = "";
  if (S.focus) {
    S.undo = { kind:"newset", item:rec,
      label:"Satz " + rec.set + " bei " + rec.exercise + " gespeichert." };
    showQuickUndo();
  } else {
    S.undo = null;
  }
  if (wasWarm) {
    backToWork();
    showToast("Aufwärmsatz gesichert: " + num(w) + " kg × " + r);
  } else {
    var extra = "";
    /* Der erste Satz einer Übung ist kein Rekord, dieselbe Regel wie in
       trainingSummary(). */
    if (prevBest && (w > prevBest.weight ||
        (Math.abs(w - prevBest.weight) < 0.001 && r > prevBest.reps))) {
      extra = '<b class="hit">Neuer Rekord</b>';
    } else if (prevE1 && e1rm(w, r) > e1rm(prevE1.weight, prevE1.reps)) {
      extra = '<b class="hit">Bestes ~1RM ' + num(e1rm(w, r)) + ' kg</b>';
    }
    var doneNow = doneSets(S.exercise, S.date), needNow = targetSets(S.exercise);
    if (doneNow === needNow) {
      extra = (extra ? extra + " · " : "") + "alle " + needNow + " Zielsätze erledigt";
    }
    showToast("Satz " + rec.set + " gesichert: " + num(w) + " kg × " + r +
      (extra ? "<br>" + extra : ""));
    S.note = "";
    /* Die Wiederholungszahl bleibt, nur der sichtbare Ausschnitt der Reps-Reihe
       springt zurück zum Planziel, damit es für den nächsten Satz direkt
       erreichbar ist. */
    if (S.focus) {
      var tgt = planTarget(S.exercise);
      var tgtReps = tgt ? parseInt(tgt.reps, 10) : 0;
      repWinCenter = tgtReps > 0 ? tgtReps : null;
    }
  }
  persist();
  if (S.settings.autoRest && S.date === todayISO()) {
    startRest(wasWarm ? warmRest(S.exercise) : exRest(S.exercise));
  }
};
ACTIONS.edit = function (v) {
  var found = S.entries.filter(function (e) { return e.id === v; })[0];
  if (!found) return false;
  S.editId = v; S.exercise = found.exercise;
  S.reps = String(found.reps); S.weight = comma(found.weight);
  S.rpe = found.rpe == null ? "7" : comma(found.rpe);
  S.pickOpen = false;
  clearWarm();
  window.scrollTo({ top:0, behavior:"smooth" });
};
ACTIONS.update = function () {
  var w = deci(S.weight), r = parseInt(S.reps,10), p = deci(S.rpe);
  if (isNaN(r) || r < 1 || !isFinite(w) || w < 0) {
    S.note = "Reps müssen mindestens 1 und das Gewicht mindestens 0 kg sein.";
    render(); return false;
  }
  S.entries.forEach(function (e) {
    if (e.id !== S.editId) return;
    e.weight = w; e.reps = r;
    e.rpe = (e.warm || isNaN(p)) ? null : p;
  });
  S.freshId = S.editId; S.editId = ""; S.note = "";
  persist();
};
ACTIONS.canceledit = function () { S.editId = ""; };
ACTIONS.del = function (v) {
  var pos = -1;
  S.entries.forEach(function (e, i) { if (e.id === v) pos = i; });
  if (pos < 0) return false;
  var gone = S.entries[pos];
  S.undo = { kind:"set", index:pos, item:gone,
    label:"Satz " + gone.set + " bei " + gone.exercise + " gelöscht." };
  S.entries.splice(pos, 1);
  renumber(gone.date, gone.exercise);
  if (S.editId === v) S.editId = "";
  S.note = "";
  persist();
};
ACTIONS.undo = function () {
  var u = S.undo;
  S.undo = null;
  S.quickUndo = false;
  if (quickUndoTimer) { clearTimeout(quickUndoTimer); quickUndoTimer = null; }
  if (!u) return false;
  if (u.kind === "set") {
    S.entries.splice(Math.min(u.index, S.entries.length), 0, u.item);
    renumber(u.item.date, u.item.exercise);
  } else if (u.kind === "newset") {
    var idx = -1;
    S.entries.forEach(function (e, i) { if (e.id === u.item.id) idx = i; });
    if (idx >= 0) {
      S.entries.splice(idx, 1);
      renumber(u.item.date, u.item.exercise);
    }
  } else if (u.kind === "custom") {
    S.custom.splice(Math.min(u.index, S.custom.length), 0, u.item);
    var name = typeof u.item === "string" ? u.item : (u.item && u.item.name);
    if (name && u.meta) S.exmeta[name] = u.meta;
  } else if (u.kind === "planrow" && S.plans[u.plan]) {
    S.plans[u.plan].splice(Math.min(u.index, S.plans[u.plan].length), 0, u.item);
  } else if (u.kind === "plan") {
    S.plans[u.plan] = u.item;
    if (u.color) S.colors[u.plan] = u.color;
    if (typeof u.goal === "number") S.settings.weekGoals[u.plan] = u.goal;
    if (Array.isArray(u.goalLog)) S.settings.weekGoalLog[u.plan] = u.goalLog;
  } else if (u.kind === "rename") {
    var back = {}, renameDays = Object.create(null);
    u.ids.forEach(function (i) { back[i] = 1; });
    S.entries.forEach(function (e) {
      if (back[e.id]) { e.exercise = u.from; renameDays[e.date] = 1; }
    });
    /* Beim Zusammenführen wurde unter dem Zielnamen gemeinsam nummeriert,
       deshalb beide Übungen neu nummerieren. */
    Object.keys(renameDays).forEach(function (date) {
      renumber(date, u.from);
      renumber(date, u.to);
    });
    S.plans = u.plans;
    S.custom = u.custom;
    S.cats = u.cats;
    S.exmeta = u.exmeta;
    S.settings.hiddenEx = u.hiddenEx;
    S.exercise = u.exercise;
    if (S.openEx === u.to) S.openEx = u.from;
    if (S.exNoteFor === u.to) S.exNoteFor = u.from;
    S.exOpen = "";
  }
  S.note = u.kind === "newset" ? "Letzten Satz gelöscht." : "Wiederhergestellt.";
  persist();
};

ACTIONS.pdel = function (v, el) {
  var plan = el.getAttribute("data-p"), idx = parseInt(el.getAttribute("data-i"),10);
  if (!S.plans[plan] || !S.plans[plan][idx]) return false;
  var removed = S.plans[plan][idx];
  S.undo = { kind:"planrow", plan:plan, index:idx, item:removed,
    label:removed.name + " aus " + plan + " entfernt." };
  S.plans[plan].splice(idx, 1);
  S.note = "";
  persist();
};
ACTIONS.addplan = function () {
  var inp = document.getElementById("newPlan");
  var name = inp ? inp.value.trim() : "";
  if (!name) return false;
  if (S.plans[name]) { S.note = "Ein Plan mit diesem Namen existiert bereits."; }
  else { S.plans[name] = []; S.note = "Plan " + name + " angelegt."; persist(); }
};
ACTIONS.planvis = function (v) {
  if (!dropFrom(S.settings.hiddenPlans, v)) {
    S.settings.hiddenPlans.push(v);
    if (S.plan === v) clearPlan();
  }
  persist();
};
ACTIONS.dupplan = function (v) {
  if (!S.plans[v]) return false;
  var base = v + " Kopie", name = base, n = 2;
  while (S.plans[name]) { name = base + " " + n; n += 1; }
  /* Eigene Farbe, sonst wäre die Kopie im Wochenstreifen nicht vom Original zu
     unterscheiden. Vor dem Einfügen suchen, sonst zählte die Kopie sich selbst;
     ist keine Farbe frei, gilt die Reihenfolge-Regel aus planColor(). */
  var used = Object.keys(S.plans).map(planColor);
  for (var i = 0; i < PALETTE.length; i++) {
    if (used.indexOf(PALETTE[i]) < 0) { S.colors[name] = PALETTE[i]; break; }
  }
  /* Ans Ende, nicht hinter das Original: ohne eigene Farbe richtet sich
     planColor() nach dem Platz in der Reihenfolge, ein Einschub färbte jeden
     Plan dahinter um. */
  S.plans[name] = JSON.parse(JSON.stringify(S.plans[v]));
  /* Wochenziel, Sichtbarkeit und Sperre werden nicht kopiert: ein mitkopiertes
     Wochenziel verdoppelte stillschweigend das Wochenpensum. */
  var len = S.plans[name].length;
  S.note = name + " angelegt, " + plural(len, "Übung", "Übungen") + " übernommen." +
    " Wochenziel bleibt frei.";
  persist();
};
ACTIONS.planlock = function (v) {
  if (!dropFrom(S.settings.lockedPlans, v)) S.settings.lockedPlans.push(v);
  persist();
};
ACTIONS.weekgoalrestart = function () {
  if (writeWeekGoalLog()) {
    S.note = "Neues Wochenziel aktiviert";
    persist();
  }
};

/* ---------- Planung ---------- */
ACTIONS.drafttoggle = function (v) {
  var mon = selWeek(), e = draftEntry(v, mon);
  weekDraftEdit(mon).plans[v] = { on:!e.on, times:e.times };
  saveDraft();
};
ACTIONS.draftstep = function (v, el) {
  var mon = selWeek(), e = draftEntry(v, mon);
  var d = parseInt(el.getAttribute("data-d"), 10) || 0;
  weekDraftEdit(mon).plans[v] = { on:e.on,
    times:Math.min(DRAFT_MAX_TIMES, Math.max(1, e.times + d)) };
  saveDraft();
};
ACTIONS.draftxstep = function (v, el) {
  var x = weekDraftEdit(selWeek()).extras[parseInt(v, 10)];
  var f = el.getAttribute("data-f"), d = parseInt(el.getAttribute("data-d"), 10) || 0;
  if (x && (f === "sets" || f === "times")) {
    var max = f === "sets" ? DRAFT_MAX_SETS : DRAFT_MAX_TIMES;
    x[f] = Math.min(max, Math.max(1, x[f] + d));
    saveDraft();
  }
};
ACTIONS.draftxdel = function (v) {
  weekDraftEdit(selWeek()).extras.splice(parseInt(v, 10), 1);
  saveDraft();
};
ACTIONS.draftsplit = function () {
  if (S.draft.split) {
    var hadWeeks = Object.keys(S.draft.weeks).length > 0;
    S.draft.split = false; S.draft.weeks = {};
    if (hadWeeks) S.note = "Alle Wochen sind wieder gleich geplant.";
  } else {
    S.draft.split = true;
    S.planWeekSel = planWeeks()[0].monday;
  }
  saveDraft();
};
ACTIONS.planweek = function (v) {
  /* Der gewählte Tag geht auf denselben Wochentag der neuen Woche, damit Reiter
     oben und Auswahl unten dieselbe Woche meinen. */
  if (S.planDaySel) {
    var off = Math.round((Date.parse(S.planDaySel + "T12:00:00") -
      Date.parse(mondayOf(S.planDaySel) + "T12:00:00")) / 86400000);
    S.planDaySel = shiftISO(v, off);
  }
  S.planWeekSel = v;
};
ACTIONS.planday = function (v) {
  S.planDaySel = v;
  /* Ein Tag aus einer anderen Woche schaltet auch die Reiter oben um, sonst
     zeigten Entwurf und Auswahl verschiedene Wochen. */
  if (S.draft.split) S.planWeekSel = mondayOf(v);
};
ACTIONS.planassign = function (v, el) {
  /* Sofort gespeichert wie jede Änderung an den Plänen, einen ungesicherten
     Zwischenstand gibt es in der App nirgends. */
  /* Der Tag kommt vom Knopf, siehe assignPanel(), damit Planung und
     Wochenübersicht über dieselbe Aktion zuweisen. */
  var day = el.getAttribute("data-day");
  if (day) {
    if (v) S.settings.planDays[day] = v;
    else delete S.settings.planDays[day];
    persist();
    /* "Frei" nimmt eine bestehende Planwahl im Training nicht weg, trainiert
       werden darf trotzdem. */
    if (v && day === S.date) preselectPlan();
  }
};
ACTIONS.drafttake = function () {
  /* Die einzelnen Übungen bleiben im Entwurf, in den Wochenzielen haben sie
     keinen Platz. */
  var mon = selWeek(), list = [];
  Object.keys(S.plans).forEach(function (p) {
    var e = draftEntry(p, mon), times = e.on ? e.times : 0;
    if (times) list.push(p + " " + times + "×");
    /* Kein Ballast: wer nie ein Ziel hatte und keins bekommt, bleibt ohne Eintrag. */
    if (times || S.settings.weekGoals[p] != null) S.settings.weekGoals[p] = times;
  });
  writeWeekGoalLog();
  /* Geleert wird der Entwurf, der gerade galt: seine Zahlen stehen jetzt in den
     Wochenzielen, leer zeigt also dasselbe und folgt späteren Änderungen der
     Wochenziele, siehe draftEntry(). */
  weekDraft(mon).plans = {};
  saveDraft();
  persist();
  var wk = S.draft.split ? " aus KW " + isoWeekNo(mon) : "";
  S.note = list.length
    ? "Wochenziele" + wk + " übernommen: " + list.join(", ") + "."
    : "Wochenziele übernommen, kein Plan hat mehr ein Ziel.";
};
ACTIONS.draftreset = function () {
  S.draft = { split:false, plans:{}, extras:[], weeks:{} };
  S.planWeekSel = "";
  saveDraft();
  S.note = "Entwurf verworfen, es gelten wieder die Wochenziele.";
};
ACTIONS.delplan = function (v) {
  if (!window.confirm("Plan " + v + " mit " + (S.plans[v] ? S.plans[v].length : 0) +
      " Übungen wirklich löschen?")) return false;
  S.undo = { kind:"plan", plan:v, item:S.plans[v], color:S.colors[v],
    goal:S.settings.weekGoals[v], goalLog:S.settings.weekGoalLog[v],
    label:"Plan " + v + " gelöscht." };
  delete S.plans[v];
  delete S.colors[v];
  delete S.settings.weekGoals[v];
  delete S.settings.weekGoalLog[v];
  dropFrom(S.settings.hiddenPlans, v);
  dropFrom(S.settings.lockedPlans, v);
  if (S.plan === v) clearPlan();
  S.note = "";
  persist();
};
ACTIONS.resetplans = function () {
  if (!window.confirm("Alle Pläne auf den Ausgangsstand zurücksetzen? " +
      "Eigene Zielwerte und selbst angelegte Pläne gehen dabei verloren.")) return false;
  S.plans = JSON.parse(JSON.stringify(DEFAULT_PLANS));
  S.settings.hiddenPlans = [];
  S.settings.lockedPlans = [];
  S.settings.weekGoals = {};
  S.settings.weekGoalLog = {};
  clearPlan();
  S.undo = null;
  S.note = "Pläne auf den Ausgangsstand zurückgesetzt.";
  persist();
};

document.addEventListener("click", function (ev) {

  if (!el) return;

      act !== "focusfinish") {

  }

});

document.getElementById("filein").addEventListener("change", function (ev) {

/* Reihenfolge im Plan per Ziehen am Griff */
var drag = null;
var lastSave = 0;

function rowAfter(cont, y) {
  var rows = [].slice.call(cont.querySelectorAll(".prow:not(.drag)"));
  var best = null, bestOffset = Number.NEGATIVE_INFINITY;
  rows.forEach(function (r) {
    var box = r.getBoundingClientRect();
    var offset = y - box.top - box.height / 2;
    if (offset < 0 && offset > bestOffset) { bestOffset = offset; best = r; }
  });
  return best;
}

document.addEventListener("pointerdown", function (ev) {
  var h = ev.target.closest ? ev.target.closest('[data-act="phandle"]') : null;
  if (!h) return;
  var row = h.closest(".prow");
  if (!row || !row.parentNode) return;
  drag = { row:row, cont:row.parentNode, plan:h.getAttribute("data-p"),
    idx:parseInt(h.getAttribute("data-i"), 10), y0:ev.clientY, moved:false };
  row.classList.add("drag");
  try { h.setPointerCapture(ev.pointerId); } catch (e) {}
  try { if (navigator.vibrate) navigator.vibrate(12); } catch (e) {}
  ev.preventDefault();
});

document.addEventListener("pointermove", function (ev) {
  if (!drag) return;
  if (!drag.moved && Math.abs(ev.clientY - drag.y0) < 6) return;
  drag.moved = true;
  ev.preventDefault();
  var after = rowAfter(drag.cont, ev.clientY);
  if (!after) { drag.cont.appendChild(drag.row); }
  else if (after !== drag.row) { drag.cont.insertBefore(drag.row, after); }
}, { passive:false });

function endDrag() {
  if (!drag) return;
  var d = drag;
  drag = null;
  d.row.classList.remove("drag");
  var list = S.plans[d.plan];
  if (!list) { render(); return; }
  if (d.moved) {
    var order = [].slice.call(d.cont.querySelectorAll(".prow")).map(function (r) {
      return parseInt(r.getAttribute("data-i"), 10);
    });
    var next = [];
    order.forEach(function (i) { if (list[i]) next.push(list[i]); });
    if (next.length === list.length) S.plans[d.plan] = next;
    persist();
  } else if (d.idx > 0) {
    var tmp = list[d.idx];
    list[d.idx] = list[d.idx - 1];
    list[d.idx - 1] = tmp;
    persist();
  }
  render();
}
document.addEventListener("pointerup", endDrag);
document.addEventListener("pointercancel", endDrag);

/* Reiter per Wischen wechseln */
var VIEWS = ["tag","plaene","planung","verlauf","daten"];
var swipe = null;

document.addEventListener("touchstart", function (ev) {
  if (S.focus) { swipe = null; return; }
  if (ev.touches.length !== 1) { swipe = null; return; }
  var blocked = ev.target.closest &&
    ev.target.closest(".week, .list, .chart, .handle, input, select, textarea, .repsrow");
  if (blocked) { swipe = null; return; }
  var t = ev.touches[0];
  swipe = { x:t.clientX, y:t.clientY, ts:Date.now() };
}, { passive:true });

/* Im Fokus-Modus verschiebt Wischen auf der Reps-Reihe nur den sichtbaren
   Ausschnitt, nie die gewählte Zahl. Nach rechts zeigt niedrigere Werte. */
var repSwipe = null;
document.addEventListener("touchstart", function (ev) {
  var row = ev.target.closest && ev.target.closest(".repsrow");
  if (!row || ev.touches.length !== 1) { repSwipe = null; return; }
  repSwipe = ev.touches[0].clientX;
}, { passive:true });
document.addEventListener("touchend", function (ev) {
  if (repSwipe == null) return;
  var dx = ev.changedTouches[0].clientX - repSwipe;
  repSwipe = null;
  if (Math.abs(dx) < 28) return;
  shiftRepWin(dx > 0 ? -5 : 5);
  render();
}, { passive:true });

document.addEventListener("touchend", function (ev) {
  var s = swipe;
  swipe = null;
  if (!s || drag) return;
  var t = ev.changedTouches[0];
  var dx = t.clientX - s.x, dy = t.clientY - s.y;
  if (Date.now() - s.ts > 800) return;
  if (Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 2) return;
  var i = VIEWS.indexOf(S.view) + (dx < 0 ? 1 : -1);
  if (i < 0 || i >= VIEWS.length) return;
  S.view = VIEWS[i];
  S.pickOpen = false;
  closeWeekOverview();
  S.note = "";
  render();
  window.scrollTo({ top:0 });
}, { passive:true });

/* Das Gegenstück zu ACTIONS für input-Ereignisse, Schlüssel ist wieder das
   data-act. Hier baut der Verteiler nie neu auf, ein render() beim Tippen nähme
   dem Feld den Fokus; die Suchfelder holen ihn sich selbst zurück, siehe
   searchInput(). Jede Aktion hier steht auch in der Ausschlussliste des
   Klick-Verteilers. */
var INPUT_ACTIONS = Object.create(null);
INPUT_ACTIONS.input = function (el) {
  var field = el.getAttribute("data-f");
  S[field] = el.value;
  if ((field === "reps" || field === "weight") && S.source) {
    S.source = "";
    /* Ohne render() den nun überholten Vorschlag von Hand entfernen. Nur mit
       S.source steht er da, sonst trägt .suggestion den Hinweis. */
    var suggestion = document.querySelector(".suggestion");
    if (suggestion && suggestion.parentNode) suggestion.parentNode.removeChild(suggestion);
  }
};
function searchInput(el, key, id) {
  var pos = el.selectionStart;
  S[key] = el.value;
  render();
  var again = document.getElementById(id);
  if (again) {
    again.focus();
    var at = pos == null ? again.value.length : pos;
    try { again.setSelectionRange(at, at); } catch (e) {}
  }
}
INPUT_ACTIONS.search = function (el) { searchInput(el, "search", "searchEx"); };
INPUT_ACTIONS.hsearch = function (el) { searchInput(el, "hsearch", "histSearch"); };
INPUT_ACTIONS.defedit = function (el) {
  var f = el.getAttribute("data-f");
  var whole = (f === "reps" || f === "sets");
  var val = whole ? parseInt(el.value, 10) : deci(el.value);
  if (!isNaN(val) && val >= (whole ? 1 : 0)) {
    S.settings[f === "sets" ? "defSets" : f === "reps" ? "defReps" : "defWeight"] = val;
    persistKey(SET_KEY, S.settings);
  }
};
INPUT_ACTIONS.weekgoaledit = function (el) {
  var n = parseInt(el.value, 10);
  if (!isNaN(n) && n >= 0) {
    /* Nur die Zahl, noch kein Eintrag in der Historie: den schreibt erst
       weekgoalrestart, sonst entstünde bei jedem Tastendruck einer. */
    S.settings.weekGoals[el.getAttribute("data-v")] = n;
    var btn = document.querySelector('[data-act="weekgoalrestart"]');
    if (btn) btn.disabled = !weekGoalPending();
  }
};
INPUT_ACTIONS.pedit = function (el) {
  var p = el.getAttribute("data-p"), i = parseInt(el.getAttribute("data-i"), 10);
  var f = el.getAttribute("data-f");
  var whole = (f === "reps" || f === "sets");
  var val = whole ? parseInt(el.value, 10) : deci(el.value);
  if (!isNaN(val) && S.plans[p] && S.plans[p][i]) {
    S.plans[p][i][f] = Math.max(whole ? 1 : 0, val);
  }
};
INPUT_ACTIONS.noteinput = function (el) {
  if (el.value.trim()) S.notes[S.date] = el.value;
  else delete S.notes[S.date];
  persistKey(NOTES_KEY, S.notes);
};
INPUT_ACTIONS.exnoteinput = function (el, act) {
  /* Nur den einen Schlüssel sichern, damit nicht bei jedem Zeichen der gesamte
     Datenbestand serialisiert wird. */
  setExNote(act === "exnoteinput" ? S.exercise : el.getAttribute("data-v"), el.value);
  persistKey(EXMETA_KEY, S.exmeta);
  var lab = document.querySelector(".exnote > span");
  if (lab && act === "exnoteinput") {
    var lv = el.value.trim();
    lab.textContent = lv || "Geräteeinstellung notieren";
    /* "blank" wie in exNoteBlock(), nicht "empty": dafür gibt es keine Regel,
       der Knopf behielte sonst die Optik einer gefüllten Notiz. */
    lab.parentNode.className = "exnote" + (lv ? "" : " blank");
  }
};
/* Dieselbe Notiz, nur aus der Übungsliste unter Daten statt aus dem Training */
INPUT_ACTIONS.exnoteset = INPUT_ACTIONS.exnoteinput;

document.addEventListener("input", function (ev) {
  var el = ev.target;
  var act = el.getAttribute ? el.getAttribute("data-act") : null;
  var fn = act ? INPUT_ACTIONS[act] : null;
  if (fn) fn(el, act);
  /* Das Backup-Textfeld hat kein data-act, es ist das einzige seiner Art und
     wird nur gelesen, siehe dataBackup(). */
  else if (el.id === "out") S.out = el.value;
});

document.addEventListener("change", function (ev) {
  var el = ev.target;
  var act = el.getAttribute ? el.getAttribute("data-act") : null;
  if (act === "newmuscleprimary") {
    var secondary = document.getElementById(el.getAttribute("data-target"));
    if (!secondary) return;
    secondary.disabled = !el.value;
    if (!el.value || secondary.value === el.value) secondary.value = "";
  }
  else if (act === "colorset") {
    S.colors[el.getAttribute("data-v")] = el.value;
    persist();
    render();
  }
  else if (act === "pedit" || act === "weekgoaledit") { persist(); }
  /* Kein render() beim Verlassen des Feldes. Es würde die Seite noch vor dem Klick
     neu aufbauen, der den Fokus genommen hat, und dieser Klick ginge verloren. */
  else if (act === "exnoteinput" || act === "exnoteset") { persist(); }
  else if (act === "stepset") {
    var sn = el.getAttribute("data-v"), sv = parseFloat(el.value);
    if (sn && sv > 0) {
      ownMeta(sn).step = sv;
      persist();
      render();
    }
  }
  else if (act === "exrestset") {
    var rn = el.getAttribute("data-v"), rv = parseInt(el.value, 10) || 0;
    if (rn) {
      /* 0 heißt "wie eingestellt". Sie wird gespeichert statt gelöscht, damit
         sie auch eine mitgelieferte Pause überdeckt, siehe exMeta(). */
      ownMeta(rn).rest = rv > 0 ? rv : 0;
      persist();
      render();
    }
  }
  else if (act === "muscleset") {
    var mn = el.getAttribute("data-v"), mf = el.getAttribute("data-f");
    if (!mn) return;
    var own = ownMeta(mn);
    own[mf === "primary" ? "musclePrimary" : "muscleSecondary"] = el.value;
    /* Sekundär leeren: ohne Primär ist es bedeutungslos, siehe muscleOf(), und
       gleich Primär zählte ein Satz mit 1,5 in diese eine Gruppe. */
    if (mf === "primary" &&
        (!el.value || el.value === own.muscleSecondary)) {
      own.muscleSecondary = "";
    }
    persist();
    render();
  }
});

/* Eingabetaste bestätigt das jeweilige Feld */
document.addEventListener("keydown", function (ev) {
  if (ev.key !== "Enter") return;
  var el = ev.target, id = el ? el.id : "";
  var act = "";
  if (id === "newName") act = "addex";
  else if (id === "dataNewName") act = "addexdata";
  else if (id === "newPlan") act = "addplan";
  else if (id === "in-reps" || id === "in-weight" || id === "in-rpe") {
    act = S.editId ? "update" : "save";
  }
  /* Enter im Notizfeld schließt es nur, gespeichert ist der Text längst */
  else if (id === "exNote" || id === "cnote-in") {
    ev.preventDefault();
    el.blur();
    if (id === "exNote") S.exNoteFor = "";
    persist();
    render();
    return;
  }
  else if (id === "ren-name") {
    ev.preventDefault();
    el.blur();
    var rbtn = document.querySelector('[data-act="rendo"]');
    if (rbtn) rbtn.click();
    return;
  }
  if (!act) return;
  ev.preventDefault();
  el.blur();
  var btn = document.querySelector('[data-act="' + act + '"]');
  if (btn) btn.click();
});

/* Zahl beim Antippen markieren, damit sie direkt überschrieben wird */
var selPending = null;
function selectAll(el) { try { el.select(); } catch (e) {} }
document.addEventListener("focusin", function (ev) {
  var el = ev.target;
  if (!el || el.tagName !== "INPUT" || !el.parentNode ||
      el.parentNode.className !== "val") { selPending = null; return; }
  selPending = el;
  setTimeout(function () { if (selPending === el) selectAll(el); }, 0);
});
function finishSelect(ev) {
  if (!selPending || ev.target !== selPending) return;
  var el = selPending;
  selPending = null;
  ev.preventDefault();
  selectAll(el);
}
document.addEventListener("mouseup", finishSelect, true);

/* Letztes Netz: ein Abbruch hier hieße weiße Seite statt App und kein Weg mehr
   an die eigenen Daten oder das Backup. Deshalb mit dem starten, was gelesen
   werden konnte, und offen sagen, dass etwas fehlen kann. Automatisch
   gespeichert wird nichts, erst der nächste bewusste Eingriff überschreibt den
   Stand. */
try {
  load();
} catch (e) {
  S.note = "Die gespeicherten Daten konnten nicht vollständig gelesen werden (" +
    (e && e.message ? e.message : "unbekannter Fehler") +
    "). Sichere unter Daten sofort ein Backup, bevor du etwas änderst.";
}
/* Reiter aus einem Shortcut und die Markierung des Teilen-Wegs stehen in der
   Adresse und müssen vor dem ersten Aufbau gelesen sein. */
var sharedFlag = startParams();
/* Nach startParams(), damit ein Reiter aus der Adresse das letzte Wort behält
   und der History-Eintrag des Fokus-Modus nicht gleich wieder überschrieben
   wird. */
restoreSession();
/* Kommt eine Ebene nach dem Neuladen nicht zurück, etwa der Fokus-Modus ohne
   seinen Plan, bleibt ihr History-Eintrag trotzdem liegen. Ohne namenlosen
   Platz dafür bekäme die nächste Ebene dieselbe Tiefe, und ihre erste
   Zurück-Geste liefe ins Leere. */
while (navStack.length < navDepth()) navStack.push("");
/* Nur wenn die Sitzung weder Plan noch Übung zurückbrachte. Ein leerer Plan
   allein reicht nicht: wer den Plan abgewählt und eine Übung samt Werten
   eingestellt hat, bekäme sonst über selectPlan() Übung, Werte und
   Aufwärmzustand überschrieben. */
if (!S.plan && !S.exercise) preselectPlan();
restoreRest();
S.pwa.standalone = standalone();
render();
takeSharedBackup(sharedFlag);
refreshStorage(rerenderData);
</script>
