function blockHits(block, goalSets, reps) {
  return !!block && block.sets.length >= goalSets &&
    block.sets.every(function (s) { return s.reps >= reps; });
}
function sameBlockWeight(a, b) {
  return !!a && !!b && Math.abs(a.weight - b.weight) < 0.001;
}

/* Konservative Progression. Ein Gewichtssprung braucht zwei erfolgreiche
   Einheiten in Folge am selben maßgeblichen Arbeitsgewicht, ohne Range
   zusätzlich eine Baseline davor; die RPE-Regel betrachtet beide. In der Range
   kommt nach einer vollständigen Einheit eine Wiederholung dazu. */
function suggestFor(name) {
  var t = planTarget(name), step = stepOf(name);
  /* Stehen heute schon Sätze, wird die Einheit mit demselben Gewicht fortgesetzt.
     Gesteigert wird erst beim nächsten Training. */
  var run = lastSession(name, null);
  if (run && run.day === S.date) {
    var rs = run.sets[run.sets.length - 1];
    return { reps:rs.reps, weight:rs.weight, rpe:rs.rpe, up:false };
  }
  var ls = lastSession(name, S.date);
  if (!ls) {
    if (t) return { reps:t.reps, weight:t.weight, rpe:null, up:false };
    var initial = exStart(name);
    return {
      reps: initial.reps > 0 ? initial.reps : defaultReps(),
      weight: initial.weight >= 0 ? initial.weight : defaultWeight(),
      rpe: null,
      up: false
    };
  }
  var goalSets = t && t.sets > 0 ? t.sets : ls.sets.length;
  var block = mainWorkBlock(ls, goalSets, t ? t.weight : NaN);
  if (!block) return null;
  var lastSet = block.last, w = block.weight;
  var goalReps = t ? t.reps : block.low;
  /* Eine Deload- oder abgebrochene Einheit unterhalb des Planziels darf keine
     Progression von diesem niedrigeren Gewicht auslösen. */
  if (t && w < t.weight - 0.001) {
    return { reps:t.reps, weight:t.weight, rpe:lastSet.rpe, up:false };
  }
  /* Schwelle für mehr Gewicht: mit Range ihr oberer Rand. */
  var rng = repRange(name, w);
  var reqReps = rng ? rng.hi : goalReps;
  var hit = blockHits(block, goalSets, reqReps);
  var avg = block.avg;
  var base = { reps:lastSet.reps, weight:w, rpe:lastSet.rpe, up:false };
  if (!S.settings.autoProgress) return base;
  /* Bindend ist die kleinste Rep-Zahl, weil alle Zielsätze den Wert erreichen
     müssen, nicht nur der letzte. */
  var low = block.low;

  if (!hit) return suggestWithinRange(name, base, block, rng, goalSets, goalReps);

  var prev = lastSession(name, ls.day);
  var prevBlock = mainWorkBlock(prev, goalSets, w);
  var prevHit = sameBlockWeight(block, prevBlock) && blockHits(prevBlock, goalSets, reqReps);
  var baseline = prev ? lastSession(name, prev.day) : null;
  var baselineBlock = mainWorkBlock(baseline, goalSets, w);
  var baselineSeen = sameBlockWeight(block, baselineBlock);
  var confirmed = prevHit && (rng || baselineSeen);
  var hardRpe = (avg != null && avg >= 9) ||
    (prevBlock && prevBlock.avg != null && prevBlock.avg >= 9);
  if (!confirmed || hardRpe) {
    base.reps = rng ? Math.min(rng.hi, Math.max(rng.lo, low)) : goalReps;
    return base;
  }
  /* Zwei Schrittweiten nur, wenn ein Schritt im Verhältnis zum Gewicht klein
     ist. Dieselbe Rechnung wie in repFirstOn(), aber ohne dessen Schalter; !rng
     allein genügt nicht, denn auch eine Übung ohne Planeintrag hat keine Range,
     egal wie groß ihr Schritt ist. */
  var bothStrong = avg != null && avg <= 7 && prevBlock.avg != null && prevBlock.avg <= 7;
  var bigStep = !(w > 0) || step / w > S.settings.repFirstThresh;
  var mult = (!rng && bothStrong && !bigStep) ? 2 : 1;
  var confirmRpes = block.rpes.concat(prevBlock.rpes);
  var confirmAvg = confirmRpes.length
    ? confirmRpes.reduce(function (a,b) { return a+b; }, 0) / confirmRpes.length : null;
  return {
    reps: rng ? rng.lo : goalReps,
    weight: Math.round((w + step * mult) * 100) / 100,
    rpe: lastSet.rpe,
    up: true,
    why: rng
      ? "+" + num(step) + " kg, " + goalSets + "x " + rng.hi +
        " in 2 Einheiten bestätigt" +
        (confirmAvg != null ? " @ RPE " + num(confirmAvg) : "") + " – zurück auf " + rng.lo
      : "+" + num(step * mult) + " kg, " + goalSets + "x " + goalReps +
        " in 2 Einheiten bestätigt" +
        (confirmAvg != null ? " @ RPE " + num(confirmAvg) : "")
  };
}
/* Die letzte Einheit hat den oberen Rand (ohne Range: das Planziel) nicht
   erreicht: die Wiederholungen klettern, das Gewicht bleibt. base bringt
   Gewicht, letzte Reps und RPE der Einheit mit und wird hier ergänzt. */
function suggestWithinRange(name, base, block, rng, goalSets, goalReps) {
  var low = block.low, avg = block.avg;
  /* Ohne Range ist das Planziel der Rand. */
  if (!rng) {
    if (block.complete && low < goalReps) return suggestBelowRange(name, base, block, null, goalSets, goalReps);
    base.reps = goalReps;
    return base;
  }
  if (block.complete && low < rng.lo) return suggestBelowRange(name, base, block, rng, goalSets, goalReps);
  /* Nah am Muskelversagen kommt keine Wiederholung obendrauf, dieselbe Grenze
     wie beim Gewicht in suggestFor(). */
  if (avg != null && avg >= 9) {
    base.reps = Math.min(rng.hi, Math.max(rng.lo, low));
    return base;
  }
  /* Weniger Sätze als das Ziel, etwa nach einem Abbruch: nicht weiterklettern,
     die schwächste Zahl bleibt, mindestens der untere Rand. */
  if (!block.complete) {
    base.reps = Math.min(rng.hi, Math.max(rng.lo, low));
    return base;
  }
  base.reps = Math.min(rng.hi, low + 1);
  if (low < rng.hi) {
    /* Die Begründung nennt ausdrücklich den schwächsten Satz, denn er bindet.
       "Letztes Top Set" darüber zeigt den besten, ohne den Zusatz widersprächen
       sich beide Zahlen. */
    base.up = true;
    base.why = "+1 Rep, schwächster Satz " + low + "x" +
      (block.lowRpe != null ? " @ RPE " + num(block.lowRpe) : "");
  }
  return base;
}
/* Vollständige Einheit, deren schwächster Satz unter dem unteren Rand liegt
   (ohne Range: unter dem Planziel). Die erste bringt nur einen Hinweis mit dem
   unteren Rand als Ziel. Die zweite in Folge am selben Gewicht bringt eine
   Schrittweite weniger zum Annehmen oder Verwerfen, sofern jede davon
   ausbelastet war (RPE ab 8 oder ohne Angabe). Herleitung und Quellen (APRE,
   Plotkin u.a. 2022) siehe README, Vorschlag unterhalb der Range. */
function suggestBelowRange(name, base, block, rng, goalSets, goalReps) {
  var step = stepOf(name);
  var lo = rng ? rng.lo : goalReps;
  var target = rng ? "ab " + lo : String(lo);
  var streak = missStreak(name, goalSets, block.weight, lo);
  var lowNote = "schwächster Satz " + block.low + "x" +
    (block.lowRpe != null ? " @ RPE " + num(block.lowRpe) : "");
  base.reps = lo;
  if (streak.n >= 2 && streak.hard && block.weight - step > 0) {
    base.weight = Math.round((block.weight - step) * 100) / 100;
    base.up = true;
    base.why = "-" + num(step) + " kg, " + (rng ? "Range ab " + lo : "Ziel " + lo + "x") +
      " in " + streak.n + " Einheiten verfehlt, " + lowNote;
    return base;
  }
  base.hint = lowNote + ", Ziel " + target + "x";
  return base;
}
/* Verfehlte Einheiten am Gewicht w in Folge, die jüngste zuerst. hard heißt:
   jede davon war ausbelastet, RPE ab 8 oder ohne Angabe. */
function missStreak(name, goalSets, w, lo) {
  var n = 0, hard = true;
  var days = lastDaysOf(name, S.date, 6);
  for (var i = 0; i < days.length; i++) {
    var b = mainWorkBlock(days[i], goalSets, w);
    if (!b || !b.complete || Math.abs(b.weight - w) > 0.001 || b.low >= lo) break;
    n += 1;
    if (b.avg != null && b.avg < 8) hard = false;
  }
  return { n:n, hard:hard };
}
/* Auch der RPE kommt zurück: Aufwärmsätze führen keinen, nach dem letzten
   Rampensatz soll wieder der Zielwert dastehen. */
function backToWork() {
  if (S.warmBase > 0) S.weight = comma(S.warmBase);
  if (S.warmReps) S.reps = S.warmReps;
  if (S.warmRpe) S.rpe = S.warmRpe;
  clearWarm();
  repWinCenter = null;
}
/* Merkt sich den Arbeitssatz, zu dem backToWork() zurückkehrt. Die vier Felder
   gehören zusammen und werden nur hier, in clearWarm() und beim Neustart in
   restoreWarm() geschrieben. */
function enterWarm(base) {
  if (S.warm) return;
  S.warmBase = base;
  S.warmReps = S.reps;
  S.warmRpe = S.rpe;
  S.warm = true;
}
function clearWarm() {
  S.warm = false;
  S.warmBase = 0;
  S.warmReps = "";
  S.warmRpe = "";
}
function applySuggestion(name) {
  clearWarm();
  repWinCenter = null;
  /* Der Merker gilt nur, solange heute noch kein Arbeitssatz dieser Übung
     steht. Danach setzt suggestFor() mit dem heute gelaufenen Gewicht fort;
     sonst spränge das Feld beim Zurückwechseln auf den angenommenen Vorschlag,
     und der nächste Satz landete mit falschem Gewicht im Log. */
  var handled = S.suggestionHandled[S.date + "\n" + name];
  if (handled && !doneSets(name, S.date)) {
    S.reps = String(handled.reps);
    S.weight = comma(handled.weight);
    if (handled.rpe != null) S.rpe = comma(handled.rpe);
    S.source = "";
    return;
  }
  var s = suggestFor(name);
  if (!s) { S.source = ""; return; }
  S.reps = String(s.reps);
  S.weight = comma(s.weight);
  if (s.rpe != null) S.rpe = comma(s.rpe);
  S.source = s.up ? s.why : "";
}
function suggestionBlock() {
  if (!S.source) return hintBlock();
  var t = planTarget(S.exercise), w = deci(S.weight), r = parseInt(S.reps, 10);
  var prior = t;
  if (!prior) {
    var priorRun = lastSession(S.exercise, S.date);
    prior = mainWorkBlock(priorRun, priorRun ? priorRun.sets.length : 1, NaN);
  }
  var weightChanged = prior && isFinite(w) && Math.abs(w - prior.weight) > 0.001;
  var down = weightChanged && w < prior.weight;
  var label = weightChanged ? num(w) + " kg" : r + " Reps";
  return '<div class="suggestion">' + svg(down ? "trendab" : "trend", 17) +
    '<div class="suggestion-copy"><b>Vorschlag: ' + esc(label) + '</b>' +
    '<span>' + esc(S.source) + '</span></div>' +
    '<div class="suggestion-actions">' +
    '<button class="accept" data-act="suggestaccept">' + svg("haken", 13) +
    'Annehmen</button>' +
    '<button data-act="suggestreject">' + svg("kreuz", 13) + 'Verwerfen</button>' +
    '</div></div>';
}
/* Der Hinweis wird beim Aufbau aus dem Vorschlag gelesen statt in S abgelegt:
   er betrifft die letzte Einheit, nicht die Eingabefelder, und muss so weder
   beim Tippen gelöscht noch je Tag gemerkt werden. Nach dem ersten Satz des
   Tages liefert suggestFor() keinen mehr. */
function hintBlock() {
  if (!S.exercise) return "";
  var s = suggestFor(S.exercise);
  if (!s || !s.hint) return "";
  return '<div class="suggestion hint">' + svg("info", 17) +
    '<div class="suggestion-copy"><b>Zurück in die Range</b>' +
    '<span>' + esc(s.hint) + '</span></div></div>';
}
function planItems() {
  return (S.plan && S.plans[S.plan]) || [];
}
function planIndex() {
  if (!S.exercise) return -1;
  var list = planItems();
  for (var i = 0; i < list.length; i++) { if (list[i].name === S.exercise) return i; }
  return -1;
}
function nextPlanOpen() {
  var list = planItems();
  for (var i = 0; i < list.length; i++) {
    if (doneSets(list[i].name, S.date) < itemSets(list[i])) return list[i];
  }
  return null;
}
function planAllDone() {
  return planItems().length > 0 && !nextPlanOpen();
}
function openPlanCount() {
  return planItems().filter(function (i) {
    return doneSets(i.name, S.date) < itemSets(i);
  }).length;
}
function backupDue() {
  if (!S.entries.length) return null;
  if (!S.meta.lastBackup) return "Es gibt noch kein Backup deiner Sätze.";
  var days = Math.floor((Date.now() - Date.parse(S.meta.lastBackup)) / 86400000);
  var since = {};
  S.entries.forEach(function (e) {
    if (e.ts > Date.parse(S.meta.lastBackup)) since[e.date] = 1;
  });
  var n = Object.keys(since).length;
  if (n >= 3) return n + " Trainings seit dem letzten Backup.";
  if (days > 7) return "Letztes Backup vor " + days + " Tagen.";
  return null;
}

/* ---------- Pausentimer ---------- */
var restInterval = null;

/* Bildschirm während der Pause wachhalten, damit der Browser den Tab nicht
   einfriert und das Signal pünktlich kommt. */
var wakeLock = null, wakeWanted = false;
function wakeOn() {
  wakeWanted = true;
  if (wakeLock || document.hidden) return;
  if (!navigator.wakeLock || !navigator.wakeLock.request) return;
  try {
    navigator.wakeLock.request("screen").then(function (w) {
      if (!wakeWanted) { try { w.release(); } catch (e) {} return; }
      wakeLock = w;
      w.addEventListener("release", function () { wakeLock = null; });
    }, function () {});
  } catch (e) {}
}
function wakeOff() {
  wakeWanted = false;
  var w = wakeLock;
  wakeLock = null;
  if (w) { try { w.release(); } catch (e) {} }
}
function saveRest() { storeKey(REST_KEY, { end:S.restEnd, total:S.restTotal }); }
function restTick() {
  if (!restInterval) restInterval = setInterval(tickRest, 300);
}
function startRest(sec) {
  /* Hier läuft noch ein Tipp nach, deshalb ist das die Stelle, an der sich der
     Tonkanal öffnen lässt. Siehe audioOn(). */
  audioOn();
  S.restEnd = Date.now() + sec * 1000;
  S.restTotal = sec;
  restSignals = 0;
  restSignalAt = 0;
  saveRest();
  restTick();
  wakeOn();
  renderRest();
}
function addRest(sec) {
  if (!S.restEnd) return;
  /* Nicht über REST_MAX hinaus, gerechnet auf der Gesamtlänge statt der
     Restzeit, sonst hinge das Ergebnis davon ab, wann in der Pause getippt
     wird. Die Prüfung steht vor vibeStop(): an der Grenze verstummte sonst nur
     das Signal, und das läse sich als "Pause verlängert". */
  sec = Math.min(sec, REST_MAX - S.restTotal);
  if (sec <= 0) return;
  /* Läuft gerade das lange Muster, endet es hier: die Pause geht ja weiter. */
  vibeStop();
  S.restEnd += sec * 1000;
  S.restTotal += sec;
  var over = S.restEnd <= Date.now();
  restSignals = over ? REST_SIGNAL_MAX : 0;
  restSignalAt = 0;
  saveRest();
  restTick();
  if (!over) wakeOn();
  renderRest();
}
function stopRest() {
  S.restEnd = 0;
  vibeStop();
  clearRestNotification();
  dropKey(REST_KEY);
  if (restInterval) { clearInterval(restInterval); restInterval = null; }
  wakeOff();
  renderRest();
}
function restoreRest() {
  var r = readJson(REST_KEY, null);
  if (!r || !r.end) return;
  if (r.end <= Date.now() - 120000) { dropKey(REST_KEY); return; }
  S.restEnd = r.end;
  S.restTotal = r.total || S.settings.rest;
  /* War die Pause während der Abwesenheit schon vorbei, wird nicht nachträglich gepiepst */
  restSignals = r.end <= Date.now() ? REST_SIGNAL_MAX : 0;
  restSignalAt = 0;
  restTick();
  if (restSignals < REST_SIGNAL_MAX) wakeOn();
}
document.addEventListener("visibilitychange", function () {
  /* Beim Sperren oder Wegwischen mitten in der Pause kommt sie sofort auf den
     Sperrbildschirm: das ist der einzige Moment, in dem eine Meldung noch
     sicher hinauskommt, bevor das System die Seite anhält. */
  if (document.hidden) { notifyRestRunning(); return; }
  /* Der Bildschirmwächter fällt beim Wegwischen weg und wird hier neu angefordert */
  if (S.restEnd && wakeWanted) wakeOn();
  if (S.restEnd) tickRest();
  clearRestNotification();
});

var REST_SIGNAL_MAX = 3, REST_SIGNAL_GAP = 5000;
var restSignals = 0, restSignalAt = 0;
function tickRest() {
  var now = Date.now();
  var left = Math.round((S.restEnd - now) / 1000);
  if (left <= 0 && restSignals < REST_SIGNAL_MAX && now - restSignalAt >= REST_SIGNAL_GAP) {
    restSignals += 1;
    restSignalAt = now;
    signal(restSignals === 1);
    if (restSignals >= REST_SIGNAL_MAX) wakeOff();
  }
  if (left < -120) { stopRest(); return; }
  renderRest();
}
function renderRest() {
  var el = document.getElementById("restbar");
  /* Solange Pause ist, reservieren beide Fußzeilen Platz, sonst verdeckt der
     fest stehende Balken den Speichern-Knopf. Das sitzt hier und nicht in
     render(), weil restplus und reststop ohne Neuaufbau laufen. */
  var feet = [document.querySelector(".fx-foot"), document.querySelector(".savearea.main")];
  if (!S.restEnd) {
    el.innerHTML = "";
    feet.forEach(function (f) { if (f) f.classList.remove("resting"); });
    return;
  }
  feet.forEach(function (f) { if (f) f.classList.add("resting"); });
  var left = Math.round((S.restEnd - Date.now()) / 1000);
  var total = S.restTotal || S.settings.rest || 90;
  var pct = Math.max(0, Math.min(100, Math.round(left / total * 100)));
  el.innerHTML = '<div class="restbar' + (left <= 0 ? " over" : "") + '">' +
    '<div class="line"><div class="t">' + mmss(left) + '</div>' +
    '<div class="lbl">' + (left > 0 ? "Pause läuft" : "Pause vorbei") + '</div>' +
    '<button data-act="restplus" style="margin-left:auto">+15 s</button>' +
    '<button data-act="reststop">Fertig</button></div>' +
    '<div class="track"><i style="width:' + pct + '%"></i></div></div>';
}
/* Ton und Vibration auch im Hintergrund versuchen: die Vibration bricht der
   Browser bei versteckter Seite zwar ab, ein schon laufender AudioContext
   spielt aber weiter, siehe audioOn(). Die Benachrichtigung kommt nur dazu,
   wenn niemand hinsieht, im Vordergrund steht der Pausenbalken. Siehe README,
   Signal am Ende der Pause. */
function signal(first) {
  buzz(first);
  beep();
  if (document.hidden) notifyRestOver();
}

/* Vom ersten bis zum dritten Signal durchgehend, rund zehn Sekunden, für das
   Handy in der Hosentasche, wo ein kurzer Doppelschlag untergeht. */
function vibeLongPattern() {
  /* Eine Sekunde Zugabe, damit es nicht kurz vor dem dritten Signal aufhört. */
  var total = 2 * REST_SIGNAL_GAP + 1000, out = [];
  for (var t = 0; t < total; t += 900) out.push(600, 300);
  return out;
}
function buzz(first) {
  try {
    if (!navigator.vibrate) return;
    /* Nur beim ersten Signal starten. Jeder weitere Aufruf setzte das Muster
       zurück, und die Vibration liefe über das dritte Signal hinaus. */
    if (first) navigator.vibrate(vibeLongPattern());
  } catch (e) {}
}
function vibeStop() {
  try { if (navigator.vibrate) navigator.vibrate(0); } catch (e) {}
}
/* Ein AudioContext für die ganze Sitzung, angelegt beim Start der Pause und
   damit aus einem Tipp heraus. Ein erst bei versteckter Seite angelegter
   Kontext startet angehalten, lässt sich ohne neue Nutzeraktion nicht mehr
   starten, und der Ton bleibt ohne jeden Fehler aus. */
var audio = null;
function audioOn() {
  try {
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    if (!audio) audio = new Ctx();
    if (audio.state === "suspended" && audio.resume) audio.resume();
  } catch (e) { audio = null; }
}
function beep() {
  audioOn();
  var ctx = audio;
  if (!ctx) return;
  try {
    [0, 0.28].forEach(function (off) {
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "sine"; o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, ctx.currentTime + off);
      g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + off + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + off + 0.22);
      o.connect(g); g.connect(ctx.destination);
      o.start(ctx.currentTime + off); o.stop(ctx.currentTime + off + 0.24);
    });
  } catch (e) {}
}

/* ---------- Signal bei ausgeschaltetem Bildschirm ---------- */
function notifyState() {
  if (typeof Notification === "undefined" || !("serviceWorker" in navigator)) {
    return "unsupported";
  }
  return Notification.permission;
}
function notifyReady() {
  return S.settings.notifySignal && notifyState() === "granted" &&
    !!swReg && !!swReg.showNotification;
}
/* Ein tag für alle Pausenmeldungen: die bis zu drei Signale erneuern eine
   Meldung, statt drei zu stapeln, und "Pause vorbei" ersetzt "Pause bis".
   renotify sorgt dafür, dass die Erneuerung nicht stillschweigend passiert. */
var REST_TAG = "rest";
/* vibrate wirkt nur auf älteren Android-Fassungen und am Rechner. Ab Android 8
   entscheidet der Benachrichtigungskanal über Ton, Vibration und Wecken,
   vibrate und silent werden ignoriert; einstellen lässt sich das nur in den
   Android-Einstellungen der App. */
function notifyRestOver() {
  if (!notifyReady()) return false;
  try {
    swReg.showNotification("Pause vorbei", {
      body: S.exercise ? S.exercise + ", Satz " + nextSet() : "Weiter geht es.",
      tag: REST_TAG,
      renotify: true,
      icon: "icons/icon-192.png",
      vibrate: [220,120,220]
    });
    return true;
  } catch (e) { return false; }
}
/* Kein Countdown: eine Aktualisierung je Sekunde bräuchte laufenden Code im
   Hintergrund, und den drosselt das System. Deshalb die Uhrzeit des Endes. Ohne
   renotify, sonst klingelte es beim Sperren. Eine schon abgelaufene Pause
   meldet tickRest(). */
function notifyRestRunning() {
  if (!S.restEnd || S.restEnd <= Date.now() || !notifyReady()) return false;
  var d = new Date(S.restEnd);
  var hm = (d.getHours() < 10 ? "0" : "") + d.getHours() + ":" +
    (d.getMinutes() < 10 ? "0" : "") + d.getMinutes();
  try {
    swReg.showNotification("Pause bis " + hm, {
      body: S.exercise ? "Dann " + S.exercise + ", Satz " + nextSet() : "Dann geht es weiter.",
      tag: REST_TAG,
      silent: true,
      icon: "icons/icon-192.png"
    });
    return true;
  } catch (e) { return false; }
}
/* Beim Zurückkommen und beim Beenden der Pause wegräumen. Sonst klebt "Pause
   vorbei" noch im Schacht, während längst der nächste Satz läuft. */
function clearRestNotification() {
  if (!swReg || !swReg.getNotifications) return;
  try {
    var p = swReg.getNotifications({ tag:REST_TAG });
    if (p && p.then) {
      p.then(function (list) {
        list.forEach(function (n) { try { n.close(); } catch (e) {} });
      }, function () {});
    }

}
/* Die Nachfrage braucht auf Android eine Nutzeraktion und hängt deshalb an
   einem Knopf unter Daten, nicht am Start. Nach einer Ablehnung fragt Chrome
   nicht von selbst erneut, darum nur im Zustand "default". */
function askNotify() {
  if (notifyState() !== "default") return;

  try {
    var p = Notification.requestPermission(done);
    if (p && p.then) p.then(done, function () {});
  } catch (e) {}
}

/* ---------- Als App auf dem Gerät ---------- */
/* Alles hier braucht Manifest und ServiceWorker. Fehlt eine Fähigkeit, fällt
   der Teil still aus und die App bleibt eine gewöhnliche Seite. */

/* Ohne diese Zusage darf der Browser den localStorage bei knappem Platz
   wegräumen, und dort liegen die einzigen Trainingsdaten. Kein Knopf nötig:
   einer installierten App sagt Chrome sie in der Regel ohne Nachfrage zu. */
function refreshStorage(after) {
  if (!navigator.storage || !navigator.storage.persisted) return;
  var done = function () { if (after) after(); };
  navigator.storage.persisted().then(function (p) {
    if (p || !navigator.storage.persist) { S.pwa.persisted = !!p; done(); return; }
    navigator.storage.persist().then(function (ok) {
      S.pwa.persisted = !!ok;
      done();
    }, done);
  }, done);
}
function rerenderData() {
  if (S.view === "daten" && !S.focus && !S.showSummary) render();
}
function byteSize(n) {
  if (!n) return "0 kB";
  if (n >= 1048576) return num(Math.round(n / 1048576 * 10) / 10) + " MB";
  return Math.max(1, Math.round(n / 1024)) + " kB";
}
/* Gerechnet statt geschätzt: der eingerückte Export ist deutlich größer als
   dieselben Daten im localStorage, und navigator.storage.estimate() zählt die
   offline abgelegte App mit. Gemerkt, weil der Daten-Reiter bei jedem Tipp neu
   aufgebaut wird und das Backup über Jahre einige Megabyte groß wird. */
var backupBytes = -1;
function backupSize() {
  if (backupBytes >= 0) return backupBytes;
  var t = backupText();
  try { backupBytes = new Blob([t]).size; } catch (e) { backupBytes = t.length; }
  return backupBytes;
}
function protectLine() {
  if (S.pwa.persisted === true) return "Vor automatischem Aufräumen geschützt.";
  if (S.pwa.persisted === false) {
    return "Nicht geschützt: wird der Platz auf dem Gerät knapp, darf der Browser " +
      "diese Daten löschen.";
  }
  return "Der Schutz vor automatischem Aufräumen wird noch geprüft.";
}

/* Zurück-Geste. Im installierten Fenster schließt sie ohne eigenen
   History-Eintrag sofort die ganze App, auch mitten im Fokus-Modus. Deshalb
   bekommt jede Ansicht, die man verlassen können soll, einen Eintrag; schließt
   die App sie selbst, räumt history.go() ihn ab, damit Stapel und Verlauf nicht
   auseinanderlaufen. */
var navStack = [];
function navDepth() {
  return (history.state && typeof history.state.hk === "number") ? history.state.hk : 0;
}
function navOpen(name) {
  if (navStack[navStack.length - 1] === name) return;
  try { history.pushState({ hk:navStack.length + 1 }, ""); } catch (e) { return; }
  navStack.push(name);
}
/* Eine Ebene nach dem Neuladen wieder anlegen. Ohne History-Eintrag schlösse die
   Zurück-Geste die App. Trägt der Eintrag nach dem Neuladen schon ein hk, wird
   nicht erneut gepusht, sonst bräuchte es zwei Gesten für eine Ebene; der
   Stapel wird nur auf diese Tiefe gebracht. Die Ebenen darunter sind unbekannt
   und bleiben namenlos, navCloseTop() nimmt sie kommentarlos ab. */
function navResume(name) {
  var hk = navDepth();
  if (!(hk > 0)) { navOpen(name); return; }
  navStack.length = 0;
  while (navStack.length < hk - 1) navStack.push("");
  navStack.push(name);
}
/* Ebene ersetzen, ohne die Tiefe zu ändern: aus der Zusammenfassung soll zurück
   auf die normale Ansicht führen, nicht in den Fokus-Modus, aus dem sie kam. */
function navSwap(name) {
  if (!navStack.length) { navOpen(name); return; }
  navStack[navStack.length - 1] = name;
}
function navBack(name) {
  var i = navStack.lastIndexOf(name);
  if (i < 0) return;
  var steps = navStack.length - i;
  /* Erst den Stapel kürzen, dann zurückgehen: das popstate, das gleich
     eintrifft, findet nichts mehr zu schließen und macht nichts doppelt. */
  navStack.length = i;
  try { history.go(-steps); } catch (e) {}
}
function navCloseTop() {
  var name = navStack.pop();
  if (name === "focus") {
    clearQuickUndo();
    S.focus = false;
    S.focusEndConfirm = false;
  } else if (name === "summary") {
    S.showSummary = false;
    S.summaryData = null;
    if (S.summaryReturn) { S.view = S.summaryReturn; S.summaryReturn = ""; }
  } else if (name === "openex") {
    S.openEx = "";
  } else if (name === "weekovr") {
    S.weekOverview = false;
  }
}
/* Die Wochenübersicht hat einen History-Eintrag. Deshalb überall hier schließen
   und nicht S.weekOverview von Hand zurücksetzen, sonst bleibt der Eintrag
   liegen. */
function closeWeekOverview() {
  if (!S.weekOverview) return;
  navBack("weekovr");
  S.weekOverview = false;
}
window.addEventListener("popstate", function () {
  var d = navDepth();
  if (navStack.length <= d) return;
  while (navStack.length > d) navCloseTop();
  render();
});

/* ServiceWorker für Offline-Betrieb, Installation und Update-Hinweis. Scheitert
   die Anmeldung, bleibt die App eine gewöhnliche Seite, deshalb still abfangen
   statt melden. */
var swReg = null, swReloading = false;
function markUpdateReady() {
  if (S.pwa.updateReady) return;
  S.pwa.updateReady = true;
  /* Im Fokus-Modus und in der Zusammenfassung bleibt es still, dort steht die
     Hinweiszeile nicht und ein Neuaufbau wäre mitten im Satz nur im Weg. */
  if (!S.focus && !S.showSummary) render();
}
function swWatch(reg) {

  reg.addEventListener("updatefound", function () {
    var w = reg.installing;

    w.addEventListener("statechange", function () {
      /* "installed" bei bereits laufendem Worker heißt: die neue Fassung liegt
         vollständig im Cache und wartet. Ohne controller wäre es die allererste
         Installation, da gibt es nichts zu melden. */
      if (w.state === "installed" && navigator.serviceWorker.controller) markUpdateReady();
    });
  });
}
function applyUpdate() {
  var w = swReg && swReg.waiting;

  swReloading = true;
  try { w.postMessage({ type:"skipWaiting" }); } catch (e) { location.reload(); }
}
/* Die Versionsnummer steht auch in sw.js und bestimmt dort den Namen des
   Caches. Der Worker nennt auf Nachfrage seine, damit die App keine Fassung
   anzeigt, die nicht zu den zwischengespeicherten Dateien gehört. */
function swAskVersion() {
  var sw = navigator.serviceWorker && navigator.serviceWorker.controller;
  if (!sw || typeof MessageChannel !== "function") return;

    var ch = new MessageChannel();

      var d = ev.data || {};

  } catch (e) {}
}
function versionLine() {
  var v = "Fassung " + APP_VERSION;
  if (!("serviceWorker" in navigator)) return v + ", kein Offline-Betrieb.";
  if (!S.pwa.swVersion) return v + ", noch nicht offline gespeichert.";
  if (S.pwa.swVersion !== APP_VERSION) {
    return v + ", offline liegt aber noch " + S.pwa.swVersion + ".";
  }
  return v + ", offline gespeichert.";
}

/* Chrome meldet, sobald die Installation möglich wäre, und lässt das Ereignis
   aufheben. Ohne das bleibt nur das Chrome-Menü, und das findet kaum jemand. */
var installPrompt = null;
window.addEventListener("beforeinstallprompt", function (ev) {
  ev.preventDefault();
  installPrompt = ev;
  S.pwa.installable = true;
  rerenderData();
});
window.addEventListener("appinstalled", function () {
  installPrompt = null;
  S.pwa.installable = false;
  S.pwa.standalone = true;
  S.note = "HantelKladde ist jetzt als eigene App installiert.";
  render();
});
function runInstall() {
  var p = installPrompt;
  if (!p) return;
  /* Das Ereignis lässt sich nur einmal verwenden. Wird die Nachfrage
     weggewischt, meldet Chrome es später von selbst wieder an. */
  installPrompt = null;
  S.pwa.installable = false;
  try {
    p.prompt();
    if (p.userChoice) p.userChoice.then(function () {}, function () {});
  } catch (e) {}
}
function standalone() {
  try {
    if (!window.matchMedia) return false;
    return window.matchMedia("(display-mode: standalone)").matches ||
      window.matchMedia("(display-mode: fullscreen)").matches ||
      window.matchMedia("(display-mode: minimal-ui)").matches;
  } catch (e) { return false; }
}

/* Start-Adresse: die Shortcuts im Manifest hängen ?tab= an, der Teilen-Weg in
   sw.js ?geteilt=. Danach wird die Adresse aufgeräumt, sonst steht die
   Markierung beim nächsten Start wieder da. */
function queryParam(name) {
  var m = new RegExp("[?&]" + name + "=([^&]*)").exec(location.search || "");
  return m ? decodeURIComponent(m[1].replace(/\+/g, " ")) : "";
}
/* Gibt die Adresse den Reiter vor, lässt restoreSession() Ansicht und
   Fokus-Modus in Ruhe: wer gezielt über einen Shortcut oder ein geteiltes
   Backup öffnet, will dorthin und nicht in den Fokus-Modus von vorhin. */
var startFromUrl = false;
function startParams() {
  var tab = queryParam("tab"), shared = queryParam("geteilt");
  if (["tag","plaene","planung","verlauf","daten"].indexOf(tab) >= 0) { S.view = tab; startFromUrl = true; }
  if (shared) { S.view = "daten"; startFromUrl = true; }
  /* Nur die Markierung entfernen, den Pfad nicht: wird die App unter index.html
     ausgeliefert, führte "./" auf das Verzeichnis, und ein Neuladen liefe ins
     Leere. */
  if (location.search) {
    try { history.replaceState(null, "", location.pathname); } catch (e) {}
  }

}
/* Ein aus einer anderen App geteiltes Backup. Der ServiceWorker hat es unter
   einer Adresse abgelegt, die es auf dem Server nicht gibt, und gibt es genau
   einmal heraus. Eingelesen wird wie ein geladenes Backup: ergänzen, nie
   überschreiben. */
function takeSharedBackup(shared) {
  if (!shared) return;
  if (shared !== "1") {
    S.note = "Aus der geteilten Nachricht kam keine Datei an.";
    return;
  }
  fetch("shared-backup").then(function (r) {
    if (!r.ok) throw new Error("nichts abgelegt");
    return r.text();
  }).then(function (text) {
    /* Leer heißt: schon eingelesen, etwa weil die Adresse mit der Markierung
       ein zweites Mal aufgerufen wurde. */
    if (!text) {
      S.note = "Das geteilte Backup wurde bereits eingelesen.";
      render();
      return;
    }
    var n = mergeBackup(text);
    S.note = n + " Sätze aus dem geteilten Backup ergänzt, " +
      S.entries.length + " insgesamt.";
    render();
  }).catch(function (e) {
    S.note = (e && e.message && e.message.indexOf("Backup ungültig:") === 0)
      ? e.message
      : "Das geteilte Backup konnte nicht gelesen werden.";
    render();
  });
}

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.addEventListener("controllerchange", function () {

    navigator.serviceWorker.register("sw.js").then(function (reg) {

}

/* ---------- Rendern ---------- */
function render() {

     Sätze nicht, danach gilt er nicht mehr, siehe entriesOn(). */

     Neuaufbau endet. */

      '<p class="ver">HantelKladde ' + APP_VERSION + '</p></div>';

}

/* Der gewählte Tag steht am rechten Rand des Streifens, siehe README,

/* Ein Feld, das nach dem Neuaufbau den Fokus bekommen soll, mit der Schreibmarke
   am Ende, etwa die Geräteeinstellung nach dem Aufklappen. */
function takeFocus() {
  if (!focusAfterRender) return;
  var el = document.getElementById(focusAfterRender);
  focusAfterRender = "";
  if (!el) return;
  el.focus();
  try { el.setSelectionRange(el.value.length, el.value.length); } catch (e) {}
}
var focusAfterRender = "";

/* Kurze Rückmeldung über dem Speichern-Knopf, die von selbst verschwindet,
   statt wie eine Meldungszeile stehenzubleiben, bis etwas anderes passiert. */
var toastTimer = null;
/* Läuft eine Einblendung aus, während ein Feld bearbeitet wird, nähme ein
   voller Neuaufbau den Fokus und schlösse auf Android die Tastatur. Dann
   verschwindet nur der betroffene Knoten. */
function inputFocused() {
  var a = document.activeElement;
  if (!a || !a.tagName) return false;
  var t = a.tagName;
  return t === "INPUT" || t === "TEXTAREA" || t === "SELECT";
}
function dropNode(sel) {
  var n = document.querySelector(sel);
  if (n && n.parentNode) n.parentNode.removeChild(n);
}
function showToast(msg) {

  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function () {
    toastTimer = null;
    S.toast = "";

}
/* Rückgängig-Knopf im Fokus-Modus für genau den eben gespeicherten Satz, über
   denselben S.undo wie das Löschen eines Satzes. */
var quickUndoTimer = null;
function showQuickUndo() {
  S.quickUndo = true;
  if (quickUndoTimer) clearTimeout(quickUndoTimer);
  var undoId = S.undo && S.undo.kind === "newset" && S.undo.item ? S.undo.item.id : "";
  quickUndoTimer = setTimeout(function () {
    quickUndoTimer = null;
    S.quickUndo = false;
    /* Nach Ablauf S.undo leeren: sonst tauchte die Aktion in der normalen
       Ansicht als vermeintlich gelöschter Satz wieder auf. */
    if (S.undo && S.undo.kind === "newset" && S.undo.item && S.undo.item.id === undoId) {
      S.undo = null;

function clearQuickUndo() {

function seg(id, label, icon) {

    id + '" aria-label="' + label + '" title="' + label + '"' +
    (S.view === id ? ' aria-current="page"' : "") + '>' + svg(icon, 21) + '</button>';

function planHidden(p) { return S.settings.hiddenPlans.indexOf(p) >= 0; }
/* Sperrt nur die Reihenfolge der Übungen, gegen versehentliches Umordnen. */
function planLocked(p) { return S.settings.lockedPlans.indexOf(p) >= 0; }
function visiblePlans() {
  return Object.keys(S.plans).filter(function (p) { return !planHidden(p); });
}
/* Ausgeblendete Pläne mit Ziel oder Historie bleiben in der Liste: sie fließen
   weiter in die Wochenziele-Quote und dürfen dort nicht unsichtbar
   mitzählen. */
function weekGoalPlans() {
  return Object.keys(S.plans).filter(function (p) {
    if (!planHidden(p) || weekGoal(p) > 0) return true;
    var log = S.settings.weekGoalLog[p];
    return !!(log && log.length);
  });
}
function planColor(p) {
  var own = safeColor(S.colors[p]);
  if (own) return own;
  if (DEFAULT_COLORS[p]) return DEFAULT_COLORS[p];
  var idx = Object.keys(S.plans).indexOf(p);
  return PALETTE[(idx < 0 ? 0 : idx) % PALETTE.length];
}
var MIN_DONE = 5;

/* Plantage: Neue Sätze tragen den beim Speichern aktiven Plan, und eine gültige
   Planangabe an einem Tag hat Vorrang vor jeder Ableitung aus überlappenden
   Übungen. Alte Sätze ohne plan-Feld werden weiter über ihre Übungen
   zugeordnet. */
/* Sätze nach Tag, einmal aufgebaut: lastPlanDay() ruft dayPlan() für jeden
   Trainingstag auf, ohne Index kostete das bei 7.500 Sätzen 274 ms je Plan und
   Neuaufbau. Verworfen bei jedem Neuaufbau und jedem Speichern, siehe render()
   und persist(). */
var dayIndex = null;
function entriesOn(iso) {
  if (!dayIndex) {
    dayIndex = Object.create(null);
    S.entries.forEach(function (e) {
      if (!e || !e.date) return;
      if (!dayIndex[e.date]) dayIndex[e.date] = [];
      dayIndex[e.date].push(e);
    });
  }
  return dayIndex[iso] || [];
}
function clearDayIndex() { dayIndex = null; }
function planStatusOnDay(name, iso) {
  var list = S.plans[name] || [];
  var allWork = entriesOn(iso).filter(isWork);
  var tagged = allWork.filter(function (e) { return e.plan === name; });
  var hasKnownTag = allWork.some(function (e) { return e.plan && S.plans[e.plan]; });
  var relevant;
  if (tagged.length) {
    /* Ungemarkte Sätze desselben Tages mitnehmen, damit ein am Tag des Updates
       begonnenes Training nicht in einen alten und neuen Teil zerfällt. */
    relevant = allWork.filter(function (e) { return !e.plan || e.plan === name; });
  } else {
    relevant = hasKnownTag ? [] : allWork;
  }
  var counts = {};
  relevant.forEach(function (e) {
    if (!counts[e.exercise]) counts[e.exercise] = 0;
    counts[e.exercise] += 1;
  });
  var touched = list.filter(function (i) { return counts[i.name] > 0; }).length;
  var full = list.filter(function (i) {
    return counts[i.name] >= itemSets(i);
  }).length;
  var need = Math.min(MIN_DONE, list.length);
  return {
    plan:name, explicit:tagged.length > 0, explicitSets:tagged.length,
    touched:touched, full:full, need:need,
    completed:need > 0 && full >= need
  };
}
/* Rangfolge der Pläne eines Tages: eine gültige Planangabe vor der Ableitung,
   dann abgeschlossen, dann mehr volle, mehr angefangene Übungen, dann mehr
   markierte Sätze. Erst ein Unterschied im vorderen Schlüssel entscheidet. */
var DAY_RANK = ["explicit", "completed", "full", "touched", "explicitSets"];
function betterDayStatus(a, b) {
  for (var i = 0; i < DAY_RANK.length; i++) {
    var x = +a[DAY_RANK[i]], y = +b[DAY_RANK[i]];
    if (x !== y) return x > y;
  }
  return false;
}
function dayPlan(iso) {
  var ex = {}, count = 0;
  entriesOn(iso).forEach(function (e) {
    if (!isWork(e)) return;
    if (!ex[e.exercise]) { ex[e.exercise] = 0; count += 1; }
    ex[e.exercise] += 1;
  });
  if (!count) return null;
  var best = null;
  Object.keys(S.plans).forEach(function (p) {
    var status = planStatusOnDay(p, iso);
    if (!status.explicit && !status.touched) return;
    if (!best || betterDayStatus(status, best)) best = status;
  });
  /* done zählt nur Übungen des erkannten Plans (best.touched), fünf beliebige
     Bonus-Übungen machen noch keinen Plantag. need ist wie bei completed auf
     die Planlänge gekappt, damit auch kurze Pläne die Schwelle erreichen. */
  return { plan:best ? best.plan : null, total:count,
    touched: best ? best.touched : 0, need: best ? best.need : 0,
    done: !!best && best.need > 0 && best.touched >= best.need,
    planDone:!!best && best.completed };
}
/* Aktuelles Wochenziel je Plan, 0 heißt kein Ziel. */
function weekGoal(p) {
  var v = S.settings.weekGoals[p];
  return (typeof v === "number" && v > 0) ? v : 0;
}
/* S.settings.weekGoalLog[p]: nach since aufsteigend sortierte Liste { since,
   value }, since ist ein Montag. Das Eingabefeld ändert nur weekGoal(), erst
   "Neues Wochenziel speichern" schreibt einen Eintrag. So behält eine

function weekGoalAt(p, mon) {

function weekGoalPending() {
  return weekGoalPlans().some(function (p) {

/* Für "Neues Wochenziel speichern" im Pläne-Reiter und "Als Wochenziel

function writeWeekGoalLog() {
  var mon = mondayOf(todayISO()), any = false;
  weekGoalPlans().forEach(function (p) {
    var val = weekGoal(p);

    if (last && last.value === val) return;

    if (!val && !last) return;

var SESSION_GAP_MS = 90 * 60 * 1000;

  var entries = S.entries.filter(function (e) { return e.date === iso && e.ts; })
    .sort(function (a, b) { return a.ts - b.ts; });
  var groups = [];
  entries.forEach(function (e) {
    var group = groups.length ? groups[groups.length - 1] : null;
    if (!group || e.ts - group[group.length - 1].ts > SESSION_GAP_MS) {
      group = [];

   Baz-Valle 2022), Faktoren dafür wären erfunden. */

  S.entries.forEach(function (e) {

    var mo = muscleOf(e.exercise);

    var vol = e.weight * e.reps;

   noch die echte Gesamtlast. */

  var vol = 0, sets = 0, days = {};

    '</span><span class="dot"' + dot.style + '></span>';

function weekStrip() {

     darüber. */
  var reps = '<div class="stepbox"><button data-act="step" data-f="reps" data-d="-1" ' +
    'aria-label="weniger Reps">&minus;</button>' +
    '<div class="mid"><b>' + esc(S.reps) + '</b><span>Reps</span></div>' +
    '<button data-act="step" data-f="reps" data-d="1" aria-label="mehr Reps">+</button></div>';
  /* Aufwärmsätze speichern kein RPE, also steht nur die Wiederholungszahl da,
     über die volle Breite. */
  if (S.warm) return '<div class="steprow one">' + reps + '</div>';
  return '<div class="steprow">' + reps +
    '<div class="stepbox"><button data-act="step" data-f="rpe" data-d="-0.5" ' +
    'aria-label="weniger RPE">&minus;</button>' +
    '<div class="mid"><b>' + (isNaN(rpeVal) ? "–" : num(rpeVal)) + '</b><span>RPE</span></div>' +
    '<button data-act="step" data-f="rpe" data-d="0.5" aria-label="mehr RPE">+</button></div>' +
    '</div>';
}

function curReps() {
  var cur = parseInt(S.reps, 10);
  return cur > 0 ? cur : 10;
}
function shiftRepWin(d) {
  repWinCenter = Math.max(3, (repWinCenter != null ? repWinCenter : curReps()) + d);
}
function repPillRow(lo, cur, rng) {
  var h = '<div class="pills">';
  for (var i = 0; i < 5; i++) {
    var v = lo + i;
    var cls = [];
    if (v === cur) cls.push("on");
    if (rng && v >= rng.lo && v <= rng.hi) cls.push("inrange");
    h += '<button class="' + cls.join(" ") + '" data-act="pillrep" data-v="' +
      v + '">' + v + '</button>';
  }
  return h + '</div>';
}
/* Die Reihe zentriert auf dem gewählten Wert und rückt so mit jedem Tipp nach,
   auch in größere Bereiche, ohne ein Feld anzufassen. */
function repPills() {
  var cur = curReps();
  return repPillRow(Math.max(1, cur - 2), cur, null);
}

/* Eigener, verschiebbarer Ausschnitt (repWinCenter), damit im Fokus-Modus auch
   weit unter dem Ziel liegende Werte erreichbar sind, etwa bei einem
   abgebrochenen Satz. Chevron und Wischen verschieben nur den Ausschnitt, ein
   Tipp wählt und zentriert wieder. */
function focusRepPills() {
  var cur = curReps();
  var center = repWinCenter != null ? repWinCenter : cur;
  /* Ziel-Range der doppelten Progression: nur ein Rahmen um ihre Tasten. Nicht
     in repPills(), beim Korrigieren eines früheren Satzes ist die Range nur
     Beiwerk. */
  return '<div class="repsrow"><button class="chev" data-act="repwin" data-d="-5" ' +
    'aria-label="Niedrigere Reps zeigen">' + svg("zurueck", 15) + '</button>' +
    repPillRow(Math.max(1, center - 2), cur, repRangeShown(S.exercise)) +
    '<button class="chev fwd" data-act="repwin" data-d="5" ' +
    'aria-label="Höhere Reps zeigen">' + svg("zurueck", 15) + '</button></div>';
}

/* Ein abweichender Wert aus älteren Sätzen, etwa 7,5, wird einsortiert, damit
   er beim Bearbeiten nicht stillschweigend wegfällt. */
function rpePills() {
  var cur = deci(S.rpe);
  var vals = [6, 7, 8, 9, 10];
  if (!isNaN(cur) && vals.indexOf(cur) < 0) {
    vals.push(cur);
    vals.sort(function (a, b) { return a - b; });
  }
  var h = '<div class="pills">';
  vals.forEach(function (v) {
    h += '<button class="' + (v === cur ? "on rpe" : "") + '" data-act="pillrpe" data-v="' +
      comma(v) + '">' + num(v) + '</button>';
  });
  return h + '</div>';
}

/* Höchstgewicht je Tag der letzten fünf Trainingstage. Bei durchweg gleichem
   Gewicht stehen alle gleich hoch, das ist die Optik eines Plateaus. */
function exBars(name) {
  var byDay = {};
  workOf(name).forEach(function (e) {
    if (byDay[e.date] == null || e.weight > byDay[e.date]) byDay[e.date] = e.weight;
  });
  var days = Object.keys(byDay).sort().slice(-5);
  if (!days.length) return [];
  var vals = days.map(function (d) { return byDay[d]; });
  var max = Math.max.apply(null, vals), min = Math.min.apply(null, vals);
  var span = max - min;
  /* Höhen in Pixel, nicht in Prozent: eine Prozentangabe löst im Flex-Kontext
     nicht zuverlässig gegen die feste Spurhöhe auf. */
  var bars = vals.map(function (v, i) {
    return { h: span < 0.001 ? 13 : Math.round(5 + (v - min) / span * 19),
      last: i === vals.length - 1 };
  });
  /* Immer fünf Plätze. Bei wenigen Trainingstagen stünde sonst ein einzelner
     breiter Balken da, der wie ein Fortschrittsbalken aussieht statt wie Verlauf. */
  while (bars.length < 5) bars.unshift({ h: 3, empty: true });
  return bars;
}

/* Eine Karte je Übung, ohne Langhantel-Kennzeichnung: die zeigt der
   Scheibenrechner im Training ohnehin. opts.multi ist die Mehrfachauswahl für
   opts.plan, mit Häkchen statt Trainingsauswahl, und ein Tipp schaltet um,
   statt zu übernehmen und den Picker zu schließen. */
function exCard(n, opts) {
  opts = opts || {};
  var planCheck = opts.multi ? opts.plan : S.plan;
  /* Ziel Entwurf (Planung): "im Plan" heißt hier "schon als einzelne Übung drin" */
  var inDraft = !!(opts.multi && planCheck === DRAFT_TARGET &&
    weekDraft(selWeek()).extras.some(function (x) { return x.name === n; }));
  var inPlan = inDraft || !!(planCheck && S.plans[planCheck] &&
    S.plans[planCheck].some(function (i) { return i.name === n; }));
  var flat = plateau(n);
  var tag = inDraft ? "IM ENTWURF" : (inPlan ? "IM PLAN" : catOf(n).toUpperCase());
  var showTag = inPlan || !opts.hideTag || catOf(n) !== opts.hideTag;
  var selected = !!(opts.multi && opts.selected);
  return '<button class="excard' + (inPlan ? " inplan" : "") +
    (selected ? " sel" : (!opts.multi && n === S.exercise ? " on" : "")) + '" data-act="' +
    (opts.multi ? "picktoggle" : "opt") + '" data-v="' + esc(n) + '">' +
    (showTag ? '<span class="tag">' + (inPlan ? '<i class="pdot"></i>' : "") + esc(tag) + '</span>' : "") +
    (selected ? '<span class="chk">' + svg("haken", 14) + '</span>' : "") +
    '<span class="nm">' + esc(n) + '</span>' +
    '<span class="bars">' + exBars(n).map(function (b) {
      return '<i class="' + (b.empty ? "pad" : (b.last ? "last" : "")) +
        '" style="height:' + b.h + 'px"></i>';
    }).join("") + '</span><span class="meta' + (flat ? " flat" : "") + '">' +
    exCardMeta(n, flat) + '</span></button>';
}
/* Höchstens drei Angaben. Die Satzzahl bezieht sich auf das ausgewählte Datum
   und heißt deshalb nur am tatsächlichen heutigen Tag auch „heute“. */
function exCardMeta(n, flat) {
  var ls = lastSession(n, null);
  if (!ls) return "noch nie erfasst";
  var selectedCount = dayEntries().filter(function (e) { return e.exercise === n; }).length;
  var bits = [num(ls.top) + " kg"];
  if (flat) bits.push(flat + " Wo. gleich");
  if (selectedCount) bits.push(selectedCount + "× " +
    (S.date === todayISO() ? "heute" : "am " + tinyDate(S.date)));
  else if (!flat) bits.push(agoText(ls.day));
  return bits.join(" · ");
}

/* Anlegebox im Wähler und unter Daten. Die Felder beginnen mit prefix, darüber
   findet createExercise() sie; cat ist die vorgewählte Kategorie. */
function newExerciseBox(prefix, placeholder, act, cat) {
  function field(f, label, mode, value) {
    return '<div class="deffield"><label for="' + prefix + f + '">' + label + '</label>' +
      '<input id="' + prefix + f + '" inputmode="' + mode + '" value="' + value + '"></div>';
  }
  return '<div class="newbox"><div class="tab">Neue Übung</div><div class="body">' +
    '<div class="newrow"><input id="' + prefix + 'Name" placeholder="' + placeholder + '"></div>' +
    '<div class="newrow"><select id="' + prefix + 'Cat">' +
    CATLIST.map(function (c) {
      return '<option value="' + esc(c) + '"' + (c === cat ? " selected" : "") +
        '>' + esc(c) + '</option>';
    }).join("") + '</select></div>' +
    '<div class="newrow">' +
    field("Sets", "Sätze", "numeric", defaultSets()) +
    field("Reps", "Reps", "numeric", defaultReps()) +
    field("Weight", "kg", "decimal", comma(defaultWeight())) +
    '</div>' +
    '<div class="newrow"><div style="flex:1"><label class="mlabel">Muskelgruppe</label>' +
    '<div class="msel">' +
    '<select id="' + prefix + 'MusclePrimary" data-act="newmuscleprimary" ' +
    'data-target="' + prefix + 'MuscleSecondary" aria-label="Primäre Muskelgruppe">' +
    muscleOptionList("Primär") + '</select>' +
    '<select id="' + prefix + 'MuscleSecondary" aria-label="Sekundäre Muskelgruppe" disabled>' +
    muscleOptionList("Sekundär") + '</select></div></div></div>' +
    '<div class="newrow"><button data-act="' + act + '">Anlegen</button></div>' +
    '</div></div>';
}
/* Gruppen des Wählers nach Kategorie oder nach Primärmuskel, dazu die gewählte,
   ohne Wahl die erste. */
function pickerGroups(names, byMuscle) {
  var groups;
  if (byMuscle) {
    groups = MUSCLE_LIST.filter(function (m) {
      return names.some(function (n) { var mo = muscleOf(n); return mo && mo.primary === m; });
    });
    if (names.some(function (n) { return !muscleOf(n); })) groups.push("Ohne Zuordnung");
    return { list:groups,
      active:S.pickMuscle && groups.indexOf(S.pickMuscle) >= 0 ? S.pickMuscle : (groups[0] || "") };
  }
  groups = CATLIST.concat(["Sonstige"]).filter(function (c) {
    return names.some(function (n) { return catOf(n) === c; });
  });
  return { list:groups,
    active:S.pickCat && groups.indexOf(S.pickCat) >= 0 ? S.pickCat : (groups[0] || "Push") };
}
/* Mit Suchbegriff alle Treffer, sonst die Übungen der gewählten Gruppe. */
function pickerItems(names, q, byMuscle, active) {
  if (q) return names.filter(function (n) { return n.toLowerCase().indexOf(q) >= 0; });
  return names.filter(function (n) {
    if (!byMuscle) return catOf(n) === active;
    var mo = muscleOf(n);
    return active === "Ohne Zuordnung" ? !mo : !!(mo && mo.primary === active);
  });
}
function pickerHead(multi, byMuscle) {
  return '<div class="pkhead">' +
    '<button data-act="' + (multi ? "pickmulticlose" : "pickclose") +
    '" aria-label="Zurück">' + svg("zurueck", 22) + '</button><b>' +
    (multi
      ? (S.pickPlanTarget === DRAFT_TARGET ? "Für den Entwurf wählen"
        : "Für " + esc(S.pickPlanTarget) + " wählen")
      : "Übung wählen") +
    '</b></div>' +
    '<div class="seg2">' +
    '<button class="' + (byMuscle ? "" : "on") + '" data-act="pickgroupby" data-v="cat">' +
    'Kategorie</button>' +
    '<button class="' + (byMuscle ? "on" : "") + '" data-act="pickgroupby" data-v="muscle">' +
    'Muskelgruppe</button></div>';
}
function pickerCards(items, q, byMuscle, active, multi) {
  var h = '<div class="pksect"><span>' + (q ? "Treffer" : esc(active)) + '</span><em>' +
    plural(items.length, "Übung", "Übungen") + '</em></div>';
  if (!items.length) {
    return h + '<p class="empty">' + (q
      ? "Kein Treffer für " + esc(S.search) + ".<br>Lege die Übung unten neu an."
      : "Keine Übung in dieser Gruppe.") + '</p>';
  }
  /* Das Kategorie-Tag doppelt die Überschrift nur bei Kategorie-Einteilung,
     bei Muskelgruppen ist es eine zusätzliche Angabe. */
  var hideTag = (!q && !byMuscle) ? active : "";
  return h + '<div class="excards">' + items.map(function (n) {
    return exCard(n, multi
      ? { multi:true, plan:S.pickPlanTarget, selected:S.pickSel.indexOf(n) >= 0, hideTag:hideTag }
      : { hideTag:hideTag });
  }).join("") + '</div>';
}
/* Ersetzt den Trainingsbildschirm, statt darunter aufzuklappen, damit die
   Karten die ganze Breite bekommen. */
function viewPicker() {
  var multi = !!S.pickPlanTarget;
  var names = allNames();
  var q = S.search.trim().toLowerCase();
  var byMuscle = S.pickGroupBy === "muscle";
  var g = pickerGroups(names, byMuscle), active = g.active;
  var h = pickerHead(multi, byMuscle) + '<div class="catpills">' +
    g.list.map(function (c) {
      return '<button class="' + (!q && c === active ? "on" : "") + '" data-act="' +
        (byMuscle ? "pickmuscle" : "pickcat") + '" data-v="' + esc(c) + '">' + esc(c) + '</button>';
    }).join("") + '</div>' +
    '<div class="pkfind"><input id="searchEx" data-act="search" ' +
    'placeholder="Übung suchen" value="' + esc(S.search) + '"></div>';
  /* Zähler und Bestätigen stehen direkt unter der Suche, damit man sie nach dem
     Antippen mehrerer Karten nicht erst wieder hochscrollen muss. */
  if (multi) {
    var nSel = S.pickSel.length;
    h += '<div class="pkmulti"><span>' + plural(nSel, "Übung", "Übungen") + ' ausgewählt</span>' +
      '<button data-act="pickmultidone"' + (nSel ? "" : " disabled") + '>Hinzufügen</button></div>';
  }
  return h + pickerCards(pickerItems(names, q, byMuscle, active), q, byMuscle, active, multi) +
    newExerciseBox("new", "Name der Übung", "addex", byMuscle ? "" : active);
}

/* Der Pausentimer startet nur für den heutigen Tag, dieselbe Bedingung steht
   vor startRest() in ACTIONS.save. Wer nachträgt, will nicht warten, und der
   Hinweis sagt, warum kein Timer kommt. Siehe README, Timer und Datum. */
function restOffNote() {
  if (!S.settings.autoRest || S.date === todayISO()) return "";
  /* Im Fokus-Modus fehlt der Knopf Heute, dort führt der Pfeil links oben
     hinaus. */
  return '<div class="notice bad">Kein Timer, da Datum ' +
    (S.date < todayISO() ? "in der Vergangenheit" : "in der Zukunft") + '.' +
    (S.focus ? "" : ' Über <b>Heute</b> oben zurück zum laufenden Tag.') +
    '</div>';
}
/* Trainingsreiter */
function viewTag() {
  if (S.pickOpen) return viewPicker();
  if (S.weekOverview) return viewWeekOverview();
  return tagHeader() + planChooser() + heroBlock() + planListBlock() +
    daySetsBlock(dayEntries());
}
function tagHeader() {
  var h = "";
  var due = backupDue();
  if (due) {
    h += '<div class="notice act">' + esc(due) +
      '<button data-act="savefile">Sichern</button></div>';
  }

  h += '<div class="dateline"><span>' +
    (S.date === todayISO() ? "Heute, " : "") + longDay(S.date) + '</span>' +
    '<span class="dact">' +
    (S.date === todayISO() ? "" : '<button class="today" data-act="today">Heute</button>') +
    '</span></div>' + weekStrip() + restOffNote();
  return h;
}
function planChooser() {
  var h = "";
  if (S.plan && S.plans[S.plan] && S.plansFold) {
    var lpc = lastPlanDay(S.plan);
    h += '<button class="plansel" data-act="plansfold" aria-expanded="false" ' +
      'aria-label="' + esc(S.plan + ", zuletzt abgeschlossen " +
        (lpc ? agoText(lpc) : "noch nie") + ". Planauswahl öffnen") + '" ' +
      'title="Planauswahl öffnen"><span class="pdot" style="background:' +
      planColor(S.plan) + '"></span><b>' + esc(S.plan) + '</b><span>' +
      (lpc ? agoText(lpc) : "noch nie") + '</span><em>Plan wechseln</em>' +
      '<i class="chev">' + svg("chev", 15) + '</i></button>';
  } else if (!visiblePlans().length) {
    h += '<p class="notice">Alle Pläne sind im Training ausgeblendet. Unter Pläne kannst ' +
      'du sie über das Auge neben dem Plannamen wieder einblenden.</p>';
  } else {
    var vp = visiblePlans();
    if (vp.some(function (p) { return weekGoal(p) > 0; })) {
      h += '<div class="plansgoalcap">Wochenziele:</div>';
    }
    h += '<div class="plans">';
    vp.forEach(function (p) {
      var lp = lastPlanDay(p);
      h += '<button class="' + (S.plan === p ? "on" : "") + '" data-act="plan" data-v="' +
        esc(p) + '" aria-label="' + esc(p + ", zuletzt abgeschlossen " +
          (lp ? agoText(lp) : "noch nie")) + '"><span class="pn"><span class="pdot" style="background:' + planColor(p) +
        '"></span>' + esc(p) + '</span><span class="pa">' +
        (lp ? agoText(lp) : "noch nie") + '</span>' + planGoalLine(p) + '</button>';
    });
    h += '</div>';
  }

  if (planItems().length) {
    h += '<button class="focusgo" data-act="focuson">' + svg("hantelh", 16) +
      '<span>Fokus Mode starten</span></button>';
  }
  return h;
}
function heroBlock() {
  if (S.editId) {
    var ed = S.entries.filter(function (e) { return e.id === S.editId; })[0];
    return ed ? editHero(ed) : "";
  }
  return S.exercise ? exerciseHero() : blankHero();
}
function editHero(ed) {
  return '<div class="hero edit">' +
    '<div class="setline">SATZ ' + ed.set + (ed.warm ? " AUFWÄRMEN" : "") +
    ' BEARBEITEN</div>' +
    '<div class="hero-ex">' + esc(ed.exercise) + '</div>' +
    '<div class="hero-meta">Satz vom ' + shortDate(ed.date) +
    '. Ursprünglich <b>' + ed.reps + ' Reps</b> mit <b>' + num(ed.weight) + ' kg</b>' +
    (ed.rpe != null ? ', RPE ' + num(ed.rpe) : '') + '.</div>' +
    weightDial(ed.exercise) +
    '<div class="fieldlab">REPS</div>' + repPills() +
    (ed.warm ? "" : '<div class="fieldlab">RPE</div>' + rpePills()) +
    '<div class="savearea">' +
    '<button class="save" data-act="update">Änderung speichern</button>' +
    '<button class="ghost" data-act="canceledit">Abbrechen</button></div></div>';
}
/* Gemeinsam für exerciseHero() und focusHero(): beide zeigen dieselbe Übung aus
   demselben Zustand, nur anders angeordnet. */
function heroFacts() {
  var last = lastSession(S.exercise, S.date);
  var isToday = S.date === todayISO();
  var curW = deci(S.weight) || 0;
  var wBase = S.warm && S.warmBase > 0 ? S.warmBase : curW;
  var doneN = doneSets(S.exercise, S.date);
  return {
    last:last,
    /* Bester Arbeitssatz der letzten früheren Einheit, nicht ihr letzter: ein
       leichter Auslaufsatz soll die Zeile nicht verfälschen. */
    lastSet:last ? bestSet(last.sets) : null,
    tg:planTarget(S.exercise),
    doneN:doneN,
    needN:targetSets(S.exercise),
    /* Vorschlag und Plateau-Warnung nur beim heutigen Training, beim Nachtragen
       oder Korrigieren älterer Tage lenken sie nur ab */
    isToday:isToday,
    flat:isToday ? plateau(S.exercise) : 0,
    ramp:doneN ? [] : warmupPlan(S.exercise, wBase),
    split:isBar(S.exercise) ? plateSplit(curW) : null,
    rng:repRangeShown(S.exercise)
  };
}
function heroHead(f) {
  /* Immer needN Pillen, auch wenn mehr Sätze erfasst sind: einen Satz über dem
     Ziel zeigt allein der Speichern-Knopf mit seiner Nummer. */
  var setBars = "";
  for (var si = 0; si < f.needN; si++) {
    setBars += '<i class="' + (si < f.doneN ? "done" : (si === f.doneN ? "cur" : "")) + '"></i>';
  }
  var ls = f.lastSet;
  return '<div class="hero-top">' +
    '<button class="hero-ex tap" data-act="pickopen" title="Andere Übung wählen">' +
    '<span>' + esc(S.exercise) + '</span><i class="chev">' + svg("chev", 16) + '</i></button>' +
    '<div class="setprog"><div class="bars">' + setBars + '</div></div>' +
    '</div>' +
    '<div class="hero-meta">' +
    /* Bei doppelter Progression die Range statt der Zielzahl, sonst wäre der
       Vorschlag "+1 Rep" nicht nachvollziehbar. */
    (f.tg ? "Ziel <b>" + f.needN + "x " +
      (f.rng ? rangeText(f.rng) : f.tg.reps) + " Reps</b> mit <b>" +
      num(f.tg.weight) + " kg</b><br>" : "") +
    (ls ? "Letztes Top Set <b>" + ls.reps + "x " + num(ls.weight) + " kg</b> am " +
      tinyDate(f.last.day) + (ls.rpe != null ? " bei RPE " + num(ls.rpe) : "")
      : "Erste Aufzeichnung für diese Übung") +
    '</div>' +
    (f.isToday ? suggestionBlock() : "") +
    (f.isToday && f.flat ? '<div class="flag">Seit ' + f.flat + ' Wochen unverändert bei ' +
      num(ls ? ls.weight : 0) + ' kg. Zeit für mehr Gewicht, mehr ' +
      'Reps oder eine andere Übung.</div>' : "");
}
function platesLine(split) {
  if (!split) return "";
  return '<div class="plates">Stange ' + num(split.bar) + ' kg, pro Seite ' +
    split.side.map(num).join(' + ') +
    (split.rest > 0.001 ? '<b> und ' + num(split.rest) + ' kg fehlen</b>' : '') + '</div>';
}
function warmRow(ramp) {
  if (!ramp.length) return "";
  return '<div class="warmrow"><span>Warmup</span>' +
    ramp.map(function (r, ri) {
      /* Mit kg, sonst liest sich die Zahl neben der Wiederholungszahl wie ein
         zweiter Faktor. */
      return '<button data-act="warmpick" data-i="' + ri + '">' + num(r.weight) +
        ' kg <s>&times;' + r.reps + '</s></button>';
    }).join("") + '</div>';
}
function toastLine() { return S.toast ? '<div class="toast">' + S.toast + '</div>' : ""; }
function saveSetButton() {
  return '<button class="save' + (S.warm ? " warm" : "") + '" data-act="save">' +
    (S.warm ? "Aufwärmsatz speichern" : "Satz " + nextSet() + " speichern") + ': ' +
    esc(S.weight) + ' kg × ' + esc(S.reps) + '</button>';
}
function exerciseHero() {
  var f = heroFacts();
  var hasNext = planIndex() >= 0 && planIndex() < planItems().length - 1;
  return logHead() + planProgress() +
    '<div class="hero' + (S.warm ? " warm" : "") + '">' +
    heroHead(f) +
    heroWeightDial(S.exercise) +
    platesLine(f.split) +
    heroSteppers() +
    warmRow(f.ramp) +
    exNoteBlock() +
    exHistBlock() +
    '</div>' +
    '<div class="savearea main">' +
    toastLine() + saveSetButton() +
    /* Hier nur der Rückweg aus einem Zustand, in den man geraten ist
       (Aufwärmen, letzte Planübung). Aufwärmen von Hand und Überspringen bietet
       nur der Fokus-Modus. */
    (S.warm || !hasNext

}

function dayTotals(day) {
  var wday = day.filter(isWork);

  return '<div class="totals"><b>' + Object.keys(workExercises).length + ' Übungen</b>' +
    '<span>' + wday.length + ' Sätze</span><span>' + num(total) + ' kg</span>' +

/* ---------- Pläne ---------- */
/* Jede Quelle trägt items (name, sets) und times, die Häufigkeit pro Woche.
   Gewichtet wie volByMuscle(): Primärmuskel voll, jeder Sekundärmuskel halb. */
function muscleTally(sources) {
  var by = {}, unassigned = [];
  MUSCLE_LIST.forEach(function (m) { by[m] = { total:0, src:{} }; });
  sources.forEach(function (sc) {
    sc.items.forEach(function (i) {
      var mo = muscleOf(i.name);
      if (!mo) { if (unassigned.indexOf(i.name) < 0) unassigned.push(i.name); return; }
      var n = itemSets(i) * sc.times;
      by[mo.primary].total += n;
      by[mo.primary].src[sc.key] = (by[mo.primary].src[sc.key] || 0) + n;
      mo.secondary.forEach(function (sm) {
        by[sm].total += n * 0.5;
        by[sm].src[sc.key] = (by[sm].src[sc.key] || 0) + n * 0.5;
      });
    });
  });
  return { by:by, unassigned:unassigned };
}
/* muscleBars(), opts.showZero: Gruppen ohne Satz rot mit aufführen statt
   weglassen.
   opts.flagRatio: ein Paar rot markieren, sobald eine Seite so viel mal mehr
   hat als die andere oder leer ausgeht.
   Die Planung nutzt beide, der Pläne-Reiter keins. */
/* Referenzbereich in Sätzen je Muskelgruppe und Woche, als zwei Striche im
   Balken: ab 10 deutlich mehr Zuwachs (Schoenfeld u.a. 2017), 12 bis 20 als
   Anhalt für Trainierte (Baz-Valle u.a. 2022), siehe README, Referenzbereich im
   Balken. Die Skala reicht immer bis knapp über 20, sonst läge der zweite
   Strich am Rand. */
var VOL_BAND = [10, 20];
function muscleBars(res, sources, opts) {
  var by = res.by;
  var groups = MUSCLE_LIST.filter(function (m) { return opts.showZero || by[m].total > 0; });
  var top = Math.max.apply(null, MUSCLE_LIST.map(function (m) { return by[m].total; }));
  var max = Math.max(top, VOL_BAND[1] + 2);
  var refs = VOL_BAND.map(function (v) {
    return '<b class="ref" style="left:' + (v / max * 100).toFixed(1) + '%" title="' + v +
      ' Sätze je Woche"></b>';
  }).join("");
  var h = '<div class="card"><div class="vol bymuscle" style="margin-top:0">';
  groups.forEach(function (m) {
    h += '<div class="volrow' + (by[m].total ? "" : " zero") + '"><span class="vn">' +
      esc(m) + '</span><div class="vb stack">' +
      sources.filter(function (sc) { return by[m].src[sc.key]; }).map(function (sc) {
        return '<i style="width:' + (by[m].src[sc.key] / max * 100).toFixed(1) +
          '%;background:' + sc.color + '" title="' + esc(sc.label) + ': ' +
          fmtCount(by[m].src[sc.key]) + '"></i>';
      }).join("") + refs + '</div>' +
      '<span class="vv">' + fmtCount(by[m].total) + '</span></div>';
  });
  h += '</div>' +
    '<div class="planlegend">' + sources.map(function (sc) {
      return '<span><span class="pdot" style="background:' + sc.color + '"></span>' +
        esc(sc.label) + (sc.times > 1 ? ' ×' + sc.times : '') + '</span>';
    }).join("") +
    '<span><i class="refleg"></i>' + VOL_BAND[0] + ' und ' + VOL_BAND[1] +
    ' Sätze je Woche</span></div>';
  /* Im Pläne-Reiter ohne Schwelle: bewerten lässt sich das Verhältnis erst am
     tatsächlichen Training. Im Entwurf geht es genau um die Frage, ob der Mix
     aufgeht, deshalb dort flagRatio. */
  var pairs = MUSCLE_PAIRS.filter(function (pr) {
    return by[pr[0]].total > 0 || by[pr[1]].total > 0;
  });
  if (pairs.length) {
    var flagged = 0;
    h += '<p class="pairline">' + pairs.map(function (pr) {
      var a = by[pr[0]].total, b = by[pr[1]].total, off = false;
      if (opts.flagRatio) off = !a || !b || a / b >= opts.flagRatio || b / a >= opts.flagRatio;
      if (off) flagged++;
      return esc(pr[0]) + ' zu ' + esc(pr[1]) + ' <b' + (off ? ' class="off"' : "") + '>' +
        fmtCount(a) + ' : ' + fmtCount(b) + '</b>';
    }).join('<br>') +
      (flagged ? '<span class="why">Rot ab ' + fmtCount(opts.flagRatio) +
        ' : 1 oder wenn eine Seite leer ausgeht.</span>' : "") + '</p>';
  }
  if (opts.showZero) {
    var zero = MUSCLE_LIST.filter(function (m) { return !by[m].total; });
    if (zero.length) {
      h += '<p class="pairline">Ohne Satz im Entwurf: ' + zero.map(esc).join(', ') + '.</p>';
    }
  }
  if (res.unassigned.length) {
    h += '<p class="pairline">Ohne Muskelgruppe, hier nicht gezählt: ' +
      res.unassigned.map(esc).join(', ') + '. Zuordnen lässt sich das unter Daten, ' +
      'Muskelgruppen.</p>';
  }
  return h + '</div>';
}
function planMuscleBlock() {
  /* Nur Pläne mit Wochenziel: ein Plan ohne Ziel läuft nicht notwendig
     regelmäßig, seine Sätze in der Wochensumme spiegelten eine Regelmäßigkeit
     vor, die es nicht gibt. */
  var plans = visiblePlans().filter(function (p) {
    return S.plans[p] && S.plans[p].length && weekGoal(p) > 0;
  });
  var sources = plans.map(function (p) {
    return { key:p, label:p, color:planColor(p), times:weekGoal(p), items:S.plans[p] };
  });
  var res = muscleTally(sources);
  var open = secOpen("plansets");
  var h = '<div class="sect"><h2>Sätze je Muskelgruppe' + infoBtn("plansets") + '</h2>' +
    secFold("plansets", "pro Woche") + '</div>' +
    descText("plansets", '<p class="notice">Wochensumme über alle eingeblendeten Pläne mit ' +
      'einem Wochenziel, gezählt wie im Verlauf: Primärmuskel voll, Sekundärmuskel halb, ' +
      'jeder Plan so oft wie sein Wochenziel es vorsieht. Pläne ohne Wochenziel oder ' +
      'ausgeblendete Pläne fehlen, sie laufen ja nicht notwendig regelmäßig. Der Balken ' +
      'zeigt in den Planfarben, welcher Plan wie viel beiträgt. Die zwei Striche ' +
      'markieren 10 und 20 Sätze je Woche: unter 10 wächst wenig, zwischen 10 und 20 ' +
      'liegt der Bereich, in dem die Metaanalysen den Zuwachs sehen (Schoenfeld 2017, ' +
      'Baz-Valle 2022), darüber bringt mehr weiter etwas, aber weniger je Satz. Einen ' +
      'anderen Mix durchspielen, ohne die Wochenziele anzufassen, geht im Reiter ' +
      'Planung.</p>');
  if (!open) return h;
  if (!plans.length) {
    return h + '<p class="notice">Kein eingeblendeter Plan hat ein Wochenziel. Unter ' +
      'Wochenziele oben lässt sich eines setzen.</p>';
  }
  if (!MUSCLE_LIST.some(function (m) { return res.by[m].total > 0; })) {
    return h + '<p class="notice">Kein eingeblendeter Plan mit Wochenziel enthält eine ' +
      'Übung mit Muskelgruppe.</p>';
  }
  return h + muscleBars(res, sources, {});
}
function viewPlans() {
  return weekGoalsBlock() + planMuscleBlock() + planEditHead() + planDefaultsBlock() +
    Object.keys(S.plans).map(planCard).join("") + newPlanBlock();
}
function weekGoalsBlock() {

/* ---------- Planung ---------- */
/* Die Planung rechnet auf einem Entwurf, damit sich ein anderer Mix
   durchspielen lässt, ohne Wochenziele und ihre Historie anzufassen. Der
   Entwurf ist eine Überlegung, kein Datenbestand: eigener Schlüssel, nicht im
   Backup, verfällt aber nicht. Zugewiesene Tage sind ein Vorhaben und liegen
   deshalb in S.settings.planDays, also im Backup. Siehe README, Planung. */
var DRAFT_KEY = "kraftlog:entwurf";
/* Ziel von pickmulti, wenn Übungen in den Entwurf statt in einen Plan sollen.
   Das führende Leerzeichen kann kein Planname tragen, addplan und cleanName()
   trimmen. */
var DRAFT_TARGET = " Entwurf";
var DRAFT_MAX_TIMES = 7, DRAFT_MAX_SETS = 12;
/* Ab diesem Verhältnis zweier Gegenspieler wird das Paar im Entwurf rot. Für
   das Training im Verlauf gilt eine eigene Regel, imbalanceFlags(). */
var DRAFT_PAIR_RATIO = 1.5;
/* In Tagen. Ältere Zuweisungen fallen beim Laden und Import weg: sie sagen, was
   man vorhat, nicht, was war, dafür gibt es die Sätze. */
var PLAN_DAYS_KEEP = 28;
/* Volle Kalenderwochen im Zuweisen-Raster. */
var PLAN_WEEKS = 2;

/* Eine spätere Woche bekommt erst mit der ersten Änderung einen eigenen Eintrag
   und zeigt bis dahin den oberen Stand. */
function weekDraft(mon) {
  if (!S.draft.split) return S.draft;
  return S.draft.weeks[mon] || S.draft;
}
/* Zum Schreiben: legt die Abweichung einer späteren Woche mit dem bis dahin
   geltenden Stand an, damit der erste Tipp dort nur diese Woche ändert. */
function weekDraftEdit(mon) {
  if (!S.draft.split) return S.draft;
  /* Eine vorhandene Abweichung gewinnt auch für die erste Woche: rückt das
     Raster bei offener App über Nacht vor, liest weekDraft() schon weeks[mon],
     und ein Tipp muss dieselbe Liste treffen. Zusammengeführt wird erst beim
     nächsten Start in loadDraft(). */
  if (S.draft.weeks[mon]) return S.draft.weeks[mon];
  if (mon === planWeeks()[0].monday) return S.draft;
  if (!S.draft.weeks[mon]) {
    S.draft.weeks[mon] = { plans:JSON.parse(JSON.stringify(S.draft.plans)),
      extras:JSON.parse(JSON.stringify(S.draft.extras)) };
  }
  return S.draft.weeks[mon];
}
/* Eine gewählte Woche, die aus dem Raster gelaufen ist, fällt auf die erste
   zurück. */
function selWeek() {
  var weeks = planWeeks();
  if (!S.draft.split) return weeks[0].monday;
  for (var i = 0; i < weeks.length; i++) {
    if (weeks[i].monday === S.planWeekSel) return S.planWeekSel;
  }
  return weeks[0].monday;
}
/* Ohne eigenen Eintrag gilt das Wochenziel, ein leerer Entwurf zeigt also
   dasselbe wie der Pläne-Reiter. */
function draftEntry(p, mon) {
  var e = weekDraft(mon || selWeek()).plans[p];
  if (e) return e;
  var g = weekGoal(p);
  return { on:g > 0, times:g || 1 };
}
function draftPlans(mon) {
  return Object.keys(S.plans).filter(function (p) {
    return S.plans[p].length && draftEntry(p, mon).on;
  });
}
function draftChanged(mon) {
  return Object.keys(S.plans).some(function (p) {
    var e = draftEntry(p, mon);
    return (e.on ? e.times : 0) !== weekGoal(p);
  });
}
function saveDraft() { storeKey(DRAFT_KEY, S.draft); }
/* Was nicht passt, fällt still weg: der Entwurf ist kein Datenbestand, ohne
   Eintrag gelten die Wochenziele. */
function readDraftInto(dst, src) {
  if (!src || typeof src !== "object" || Array.isArray(src)) return;
  if (src.plans && typeof src.plans === "object") {
    Object.keys(src.plans).forEach(function (p) {
      var e = src.plans[p];
      if (!safeObjectKey(p) || !e || typeof e !== "object" || typeof e.on !== "boolean") return;
      if (!Number.isInteger(e.times) || e.times < 1 || e.times > DRAFT_MAX_TIMES) return;
      dst.plans[p] = { on:e.on, times:e.times };
    });
  }
  if (Array.isArray(src.extras)) {
    src.extras.forEach(function (x) {
      if (!x || typeof x !== "object" || typeof x.name !== "string" || !x.name) return;
      if (!Number.isInteger(x.sets) || x.sets < 1 || x.sets > DRAFT_MAX_SETS) return;
      if (!Number.isInteger(x.times) || x.times < 1 || x.times > DRAFT_MAX_TIMES) return;
      if (dst.extras.some(function (y) { return y.name === x.name; })) return;
      dst.extras.push({ name:x.name, sets:x.sets, times:x.times });
    });
  }
}
function loadDraft() {
  var d = readJson(DRAFT_KEY, null);
  if (!d || typeof d !== "object" || Array.isArray(d)) return;
  readDraftInto(S.draft, d);
  if (d.split !== true) return;
  S.draft.split = true;
  if (!d.weeks || typeof d.weeks !== "object" || Array.isArray(d.weeks)) return;
  var first = planWeeks()[0].monday;
  Object.keys(d.weeks).forEach(function (mon) {
    /* Rutscht eine geplante Woche nach vorn, zieht ihre Abweichung in den
       oberen Stand, sonst ginge sie mit dem Wochenwechsel verloren. */
    if (!validISODate(mon) || mon < first) return;
    var w = { plans:{}, extras:[] };
    readDraftInto(w, d.weeks[mon]);
    if (mon === first) { S.draft.plans = w.plans; S.draft.extras = w.extras; }
    else S.draft.weeks[mon] = w;
  });
}
/* Ob es den Plan noch gibt, prüft erst die Anzeige (plannedPlan()): ein Backup
   kann ihn noch nachliefern. */
function cleanPlanDays(src) {
  var out = {}, floor = shiftISO(todayISO(), -PLAN_DAYS_KEEP);
  Object.keys(src).forEach(function (d) {
    if (!validISODate(d) || d < floor) return;
    var p = src[d];
    if (typeof p !== "string" || !p.trim() || !safeObjectKey(p)) return;
    out[d] = p;
  });
  return out;
}

function stepper(act, v, f, val, min, max, unit) {
  var attrs = ' data-act="' + act + '" data-v="' + esc(v) + '"' +
    (f ? ' data-f="' + f + '"' : "");
  return '<span class="step">' +
    '<button' + attrs + ' data-d="-1"' + (val <= min ? " disabled" : "") +
    ' aria-label="weniger">−</button>' +
    '<b>' + val + (unit ? ' <small>' + unit + '</small>' : "") + '</b>' +
    '<button' + attrs + ' data-d="1"' + (val >= max ? " disabled" : "") +
    ' aria-label="mehr">+</button></span>';
}
function weekTabs() {
  if (!S.draft.split) return "";
  var sel = selWeek();
  return '<div class="seg2">' + planWeeks().map(function (w) {
    return '<button class="' + (w.monday === sel ? "on" : "") + '" data-act="planweek" ' +
      'data-v="' + w.monday + '" aria-pressed="' + (w.monday === sel ? "true" : "false") +
      '">KW ' + isoWeekNo(w.monday) + '</button>';
  }).join("") + '</div>';
}
function weekMark() { return S.draft.split ? "KW " + isoWeekNo(selWeek()) : ""; }
function draftBlock() {
  var mon = selWeek(), names = Object.keys(S.plans);
  var h = '<div class="sect"><h2>Entwurf' + infoBtn("entwurf") + '</h2>' +
    '<button class="wksplit" role="switch" aria-checked="' + (S.draft.split ? "true" : "false") +
    '" data-act="draftsplit" title="' + (S.draft.split
      ? "Plant wieder alle Wochen gleich und nimmt die Unterschiede heraus"
      : "Plant jede Kalenderwoche einzeln, mit einem Reiter je Woche") + '">' +
    (S.draft.split ? "Trennung aufheben" : "Wochen trennen") + '</button></div>' +
    descText("entwurf", '<p class="notice">Welche Pläne wie oft pro Woche laufen sollen. ' +
      'Vorbelegt mit den aktuellen Wochenzielen. Was hier steht, bleibt ein Entwurf und ' +
      'ändert kein Wochenziel, bis unten „Als Wochenziel übernehmen“ gedrückt wird. ' +
      'Ausgeblendete Pläne stehen mit dabei, damit sie sich einplanen lassen, ohne sie ' +
      'erst einzublenden. „Wochen trennen“ gibt jeder Kalenderwoche einen eigenen ' +
      'Entwurf; eine Woche ohne eigene Änderung zeigt die erste mit.</p>') +
    weekTabs() + '<div class="card" style="padding:0">';
  if (!names.length) h += '<div class="dempty">Noch kein Plan angelegt.</div>';
  names.forEach(function (p) {
    var e = draftEntry(p, mon);
    h += '<div class="drow' + (e.on ? "" : " off") + '">' +
      '<button class="tog" role="switch" aria-checked="' + (e.on ? "true" : "false") +
      '" data-act="drafttoggle" data-v="' + esc(p) + '" aria-label="' + esc(p) +
      ' im Entwurf">' + svg("haken", 14) + '</button>' +
      '<div class="nm"><span class="pdot" style="background:' + planColor(p) + '"></span>' +
      '<span class="t">' + esc(p) + '</span>' +
      (planHidden(p) ? '<s>ausgeblendet</s>' : "") + '</div>' +
      stepper("draftstep", p, "", e.times, 1, DRAFT_MAX_TIMES, "/Wo") + '</div>';
  });
  return h + '</div>';
}
function draftExtrasBlock() {

    '<div class="card" style="padding:0">';

      esc(x.name) + ' aus dem Entwurf nehmen">' + svg("kreuz", 13) + '</button></div>' +
      '<div class="xsteps"><label>Sätze ' +
