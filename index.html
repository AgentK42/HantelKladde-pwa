ACTIONS.update = function () {
  var w2 = deci(S.weight), r2 = parseInt(S.reps,10), p2 = deci(S.rpe);
  if (isNaN(r2) || r2 < 1 || !isFinite(w2) || w2 < 0) {
    S.note = "Reps müssen mindestens 1 und das Gewicht mindestens 0 kg sein.";
    render(); return false;
  }
  S.entries.forEach(function (e) {
    if (e.id !== S.editId) return;
    e.weight = w2; e.reps = r2;
    e.rpe = (e.warm || isNaN(p2)) ? null : p2;
  });
  S.freshId = S.editId; S.editId = ""; S.note = "";
  persist();
};

ACTIONS.del = function (v) {
  var pos = -1;
  S.entries.forEach(function (e, i) { if (e.id === v) pos = i; });
  if (pos < 0) return false;
  var gone = S.entries[pos];
  S.undo = { kind:"set", index:pos, item:gone,
    label:"Satz " + gone.set + " bei " + gone.exercise + " gelöscht." };
  S.entries.splice(pos, 1);
  renumber(gone.date, gone.exercise);
  if (S.editId === v) S.editId = "";

};
ACTIONS.undo = function () {
  var u = S.undo;
  S.undo = null;
  S.quickUndo = false;
  if (quickUndoTimer) { clearTimeout(quickUndoTimer); quickUndoTimer = null; }
  if (!u) return false;
  if (u.kind === "set") {
    S.entries.splice(Math.min(u.index, S.entries.length), 0, u.item);
    renumber(u.item.date, u.item.exercise);
  } else if (u.kind === "newset") {
    var ni = -1;
    S.entries.forEach(function (e, i) { if (e.id === u.item.id) ni = i; });
    if (ni >= 0) {
      S.entries.splice(ni, 1);
      renumber(u.item.date, u.item.exercise);
    }
  } else if (u.kind === "custom") {
    S.custom.splice(Math.min(u.index, S.custom.length), 0, u.item);
    var un = typeof u.item === "string" ? u.item : (u.item && u.item.name);
    if (un && u.meta) S.exmeta[un] = u.meta;
  } else if (u.kind === "planrow" && S.plans[u.plan]) {
    S.plans[u.plan].splice(Math.min(u.index, S.plans[u.plan].length), 0, u.item);
  } else if (u.kind === "plan") {
    S.plans[u.plan] = u.item;
    if (u.color) S.colors[u.plan] = u.color;
    if (typeof u.goal === "number") S.settings.weekGoals[u.plan] = u.goal;
    if (Array.isArray(u.goalLog)) S.settings.weekGoalLog[u.plan] = u.goalLog;
  } else if (u.kind === "rename") {
    var back = {}, renameDays = Object.create(null);
    u.ids.forEach(function (i) { back[i] = 1; });
    S.entries.forEach(function (e) {
      if (back[e.id]) { e.exercise = u.from; renameDays[e.date] = 1; }
    });
    /* Auch nach dem Rückgängigmachen beide getrennten Übungen wieder sauber
       nummerieren; die zeitliche Reihenfolge der Sätze bleibt dabei erhalten. */
    Object.keys(renameDays).forEach(function (date) {
      renumber(date, u.from);
      renumber(date, u.to);
    });
    S.plans = u.plans;
    S.custom = u.custom;
    S.cats = u.cats;
    S.exmeta = u.exmeta;
    S.settings.hiddenEx = u.hiddenEx;
    S.exercise = u.exercise;
    if (S.openEx === u.to) S.openEx = u.from;
    if (S.exNoteFor === u.to) S.exNoteFor = u.from;
    S.exOpen = "";
  }
  S.note = u.kind === "newset" ? "Letzten Satz gelöscht." : "Wiederhergestellt.";
  persist();
};
ACTIONS.finish = function () {
  /* Der Abschluss geht bewusst direkt über den Download und nicht über das

ACTIONS.dupplan = function (v) {
  if (!S.plans[v]) return false;
  var base = v + " Kopie", name = base, n = 2;
  while (S.plans[name]) { name = base + " " + n; n += 1; }
  /* Die Kopie bekommt eine eigene Farbe, sonst wäre sie im Wochenstreifen nicht
     vom Original zu unterscheiden. Gesucht ist die erste Palettenfarbe, die noch
     kein Plan trägt; ist keine mehr frei, bleibt es bei der Reihenfolge-Regel aus
     planColor(). Deshalb vor dem Einfügen, sonst zählte die Kopie sich selbst. */
  var used = Object.keys(S.plans).map(planColor);
  for (var i = 0; i < PALETTE.length; i++) {
    if (used.indexOf(PALETTE[i]) < 0) { S.colors[name] = PALETTE[i]; break; }
  }
  /* Ans Ende der Liste, nicht hinter das Original: ohne eigene Farbe greift
     planColor() auf den Platz in der Reihenfolge zurück, ein Einschub gäbe
     jedem Plan dahinter eine andere Farbe. */
  S.plans[name] = JSON.parse(JSON.stringify(S.plans[v]));
  /* Wochenziel, Sichtbarkeit und Sperre bleiben außen vor. Ein mitkopiertes
     Wochenziel würde das Wochenpensum stillschweigend verdoppeln. */
  var len = S.plans[name].length;
  S.note = name + " angelegt, " + len +
    (len === 1 ? " Übung übernommen." : " Übungen übernommen.") +
    " Wochenziel bleibt frei.";
  persist();
};

ACTIONS.planweek = function (v) {

ACTIONS.planassign = function (v, el) {
  /* Sofort gespeichert, wie jede Änderung an den Plänen. Ein eigener
     Speichern-Knopf hieße einen ungesicherten Zwischenstand, den es sonst
     nirgends in der App gibt. */
  /* Der Tag steht am Knopf, siehe assignPanel(): so weisen der Reiter Planung
     und die Wochenübersicht über denselben Zweig zu. */
  var paDay = el.getAttribute("data-day");
  if (paDay) {
    if (v) S.settings.planDays[paDay] = v;
    else delete S.settings.planDays[paDay];

       Plan dort sofort gewählt, siehe preselectPlan(). "Frei" nimmt eine
       bestehende Wahl nicht weg, trainiert werden darf ja trotzdem. */

ACTIONS.drafttake = function () {
  /* Der Entwurf wird Wochenziel: Zahl je Plan übernehmen, die Historie
     festschreiben wie beim Knopf im Pläne-Reiter, dann den Entwurf leeren -
     leer heißt ab jetzt genau dieser Stand, siehe draftEntry(). Die einzelnen
     Übungen bleiben stehen, in den Wochenzielen haben sie keinen Platz. */
  var tkMon = selWeek(), tkList = [];
  Object.keys(S.plans).forEach(function (p) {
    var tkE = draftEntry(p, tkMon), tkV = tkE.on ? tkE.times : 0;
    if (tkV) tkList.push(p + " " + tkV + "×");
    /* Kein Ballast: wer nie ein Ziel hatte und keins bekommt, bleibt ohne Eintrag. */
    if (tkV || S.settings.weekGoals[p] != null) S.settings.weekGoals[p] = tkV;
  });
  writeWeekGoalLog();
  /* Geleert wird der Entwurf, der gerade galt: seine Zahlen stehen jetzt in den
     Wochenzielen, leer zeigt also dasselbe und folgt einer späteren Änderung
     der Wochenziele wieder. */
  weekDraft(tkMon).plans = {};
  saveDraft();
  persist();
  var tkWk = S.draft.split ? " aus KW " + isoWeekNo(tkMon) : "";
  S.note = tkList.length
    ? "Wochenziele" + tkWk + " übernommen: " + tkList.join(", ") + "."
    : "Wochenziele übernommen, kein Plan hat mehr ein Ziel.";
};

ACTIONS.delplan = function (v) {
  if (!window.confirm("Plan " + v + " mit " + (S.plans[v] ? S.plans[v].length : 0) +
      " Übungen wirklich löschen?")) return false;
  S.undo = { kind:"plan", plan:v, item:S.plans[v], color:S.colors[v],
    goal:S.settings.weekGoals[v], goalLog:S.settings.weekGoalLog[v],
    label:"Plan " + v + " gelöscht." };
  delete S.plans[v];
  delete S.colors[v];
  delete S.settings.weekGoals[v];
  delete S.settings.weekGoalLog[v];
  var dhx = S.settings.hiddenPlans.indexOf(v);
  if (dhx >= 0) S.settings.hiddenPlans.splice(dhx, 1);
  var dlx = S.settings.lockedPlans.indexOf(v);
  if (dlx >= 0) S.settings.lockedPlans.splice(dlx, 1);
  if (S.plan === v) { S.plan = ""; S.plansFold = false; }
  S.note = "";
  persist();
};
ACTIONS.resetplans = function () {
  if (!window.confirm("Alle Pläne auf den Ausgangsstand zurücksetzen? " +
      "Eigene Zielwerte und selbst angelegte Pläne gehen dabei verloren.")) return false;
  S.plans = JSON.parse(JSON.stringify(DEFAULT_PLANS));
  S.settings.hiddenPlans = [];
  S.settings.lockedPlans = [];
  S.settings.weekGoals = {};
  S.settings.weekGoalLog = {};
  S.plan = ""; S.plansFold = false;
  S.undo = null;
  S.note = "Pläne auf den Ausgangsstand zurückgesetzt.";
  persist();
};

document.addEventListener("click", function (ev) {
  var el = ev.target.closest ? ev.target.closest("[data-act]") : null;
  if (!el) return;
  var act = el.getAttribute("data-act"), v = el.getAttribute("data-v");
  if (act === "input" || act === "pedit" ||
      act === "search" || act === "catmove" || act === "hsearch" ||
      act === "colorset" || act === "noteinput" || act === "stepset" ||
      act === "exnoteinput" || act === "exnoteset" || act === "defedit" ||
      act === "exrestset" ||
      act === "muscleset" || act === "newmuscleprimary" ||
      act === "weekgoaledit") return;

  /* Der Abschluss-Hinweis (endWarnBlock) gilt nur für den Moment der Nachfrage:
     jede andere Aktion räumt ihn stillschweigend wieder ab. */
  if (S.focusEndConfirm && act !== "focusfinishask" && act !== "focusfinishcancel" &&
      act !== "focusfinish") {
    S.focusEndConfirm = false;
  }

  var fn = ACTIONS[act];
  if (!fn) return;
  if (fn(v, el) === false) return;
  render();
});

document.getElementById("filein").addEventListener("change", function (ev) {
  var f = ev.target.files && ev.target.files[0];
  if (!f) return;
  var reader = new FileReader();
  reader.onload = function () {
    try {
      var n = mergeBackup(String(reader.result));
      S.note = n + " Sätze aus " + f.name + " ergänzt, " + S.entries.length + " insgesamt.";
    } catch (e) {
      S.note = e && e.message && e.message.indexOf("Backup ungültig:") === 0
        ? e.message : "Die Datei " + f.name + " ist kein gültiges HantelKladde-Backup.";
    }
    ev.target.value = "";
    render();
  };
  reader.onerror = function () { S.note = "Die Datei konnte nicht gelesen werden."; render(); };
  reader.readAsText(f);
});

/* Reihenfolge im Plan per Ziehen am Griff */
var drag = null;
var lastSave = 0;

function rowAfter(cont, y) {
  var rows = [].slice.call(cont.querySelectorAll(".prow:not(.drag)"));
  var best = null, bestOffset = Number.NEGATIVE_INFINITY;
  rows.forEach(function (r) {
    var box = r.getBoundingClientRect();
    var offset = y - box.top - box.height / 2;
    if (offset < 0 && offset > bestOffset) { bestOffset = offset; best = r; }
  });
  return best;
}

document.addEventListener("pointerdown", function (ev) {
  var h = ev.target.closest ? ev.target.closest('[data-act="phandle"]') : null;
  if (!h) return;
  var row = h.closest(".prow");
  if (!row || !row.parentNode) return;
  drag = { row:row, cont:row.parentNode, plan:h.getAttribute("data-p"),
    idx:parseInt(h.getAttribute("data-i"), 10), y0:ev.clientY, moved:false };
  row.classList.add("drag");
  try { h.setPointerCapture(ev.pointerId); } catch (e) {}
  try { if (navigator.vibrate) navigator.vibrate(12); } catch (e) {}
  ev.preventDefault();
});

document.addEventListener("pointermove", function (ev) {
  if (!drag) return;
  if (!drag.moved && Math.abs(ev.clientY - drag.y0) < 6) return;
  drag.moved = true;
  ev.preventDefault();
  var after = rowAfter(drag.cont, ev.clientY);
  if (!after) { drag.cont.appendChild(drag.row); }
  else if (after !== drag.row) { drag.cont.insertBefore(drag.row, after); }
}, { passive:false });

function endDrag() {
  if (!drag) return;
  var d = drag;
  drag = null;
  d.row.classList.remove("drag");
  var list = S.plans[d.plan];
  if (!list) { render(); return; }
  if (d.moved) {
    var order = [].slice.call(d.cont.querySelectorAll(".prow")).map(function (r) {
      return parseInt(r.getAttribute("data-i"), 10);
    });
    var next = [];
    order.forEach(function (i) { if (list[i]) next.push(list[i]); });
    if (next.length === list.length) S.plans[d.plan] = next;
    persist();
  } else if (d.idx > 0) {
    var tmp = list[d.idx];
    list[d.idx] = list[d.idx - 1];
    list[d.idx - 1] = tmp;
    persist();
  }
  render();
}
document.addEventListener("pointerup", endDrag);
document.addEventListener("pointercancel", endDrag);

/* Reiter per Wischen wechseln */
var VIEWS = ["tag","plaene","planung","verlauf","daten"];
var swipe = null;

document.addEventListener("touchstart", function (ev) {
  if (S.focus) { swipe = null; return; }
  if (ev.touches.length !== 1) { swipe = null; return; }
  var blocked = ev.target.closest &&
    ev.target.closest(".week, .list, .chart, .handle, input, select, textarea, .repsrow");
  if (blocked) { swipe = null; return; }
  var t = ev.touches[0];
  swipe = { x:t.clientX, y:t.clientY, ts:Date.now() };
}, { passive:true });

/* Wischen auf der Reps-Reihe im Fokus-Modus: verschiebt nur den sichtbaren
   Ausschnitt, ändert nie die Auswahl selbst. Nach rechts zeigt niedrigere Werte,
   nach links höhere, unabhängig von der Wischnavigation zwischen den Reitern. */
var repSwipe = null;
document.addEventListener("touchstart", function (ev) {
  var row = ev.target.closest && ev.target.closest(".repsrow");
  if (!row || ev.touches.length !== 1) { repSwipe = null; return; }
  repSwipe = ev.touches[0].clientX;
}, { passive:true });
document.addEventListener("touchend", function (ev) {
  if (repSwipe == null) return;
  var dx = ev.changedTouches[0].clientX - repSwipe;
  repSwipe = null;
  if (Math.abs(dx) < 28) return;
  var cur = parseInt(S.reps, 10);
  if (!(cur > 0)) cur = 10;
  var center = repWinCenter != null ? repWinCenter : cur;
  repWinCenter = Math.max(3, center + (dx > 0 ? -5 : 5));
  render();
}, { passive:true });

document.addEventListener("touchend", function (ev) {
  var s = swipe;
  swipe = null;
  if (!s || drag) return;
  var t = ev.changedTouches[0];
  var dx = t.clientX - s.x, dy = t.clientY - s.y;
  if (Date.now() - s.ts > 800) return;
  if (Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 2) return;
  var i = VIEWS.indexOf(S.view) + (dx < 0 ? 1 : -1);
  if (i < 0 || i >= VIEWS.length) return;
  S.view = VIEWS[i];
  S.pickOpen = false;
  closeWeekOverview();
  S.note = "";
  render();
  window.scrollTo({ top:0 });
}, { passive:true });

/* Eingaben beim Tippen, das Gegenstück zu ACTIONS für input-Ereignisse, der
   Schlüssel ist wieder das data-act. Anders als nach einem Tipp auf einen Knopf
   baut hier der Verteiler nicht neu auf: ein render() mitten im Tippen nähme dem
   Feld den Fokus. Die zwei Suchfelder, die trotzdem neu aufbauen müssen, holen
   sich Fokus und Schreibmarke danach selbst zurück, siehe searchInput(). Der
   Klick-Verteiler kennt diese Aktionen und lässt sie durch. */
var INPUT_ACTIONS = Object.create(null);
INPUT_ACTIONS.input = function (el) {
  var field = el.getAttribute("data-f");
  S[field] = el.value;
  if (field === "reps" || field === "weight") {
    S.source = "";
    /* Beim Tippen kein komplettes render(), sonst verlöre das Feld den Fokus.
       Nur die nun überholte Begründungszeile direkt entfernen. */
    var suggestion = document.querySelector(".suggestion");
    if (suggestion && suggestion.parentNode) suggestion.parentNode.removeChild(suggestion);
  }
};
/* Ein Suchfeld: Treffer neu aufbauen, dann Fokus und Schreibmarke zurückholen.
   Bis 1.30.4 stand das zweimal da, für die Übungssuche und die im Verlauf. */
function searchInput(el, key, id) {
  var pos = el.selectionStart;
  S[key] = el.value;
  render();
  var again = document.getElementById(id);
  if (again) {
    again.focus();
    var at = pos == null ? again.value.length : pos;
    try { again.setSelectionRange(at, at); } catch (e) {}
  }
}
INPUT_ACTIONS.search = function (el) { searchInput(el, "search", "searchEx"); };
INPUT_ACTIONS.hsearch = function (el) { searchInput(el, "hsearch", "histSearch"); };
INPUT_ACTIONS.defedit = function (el) {
  var f = el.getAttribute("data-f");
  var whole = (f === "reps" || f === "sets");
  var val = whole ? parseInt(el.value, 10) : deci(el.value);
  if (!isNaN(val) && val >= (whole ? 1 : 0)) {
    S.settings[f === "sets" ? "defSets" : f === "reps" ? "defReps" : "defWeight"] = val;
    persistKey(SET_KEY, S.settings);
  }
};
INPUT_ACTIONS.weekgoaledit = function (el) {
  var n = parseInt(el.value, 10);
  if (!isNaN(n) && n >= 0) {
    /* Ändert nur die aktuelle Zahl, noch keinen Log-Eintrag - das macht erst
       der Knopf "Neues Wochenziel speichern" (weekgoalrestart), sonst würde
       jeder Tastendruck einen eigenen Historien-Eintrag erzeugen. */
    S.settings.weekGoals[el.getAttribute("data-v")] = n;
    /* Kein render() hier (siehe unten bei "change"), also den Knopf von Hand
       mitziehen statt die Seite neu aufzubauen. */
    var btn = document.querySelector('[data-act="weekgoalrestart"]');
    if (btn) btn.disabled = !weekGoalPending();
  }
};
INPUT_ACTIONS.pedit = function (el) {
  var p = el.getAttribute("data-p"), i = parseInt(el.getAttribute("data-i"), 10);
  var f = el.getAttribute("data-f");
  var whole = (f === "reps" || f === "sets");
  var val = whole ? parseInt(el.value, 10) : deci(el.value);
  if (!isNaN(val) && S.plans[p] && S.plans[p][i]) {
    S.plans[p][i][f] = Math.max(whole ? 1 : 0, val);
  }
};
INPUT_ACTIONS.noteinput = function (el) {
  if (el.value.trim()) S.notes[S.date] = el.value;
  else delete S.notes[S.date];
  persistKey(NOTES_KEY, S.notes);
};
INPUT_ACTIONS.exnoteinput = function (el, act) {
  /* Kein render(), das würde das Feld beim Tippen unter dem Finger neu aufbauen.
     Gesichert wird sofort, aber nur der eine Schlüssel, damit nicht bei jedem
     Zeichen der gesamte Datenbestand serialisiert wird. */
  setExNote(act === "exnoteinput" ? S.exercise : el.getAttribute("data-v"), el.value);
  persistKey(EXMETA_KEY, S.exmeta);
  /* Die Anzeigezeile darüber zieht von Hand mit, statt über einen Neuaufbau */
  var lab = document.querySelector(".exnote > span");
  if (lab && act === "exnoteinput") {
    var lv = el.value.trim();
    lab.textContent = lv || "Geräteeinstellung notieren";
    /* "blank" wie in exNoteBlock(), nicht "empty" - dafür gibt es keine Regel,
       der Knopf behielte sonst die Optik einer gefüllten Notiz. */
    lab.parentNode.className = "exnote" + (lv ? "" : " blank");
  }
};
/* Dieselbe Notiz, nur aus der Übungsliste unter Daten statt aus dem Training */
INPUT_ACTIONS.exnoteset = INPUT_ACTIONS.exnoteinput;

document.addEventListener("input", function (ev) {
  var el = ev.target;
  var act = el.getAttribute ? el.getAttribute("data-act") : null;
  var fn = act ? INPUT_ACTIONS[act] : null;
  if (fn) fn(el, act);
  /* Das Textfeld von "Als Text anzeigen" hat kein data-act, es ist das einzige
     seiner Art und wird nur gelesen, siehe dataBackup(). */
  else if (el.id === "out") S.out = el.value;
});

document.addEventListener("change", function (ev) {
  var el = ev.target;
  var act = el.getAttribute ? el.getAttribute("data-act") : null;
  if (act === "newmuscleprimary") {
    var secondary = document.getElementById(el.getAttribute("data-target"));
    if (!secondary) return;
    secondary.disabled = !el.value;
    if (!el.value || secondary.value === el.value) secondary.value = "";
  }
  else if (act === "colorset") {
    S.colors[el.getAttribute("data-v")] = el.value;
    persist();
    render();
  }
  else if (act === "catmove") {
    var msel = document.getElementById("mv-" + el.getAttribute("data-i"));
    var nm = msel ? msel.value : "", target = el.value;
    if (!nm || !target) { el.value = ""; return; }
    S.cats[nm] = target;
    S.custom.forEach(function (c) {
      if (typeof c === "object" && c.name === nm) c.cat = target;
    });
    S.dataClosed[target] = false;
    S.note = nm + " steht jetzt unter " + target + ".";
    persist();
    render();
  }
  else if (act === "pedit" || act === "weekgoaledit") { persist(); }
  /* Kein render() beim Verlassen des Feldes. Es würde die Seite noch vor dem Klick
     neu aufbauen, der den Fokus genommen hat, und dieser Klick ginge verloren. */
  else if (act === "exnoteinput" || act === "exnoteset") { persist(); }
  else if (act === "stepset") {
    var sn = el.getAttribute("data-v"), sv = parseFloat(el.value);
    if (sn && sv > 0) {
      if (!S.exmeta[sn]) S.exmeta[sn] = {};
      S.exmeta[sn].step = sv;
      persist();
      render();
    }
  }
  else if (act === "exrestset") {
    var rn = el.getAttribute("data-v"), rv = parseInt(el.value, 10) || 0;
    if (rn) {
      if (!S.exmeta[rn]) S.exmeta[rn] = {};
      /* Die Null steht für "wie eingestellt". Sie wird nicht gespeichert, sondern
         räumt einen früheren Wert weg - auch den mitgelieferten. */
      if (rv > 0) S.exmeta[rn].rest = rv;
      else S.exmeta[rn].rest = 0;
      persist();
      render();
    }
  }
  else if (act === "muscleset") {
    var mn = el.getAttribute("data-v"), mf = el.getAttribute("data-f");
    if (!mn) return;
    if (!S.exmeta[mn]) S.exmeta[mn] = {};
    S.exmeta[mn][mf === "primary" ? "musclePrimary" : "muscleSecondary"] = el.value;
    /* Ohne Primär ist Sekundär bedeutungslos, siehe muscleOf(): das Dropdown ist
       dann gesperrt, ein vorher gewählter Wert soll aber nicht stehen bleiben.
       Dasselbe, wenn Primär auf die Gruppe wechselt, die schon als Sekundär
       steht - sonst zählte ein Satz mit 1,5 in diese eine Gruppe. */
    if (mf === "primary" &&
        (!el.value || el.value === S.exmeta[mn].muscleSecondary)) {
      S.exmeta[mn].muscleSecondary = "";
    }
    persist();
    render();
  }
});

/* Eingabetaste bestätigt das jeweilige Feld */
document.addEventListener("keydown", function (ev) {
  if (ev.key !== "Enter") return;
  var el = ev.target, id = el ? el.id : "";
  var act = "";
  if (id === "newName") act = "addex";
  else if (id === "dataNewName") act = "addexdata";
  else if (id === "newPlan") act = "addplan";
  else if (id === "in-reps" || id === "in-weight" || id === "in-rpe") {
    act = S.editId ? "update" : "save";
  }
  /* Enter im Notizfeld schließt es nur, gespeichert ist der Text längst */
  else if (id === "exNote" || id === "cnote-in") {
    ev.preventDefault();
    el.blur();
    if (id === "exNote") S.exNoteFor = "";
    persist();
    render();
    return;
  }
  else if (id === "ren-name") {
    ev.preventDefault();
    el.blur();
    var rbtn = document.querySelector('[data-act="rendo"]');
    if (rbtn) rbtn.click();
    return;
  }
  if (!act) return;
  ev.preventDefault();
  el.blur();
  var btn = document.querySelector('[data-act="' + act + '"]');
  if (btn) btn.click();
});

/* Zahl beim Antippen markieren, damit sie direkt überschrieben wird */
var selPending = null;
function selectAll(el) { try { el.select(); } catch (e) {} }
document.addEventListener("focusin", function (ev) {
  var el = ev.target;
  if (!el || el.tagName !== "INPUT" || !el.parentNode ||
      el.parentNode.className !== "val") { selPending = null; return; }
  selPending = el;
  setTimeout(function () { if (selPending === el) selectAll(el); }, 0);
});
function finishSelect(ev) {
  if (!selPending || ev.target !== selPending) return;
  var el = selPending;
  selPending = null;
  ev.preventDefault();
  selectAll(el);
}
document.addEventListener("mouseup", finishSelect, true);

/* Letztes Netz: Die bekannten Stolperstellen im Speicher sind seit 1.14.6
   repariert (repairEntries()/repairPlans()/muscleOf()), aber ein Abbruch hier
   hieße weiterhin weiße Seite statt App - und damit kein Weg mehr an die eigenen
   Daten oder an "Als Text anzeigen". Deshalb lieber mit dem starten, was gelesen
   werden konnte, und offen sagen, dass etwas fehlen kann. Automatisch gespeichert
   wird dabei nichts; der nächste bewusste Eingriff überschreibt den Stand. */
try {
  load();
} catch (e) {
  S.note = "Die gespeicherten Daten konnten nicht vollständig gelesen werden (" +
    (e && e.message ? e.message : "unbekannter Fehler") +
    "). Sichere unter Daten sofort ein Backup, bevor du etwas änderst.";
}
/* Reiter aus einem Shortcut und die Markierung des Teilen-Wegs stehen in der
   Adresse und müssen vor dem ersten Aufbau gelesen sein. */
var sharedFlag = startParams();
/* Wo das Training zuletzt stand, still zurückholen, siehe restoreSession().
   Nach startParams(), damit ein Reiter aus der Adresse das letzte Wort behält
   und der History-Eintrag des Fokus-Modus nicht gleich wieder überschrieben wird. */
restoreSession();
/* Hat die Sitzung weder Plan noch Übung zurückgebracht, gilt der für den Tag
   zugewiesene, siehe preselectPlan(). Ein leerer Plan allein reicht als Prüfung
   nicht: wer den Plan abgewählt und dann eine Übung samt Werten eingestellt hat,
   bekäme sonst über selectPlan() Übung, Werte und Aufwärmzustand überschrieben. */
if (!S.plan && !S.exercise) preselectPlan();
restoreRest();
S.pwa.standalone = standalone();
render();
takeSharedBackup(sharedFlag);
refreshStorage(rerenderData);
</script>
