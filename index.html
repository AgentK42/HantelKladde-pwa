   Sätze sollen auffallen, solange ein älteres Backup sie noch zurückholen kann. */
function repairNote() {
  var parts = [];
  if (loadRepairs.dropped) {
    parts.push(loadRepairs.dropped +
      (loadRepairs.dropped === 1 ? " unlesbarer Satz" : " unlesbare Sätze") + " entfernt");
  }
  if (loadRepairs.entries) {
    parts.push(loadRepairs.entries +
      (loadRepairs.entries === 1 ? " Satz" : " Sätze") + " mit fehlenden Werten ergänzt");
  }
  if (loadRepairs.plans) {
    parts.push(loadRepairs.plans +
      (loadRepairs.plans === 1 ? " Planeintrag" : " Planeinträge") + " berichtigt");
  }

     entriesOn() und backupSize(). */
  clearDayIndex();
  backupBytes = -1;
  try {
    localStorage.setItem(KEY, JSON.stringify(S.entries));
    localStorage.setItem(CUSTOM_KEY, JSON.stringify(S.custom));
    localStorage.setItem(PLANS_KEY, JSON.stringify(S.plans));
    localStorage.setItem(SET_KEY, JSON.stringify(S.settings));
    localStorage.setItem(META_KEY, JSON.stringify(S.meta));
    localStorage.setItem(CATS_KEY, JSON.stringify(S.cats));
    localStorage.setItem(COLOR_KEY, JSON.stringify(S.colors));
    localStorage.setItem(EXMETA_KEY, JSON.stringify(S.exmeta));
    localStorage.setItem(NOTES_KEY, JSON.stringify(S.notes));

  } catch (e) { S.storeOk = false; }
}
/* Nur ein einzelner Schlüssel. Beim Tippen in ein Textfeld soll nicht bei jedem

function persistKey(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
}
/* Angenommene und verworfene Vorschläge überstehen ab 1.14.6 einen Neustart.

/* Wo im Training man gerade steht, überlebt seit 1.17.2 einen Neustart. Anlass war
   der Fokus-Modus: ein versehentliches Neuladen warf einen in den leeren
   Trainingsreiter zurück, Plan, Übung und die eingestellten Werte waren weg. Die
   Geste selbst ist inzwischen abgestellt (overscroll-behavior, siehe html/body),
   aber ein Neustart kommt auch anders zustande - das System räumt die App im
   Hintergrund weg, das ServiceWorker-Update lädt neu, das Fenster wird zugeklappt.

   Bewusst ein eigener Schlüssel und nicht S.settings, genau wie beim Pausentimer
   und bei den Vorschlägen: das ist Sitzungszustand, kein Datenbestand, und im

var SESSION_MAX_AGE = 4 * 3600 * 1000;
var lastSessionJson = "";
function saveSession() {
  var d = { day:S.date, view:S.view, focus:!!S.focus, plan:S.plan,
    exercise:S.exercise, reps:S.reps, weight:S.weight, rpe:S.rpe,
    warm:!!S.warm, warmBase:S.warmBase, warmReps:S.warmReps, warmRpe:S.warmRpe };
  var json = JSON.stringify(d);
  /* Der Zeitstempel steht bewusst außerhalb des Vergleichs: sonst wäre jeder
     Neuaufbau eine Änderung und schriebe. So altert der Stempel, solange sich
     nichts tut, und misst damit "zuletzt etwas getan". */

  lastSessionJson = json;
  d.ts = Date.now();
  persistKey(SESSION_KEY, d);
}
function restoreSession() {
  var d = readJson(SESSION_KEY, null);
  if (!d || typeof d !== "object" || Array.isArray(d)) return;
  if (typeof d.ts !== "number" || Date.now() - d.ts > SESSION_MAX_AGE) {
    try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
    return;
  }
  if (typeof d.day === "string" && /^\d{4}-\d{2}-\d{2}$/.test(d.day)) S.date = d.day;
  if (!startFromUrl && VIEWS.indexOf(d.view) >= 0) S.view = d.view;
  /* Plan und Übung können seit dem Speichern gelöscht oder umbenannt worden
     sein. Was es nicht mehr gibt, bleibt leer, statt eine Auswahl vorzutäuschen. */
  if (typeof d.plan === "string" && S.plans[d.plan]) S.plan = d.plan;
  if (typeof d.exercise === "string" && allNames().indexOf(d.exercise) >= 0) {
    S.exercise = d.exercise;
  }
  ["reps", "weight", "rpe"].forEach(function (k) {
    if (typeof d[k] === "string" && d[k].length <= 8) S[k] = d[k];
  });
  if (d.warm && S.exercise) {
    S.warm = true;
    S.warmBase = typeof d.warmBase === "number" ? d.warmBase : 0;
    S.warmReps = typeof d.warmReps === "string" ? d.warmReps : "";
    S.warmRpe = typeof d.warmRpe === "string" ? d.warmRpe : "";
  }
  if (d.focus && !startFromUrl) {
    S.focus = true;
    /* Ohne eigenen History-Eintrag schließt die Zurück-Geste im installierten
       Fenster sofort die ganze App, siehe navOpen(). Der Stapel ist nach einem
       Neustart leer und muss nachgezogen werden - aber nicht immer durch einen
       neuen Eintrag: wurde mitten im Fokus-Modus neu geladen, trägt der Eintrag,
       auf dem die App wieder hochkommt, bereits ein hk. Dann noch einmal zu
       pushen hieße zwei Zurück-Gesten, um eine Ebene zu schließen. In dem Fall

}
function loadSuggestions() {
  var raw = readJson(SUGGEST_KEY, null);
  if (!raw || typeof raw !== "object" || Array.isArray(raw)) return;
  var today = todayISO(), out = {};

    if (k.indexOf(today + "\n") !== 0) return;
    var v = raw[k];
    if (!v || typeof v !== "object") return;
    if (!(v.reps > 0) || !(v.weight >= 0)) return;
    out[k] = { reps:v.reps, weight:v.weight,
      rpe:(typeof v.rpe === "number" ? v.rpe : null) };
  });
  S.suggestionHandled = out;
  if (Object.keys(out).length !== Object.keys(raw).length) saveSuggestions();
}

/* ---------- Abfragen ---------- */
function customNames() {
  return S.custom.map(function (c) { return typeof c === "string" ? c : c.name; });
}
function catOf(name) {
  if (S.cats[name] && CATLIST.concat(["Sonstige"]).indexOf(S.cats[name]) >= 0) {
    return S.cats[name];
  }
  var hit = "Sonstige";
  CATLIST.forEach(function (c) { if (CATS[c].indexOf(name) >= 0) hit = c; });
  if (hit !== "Sonstige") return hit;
  S.custom.forEach(function (c) {
    if (typeof c === "object" && c.name === name && c.cat) hit = safeCat(c.cat);
  });
  return hit;
}
function usedOrder() {
  var last = {};
  S.entries.forEach(function (e) {
    if (!last[e.exercise] || e.ts > last[e.exercise]) last[e.exercise] = e.ts;
  });
  return Object.keys(last).sort(function (a,b) { return last[b]-last[a]; });
}
function allNames() {
  var seen = {}, out = [];

    S.plans[p].forEach(function (i) { fromPlans.push(i.name); });
  });
  PRESETS.concat(fromPlans, customNames(), usedOrder()).forEach(function (n) {
    if (n && !seen[n]) { seen[n]=1; out.push(n); }
  });
  /* Mitgelieferte Übungen, die umbenannt wurden, verschwinden aus der Liste. Sie
     stünden sonst leer im Auswahlmenü. Sobald wieder Sätze oder ein Planeintrag an
     ihnen hängen, sind sie von selbst zurück. */

  if (!hid.length) return out;
  return out.filter(function (n) {
    if (hid.indexOf(n) < 0) return true;
    if (fromPlans.indexOf(n) >= 0) return true;
    return S.entries.some(function (e) { return e.exercise === n; });
  });
}
/* Aufwärmsätze zählen nirgends mit, weder für Rekorde noch für Volumen oder Planziele */
function isWork(e) { return !e.warm; }
function workOf(name) {
  return S.entries.filter(function (e) { return e.exercise === name && isWork(e); });
}

/* Schrittweite, Langhantel-Kennzeichnung, Pause und Geräteeinstellung je Übung */
function exMeta(name) {

  var rt = own.rest != null ? own.rest : def.rest;
  return {
    step: (typeof st === "number" && st > 0) ? st : DEFAULT_STEP,
    bar: own.bar != null ? !!own.bar : !!def.bar,
    /* 0 heißt: diese Übung hat keine eigene Pause und folgt den Einstellungen. */

  var vals = REST_CHOICES.slice();

    vals.push(cur);
    vals.sort(function (a, b) { return a - b; });
  }

function exRest(name) {
  var r = name ? exMeta(name).rest : 0;
  return r > 0 ? r : (S.settings.rest || 90);

/* Nach dem Aufwärmen ist die Pause kurz. Steht die Übung selbst unter WARM_REST,

function warmRest(name) { return Math.min(WARM_REST, exRest(name)); }

function defaultSets() { return S.settings.defSets > 0 ? S.settings.defSets : DEFAULT_SETS; }
function defaultReps() { return S.settings.defReps > 0 ? S.settings.defReps : 10; }
function defaultWeight() { return S.settings.defWeight >= 0 ? S.settings.defWeight : 20; }
/* Punkt 1 in 1.5.2: die Einstellung am Gerät, etwa Sitzhöhe oder Griffweite.
   Sie hängt an der Übung, nicht am Tag, und steht deshalb in exmeta. */
function noteOf(name) { return name ? exMeta(name).note : ""; }
function setExNote(name, text) {
  if (!name) return;
  var t = String(text).trim();
  if (t) {
    if (!S.exmeta[name]) S.exmeta[name] = {};
    S.exmeta[name].note = t;
  } else if (S.exmeta[name]) {
    delete S.exmeta[name].note;
  }
}
/* Punkt 13: Startwerte für Sätze/Reps/Gewicht, direkt beim Anlegen einer neuen
   Übung mit eingegeben. Sie greifen nur, solange lastSession() noch nichts
   liefert, siehe padd()/pickmultidone() - danach übernimmt die Historie. */
function exStart(name) { return (name && S.exmeta[name]) || {}; }
function setExStart(name, setsEl, repsEl, weightEl) {
  var sets = setsEl ? parseInt(setsEl.value, 10) : NaN;
  var reps = repsEl ? parseInt(repsEl.value, 10) : NaN;
  var weight = weightEl ? deci(weightEl.value) : NaN;
  if (!(sets > 0) && !(reps > 0) && !(weight >= 0)) return;
  if (!S.exmeta[name]) S.exmeta[name] = {};

/* Primär-/Sekundärmuskel direkt bei der Übungsanlage mit eingeben, siehe

   zusätzlich hier ignoriert. Eine leere Sekundärwahl löscht einen

   Sekundär gleich Primär wird verworfen statt doppelt gezählt, siehe muscleOf(). */

  S.exmeta[name].musclePrimary = primary;
  if (secondary && secondary !== primary) S.exmeta[name].muscleSecondary = secondary;
  else S.exmeta[name].muscleSecondary = "";

    return base;
  }
  /* Nie zwei Schrittweiten auf einmal, wenn der Schritt relativ zum Gewicht ohnehin
     groß ist - genau dann ist ja schon eine Schrittweite viel. Bis 1.14.5 hing das
     allein an der fehlenden Range, und die fehlt auch einer Übung ohne Planeintrag,
     unabhängig von ihrer Schrittweite: eine freie Übung sprang so von 20 auf 25 kg,
     also um 25 Prozent. Deshalb hier dieselbe Verhältnisrechnung wie in
     repFirstOn(), aber ohne dessen Schalter - die Größe des Sprungs hängt nicht
     daran, ob die Rep-Leiter eingeschaltet ist. */
  var bothStrong = avg != null && avg <= 7 && prevBlock.avg != null && prevBlock.avg <= 7;
  var bigStep = !(w > 0) || step / w > S.settings.repFirstThresh;
  var mult = (!rng && bothStrong && !bigStep) ? 2 : 1;
  var confirmRpes = block.rpes.concat(prevBlock.rpes);
  var confirmAvg = confirmRpes.length
    ? confirmRpes.reduce(function (a,b) { return a+b; }, 0) / confirmRpes.length : null;
  return {
    reps: rng ? rng.lo : goalReps,
    weight: Math.round((w + step * mult) * 100) / 100,
    rpe: lastSet.rpe,
    up: true,
    why: rng
      ? "+" + num(step) + " kg, " + goalSets + "x " + rng.hi +
        " in 2 Einheiten bestätigt" +
        (confirmAvg != null ? " @ RPE " + num(confirmAvg) : "") + " – zurück auf " + rng.lo
      : "+" + num(step * mult) + " kg, " + goalSets + "x " + goalReps +
        " in 2 Einheiten bestätigt" +
        (confirmAvg != null ? " @ RPE " + num(confirmAvg) : "")
  };
}
/* Zurück auf Gewicht, Wiederholungen und RPE des Arbeitssatzes, von dem die Rampe
   stammt. Der RPE kommt seit 1.27.1 mit: Aufwärmsätze führen keinen, und nach dem
   letzten Rampensatz soll wieder der Zielwert dastehen. */
function backToWork() {
  if (S.warmBase > 0) S.weight = comma(S.warmBase);
  if (S.warmReps) S.reps = S.warmReps;
  if (S.warmRpe) S.rpe = S.warmRpe;
  clearWarm();
  repWinCenter = null;
}
/* Der Wechsel ins Aufwärmen merkt sich den Arbeitssatz, zu dem backToWork()
   zurückkehrt. Läuft das Aufwärmen schon, bleibt der erste Merker stehen. Die vier
   Felder gehören zusammen und werden nur hier und in clearWarm() angefasst; bis
   1.29.0 standen sie an fünf Stellen ausgeschrieben, und genau so blieb der RPE
   in 1.27.0 beim Zurückkehren liegen. */
function enterWarm(base) {
  if (S.warm) return;
  S.warmBase = base;
  S.warmReps = S.reps;
  S.warmRpe = S.rpe;
  S.warm = true;
}
function clearWarm() {
  S.warm = false;
  S.warmBase = 0;
  S.warmReps = "";
  S.warmRpe = "";
}
function applySuggestion(name) {
  clearWarm();
  repWinCenter = null;
  /* Der Merker hält nur, solange an diesem Tag noch kein Arbeitssatz dieser Übung
     steht. Sobald einer da ist, gilt die Fortsetzungsregel aus suggestFor(): weiter
     mit dem Gewicht, das heute tatsächlich gelaufen ist. Sonst springt das Feld beim
     Zurückwechseln auf den angenommenen Vorschlag zurück, obwohl bewusst anders
     trainiert wurde - und der nächste Satz landet mit dem falschen Gewicht im Log.
     Ein erneuter Vorschlag entsteht dadurch nicht, suggestFor() liefert für den
     laufenden Tag immer up:false. */
  var handled = S.suggestionHandled[S.date + "\n" + name];
  if (handled && !doneSets(name, S.date)) {
    S.reps = String(handled.reps);
    S.weight = comma(handled.weight);
    if (handled.rpe != null) S.rpe = comma(handled.rpe);
    S.source = "";
    return;
  }
  var s = suggestFor(name);
  if (!s) { S.source = ""; return; }
  S.reps = String(s.reps);
  S.weight = comma(s.weight);
  if (s.rpe != null) S.rpe = comma(s.rpe);
  /* Die Entscheidung erscheint nur bei einer tatsächlichen Steigerung. Ein gehaltenes
     Gewicht oder unverändertes Planziel brauchen keine zusätzliche Nachfrage. */
  S.source = s.up ? s.why : "";
}
/* Entwurf 1: kompakter Vorschlag unter „Letztes Top Set“. Der hervorgehobene Wert ist
   das Gewicht bei einem Lastsprung und sonst die vorgeschlagene Wiederholungszahl. */
function suggestionBlock() {
  if (!S.source) return "";
  var t = planTarget(S.exercise), w = deci(S.weight), r = parseInt(S.reps, 10);
  var prior = t;
  if (!prior) {
    var priorRun = lastSession(S.exercise, S.date);
    prior = mainWorkBlock(priorRun, priorRun ? priorRun.sets.length : 1, NaN);
  }
  var weightChanged = prior && isFinite(w) && Math.abs(w - prior.weight) > 0.001;
  var label = weightChanged ? num(w) + " kg" : r + " Reps";
  return '<div class="suggestion">' + svg("trend", 17) +
    '<div class="suggestion-copy"><b>Vorschlag: ' + esc(label) + '</b>' +
    '<span>' + esc(S.source) + '</span></div>' +
    '<div class="suggestion-actions">' +
    '<button class="accept" data-act="suggestaccept">' + svg("haken", 13) +
    'Annehmen</button>' +
    '<button data-act="suggestreject">' + svg("kreuz", 13) + 'Verwerfen</button>' +
    '</div></div>';
}
function planIndex() {
  if (!S.plan || !S.exercise || !S.plans[S.plan]) return -1;
  var list = S.plans[S.plan];
  for (var i = 0; i < list.length; i++) { if (list[i].name === S.exercise) return i; }
  return -1;
}
/* Erste noch offene Übung des aktiven Plans, für den Fall, dass im Fokus-Modus
   gerade eine plan-fremde Übung läuft (siehe rightBtn in viewFocus()). */
function nextPlanOpen() {
  if (!S.plan || !S.plans[S.plan]) return null;
  var list = S.plans[S.plan];
  for (var i = 0; i < list.length; i++) {
    var need = list[i].sets > 0 ? list[i].sets : defaultSets();
    if (doneSets(list[i].name, S.date) < need) return list[i];
  }
  return null;
}
/* Ist jede Übung des aktiven Plans erledigt? Anders als das Satzziel der gerade

   viewFocus(): sonst zeigt nur die letzte Übung "Trainingsplan abschließen". */
function planAllDone() {
  return !!(S.plan && S.plans[S.plan] && S.plans[S.plan].length) && !nextPlanOpen();
}
/* Anzahl der Übungen, die im aktiven Plan ihr Satzziel noch nicht erreicht haben,

   letzten Übung der Reihenfolge erscheint, siehe rightBtn in viewFocus(). */
function openPlanCount() {
  if (!S.plan || !S.plans[S.plan]) return 0;
  return S.plans[S.plan].filter(function (i) {
    var need = i.sets > 0 ? i.sets : defaultSets();
    return doneSets(i.name, S.date) < need;
  }).length;
}
/* Punkt 1: Backup fällig? */
function backupDue() {
  if (!S.entries.length) return null;
  if (!S.meta.lastBackup) return "Es gibt noch kein Backup deiner Sätze.";
  var days = Math.floor((Date.now() - Date.parse(S.meta.lastBackup)) / 86400000);
  var since = {};
  S.entries.forEach(function (e) {
    if (e.ts > Date.parse(S.meta.lastBackup)) since[e.date] = 1;
  });
  var n = Object.keys(since).length;
  if (n >= 3) return n + " Trainings seit dem letzten Backup.";
  if (days > 7) return "Letztes Backup vor " + days + " Tagen.";
  return null;
}

/* ---------- Pausentimer, Punkt 3 ---------- */
var restInterval = null;

/* Bildschirm während der Pause wachhalten, damit der Browser den Tab nicht
   einfriert und das Signal pünktlich kommt. Ohne Unterstützung passiert nichts. */
var wakeLock = null, wakeWanted = false;
function wakeOn() {
  wakeWanted = true;
  if (wakeLock || document.hidden) return;
  if (!navigator.wakeLock || !navigator.wakeLock.request) return;
  try {
    navigator.wakeLock.request("screen").then(function (w) {
      if (!wakeWanted) { try { w.release(); } catch (e) {} return; }
      wakeLock = w;
      w.addEventListener("release", function () { wakeLock = null; });
    }, function () {});
  } catch (e) {}
}
function wakeOff() {
  wakeWanted = false;
  var w = wakeLock;
  wakeLock = null;
  if (w) { try { w.release(); } catch (e) {} }
}
function saveRest() {
  try {
    localStorage.setItem(REST_KEY,
      JSON.stringify({ end:S.restEnd, total:S.restTotal }));
  } catch (e) {}
}
function startRest(sec) {
  /* Hier läuft noch ein Tipp nach, deshalb ist das die Stelle, an der sich der
     Tonkanal öffnen lässt. Siehe audioOn(). */
  audioOn();
  S.restEnd = Date.now() + sec * 1000;
  S.restTotal = sec;
  restSignals = 0;
  restSignalAt = 0;
  saveRest();
  if (!restInterval) restInterval = setInterval(tickRest, 300);
  wakeOn();
  renderRest();
}
function addRest(sec) {
  if (!S.restEnd) return;
  /* Läuft gerade das lange Muster, endet es hier: die Pause geht ja weiter. */
  vibeStop();
  S.restEnd += sec * 1000;
  S.restTotal += sec;
  var over = S.restEnd <= Date.now();
  restSignals = over ? REST_SIGNAL_MAX : 0;
  restSignalAt = 0;
  saveRest();
  if (!restInterval) restInterval = setInterval(tickRest, 300);
  if (!over) wakeOn();
  renderRest();
}
function stopRest() {
  S.restEnd = 0;
  vibeStop();
  clearRestNotification();
  try { localStorage.removeItem(REST_KEY); } catch (e) {}
  if (restInterval) { clearInterval(restInterval); restInterval = null; }
  wakeOff();
  renderRest();
}
function restoreRest() {
  var r = readJson(REST_KEY, null);
  if (!r || !r.end) return;
  if (r.end <= Date.now() - 120000) { try { localStorage.removeItem(REST_KEY); } catch (e) {} return; }
  S.restEnd = r.end;
  S.restTotal = r.total || S.settings.rest;
  /* War die Pause während der Abwesenheit schon vorbei, wird nicht nachträglich gepiepst */
  restSignals = r.end <= Date.now() ? REST_SIGNAL_MAX : 0;
  restSignalAt = 0;
  if (!restInterval) restInterval = setInterval(tickRest, 300);
  if (restSignals < REST_SIGNAL_MAX) wakeOn();
}
document.addEventListener("visibilitychange", function () {
  if (document.hidden) return;
  /* Der Bildschirmwächter fällt beim Wegwischen weg und wird hier neu angefordert */
  if (S.restEnd && wakeWanted) wakeOn();
  if (S.restEnd) tickRest();
  /* Wer wieder hinsieht, braucht die Meldung im Schacht nicht mehr. */
  clearRestNotification();
});

/* Höchstens drei Signale im Abstand von fünf Sekunden */
var REST_SIGNAL_MAX = 3, REST_SIGNAL_GAP = 5000;
var restSignals = 0, restSignalAt = 0;
function tickRest() {
  var now = Date.now();
  var left = Math.round((S.restEnd - now) / 1000);
  if (left <= 0 && restSignals < REST_SIGNAL_MAX && now - restSignalAt >= REST_SIGNAL_GAP) {
    restSignals += 1;
    restSignalAt = now;
    signal(restSignals === 1);
    if (restSignals >= REST_SIGNAL_MAX) wakeOff();
  }
  if (left < -120) { stopRest(); return; }
  renderRest();
}
function renderRest() {
  var el = document.getElementById("restbar");
  /* Der Pausenbalken bleibt fest über dem Bildschirm. Beide Fußzeilen säßen sonst
     genauso weit unten: die des Fokus-Modus und, seit sie dort ebenfalls stehen
     bleibt, die Speichern-Zeile des Standard-Trainingsreiters. Damit der Balken den
     Speichern-Knopf nicht einfach überdeckt, bekommen beide Platz reserviert,
     solange Pause ist. restplus() und reststop() laufen ohne vollen Neuaufbau,
     deshalb sitzt diese Umschaltung hier und nicht in render(). */
  var feet = [document.querySelector(".fx-foot"), document.querySelector(".savearea.main")];
  if (!S.restEnd) {
    el.innerHTML = "";
    feet.forEach(function (f) { if (f) f.classList.remove("resting"); });
    return;
  }
  feet.forEach(function (f) { if (f) f.classList.add("resting"); });
  var left = Math.round((S.restEnd - Date.now()) / 1000);
  var total = S.restTotal || S.settings.rest || 90;
  var pct = Math.max(0, Math.min(100, Math.round(left / total * 100)));
  el.innerHTML = '<div class="restbar' + (left <= 0 ? " over" : "") + '">' +
    '<div class="line"><div class="t">' + mmss(left) + '</div>' +
    '<div class="lbl">' + (left > 0 ? "Pause läuft" : "Pause vorbei") + '</div>' +
    '<button data-act="restplus" style="margin-left:auto">+15 s</button>' +
    '<button data-act="reststop">Fertig</button></div>' +
    '<div class="track"><i style="width:' + pct + '%"></i></div></div>';
}
/* Alles gleichzeitig, statt sich für einen Weg zu entscheiden. Bis 1.16.2 gab
   es im Hintergrund ausschließlich die Benachrichtigung, mit der Begründung,
   Ton und Vibration richteten dort ohnehin nichts aus. Für die Vibration
   stimmt das, die bricht der Browser ab, sobald das Dokument versteckt ist.
   Für den Ton stimmt es nicht: ein AudioContext, der bereits läuft, spielt
   auch bei versteckter Seite weiter, siehe audioOn(). Der Versuch kostet
   nichts und ist der einzige Kanal, den die App selbst in der Hand hat.

   Die Benachrichtigung kommt nur dazu, wenn niemand hinsieht. Im Vordergrund
   wäre sie nur im Weg, der Pausenbalken steht ja sichtbar auf dem Schirm.

   Was die App nicht beeinflussen kann: ob die Benachrichtigung klingelt,
   vibriert und den Bildschirm weckt. Das entscheidet seit Android 8 der
   Benachrichtigungskanal, nicht die Seite, siehe notifyRestOver(). */
function signal(first) {
  buzz(first);
  beep();
  if (document.hidden) notifyRestOver();
}

/* Zwei Muster für die Vibration am Ende der Pause.

   einfach:     ein kurzer Doppelschlag je Signal, wie bisher.
   durchgehend: vom ersten Signal an ohne Pause bis zum dritten, also rund zehn
                Sekunden. Für das Handy in der Hosentasche, wo ein kurzer
                Doppelschlag leicht untergeht.

   Beides gilt nur, solange die Seite sichtbar ist. Ist sie versteckt, bricht
   der Browser jede laufende Vibration ab, und es vibriert stattdessen die
   Benachrichtigung. Wie stark und wie oft entscheidet dort der
   Benachrichtigungskanal von Android, nicht diese Einstellung. */
var VIBE_SHORT = [220, 120, 220];
function vibeLongPattern() {
  /* Der Bogen vom ersten bis zum dritten Signal ist zweimal REST_SIGNAL_GAP,
     plus eine Sekunde Zugabe, damit es nicht kurz vor dem letzten Ton aufhört. */
  var total = 2 * REST_SIGNAL_GAP + 1000, out = [];
  for (var t = 0; t < total; t += 900) out.push(600, 300);
  return out;
}
function buzz(first) {

    if (!navigator.vibrate) return;
    if (!S.settings.vibeLong) { navigator.vibrate(VIBE_SHORT); return; }
    /* Das lange Muster nur beim ersten Signal starten. Jeder weitere Aufruf
       setzte es zurück, und die Vibration liefe über das dritte Signal hinaus. */
    if (first) navigator.vibrate(vibeLongPattern());
  } catch (e) {}
}
function vibeStop() {
  try { if (navigator.vibrate) navigator.vibrate(0); } catch (e) {}
}
/* Ein einziger AudioContext für die ganze Sitzung, angelegt beim Start der
   Pause und damit aus einem Tipp heraus. Genau das war der Fehler bis 1.16.2:
   der Kontext entstand erst im Moment des Signals, also bei längst versteckter
   Seite. Ein dort frisch angelegter Kontext startet angehalten, und ohne neue
   Nutzeraktion lässt er sich nicht mehr starten - der Ton blieb aus, ohne dass

      var o = ctx.createOscillator(), g = ctx.createGain();

      g.gain.setValueAtTime(0.0001, ctx.currentTime + off);
      g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + off + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + off + 0.22);
      o.connect(g); g.connect(ctx.destination);
      o.start(ctx.currentTime + off); o.stop(ctx.currentTime + off + 0.24);

  } catch (e) {}
}

/* ---------- Signal bei ausgeschaltetem Bildschirm ---------- */
/* "unsupported" heißt: kein Notification-Objekt oder kein ServiceWorker, dann

function notifyState() {
  if (typeof Notification === "undefined" || !("serviceWorker" in navigator)) {
    return "unsupported";

  return Notification.permission;
}
function notifyReady() {
  return S.settings.notifySignal && notifyState() === "granted" &&

}

   Sekunden, und ohne tag lägen danach drei Meldungen im Schacht statt einer,

   stillschweigend passiert. */

   Android 8 wird es ignoriert, genau wie silent: seit den Benachrichtigungs-
   kanälen entscheidet der Kanal über Ton, Vibration und darüber, ob die
   Meldung den Bildschirm weckt. Die Seite hat darauf keinen Zugriff, das
   stellt man einmal in den Android-Einstellungen der App ein. */
function notifyRestOver() {
  if (!notifyReady()) return false;
  try {
    swReg.showNotification("Pause vorbei", {
      body: S.exercise ? S.exercise + ", Satz " + nextSet() : "Weiter geht es.",
      tag: REST_TAG,
      renotify: true,

      vibrate: [220,120,220]

}
/* Beim Zurückkommen und beim Beenden der Pause wegräumen. Sonst klebt "Pause

function clearRestNotification() {
  if (!swReg || !swReg.getNotifications) return;
  try {
    var p = swReg.getNotifications({ tag:REST_TAG });

      p.then(function (list) {
        list.forEach(function (n) { try { n.close(); } catch (e) {} });
      }, function () {});
    }
  } catch (e) {}
}
/* Die Nachfrage braucht auf Android eine Nutzeraktion, sie hängt deshalb an
   einem Knopf unter Daten und läuft nicht beim Start. Eine abgelehnte Nachfrage

  try {
    var p = Notification.requestPermission(done);
    if (p && p.then) p.then(done, function () {});
  } catch (e) {}

/* ---------- Als App auf dem Gerät ---------- */
/* Alles, was nur greift, weil die Seite ein Manifest und einen ServiceWorker
   hat: dauerhafter Speicher, die Zurück-Geste im Fenster ohne Adressleiste,
   der Update-Hinweis, der Installations-Knopf und ein aus einer anderen App
   hereingereichtes Backup. Fehlt eine der Fähigkeiten, fällt der jeweilige
   Teil still aus und die App bleibt eine gewöhnliche Seite. */

/* Speicher dauerhaft anfordern. Ohne diese Zusage darf der Browser den
   localStorage wegräumen, sobald der Platz auf dem Gerät knapp wird, und der

   installierten App in der Regel ohne Nachfrage zu, deshalb steht das hier
   und nicht hinter einem Knopf. */

    if (p || !navigator.storage.persist) { S.pwa.persisted = !!p; done(); return; }
    navigator.storage.persist().then(function (ok) {
      S.pwa.persisted = !!ok;
      done();
    }, done);
  }, done);
}
/* Nachrücken, wenn eine dieser Auskünfte erst eintrifft, während der
   Daten-Reiter schon offen ist. Fokus-Modus und Zusammenfassung nicht stören. */
function rerenderData() {
  if (S.view === "daten" && !S.focus && !S.showSummary) render();
}
function byteSize(n) {
  if (!n) return "0 kB";
  if (n >= 1048576) return num(Math.round(n / 1048576 * 10) / 10) + " MB";
  return Math.max(1, Math.round(n / 1024)) + " kB";
}
/* Größe des Backups, also genau der Datei, die "Backup speichern" schreibt.
   Bewusst gerechnet statt geschätzt: der Export ist eingerückt und damit
   deutlich größer als dieselben Daten im localStorage, und
   navigator.storage.estimate() zählt umgekehrt die offline abgelegte App mit,
   das wären 330 kB Programm neben ein paar kB Sätzen.

   Das Ergebnis wird gemerkt und in persist() verworfen: der Daten-Reiter wird
   bei jedem Tipp neu aufgebaut, und über Jahre hinweg sind das ein paar
   Megabyte, die sonst jedes Mal neu serialisiert würden. */
var backupBytes = -1;
function backupSize() {
  if (backupBytes >= 0) return backupBytes;
  var t = backupText();
  try { backupBytes = new Blob([t]).size; } catch (e) { backupBytes = t.length; }
  return backupBytes;
}
function protectLine() {
  if (S.pwa.persisted === true) return "Vor automatischem Aufräumen geschützt.";
  if (S.pwa.persisted === false) {
    return "Nicht geschützt: wird der Platz auf dem Gerät knapp, darf der Browser " +
      "diese Daten löschen.";
  }
  return "Der Schutz vor automatischem Aufräumen wird noch geprüft.";
}

/* Zurück-Geste. Im installierten Fenster gibt es keine Adressleiste und keine
   Seite, auf die zurück führen könnte: ohne eigenen History-Eintrag schließt
   die Geste sofort die ganze App, auch mitten im Fokus-Modus. Deshalb bekommt
   jede Ansicht, die man wieder verlassen können soll, einen Eintrag. Schließt
   die App sie selbst über einen Knopf, wird der Eintrag mit history.go()
   abgeräumt, damit Stapel und Verlauf nicht auseinanderlaufen. */

function navOpen(name) {

function navSwap(name) {
  if (!navStack.length) { navOpen(name); return; }
  navStack[navStack.length - 1] = name;
}
function navBack(name) {
  var i = navStack.lastIndexOf(name);
  if (i < 0) return;
  var steps = navStack.length - i;
  /* Erst den Stapel kürzen, dann zurückgehen: das popstate, das gleich
     eintrifft, findet nichts mehr zu schließen und macht nichts doppelt. */
  navStack.length = i;
  try { history.go(-steps); } catch (e) {}
}
function navCloseTop() {
  var name = navStack.pop();
  if (name === "focus") {
    clearQuickUndo();
    S.focus = false;
    S.focusEndConfirm = false;
  } else if (name === "summary") {
    S.showSummary = false;
    S.summaryData = null;
    if (S.summaryReturn) { S.view = S.summaryReturn; S.summaryReturn = ""; }
  } else if (name === "openex") {
    S.openEx = "";
  } else if (name === "weekovr") {
    S.weekOverview = false;
  }
}
/* Die Wochenübersicht hängt wie der Fokus-Modus im History-Stapel, damit die
   Zurück-Geste sie schließt und nicht gleich die App. Deshalb geht sie überall
   über diese Stelle zu, nicht über S.weekOverview von Hand. */
function closeWeekOverview() {
  if (!S.weekOverview) return;
  navBack("weekovr");
  S.weekOverview = false;
}
window.addEventListener("popstate", function (ev) {
  var d = (ev.state && typeof ev.state.hk === "number") ? ev.state.hk : 0;
  if (navStack.length <= d) return;
  while (navStack.length > d) navCloseTop();
  render();
});

/* ServiceWorker anmelden, damit die App nach dem ersten Aufruf offline läuft
   und sich vom Startbildschirm aus installieren lässt. Fehlt der Worker oder
   scheitert die Anmeldung, ändert das an der App selbst nichts: sie bleibt
   eine gewöhnliche Seite, nur eben ohne Offline-Betrieb. Deshalb still
   abfangen statt melden. */
var swReg = null, swReloading = false;
function markUpdateReady() {
  if (S.pwa.updateReady) return;
  S.pwa.updateReady = true;
  /* Im Fokus-Modus und in der Zusammenfassung bleibt es still, dort steht die
     Hinweiszeile nicht und ein Neuaufbau wäre mitten im Satz nur im Weg. */
  if (!S.focus && !S.showSummary) render();
}
function swWatch(reg) {
  swReg = reg;
  if (reg.waiting && navigator.serviceWorker.controller) markUpdateReady();
  reg.addEventListener("updatefound", function () {
    var w = reg.installing;
    if (!w) return;
    w.addEventListener("statechange", function () {
      /* "installed" bei bereits laufendem Worker heißt: die neue Fassung liegt
         vollständig im Cache und wartet. Ohne controller wäre es die allererste
         Installation, da gibt es nichts zu melden. */
      if (w.state === "installed" && navigator.serviceWorker.controller) markUpdateReady();
    });
  });
}
function applyUpdate() {
  var w = swReg && swReg.waiting;
  if (!w) { location.reload(); return; }
  swReloading = true;
  try { w.postMessage({ type:"skipWaiting" }); } catch (e) { location.reload(); }
}
/* Die Versionsnummer steht an zwei Stellen: hier in der App und in sw.js, wo
   sie den Namen des Caches bestimmt. Der Worker sagt auf Nachfrage, was er
   ausliefert. Laufen beide auseinander, zeigt die App sonst eine Nummer an,
   die nicht zu den zwischengespeicherten Dateien gehört. */
function swAskVersion() {
  var sw = navigator.serviceWorker && navigator.serviceWorker.controller;
  if (!sw || typeof MessageChannel !== "function") return;
  try {
    var ch = new MessageChannel();
    ch.port1.onmessage = function (ev) {
      var d = ev.data || {};
      S.pwa.swVersion = d.version || "";
      rerenderData();
    };
    sw.postMessage({ type:"version" }, [ch.port2]);
  } catch (e) {}
}
function versionLine() {
  var v = "Fassung " + APP_VERSION;
  if (!("serviceWorker" in navigator)) return v + ", kein Offline-Betrieb.";
  if (!S.pwa.swVersion) return v + ", noch nicht offline gespeichert.";
  /* Läuft die Nummer im Worker auseinander, zeigt die App sonst eine Fassung
     an, die nicht zu den offline abgelegten Dateien gehört. */
  if (S.pwa.swVersion !== APP_VERSION) {
    return v + ", offline liegt aber noch " + S.pwa.swVersion + ".";
  }
  return v + ", offline gespeichert.";
}

/* Chrome meldet sich, sobald die Installation möglich wäre, und lässt sich das
   Ereignis aufheben. Ohne das führt der einzige Weg über das Chrome-Menü, und
   den findet kaum jemand. */
var installPrompt = null;
window.addEventListener("beforeinstallprompt", function (ev) {
  ev.preventDefault();
  installPrompt = ev;
  S.pwa.installable = true;
  rerenderData();
});
window.addEventListener("appinstalled", function () {
  installPrompt = null;
  S.pwa.installable = false;
  S.pwa.standalone = true;
  S.note = "HantelKladde ist jetzt als eigene App installiert.";
  render();
});
function runInstall() {
  var p = installPrompt;
  if (!p) return;
  /* Das Ereignis lässt sich nur einmal verwenden. Wird die Nachfrage
     weggewischt, meldet Chrome es später von selbst wieder an. */
  installPrompt = null;
  S.pwa.installable = false;
  try {
    p.prompt();
    if (p.userChoice) p.userChoice.then(function () {}, function () {});
  } catch (e) {}
}
function standalone() {
  try {
    if (!window.matchMedia) return false;
    return window.matchMedia("(display-mode: standalone)").matches ||
      window.matchMedia("(display-mode: fullscreen)").matches ||
      window.matchMedia("(display-mode: minimal-ui)").matches;
  } catch (e) { return false; }
}

/* Adresse beim Start auswerten. Die Shortcuts aus dem Manifest hängen den
   gewünschten Reiter an, der Teilen-Weg meldet sich mit ?geteilt=1. Danach
   wird die Adresse wieder aufgeräumt, sonst steht die Markierung beim nächsten
   Start erneut da. */
function queryParam(name) {
  var m = new RegExp("[?&]" + name + "=([^&]*)").exec(location.search || "");
  return m ? decodeURIComponent(m[1].replace(/\+/g, " ")) : "";
}
/* Hat die Adresse den Reiter vorgegeben? Dann haelt sich restoreSession() bei
   Ansicht und Fokus-Modus zurueck. */
var startFromUrl = false;
function startParams() {
  var tab = queryParam("tab"), shared = queryParam("geteilt");
  /* Ein Reiter aus der Adresse schlägt die wiederhergestellte Sitzung, siehe
     restoreSession(): wer die App gezielt über einen Shortcut oder ein geteiltes
     Backup öffnet, will dorthin und nicht in den Fokus-Modus von vorhin. */
  if (["tag","plaene","planung","verlauf","daten"].indexOf(tab) >= 0) { S.view = tab; startFromUrl = true; }
  if (shared) { S.view = "daten"; startFromUrl = true; }
  /* Die Markierung wieder aus der Adresse nehmen, aber den Pfad so lassen, wie
     er ist: wird die App als .../index.html ausgeliefert, führte "./" auf das
     Verzeichnis und ein Neuladen liefe ins Leere. */
  if (location.search) {
    try { history.replaceState(null, "", location.pathname); } catch (e) {}
  }
  return shared;
}
/* Ein aus einer anderen App geteiltes Backup. Der ServiceWorker hat die Datei
   entgegengenommen und unter einer Adresse abgelegt, die es auf dem Server
   nicht gibt; hier wird sie genau einmal abgeholt und wie ein geladenes Backup
   eingelesen: ergänzen, nie überschreiben. */
function takeSharedBackup(shared) {
  if (!shared) return;
  if (shared !== "1") {
    S.note = "Aus der geteilten Nachricht kam keine Datei an.";
    return;
  }
  fetch("shared-backup").then(function (r) {
    if (!r.ok) throw new Error("nichts abgelegt");
    return r.text();
  }).then(function (text) {
    /* Leer heißt: der Worker hatte nichts mehr, die Datei ist also schon
       eingelesen. Das passiert, wenn die Adresse mit der Markierung ein
       zweites Mal aufgerufen wird. */
    if (!text) {
      S.note = "Das geteilte Backup wurde bereits eingelesen.";
      render();
      return;
    }
    var n = mergeBackup(text);
    S.note = n + " Sätze aus dem geteilten Backup ergänzt, " +
      S.entries.length + " insgesamt.";
    render();
  }).catch(function (e) {
    S.note = (e && e.message && e.message.indexOf("Backup ungültig:") === 0)
      ? e.message
      : "Das geteilte Backup konnte nicht gelesen werden.";
    render();
  });
}

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.addEventListener("controllerchange", function () {
    /* Nur nach einem bewussten Tipp auf den Update-Hinweis neu laden. Sonst
       wechselt die Seite mitten im Satz. */
    if (!swReloading) return;
    swReloading = false;
    location.reload();
  });
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").then(function (reg) {
      swWatch(reg);
      swAskVersion();
    }, function () {});
  });
}

/* ---------- Rendern ---------- */
function render() {
  /* Frischer Tagesindex je Neuaufbau: innerhalb eines Durchlaufs ändern sich die
     Sätze nicht, danach gilt er nicht mehr, siehe entriesOn(). */
  clearDayIndex();
  /* Jede Zustandsänderung endet in einem Neuaufbau, also ist das die eine Stelle,
     an der sich die Sitzung festhalten lässt, siehe saveSession(). */
  saveSession();
  if (S.showSummary) {
    document.getElementById("app").innerHTML = viewSummary();
    renderRest();
    return;
  }
  if (S.focus) {
    document.getElementById("app").innerHTML = viewFocus();
    if (focusAfterRender) {
      var ffel = document.getElementById(focusAfterRender);
      focusAfterRender = "";
      if (ffel) {
        ffel.focus();
        try { ffel.setSelectionRange(ffel.value.length, ffel.value.length); } catch (e) {}
      }
    }
    renderRest();
    return;
  }
  var h = '<div class="bar"><div class="bar-top"><div class="brand">' +
    '<i class="hmark" role="img" aria-label="H">' + svg("hantelh", 17) + '</i>antelKladde</div>' +
    '<div class="seg">' + seg("tag","Training","training") + seg("plaene","Pläne","plaene") +
    seg("planung","Planung","planung") + seg("verlauf","Verlauf","verlauf") +
    seg("daten","Daten","daten") +
    '</div></div></div><div class="wrap">';

  if (S.storeOk === false) {
    h += '<div class="notice bad">Dieser Browser speichert hier nichts dauerhaft. ' +
      'Lege unter Daten ein Backup an, bevor du die Seite schließt.</div>';
  }

  if (S.pwa.updateReady) {
    h += '<div class="notice act">Ein Update ist vorhanden.' +
      '<button data-act="swupdate">Update starten</button></div>';
  }

  if (S.undo) {
    h += '<div class="notice act">' + esc(S.undo.label) +
      '<button data-act="undo">Rückgängig</button></div>';
  }
  if (S.note) h += '<div class="notice">' + esc(S.note) + '</div>';

  if (S.view === "tag") h += viewTag();
  else if (S.view === "plaene") h += (S.pickPlanTarget ? viewPicker() : viewPlans());
  else if (S.view === "planung") h += (S.pickPlanTarget ? viewPicker() : viewPlanung());
  else if (S.view === "verlauf") h += viewHistory();
  else h += viewData();

  h += '<p class="ver">HantelKladde ' + APP_VERSION + '</p>';

  document.getElementById("app").innerHTML = h + '</div>';
  var wk = document.getElementById("week");
  if (wk) {
    var on = wk.querySelector(".wday.on");
    wk.scrollLeft = on ? Math.max(0, on.offsetLeft - wk.clientWidth + on.offsetWidth + 8)
      : wk.scrollWidth;
  }
  if (S.freshId) setTimeout(function () { S.freshId = ""; }, 1200);
  /* Einmalig nach einem Neuaufbau in ein frisch geöffnetes Feld springen */
  if (focusAfterRender) {
    var fel = document.getElementById(focusAfterRender);
    focusAfterRender = "";
    if (fel) {
      fel.focus();
      try { fel.setSelectionRange(fel.value.length, fel.value.length); } catch (e) {}
    }
  }
  renderRest();
}
var focusAfterRender = "";

/* Kurze Rückmeldung über dem Speichern-Knopf. Sie verschwindet von selbst, damit
   sie nicht wie die alte Meldungszeile stehenbleibt, bis etwas anderes passiert. */
var toastTimer = null;
/* Läuft eine dieser Einblendungen aus, während gerade ein Feld bearbeitet wird,
   würde ein voller Neuaufbau den Fokus nehmen und auf Android die Tastatur
   schließen - mitten in der Eingabe des nächsten Gewichts. Dann verschwindet nur
   der betroffene Knoten, wie es die Vorschlagszeile beim Tippen schon macht. */
function inputFocused() {
  var a = document.activeElement;
  if (!a || !a.tagName) return false;
  var t = a.tagName;
  return t === "INPUT" || t === "TEXTAREA" || t === "SELECT";
}
function dropNode(sel) {
  var n = document.querySelector(sel);
  if (n && n.parentNode) n.parentNode.removeChild(n);
}
function showToast(msg) {
  S.toast = msg;
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function () {
    toastTimer = null;
    S.toast = "";
    if (inputFocused()) dropNode(".toast"); else render();
  }, 2600);
}
/* Punkt 9: im Fokus-Modus bleibt nach dem Speichern eines Satzes 5s lang ein
   Rückgängig-Knopf für genau diesen Satz stehen, danach verschwindet er von
   selbst. Nutzt denselben S.undo wie das Löschen eines Satzes (act "del"). */
var quickUndoTimer = null;
function showQuickUndo() {
  S.quickUndo = true;
  if (quickUndoTimer) clearTimeout(quickUndoTimer);
  var undoId = S.undo && S.undo.kind === "newset" && S.undo.item ? S.undo.item.id : "";
  quickUndoTimer = setTimeout(function () {
    quickUndoTimer = null;
    S.quickUndo = false;
    /* Der Rückgängig-Knopf gehört nur zu diesem kurzen Fokus-Zeitfenster. Nach
       Ablauf darf die Aktion nicht als vermeintlich gelöschter Satz in der
       normalen Ansicht wieder auftauchen. */
    if (S.undo && S.undo.kind === "newset" && S.undo.item && S.undo.item.id === undoId) {
      S.undo = null;
    }
    if (inputFocused()) dropNode(".undoquick"); else render();
  }, 5000);
}
function clearQuickUndo() {
  S.quickUndo = false;
  if (quickUndoTimer) { clearTimeout(quickUndoTimer); quickUndoTimer = null; }
  if (S.undo && S.undo.kind === "newset") S.undo = null;
}
function seg(id, label, icon) {
  return '<button class="' + (S.view === id ? "on" : "") + '" data-act="tab" data-v="' +
    id + '" aria-label="' + label + '" title="' + label + '"' +
    (S.view === id ? ' aria-current="page"' : "") + '>' + svg(icon, 21) + '</button>';
}

function planHidden(p) { return S.settings.hiddenPlans.indexOf(p) >= 0; }
/* Punkt 11: sperrt die Reihenfolge eines Plans gegen versehentliches Umordnen,
   analog zum Sichtbarkeits-Auge daneben. */
function planLocked(p) { return S.settings.lockedPlans.indexOf(p) >= 0; }
function visiblePlans() {
  return Object.keys(S.plans).filter(function (p) { return !planHidden(p); });
}
/* Für die Wochenziele-Liste: ausgeblendete Pläne bleiben trotzdem drin, wenn
   sie noch ein Ziel tragen oder tragen könnten - über die aktuelle Zahl oder
   über die Historie (weekGoalLog), die weiter in der Auswertung steckt. Sonst
   würde ein ausgeblendeter Plan mit Vergangenheit aus der Liste verschwinden,
   aber weiter (unsichtbar) in die Wochenziele-Quote einfließen. */
function weekGoalPlans() {
  return Object.keys(S.plans).filter(function (p) {
    if (!planHidden(p) || weekGoal(p) > 0) return true;
    var log = S.settings.weekGoalLog[p];
    return !!(log && log.length);
  });
}
function planColor(p) {
  var own = safeColor(S.colors[p]);
  if (own) return own;
  if (DEFAULT_COLORS[p]) return DEFAULT_COLORS[p];
  var idx = Object.keys(S.plans).indexOf(p);
  return PALETTE[(idx < 0 ? 0 : idx) % PALETTE.length];
}
var MIN_DONE = 5;

/* Eine gemeinsame Wahrheit für Plantage. Neue Sätze tragen den beim Speichern
   aktiven Plan. Sobald es an einem Tag eine gültige Planangabe gibt, hat sie vor
   jeder Ableitung aus überlappenden Übungen Vorrang. Alte Sätze ohne plan-Feld
   bleiben über die bisherige Übungszuordnung auswertbar. */
/* Sätze nach Trainingstag, einmal aufgebaut statt bei jeder Abfrage neu über die
   ganze Liste gefiltert. dayPlan() und planStatusOnDay() liefen bis 1.14.5 je
   Aufruf sechsmal durch alle Sätze; lastPlanDay() ruft dayPlan() für jeden
   Trainingstag auf, wenn ein Plan noch nie vollständig absolviert wurde, und das
   summierte sich mit wachsender Historie auf (3 Jahre, 7.500 Sätze: 274 ms je
   sichtbarem Plan, bei jedem Neuaufbau des Trainingsreiters). Der Zwischenspeicher
   wird bei jedem Neuaufbau und bei jedem Speichern verworfen, lebt also nie über
   eine Änderung hinweg. */
var dayIndex = null;
function entriesOn(iso) {
  if (!dayIndex) {
    dayIndex = Object.create(null);
    S.entries.forEach(function (e) {
      if (!e || !e.date) return;
      if (!dayIndex[e.date]) dayIndex[e.date] = [];
      dayIndex[e.date].push(e);
    });
  }
  return dayIndex[iso] || [];
}
function clearDayIndex() { dayIndex = null; }
function planStatusOnDay(name, iso) {
  var list = S.plans[name] || [];
  var allWork = entriesOn(iso).filter(isWork);
  var tagged = allWork.filter(function (e) { return e.plan === name; });
  var hasKnownTag = allWork.some(function (e) { return e.plan && S.plans[e.plan]; });
  var relevant;
  if (tagged.length) {
    /* Ungemarkte Sätze desselben Tages mitnehmen, damit ein am Tag des Updates
       begonnenes Training nicht in einen alten und neuen Teil zerfällt. */
    relevant = allWork.filter(function (e) { return !e.plan || e.plan === name; });
  } else {
    relevant = hasKnownTag ? [] : allWork;
  }
  var counts = {};
  relevant.forEach(function (e) {
    if (!counts[e.exercise]) counts[e.exercise] = 0;
    counts[e.exercise] += 1;
  });
  var touched = list.filter(function (i) { return counts[i.name] > 0; }).length;
  var full = list.filter(function (i) {
    return counts[i.name] >= (i.sets > 0 ? i.sets : defaultSets());
  }).length;
  var need = Math.min(MIN_DONE, list.length);
  return {
    plan:name, explicit:tagged.length > 0, explicitSets:tagged.length,
    touched:touched, full:full, need:need,
    completed:need > 0 && full >= need
  };
}
function dayPlan(iso) {
  var ex = {}, count = 0;
  entriesOn(iso).forEach(function (e) {
    if (!isWork(e)) return;
    if (!ex[e.exercise]) { ex[e.exercise] = 0; count += 1; }
    ex[e.exercise] += 1;
  });
  if (!count) return null;
  var best = null;
  Object.keys(S.plans).forEach(function (p) {
    var status = planStatusOnDay(p, iso);
    if (!status.explicit && !status.touched) return;
    if (!best ||
        (status.explicit && !best.explicit) ||
        (status.explicit === best.explicit && status.completed && !best.completed) ||
        (status.explicit === best.explicit && status.completed === best.completed &&
          status.full > best.full) ||
        (status.explicit === best.explicit && status.completed === best.completed &&
          status.full === best.full && status.touched > best.touched) ||
        (status.explicit === best.explicit && status.completed === best.completed &&
          status.full === best.full && status.touched === best.touched &&
          status.explicitSets > best.explicitSets)) best = status;
  });
  /* MIN_DONE zählt nur Übungen aus dem hier ermittelten Plan (best.touched),
     nicht beliebige Bonus-Übungen ohne Planbezug - fünf zufällige Übungen
     machen einen Tag noch nicht zum absolvierten Plantag. Ohne erkannten Plan
     gibt es dafür keine Grundlage, done bleibt dann false. Dieselbe Kappung
     auf die Planlänge wie bei completed (need = min(MIN_DONE, Planlänge)),
     damit auch kurze Pläne die Schwelle erreichen können. */
  return { plan:best ? best.plan : null, total:count,
    touched: best ? best.touched : 0, need: best ? best.need : 0,
    done: !!best && best.need > 0 && best.touched >= best.need,
    planDone:!!best && best.completed };
}
/* Wochenziel je Plan, siehe "Wochenziele" im Pläne-Reiter. 0 heißt kein Ziel. */
function weekGoal(p) {
  var v = S.settings.weekGoals[p];
  return (typeof v === "number" && v > 0) ? v : 0;
}
/* Historie der Wochenziel-Werte je Plan: S.settings.weekGoalLog[p] ist eine
   nach "since" aufsteigend sortierte Liste { since, value }. Das Eingabefeld
   ändert nur die aktuelle Zahl (weekGoal()); erst der Knopf "Neues Wochenziel
   speichern" (weekgoalrestart) schreibt einen Eintrag fest, mit "since" auf
   den Montag der aktuellen Woche. So bleibt z. B. eine einmalige Woche mit
   höherem Ziel korrekt mit dem damals gültigen Wert in der Auswertung stehen,
   auch wenn die Zahl danach wieder zurückgestellt wird - ohne dass jede
   Eingabe beim Tippen einen eigenen Log-Eintrag erzeugt. */
function weekGoalAt(p, mon) {
  var log = S.settings.weekGoalLog[p];
  if (!log || !log.length) return 0;
  var v = 0;
  for (var i = 0; i < log.length; i++) {
    if (log[i].since <= mon) v = log[i].value; else break;
  }
  return v;
}
/* Ob es für mindestens einen relevanten Plan eine noch nicht gespeicherte
   Änderung gibt - steuert, ob der Knopf "Neues Wochenziel speichern" aktiv
   ist. Ohne diese Prüfung könnte man denselben Stand beliebig oft als neuen
   Log-Eintrag festschreiben. */
function weekGoalPending() {
  return weekGoalPlans().some(function (p) {
    var log = S.settings.weekGoalLog[p];
    var lastVal = (log && log.length) ? log[log.length - 1].value : 0;
    return weekGoal(p) !== lastVal;
  });
}
/* Schreibt die aktuellen Wochenziele als Log-Einträge für die laufende Woche fest,
   siehe weekGoalAt(). Gemeinsam für "Neues Wochenziel speichern" im Pläne-Reiter
   und "Als Wochenziel übernehmen" in der Planung. Liefert, ob sich etwas getan hat. */
function writeWeekGoalLog() {
  var mon = mondayOf(todayISO()), any = false;
  weekGoalPlans().forEach(function (p) {
    var val = weekGoal(p);
    var log = S.settings.weekGoalLog[p] || [];
    var last = log.length ? log[log.length - 1] : null;
    if (last && last.value === val) return;
    /* Ein Plan ohne Ziel und ohne Historie bekommt keinen Eintrag mit Wert 0.
       Der wäre für die Auswertung wirkungslos (weekGoalAt() > 0) und stünde nur
       als Ballast in jedem Backup. */
    if (!val && !last) return;
    if (!S.settings.weekGoalLog[p]) S.settings.weekGoalLog[p] = log;
    if (last && last.since === mon) last.value = val;
    else log.push({ since:mon, value:val });
    any = true;
  });
  return any;
}
/* Der in der Planung für einen Tag zugewiesene Plan, leer ohne Zuweisung oder
   wenn es den Plan nicht mehr gibt, siehe planDaysBlock(). */
function plannedPlan(iso) {
  var p = S.settings.planDays[iso];
  return (p && S.plans[p]) ? p : "";
}
/* Plan im Trainingsreiter wählen: Liste einklappen und die erste noch offene

   Vorauswahl aus der Planung, siehe preselectPlan(). */
function selectPlan(p) {
  S.plan = p; S.pickOpen = false; S.editId = ""; S.plansFold = true;
  var plist = S.plans[p] || [];
  var pday = dayEntries();
  var firstOpen = plist.filter(function (i) {
    return !pday.some(function (e) { return e.exercise === i.name; });
  })[0] || plist[0];
  if (firstOpen) {
    S.exercise = firstOpen.name;
    applySuggestion(firstOpen.name);
  }
}
/* Vorauswahl aus der Planung, seit 1.23.1: trägt der angezeigte Tag einen
   zugewiesenen Plan, ist er im Trainingsreiter schon gewählt. Wechseln geht
   weiter wie immer über die Planauswahl. Greift beim Start ohne gemerkte
   Sitzung, bei jedem Datumswechsel und beim Zuweisen für den gerade angezeigten
   Tag - nicht bei jedem Neuaufbau: wer den Plan abwählt, soll ihn nicht sofort
   wieder vorfinden. Ein im Training ausgeblendeter Plan bleibt außen vor, der
   lässt sich dort auch von Hand nicht wählen (planvis räumt ihn ab). */
function preselectPlan() {
  var p = plannedPlan(S.date);

}
function mondayOf(iso) {

}

   gefüllte Punkt im Wochenstreifen. Nimmt einen beliebigen Montag, damit sich
   damit auch vergangene Wochen prüfen lassen, siehe weekGoalBlock(). */
function planDoneOnWeek(p, monday) {
  var done = 0;
  for (var i = 0; i < 7; i++) {
    var dp = dayPlan(shiftISO(monday, i));
    if (dp && dp.planDone && dp.plan === p) done += 1;
  }

}
function planWeekDone(p) { return planDoneOnWeek(p, mondayOf(todayISO())); }

function planGoalLine(p) {

/* Nach 90 Minuten ohne Satz beginnt eine neue Einheit. Das lässt bestehende
   Backups unverändert und trennt trotzdem z.B. Morgen- und Abendtraining. */
var SESSION_GAP_MS = 90 * 60 * 1000;
function sessionsOn(iso) {
  var entries = S.entries.filter(function (e) { return e.date === iso && e.ts; })
    .sort(function (a, b) { return a.ts - b.ts; });
  var groups = [];
  entries.forEach(function (e) {
    var group = groups.length ? groups[groups.length - 1] : null;
    if (!group || e.ts - group[group.length - 1].ts > SESSION_GAP_MS) {
      group = [];
      groups.push(group);
    }
    group.push(e);
  });
  return groups;
}
function sessionMinutes(entries) {
  if (!entries || entries.length < 2) return 0;
  return Math.max(0, Math.round((entries[entries.length - 1].ts - entries[0].ts) / 60000));
}
function latestSessionEntries(iso) {
  var groups = sessionsOn(iso);

}
function currentSessionMinutes(iso) { return sessionMinutes(latestSessionEntries(iso)); }

   ersten bis zum letzten Satz des Kalendertags. */
function dayMinutes(iso) {
  return sessionsOn(iso).reduce(function (sum, group) {
    return sum + sessionMinutes(group);
  }, 0);
}
/* Last je Muskelgruppe in einem Zeitraum, Aufwärmsätze bleiben außen vor */
/* Anstrengungsgewicht für effektive Sätze: nah am Muskelversagen zählt voll,
   weit davon entfernt kaum. Ohne erfassten RPE wird ein mittlerer Wert angenommen. */
function effWeight(rpe) {
  if (rpe == null) return 0.7;
  if (rpe >= 9) return 1;
  if (rpe >= 8) return 0.9;
  if (rpe >= 7) return 0.7;
  return 0.3;
}
function volByCat(fromISO, toISO) {
  var out = {};
  CATLIST.concat(["Sonstige"]).forEach(function (c) { out[c] = { vol:0, sets:0, eff:0, heavy:0 }; });
  S.entries.forEach(function (e) {
    if (!isWork(e) || e.date < fromISO || e.date > toISO) return;
    var c = catOf(e.exercise);
    if (!out[c]) out[c] = { vol:0, sets:0, eff:0, heavy:0 };
    out[c].vol += e.weight * e.reps;
    out[c].sets += 1;
    out[c].eff += effWeight(e.rpe);
    if (e.rpe != null && e.rpe >= 8) out[c].heavy += 1;
  });
  return out;
}
/* Gegenstück zu volByCat() für die Muskelgruppen-Ansicht: ein Satz zählt voll
   beim Primärmuskel, halb bei jedem Sekundärmuskel, siehe muscleOf(). Gleiche
   Form wie volByCat(), damit volumeBlock() beide Gruppierungen über dieselbe
   Darstellung bedienen kann. */
function volByMuscle(fromISO, toISO) {
  var out = {};
  MUSCLE_LIST.forEach(function (m) { out[m] = { vol:0, sets:0, eff:0, heavy:0 }; });
  S.entries.forEach(function (e) {
    if (!isWork(e) || e.date < fromISO || e.date > toISO) return;
    var mo = muscleOf(e.exercise);
    if (!mo) return;
    var vol = e.weight * e.reps, eff = effWeight(e.rpe);
    var heavy = (e.rpe != null && e.rpe >= 8) ? 1 : 0;
    out[mo.primary].vol += vol; out[mo.primary].sets += 1;
    out[mo.primary].eff += eff; out[mo.primary].heavy += heavy;
    mo.secondary.forEach(function (s) {
      out[s].vol += vol * 0.5; out[s].sets += 0.5;
      out[s].eff += eff * 0.5; out[s].heavy += heavy * 0.5;
    });

}
/* Rohsummen eines Zeitraums für die Kopfzeile über dem Balkenblock: Trainings-
   tage, Gesamtlast und Arbeitssätze. Zählt bewusst direkt über die Sätze und
   nicht über die Gruppensummen aus volByCat()/volByMuscle(). Bis 1.13.3 summierte
   volumeBlock() über die angezeigten Gruppen - in der Muskelgruppen-Ansicht trägt
   ein Satz aber einmal voll beim Primär- und halb bei jedem Sekundärmuskel, siehe
   volByMuscle(). Die Summe darüber war damit weder die echte Satzzahl noch die
   echte Gesamtlast (ein Satz Benchpress Maschine zählte als 2,0), und dieselbe
   Zeile zeigte je Gruppierung andere Zahlen. So steht dort in beiden Gruppierungen
   dasselbe, und die Zeile bleibt auch dann vollständig, wenn eine Übung keiner
   Muskelgruppe zugeordnet ist und in den Balken darunter fehlt. */
function volTotals(fromISO, toISO) {
  var vol = 0, sets = 0, days = {};
  S.entries.forEach(function (e) {
    if (!isWork(e) || e.date < fromISO || e.date > toISO) return;
    vol += e.weight * e.reps;
    sets += 1;
    days[e.date] = 1;
  });
  return { vol:vol, sets:sets, days:Object.keys(days) };
}
/* Gegenstück zu volTotals() für die Muskelgruppen-Ansicht: wie viele Sätze aus
   wie vielen Übungen tragen dort nirgends bei, weil muscleOf() nichts liefert?
   volByMuscle() ließ das bis 1.14.3 lautlos verschwinden - die Summenzeile
   nannte zwar alle Sätze, aber nichts erklärte die Lücke zu den Balken
   darunter. */
function volUnmapped(fromISO, toISO) {
  var sets = 0, names = {};
  S.entries.forEach(function (e) {
    if (!isWork(e) || e.date < fromISO || e.date > toISO) return;
    if (muscleOf(e.exercise)) return;
    sets += 1;
    names[e.exercise] = 1;
  });
  return { sets:sets, exCount:Object.keys(names).length };
}

/* Beschreibungstexte in Daten sind einklappbar, die Schalter/Buttons daneben
   bleiben immer sichtbar. Der Zustand hängt an S.settings.descOpen und wird
   dauerhaft gespeichert, nicht nur für die Sitzung. */
function descOpen(key) { return !!S.settings.descOpen[key]; }
function infoBtn(key) {

function lastPlanDay(name) {
  if (!S.plans[name] || !S.plans[name].length) return null;

  S.entries.forEach(function (e) {
    if (isWork(e)) days[e.date] = 1;
  });

  for (var i = 0; i < ordered.length; i++) {
    var d = ordered[i];

  }

}
function agoText(iso) {
  var days = Math.round((Date.parse(todayISO() + "T12:00:00") -
    Date.parse(iso + "T12:00:00")) / 86400000);
  if (days <= 0) return "heute";
  if (days === 1) return "gestern";

}
/* Fenster des Wochenstreifens: zwei Wochen zurück, eine nach vorn. Weiter nach
   vorn hilft wenig, die Zuweisung reicht ohnehin nur 14 Tage, und jede Zelle
   mehr rückt den heutigen Tag weiter aus dem Bild. */
var STRIP_BACK = 13, STRIP_FWD = 7;
/* Eine Tageszelle für den Streifen und für die Wochenübersicht: gefüllter Punkt
   in der Planfarbe für einen absolvierten Tag, leerer Ring für einen in der
   Planung zugewiesenen, matter Ring für einen angefangenen. Beide Ansichten
   zeigen dasselbe, deshalb steht es an einer Stelle.

   Im Streifen wählt ein Tipp den Tag fürs Eintragen. In der Übersicht (assign)
   weist er stattdessen einen Plan zu, siehe viewWeekOverview(); vergangene Tage
   sind dort kein Knopf, eine Zuweisung von gestern gibt es nicht. */
/* Was ein Tag im Streifen und in den Rastern zeigt, einmal gerechnet: die
   Wochenübersicht braucht denselben Stand für Zelle und Wochenbilanz, siehe
   viewWeekOverview()/weekTally(). */
function dayStatus(d) {
  return { dp:dayPlan(d), planned:plannedPlan(d) };
}
/* Die Tageszelle, gemeinsam für den Wochenstreifen ("pickday"), die Wochenübersicht
   ("ovrday") und das Zuweisen-Raster der Planung ("planday"). Gefüllter Punkt in
   der Planfarbe für einen absolvierten Tag, leerer Ring für einen zugewiesenen,
   matter Ring für einen angefangenen. sel ist der hervorgehobene Tag des jeweiligen
   Orts. Die Raster sitzen in Wochen, dort markiert die Planung heute und das
   Wochenende; der Streifen und die Übersicht setzen stattdessen künftige Tage
   matt ab. In der Übersicht sind vergangene Tage nicht wählbar und werden zu
   einem span. */
function dayCell(d, td, act, sel, st) {
  st = st || dayStatus(d);
  var dt = new Date(d + "T12:00:00"), wd = WEEKDAY_SHORT[dt.getDay()];
  var dp = st.dp, planned = st.planned;
  var cls = "wday" + (d === sel ? " on" : "");
  if (act === "planday") {
    cls += (d === td ? " today" : "") + (wd === "Sa" || wd === "So" ? " we" : "");
  } else if (d > td) {
    cls += " future";
  }
  var dot = "";
  if (dp && dp.planDone) {
    cls += " has";
    dot = ' style="background:' + planColor(dp.plan) + '"';
  } else if (dp && dp.done) {
    cls += " has";
  } else if (planned) {
    cls += " plan";
    dot = ' style="border-color:' + planColor(planned) + '"';
  } else if (dp) {
    cls += " part";
  }
  var tip = dp ? esc(dp.plan ? dp.plan : "Training") + ', ' + dp.total + ' Übungen' : "";
  if (planned && !(dp && dp.planDone)) tip += (tip ? ", " : "") + "geplant: " + esc(planned);
  var inner = '<span class="wd">' + wd + '</span><span class="dd">' + dt.getDate() +
    '</span><span class="dot"' + dot + '></span>';
  var title = tip ? ' title="' + tip + '"' : "";
  if (act === "ovrday" && d < td) return '<span class="' + cls + '"' + title + '>' + inner + '</span>';
  return '<button class="' + cls + '" data-act="' + act + '" data-v="' + d + '"' + title + '>' +
    inner + '</button>';
}
function weekStrip() {
  var td = todayISO();
  var first = shiftISO(td, -STRIP_BACK), last = shiftISO(td, STRIP_FWD);
  /* Ein gewählter Tag weit außerhalb nimmt das ganze Fenster mit, statt beliebig
     viele Zellen entstehen zu lassen. */
  if (S.date < first || S.date > last) {
    first = shiftISO(S.date, -STRIP_BACK);
    last = shiftISO(S.date, STRIP_FWD);
  }
  var cells = "", d = first;
  while (d <= last) { cells += dayCell(d, td, "pickday", S.date); d = shiftISO(d, 1); }
  return '<div class="weekrow"><div class="week" id="week">' + cells + '</div>' +
    '<button class="weekmore" data-act="weekovr" ' +
    'aria-label="Wochenübersicht" title="Übersicht der letzten und nächsten Wochen">' +
    svg("wochen", 19) + '</button></div>';
}
/* Trainierte und noch geplante Tage einer Kalenderwoche, für die Zeile über dem
   Raster in der Wochenübersicht. Trainiert heißt wie im Streifen: der Tag trägt
   den gefüllten Punkt. */
function weekTally(monday, td, stats) {
  var done = 0, planned = 0;
  for (var i = 0; i < 7; i++) {
    var dp = stats[i].dp;
    if (dp && (dp.planDone || dp.done)) done += 1;
    else if (shiftISO(monday, i) >= td && stats[i].planned) planned += 1;
  }
  var bits = [];
  if (done) bits.push(done + (done === 1 ? " Tag" : " Tage"));
  if (planned) bits.push(planned + " geplant");
  if (bits.length) return bits.join(", ");
  return shiftISO(monday, 6) < td ? "kein Training" : "nichts geplant";
}
/* Eigener Bildschirm im Trainingsreiter, seit 1.24.0: die beiden vergangenen
   Kalenderwochen, die laufende und die beiden kommenden, Montag bis Sonntag.
   Dieselben Zellen wie im Streifen, damit man nicht zweimal etwas lernen muss.

   Ein Tipp auf einen Tag ab heute weist ihm einen Plan zu, mit derselben Auswahl
   wie im Reiter Planung (assignPanel()) und direkt unter seiner Woche. Bis 1.24.0
   öffnete der Tipp den Tag im Training; das kann der Streifen darunter schon, und
   zum Nachsehen taugt die Übersicht auch ohne. Angeboten werden die im Training
   eingeblendeten Pläne, dazu ein bereits zugewiesener, der nicht mehr darunter
   ist - sonst ließe er sich nur noch auf Frei setzen. */
function viewWeekOverview() {
  var td = todayISO(), curMon = mondayOf(td), lastDay = shiftISO(curMon, 34);
  var sel = S.ovrDay;
  /* Nur Tage ab heute und innerhalb der gezeigten Wochen lassen sich zuweisen. */
  if (!sel || sel < td || sel > lastDay) sel = S.ovrDay = td;
  var plans = visiblePlans(), assigned = plannedPlan(sel);
  if (assigned && plans.indexOf(assigned) < 0) plans = plans.concat([assigned]);
  var h = '<div class="pkhead"><button data-act="weekovrclose" aria-label="Zurück">' +
    svg("zurueck", 22) + '</button><b>Wochenübersicht</b></div><div class="card">';
  for (var i = -2; i <= 2; i++) {
    var mon = shiftISO(curMon, i * 7), cur = mon === curMon;
    var days = "", stats = [];
    for (var k = 0; k < 7; k++) {
      var day = shiftISO(mon, k), st = dayStatus(day);
      stats.push(st);
      days += dayCell(day, td, "ovrday", sel, st);
    }
    h += '<div class="kw"><span' + (cur ? ' class="now"' : "") + '>KW ' + isoWeekNo(mon) +
      (cur ? " · diese Woche" : "") + '</span><em>' + weekTally(mon, td, stats) + '</em></div>' +
      '<div class="cal">' + days + '</div>';
    if (sel >= mon && sel <= shiftISO(mon, 6)) {
      h += assignPanel(sel, plans, i < 2, "Alle Pläne sind im Training ausgeblendet. " +
        "Unter Pläne lässt sich das über das Auge neben dem Plannamen ändern.");
    }
  }
  h += '<div class="dotleg"><span><i class="full"></i>absolviert</span>' +
    '<span><i class="ring"></i>geplant</span>' +
    '<span><i class="part"></i>angefangen</span></div></div>' +
    '<p class="notice">Ein Tipp auf einen Tag ab heute legt einen Plan darauf. Zum ' +
    'Eintragen führt der Wochenstreifen darunter.</p>';
  return h;
}

/* Zeile über dem Fortschrittsbalken: Position im Plan und Dauer der laufenden Einheit. Der
   Planname steht schon im Wähler direkt darüber und wird hier nicht wiederholt. */
function logHead() {
