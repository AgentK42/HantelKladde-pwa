/* Ein Segment je Planübung. Grün heißt alle Zielsätze erledigt, Grau angefangen,
   das höhere Segment ist die gerade gewählte Übung. Antippen springt dorthin. */
function planProgress() {
  if (!S.plan || !S.plans[S.plan] || !S.plans[S.plan].length) return "";
  var h = '<div class="prog">';
  S.plans[S.plan].forEach(function (i) {
    var need = i.sets > 0 ? i.sets : defaultSets();
    var c = doneSets(i.name, S.date);
    var cls = [];
    if (c >= need) cls.push("done");
    else if (c) cls.push("part");
    if (i.name === S.exercise) cls.push("cur");
    h += '<button class="' + cls.join(" ") + '" data-act="planpick" data-v="' +
      esc(i.name) + '" title="' + esc(i.name) + ', ' + c + ' von ' + need +
      '" aria-label="' + esc(i.name) + ', ' + c + ' von ' + need + '"></button>';
  });
  return h + '</div>';
}

/* Das große Gewicht mit runden Tasten. Die Zahl selbst bleibt ein Eingabefeld,
   damit sich ein weiter entfernter Wert direkt tippen lässt statt in Schritten. */
var wPrev = "";
function weightDial(name) {
  var st = stepOf(name);
  var pop = S.weight !== wPrev;
  wPrev = S.weight;
  return '<div class="wdial">' +
    '<button data-act="step" data-f="weight" data-d="' + (-st) +
    '" aria-label="weniger Gewicht">&minus;</button>' +
    '<div class="wmid"><span class="val"><input id="in-weight" inputmode="decimal" ' +
    'value="' + esc(S.weight) + '" data-act="input" data-f="weight" ' +
    'aria-label="Gewicht in Kilogramm"' + (pop ? ' class="pop"' : '') + '></span>' +
    '<div class="wunit">kg · ±' + num(st) + '</div></div>' +
    '<button class="up" data-act="step" data-f="weight" data-d="' + st +
    '" aria-label="mehr Gewicht">+</button></div>';
}

/* Wie weightDial(), aber für den Standard-Trainingsreiter neu gestaltet: kg
   direkt neben der Zahl statt darunter, Beschriftung als eigene Zeile. Eigene
   Funktion, damit Fokus-Modus und das Bearbeiten eines Satzes unverändert bei
   der kompakteren weightDial() bleiben. */
var wPrevHero = "";
function heroWeightDial(name) {
  var st = stepOf(name);
  var pop = S.weight !== wPrevHero;
  wPrevHero = S.weight;
  return '<div class="wdial">' +
    '<button data-act="step" data-f="weight" data-d="' + (-st) +
    '" aria-label="weniger Gewicht">&minus;</button>' +
    '<div class="wmid"><div class="wnum"><span class="val"><input id="in-weight" ' +
    'inputmode="decimal" value="' + esc(S.weight) + '" data-act="input" ' +
    'data-f="weight" aria-label="Gewicht in Kilogramm"' + (pop ? ' class="pop"' : '') +
    '></span><em>kg</em></div>' +
    '<div class="wunit">±' + num(st) + '</div></div>' +
    '<button class="up" data-act="step" data-f="weight" data-d="' + st +
    '" aria-label="mehr Gewicht">+</button></div>';
}

/* Reps und RPE als zwei nebeneinander stehende Stepper, nur für den Standard-
   Trainingsreiter. Nutzt denselben "step"-Klick-Handler wie das Gewicht, der
   Reps und RPE bereits unterstützt. Fokus-Modus und Bearbeiten behalten die
   Pillen-Reihen aus repPills()/rpePills(). */
function heroSteppers() {
  var rpeVal = deci(S.rpe);
  /* Die Ziel-Range stand hier eine Zeit lang in der Beschriftung unter der
     Zahl ("Reps 8-12"). Sie steht schon in der Zielzeile darüber, deshalb bleibt
     es hier bei der schlichten Beschriftung. */
  var reps = '<div class="stepbox"><button data-act="step" data-f="reps" data-d="-1" ' +
    'aria-label="weniger Reps">&minus;</button>' +
    '<div class="mid"><b>' + esc(S.reps) + '</b><span>Reps</span></div>' +
    '<button data-act="step" data-f="reps" data-d="1" aria-label="mehr Reps">+</button></div>';
  /* Beim Aufwärmen steht nur die Wiederholungszahl da, über die volle Breite.
     Ein RPE-Feld, das nichts speichert, wäre ein leeres Versprechen. */
  if (S.warm) return '<div class="steprow one">' + reps + '</div>';
  return '<div class="steprow">' + reps +
    '<div class="stepbox"><button data-act="step" data-f="rpe" data-d="-0.5" ' +
    'aria-label="weniger RPE">&minus;</button>' +
    '<div class="mid"><b>' + (isNaN(rpeVal) ? "–" : num(rpeVal)) + '</b><span>RPE</span></div>' +
    '<button data-act="step" data-f="rpe" data-d="0.5" aria-label="mehr RPE">+</button></div>' +
    '</div>';
}

/* Fünf Wiederholungszahlen um den aktuellen Wert. Ein Tipp rückt die Reihe nach,
   so kommt man auch in größere Bereiche, ohne ein Feld anfassen zu müssen. */
function repPills() {
  var cur = parseInt(S.reps, 10);
  if (!(cur > 0)) cur = 10;
  var lo = Math.max(1, cur - 2), h = '<div class="pills">';
  for (var i = 0; i < 5; i++) {
    var v = lo + i;
    h += '<button class="' + (v === cur ? "on" : "") + '" data-act="pillrep" data-v="' +
      v + '">' + v + '</button>';
  }
  return h + '</div>';
}

/* Wie repPills(), nur mit eigenem, verschiebbarem Ausschnitt: eigens für den
   Fokus-Modus, damit sich auch weit unter dem Zielwert liegende Wiederholungen
   erreichen lassen, etwa bei einem abgebrochenen Satz. Chevron und Wischen auf
   der Reihe verschieben nur den Ausschnitt, ein Tipp auf eine Zahl wählt sie
   und zentriert wieder auf ihr, genau wie bei repPills(). */
function focusRepPills() {
  var cur = parseInt(S.reps, 10);
  if (!(cur > 0)) cur = 10;
  var center = repWinCenter != null ? repWinCenter : cur;
  var lo = Math.max(1, center - 2);
  /* Ziel-Range der doppelten Progression, 1.13.0: die Tasten innerhalb der
     Range bekommen einen Rahmen, das ist die ganze Auszeichnung. Der untere
     Rand hatte zunächst zusätzlich einen Punkt, der ist wieder raus - er stand
     ohnehin schon in der Zielzeile, war die linkeste umrandete Taste und der
     Vorschlag nach einem Gewichtssprung, trug also keine eigene Information.
     Bewusst nur hier und in heroSteppers(), nicht in repPills() - beim
     Korrigieren eines früheren Satzes ist die Range keine Information,
     sondern nur Beiwerk. */
  var rng = repRangeShown(S.exercise);
  var h = '<div class="repsrow"><button class="chev" data-act="repwin" data-d="-5" ' +
    'aria-label="Niedrigere Reps zeigen">' + svg("zurueck", 15) +
    '</button><div class="pills">';
  for (var i = 0; i < 5; i++) {
    var v = lo + i;
    var cls = [];
    if (v === cur) cls.push("on");
    if (rng && v >= rng.lo && v <= rng.hi) cls.push("inrange");
    h += '<button class="' + cls.join(" ") + '" data-act="pillrep" data-v="' +
      v + '">' + v + '</button>';
  }
  h += '</div><button class="chev fwd" data-act="repwin" data-d="5" ' +
    'aria-label="Höhere Reps zeigen">' + svg("zurueck", 15) + '</button></div>';
  return h;
}

/* RPE von 6 bis 10. Ein abweichender Wert aus älteren Sätzen, etwa 7,5, wird
   zusätzlich einsortiert, damit er beim Bearbeiten nicht stillschweigend wegfällt. */
function rpePills() {
  var cur = deci(S.rpe);
  var vals = [6, 7, 8, 9, 10];
  if (!isNaN(cur) && vals.indexOf(cur) < 0) {
    vals.push(cur);
    vals.sort(function (a, b) { return a - b; });
  }
  var h = '<div class="pills">';
  vals.forEach(function (v) {
    h += '<button class="' + (v === cur ? "on rpe" : "") + '" data-act="pillrpe" data-v="' +
      comma(v) + '">' + num(v) + '</button>';
  });
  return h + '</div>';
}

/* Höchstgewicht der letzten fünf Trainingstage als Balken. Bei durchweg gleichem
   Gewicht stehen alle gleich hoch, das ist die Optik eines Plateaus. */
function exBars(name) {
  var byDay = {};
  workOf(name).forEach(function (e) {
    if (byDay[e.date] == null || e.weight > byDay[e.date]) byDay[e.date] = e.weight;
  });
  var days = Object.keys(byDay).sort().slice(-5);
  if (!days.length) return [];
  var vals = days.map(function (d) { return byDay[d]; });
  var max = Math.max.apply(null, vals), min = Math.min.apply(null, vals);
  var span = max - min;
  /* Höhen in Pixel, nicht in Prozent: eine Prozentangabe löst im Flex-Kontext
     nicht zuverlässig gegen die feste Spurhöhe auf. */
  var bars = vals.map(function (v, i) {
    return { h: span < 0.001 ? 13 : Math.round(5 + (v - min) / span * 19),
      last: i === vals.length - 1 };
  });
  /* Immer fünf Plätze. Bei wenigen Trainingstagen stünde sonst ein einzelner
     breiter Balken da, der wie ein Fortschrittsbalken aussieht statt wie Verlauf. */
  while (bars.length < 5) bars.unshift({ h: 3, empty: true });
  return bars;
}

/* Eine Karte je Übung. Der Tag zeigt, was am wichtigsten ist: steht sie im
   gewählten Plan, dann das, sonst die Gruppe. Die Langhantel-Kennzeichnung
   steht bewusst nicht mehr hier - der Scheibenrechner im Training macht das
   ohnehin offensichtlich, ein Tag dafür ist überflüssig. */
/* opts.multi steuert die Mehrfachauswahl im Pläne-Reiter (pickmulti-Aktionen):
   die Karte prüft "im Plan" gegen opts.plan statt gegen den aktiven Trainingsplan,
   markiert per Häkchen statt per Trainingsauswahl und tippt togglet statt zu
   übernehmen und den Picker zu schließen. */
function exCard(n, opts) {
  opts = opts || {};
  var planCheck = opts.multi ? opts.plan : S.plan;
  /* Ziel Entwurf (Planung): "im Plan" heißt hier "schon als einzelne Übung drin" */
  var inDraft = !!(opts.multi && planCheck === DRAFT_TARGET &&
    weekDraft(selWeek()).extras.some(function (x) { return x.name === n; }));
  var inPlan = inDraft || !!(planCheck && S.plans[planCheck] &&
    S.plans[planCheck].some(function (i) { return i.name === n; }));
  var ls = lastSession(n, null), flat = plateau(n);
  var bars = exBars(n);
  var tag = inDraft ? "IM ENTWURF" : (inPlan ? "IM PLAN" : catOf(n).toUpperCase());
  /* Steht die Gruppe schon in der Abschnittsüberschrift darüber (aktive Kategorie-
     oder Muskel-Pille, keine Suche), wäre sie auf jeder Karte noch einmal doppelt. */
  var showTag = inPlan || !opts.hideTag || catOf(n) !== opts.hideTag;
  var selectedCount = dayEntries().filter(function (e) { return e.exercise === n; }).length;
  /* Höchstens drei Angaben. Die Satzzahl bezieht sich auf das ausgewählte Datum
     und heißt deshalb nur am tatsächlichen heutigen Tag auch „heute“. */
  var meta = "noch nie erfasst";
  if (ls) {
    var bits = [num(ls.top) + " kg"];
    if (flat) bits.push(flat + " Wo. gleich");
    if (selectedCount) bits.push(selectedCount + "× " +
      (S.date === todayISO() ? "heute" : "am " + tinyDate(S.date)));
    else if (!flat) bits.push(agoText(ls.day));
    meta = bits.join(" · ");
  }
  var selected = !!(opts.multi && opts.selected);
  var h = '<button class="excard' + (inPlan ? " inplan" : "") +
    (selected ? " sel" : (!opts.multi && n === S.exercise ? " on" : "")) + '" data-act="' +
    (opts.multi ? "picktoggle" : "opt") + '" data-v="' + esc(n) + '">' +
    (showTag ? '<span class="tag">' + (inPlan ? '<i class="pdot"></i>' : "") + esc(tag) + '</span>' : "") +
    (selected ? '<span class="chk">' + svg("haken", 14) + '</span>' : "") +
    '<span class="nm">' + esc(n) + '</span>' +
    '<span class="bars">';
  if (bars.length) {
    bars.forEach(function (b) {
      h += '<i class="' + (b.empty ? "pad" : (b.last ? "last" : "")) +
        '" style="height:' + b.h + 'px"></i>';
    });
  }
  h += '</span><span class="meta' + (flat ? " flat" : "") + '">' + meta +
    '</span></button>';
  return h;
}

/* Auswahlbildschirm. Er tritt an die Stelle des Trainingsbildschirms, statt sich
   darunter aufzuklappen, damit die Karten die ganze Breite bekommen. */
function viewPicker() {
  var multi = !!S.pickPlanTarget;
  var names = allNames();
  var q = S.search.trim().toLowerCase();
  /* Umschalter Kategorie/Muskelgruppe, siehe "seg2" - gilt für Mehrfachauswahl
     genauso wie für die einfache Auswahl über die aktuelle Übung im Standard-
     und Fokus-Modus. */
  var byMuscle = S.pickGroupBy === "muscle";
  var groups, active;
  if (byMuscle) {
    groups = MUSCLE_LIST.filter(function (m) {
      return names.some(function (n) { var mo = muscleOf(n); return mo && mo.primary === m; });
    });
    if (names.some(function (n) { return !muscleOf(n); })) groups.push("Ohne Zuordnung");
    active = S.pickMuscle && groups.indexOf(S.pickMuscle) >= 0 ? S.pickMuscle : (groups[0] || "");
  } else {
    groups = CATLIST.concat(["Sonstige"]).filter(function (c) {
      return names.some(function (n) { return catOf(n) === c; });
    });
    active = S.pickCat && groups.indexOf(S.pickCat) >= 0 ? S.pickCat : (groups[0] || "Push");
  }
  var items = q
    ? names.filter(function (n) { return n.toLowerCase().indexOf(q) >= 0; })
    : names.filter(function (n) {
        if (!byMuscle) return catOf(n) === active;
        var mo = muscleOf(n);
        return active === "Ohne Zuordnung" ? !mo : !!(mo && mo.primary === active);
      });

  var h = '<div class="pkhead">' +
    '<button data-act="' + (multi ? "pickmulticlose" : "pickclose") +
    '" aria-label="Zurück">' + svg("zurueck", 22) + '</button><b>' +
    (multi
      ? (S.pickPlanTarget === DRAFT_TARGET ? "Für den Entwurf wählen"
        : "Für " + esc(S.pickPlanTarget) + " wählen")
      : "Übung wählen") +
    '</b></div>';
  h += '<div class="seg2">' +
    '<button class="' + (byMuscle ? "" : "on") + '" data-act="pickgroupby" data-v="cat">' +
    'Kategorie</button>' +
    '<button class="' + (byMuscle ? "on" : "") + '" data-act="pickgroupby" data-v="muscle">' +
    'Muskelgruppe</button></div>';
  h += '<div class="catpills">';
  groups.forEach(function (c) {
    h += '<button class="' + (!q && c === active ? "on" : "") + '" data-act="' +
      (byMuscle ? "pickmuscle" : "pickcat") + '" data-v="' + esc(c) + '">' + esc(c) + '</button>';
  });
  h += '</div>' +
    '<div class="pkfind"><input id="searchEx" data-act="search" ' +
    'placeholder="Übung suchen" value="' + esc(S.search) + '"></div>';

  /* Mehrfachauswahl: Zähler und Bestätigen bleiben direkt unter der Suche stehen,
     damit sie nach dem Antippen mehrerer Karten nicht erst wieder hochgescrollt
     werden müssen. */
  if (multi) {
    var nSel = S.pickSel.length;
    h += '<div class="pkmulti"><span>' + nSel +
      (nSel === 1 ? " Übung ausgewählt" : " Übungen ausgewählt") + '</span>' +
      '<button data-act="pickmultidone"' + (nSel ? "" : " disabled") + '>Hinzufügen</button></div>';
  }

  h += '<div class="pksect"><span>' + (q ? "Treffer" : esc(active)) + '</span><em>' +
    items.length + (items.length === 1 ? " Übung" : " Übungen") + '</em></div>';

  if (!items.length) {
    h += '<p class="empty">' + (q
      ? "Kein Treffer für " + esc(S.search) + ".<br>Lege die Übung unten neu an."
      : "Keine Übung in dieser Gruppe.") + '</p>';
  } else {
    h += '<div class="excards">';
    /* Das Kategorie-Tag auf der Karte doppelt nur bei Kategorie-Einteilung mit
       der Abschnittsüberschrift, bei Muskelgruppen zeigt es weiterhin die
       Kategorie und ist damit eine zusätzliche, keine doppelte Angabe. */
    var hideTag = (!q && !byMuscle) ? active : "";
    items.forEach(function (n) {
      h += exCard(n, multi
        ? { multi:true, plan:S.pickPlanTarget, selected:S.pickSel.indexOf(n) >= 0, hideTag:hideTag }
        : { hideTag:hideTag });
    });
    h += '</div>';
  }

  var newCatActive = byMuscle ? "" : active;
  h += '<div class="newbox"><div class="tab">Neue Übung</div><div class="body">' +
    '<div class="newrow"><input id="newName" placeholder="Name der Übung"></div>' +
    '<div class="newrow"><select id="newCat">' +
    CATLIST.map(function (c) {
      return '<option value="' + esc(c) + '"' + (c === newCatActive ? " selected" : "") +
        '>' + esc(c) + '</option>';
    }).join("") + '</select></div>' +
    '<div class="newrow">' +
    '<div class="deffield"><label for="newSets">Sätze</label><input id="newSets" ' +
    'inputmode="numeric" value="' + defaultSets() + '"></div>' +
    '<div class="deffield"><label for="newReps">Reps</label><input id="newReps" ' +
    'inputmode="numeric" value="' + defaultReps() + '"></div>' +
    '<div class="deffield"><label for="newWeight">kg</label><input id="newWeight" ' +
    'inputmode="decimal" value="' + comma(defaultWeight()) + '"></div>' +
    '</div>' +
    '<div class="newrow"><div style="flex:1"><label class="mlabel">Muskelgruppe</label>' +
    '<div class="msel">' +
    '<select id="newMusclePrimary" data-act="newmuscleprimary" ' +
    'data-target="newMuscleSecondary" aria-label="Primäre Muskelgruppe">' +
    muscleOptionList("Primär") + '</select>' +
    '<select id="newMuscleSecondary" aria-label="Sekundäre Muskelgruppe" disabled>' +
    muscleOptionList("Sekundär") + '</select></div></div></div>' +
    '<div class="newrow"><button data-act="addex">Anlegen</button></div>' +
    '</div></div>';
  return h;
}

/* Der Pausentimer startet nur für den heutigen Tag, siehe den Aufruf von
   startRest() im Speichern-Zweig: wer einen zurückliegenden Tag nachträgt, will
   nicht dabei sitzen und warten. Das passierte bisher stillschweigend, und weil
   restoreSession() seit 1.17.2 auch das zuletzt betrachtete Datum zurückholt,
   kam man nach Mitternacht mit dem Datum von gestern hoch und wunderte sich über
   einen Timer, der nicht mehr angeht. Deshalb steht der Grund jetzt da. */
function restOffNote() {
  if (!S.settings.autoRest || S.date === todayISO()) return "";
  /* Der Weg zurück steht nur im Trainingsreiter dabei. Im Fokus-Modus gibt es
     die Datumszeile und damit den Knopf "Heute" nicht, dort führt der Pfeil
     links oben hinaus. */
  return '<div class="notice bad">Kein Timer, da Datum ' +
    (S.date < todayISO() ? "in der Vergangenheit" : "in der Zukunft") + '.' +
    (S.focus ? "" : ' Über <b>Heute</b> oben zurück zum laufenden Tag.') +
    '</div>';
}
/* Der Trainingsreiter, von oben nach unten: Datumszeile mit Wochenstreifen,
   Planauswahl, die Karte zur gewählten Übung (oder zum Satz in Bearbeitung, oder
   der leere Einstieg), die Planliste und die erfassten Sätze des Tages. Bis 1.30.0
   stand das alles in einer Funktion mit 224 Zeilen und einer Komplexität von 70. */
function viewTag() {
  if (S.pickOpen) return viewPicker();
  if (S.weekOverview) return viewWeekOverview();
  return tagHeader() + planChooser() + heroBlock() + planListBlock() +
    daySetsBlock(dayEntries());
}
/* Backup-Hinweis, Datumszeile, Wochenstreifen und der Hinweis zur Pause */
function tagHeader() {
  var h = "";
  var due = backupDue();
  if (due) {
    h += '<div class="notice act">' + esc(due) +
      '<button data-act="savefile">Sichern</button></div>';
  }

  h += '<div class="dateline"><span>' +
    (S.date === todayISO() ? "Heute, " : "") + longDay(S.date) + '</span>' +
    '<span class="dact">' +
    (S.date === todayISO() ? "" : '<button class="today" data-act="today">Heute</button>') +
    '</span></div>' + weekStrip() + restOffNote();
  return h;
}
/* Eingeklappt nur der gewählte Plan, sonst die Liste; darunter der Fokus-Knopf */
function planChooser() {
  var h = "";
  if (S.plan && S.plans[S.plan] && S.plansFold) {
    /* Eingeklappt: nur der gewählte Plan, ein Tipp öffnet die Auswahl wieder */
    var lpc = lastPlanDay(S.plan);
    h += '<button class="plansel" data-act="plansfold" aria-expanded="false" ' +
      'aria-label="' + esc(S.plan + ", zuletzt abgeschlossen " +
        (lpc ? agoText(lpc) : "noch nie") + ". Planauswahl öffnen") + '" ' +
      'title="Planauswahl öffnen"><span class="pdot" style="background:' +
      planColor(S.plan) + '"></span><b>' + esc(S.plan) + '</b><span>' +
      (lpc ? agoText(lpc) : "noch nie") + '</span><em>Plan wechseln</em>' +
      '<i class="chev">' + svg("chev", 15) + '</i></button>';
  } else if (!visiblePlans().length) {
    h += '<p class="notice">Alle Pläne sind im Training ausgeblendet. Unter Pläne kannst ' +
      'du sie über das Auge neben dem Plannamen wieder einblenden.</p>';
  } else {
    var vp = visiblePlans();
    if (vp.some(function (p) { return weekGoal(p) > 0; })) {
      h += '<div class="plansgoalcap">Wochenziele:</div>';
    }
    h += '<div class="plans">';
    vp.forEach(function (p) {
      var lp = lastPlanDay(p);
      h += '<button class="' + (S.plan === p ? "on" : "") + '" data-act="plan" data-v="' +
        esc(p) + '" aria-label="' + esc(p + ", zuletzt abgeschlossen " +
          (lp ? agoText(lp) : "noch nie")) + '"><span class="pn"><span class="pdot" style="background:' + planColor(p) +
        '"></span>' + esc(p) + '</span><span class="pa">' +
        (lp ? agoText(lp) : "noch nie") + '</span>' + planGoalLine(p) + '</button>';
    });
    h += '</div>';
  }

  if (S.plan && S.plans[S.plan] && S.plans[S.plan].length) {
    h += '<button class="focusgo" data-act="focuson">' + svg("hantelh", 16) +
      '<span>Fokus Mode starten</span></button>';
  }
  return h;
}
/* Die Karte in der Mitte: ein Satz in Bearbeitung, sonst die gewählte Übung,
   sonst der leere Einstieg. Ein editId ohne passenden Satz zeigt nichts. */
function heroBlock() {
  if (S.editId) {
    var ed = S.entries.filter(function (e) { return e.id === S.editId; })[0];
    return ed ? editHero(ed) : "";
  }
  return S.exercise ? exerciseHero() : blankHero();
}
function editHero(ed) {
  return '<div class="hero edit">' +
    '<div class="setline">SATZ ' + ed.set + (ed.warm ? " AUFWÄRMEN" : "") +
    ' BEARBEITEN</div>' +
    '<div class="hero-ex">' + esc(ed.exercise) + '</div>' +
    '<div class="hero-meta">Satz vom ' + shortDate(ed.date) +
    '. Ursprünglich <b>' + ed.reps + ' Reps</b> mit <b>' + num(ed.weight) + ' kg</b>' +
    (ed.rpe != null ? ', RPE ' + num(ed.rpe) : '') + '.</div>' +
    weightDial(ed.exercise) +
    '<div class="fieldlab">REPS</div>' + repPills() +
    (ed.warm ? "" : '<div class="fieldlab">RPE</div>' + rpePills()) +
    '<div class="savearea">' +
    '<button class="save" data-act="update">Änderung speichern</button>' +
    '<button class="ghost" data-act="canceledit">Abbrechen</button></div></div>';
}
/* Die Übungskarte: Ziel, letztes Top Set, Vorschlag, Gewicht, Reps und RPE,
   Aufwärmrampe, Notiz und Verlauf, darunter die feste Speichern-Zeile. */
function exerciseHero() {
  var n = nextSet(), last = lastSession(S.exercise, S.date);
  var tg = planTarget(S.exercise);
  /* "Letztes Top Set" zeigt den besten Arbeitssatz der letzten früheren Einheit,
     nicht deren chronologisch letzten Satz. Ein leichter Auslaufsatz verfälscht
     die Zeile deshalb nicht. */
  var lastSet = last ? bestSet(last.sets) : null;
  var doneN = doneSets(S.exercise, S.date), needN = targetSets(S.exercise);
  /* Vorschlag und Plateau-Warnung nur beim heutigen Training, beim Nachtragen
     oder Korrigieren älterer Tage lenken sie nur ab */
  var isToday = S.date === todayISO();
  var flat = isToday ? plateau(S.exercise) : 0;
  var curW = deci(S.weight) || 0;
  var wBase = S.warm && S.warmBase > 0 ? S.warmBase : curW;
  var ramp = doneSets(S.exercise, S.date) ? [] : warmupPlan(S.exercise, wBase);
  var split = isBar(S.exercise) ? plateSplit(curW) : null;
  var heroRng = repRangeShown(S.exercise);
  /* Wie im Fokus-Modus: blau der aktuelle, grün die erledigten Sätze, keine
     Textzeile "Satz X von Y" mehr daneben, siehe BACKLOG. */
  var setBars = "";
  for (var si = 0; si < needN; si++) {
    setBars += '<i class="' + (si < doneN ? "done" : (si === doneN ? "cur" : "")) + '"></i>';
  }

  return logHead() + planProgress() +
    '<div class="hero' + (S.warm ? " warm" : "") + '">' +
    '<div class="hero-top">' +
    '<button class="hero-ex tap" data-act="pickopen" title="Andere Übung wählen">' +
    '<span>' + esc(S.exercise) + '</span><i class="chev">' + svg("chev", 16) +
    '</i></button>' +
    '<div class="setprog"><div class="bars">' + setBars + '</div></div>' +
    '</div>' +
    '<div class="hero-meta">' +
    /* Ist die doppelte Progression an, steht hier die Range statt der einen
       Zielzahl - sonst wäre der Vorschlag "+1 Rep" nicht
       nachvollziehbar, siehe repRangeShown(). */
    (tg ? "Ziel <b>" + needN + "x " +
      (heroRng ? rangeText(heroRng) : tg.reps) + " Reps</b> mit <b>" +
      num(tg.weight) + " kg</b><br>" : "") +
    (lastSet ? "Letztes Top Set <b>" + lastSet.reps + "x " + num(lastSet.weight) + " kg</b> am " +
      tinyDate(last.day) + (lastSet.rpe != null ? " bei RPE " + num(lastSet.rpe) : "") +
      "" : "Erste Aufzeichnung für diese Übung") +
    '</div>' +
    (isToday ? suggestionBlock() : "") +
    (isToday && flat ? '<div class="flag">Seit ' + flat + ' Wochen unverändert bei ' +
      num(lastSet ? lastSet.weight : 0) + ' kg. Zeit für mehr Gewicht, mehr ' +
      'Reps oder eine andere Übung.</div>' : "") +
    heroWeightDial(S.exercise) +
    (split ? '<div class="plates">Stange ' + num(split.bar) + ' kg, pro Seite ' +
      split.side.map(num).join(' + ') +
      (split.rest > 0.001 ? '<b> und ' + num(split.rest) + ' kg fehlen</b>' : '') +
      '</div>' : "") +
    heroSteppers() +
    (ramp.length
      ? '<div class="warmrow"><span>Warmup</span>' +
        ramp.map(function (r, ri) {
          /* Mit Einheit, wie im Fokus-Modus: ohne "kg" steht die Zahl allein
             neben der Wiederholungszahl und liest sich wie ein zweiter Faktor. */
          return '<button data-act="warmpick" data-i="' + ri + '">' + num(r.weight) +
            ' kg <s>&times;' + r.reps + '</s></button>';
        }).join("") + '</div>'
      : "") +
    exNoteBlock() +
    exHistBlock() +
    '</div>' +
    /* Wie im Fokus-Modus: der Speichern-Knopf bleibt am unteren Bildschirmrand
       stehen, statt mit der Übungskarte wegzuscrollen, siehe BACKLOG. */
    '<div class="savearea main">' +
    (S.toast ? '<div class="toast">' + S.toast + '</div>' : "") +
    '<button class="save' + (S.warm ? " warm" : "") + '" data-act="save">' +
    (S.warm ? "Aufwärmsatz speichern" : "Satz " + n + " speichern") + ': ' +
    esc(S.weight) + ' kg × ' + esc(S.reps) + '</button>' +
    /* Im Standard-Trainingsreiter bleibt nur die Rückzugsmöglichkeit aus einem
       Zustand stehen, in den man geraten ist (Aufwärmen, letzte Planübung).
       Der aktive Einstieg dorthin (manuell Aufwärmen erfassen, eine Übung
       bewusst überspringen) ist hier entfernt, siehe BACKLOG. */
    (S.warm || !(planIndex() >= 0 && planIndex() < S.plans[S.plan].length - 1)
      ? '<div class="subacts">' +
        (S.warm ? '<button data-act="warmoff">Doch ein Arbeitssatz</button>' : "") +
        (!(planIndex() >= 0 && planIndex() < S.plans[S.plan].length - 1)
          ? '<button data-act="pickopen">Andere Übung</button>' : "") +
        '</div>'
      : "") + '</div>' +
    planNav();
}
function blankHero() {
  return '<div class="hero blank"><div class="hero-ex">Bereit für den ersten Satz</div>' +
    '<div class="hero-meta">Wähle einen Plan oder eine einzelne Übung. Reps ' +
    'und Gewicht werden dann aus deinem letzten Training vorgeschlagen.</div>' +
    '<div class="savearea"><button class="save" data-act="pickopen">Übung wählen</button>' +
    '</div></div>';
}
/* Kopfzeile des Plans mit offenen Übungen, aufklappbar zur Liste */
function planListBlock() {
  var h = "";
  if (S.plan && S.plans[S.plan]) {
    var items = S.plans[S.plan];
    var offen = items.filter(function (i) {
      return doneSets(i.name, S.date) < (i.sets > 0 ? i.sets : defaultSets());
    }).length;
    h += '<button class="planhead" data-act="planlist"><b>' + esc(S.plan) + '</b><span>' +
      (offen ? offen + " von " + items.length + " offen" : "alle Zielsätze erledigt") +
      '</span><i class="chev' + (S.planOpen ? " up" : "") + '">' + svg("chev", 15) +
      '</i></button>';
    if (S.planOpen) {
      h += '<div class="plan">';
      items.forEach(function (i) {
        var need = i.sets > 0 ? i.sets : defaultSets();
        var c = doneSets(i.name, S.date);
        var full = c >= need;
        h += '<button class="' + (full ? "done " : c ? "part " : "") +
          (i.name === S.exercise ? "on" : "") +
          '" data-act="planpick" data-v="' + esc(i.name) + '"><span class="stripe"></span>' +
          '<span><span class="nm">' + esc(i.name) + '</span>' +
          '<span class="tg">' + need + 'x ' + i.reps + ' Reps mit ' + num(i.weight) +
          ' kg</span></span>' +
          '<span class="st">' + c + ' von ' + need + '</span></button>';
      });
      h += '</div>';
    }
  }
  return h;
}
/* Erfasste Sätze des Tages nach Übung, Summenzeile, Tagesnotiz und Abschluss */
function daySetsBlock(day) {
  var h = "";
  h += '<div class="sect"><h2>Erfasste Sätze</h2><span>' +
    (day.length ? day.length + (day.length === 1 ? " Satz" : " Sätze") : "noch keine") +
    '</span></div>';

  if (!day.length) {
    h += '<p class="empty">Hier erscheint jeder gespeicherte Satz,<br>' +
      'antippen zum Korrigieren.</p>';
  } else {
    var order = [], groups = {};
    day.forEach(function (e) {
      if (!groups[e.exercise]) { groups[e.exercise] = []; order.push(e.exercise); }
      groups[e.exercise].push(e);
    });
    order.forEach(function (name) {
      var sets = groups[name];
      var wsets = sets.filter(isWork);
      var vol = wsets.reduce(function (a, e) { return a + e.weight * e.reps; }, 0);
      var need = targetSets(name);
      h += '<div class="grp"><header><h3>' + esc(name) + '</h3><span>' +
        wsets.length + ' von ' + need + ', ' + num(vol) + ' kg Last</span></header>';
      sets.forEach(function (s) {
        h += '<div class="set' +
          (s.warm ? " warm" : "") +
          (s.id === S.freshId ? " fresh" : "") + (s.id === S.editId ? " editing" : "") + '">' +
          '<button class="tapzone" data-act="edit" data-v="' + s.id + '">' +
          '<span class="no">' + (s.warm ? "A" : "") + s.set + '</span>' +
          '<span class="fig">' + s.reps + '<s>Reps</s></span>' +
          '<span class="fig">' + num(s.weight) + '<s>kg</s></span>' +
          (s.warm ? '<span class="rpe">Warmup</span>'
                  : (s.rpe != null ? '<span class="rpe">RPE ' + num(s.rpe) + '</span>' : '')) +
          '</button>' +
          '<button class="del" data-act="del" data-v="' + s.id +
          '" aria-label="Satz löschen">✕</button></div>';
      });
      h += '</div>';
    });
    var wday = day.filter(isWork);
    var workExercises = {};
    wday.forEach(function (e) { workExercises[e.exercise] = 1; });
    var workExerciseCount = Object.keys(workExercises).length;
    var total = wday.reduce(function (a, e) { return a + e.weight * e.reps; }, 0);
    var mins = dayMinutes(S.date);
    /* Aufwärmsätze bleiben in der Satzliste sichtbar, zählen den Trainingstag aber
       weder als Übung noch als erledigt. Maßgeblich sind nur Arbeitsätze.
       "erledigt" kommt jetzt aus derselben Quelle wie der Punkt im Wochenstreifen
       (dayPlan()): MIN_DONE zählt dort nur Übungen aus dem erkannten Plan, nicht
       beliebige Bonus-Übungen. Ohne erkannten Plan gibt es dafür keine Grundlage,
       die Marke bleibt dann weg statt eine Zahl zu zeigen, die nichts über einen
       Plantag aussagt. */
    var dp = dayPlan(S.date);
    var mark = (dp && dp.plan)
      ? '<em class="' + (dp.done ? "ok" : "") + '">' +
        (dp.done ? "erledigt" : "noch " + (dp.need - dp.touched)) + '</em>'
      : "";
    h += '<div class="totals"><b>' + workExerciseCount + ' Übungen</b>' +
      '<span>' + wday.length + ' Sätze</span><span>' + num(total) + ' kg</span>' +
      (mins ? '<span>' + mins + ' min</span>' : '') + mark + '</div>';

    h += '<button class="planhead" data-act="noteopen"><b>Notiz zum Tag</b><span>' +
      (S.notes[S.date] ? "vorhanden" : "keine") + '</span>' +
      '<i class="chev' + (S.noteOpen ? " up" : "") + '">' + svg("chev", 15) +
      '</i></button>';
    if (S.noteOpen) {
      h += '<textarea id="dayNote" class="note" data-act="noteinput" rows="3" ' +
        'placeholder="Wie lief es? Etwa: Knie gezwickt, Bank besetzt, Gurt benutzt.">' +
        esc(S.notes[S.date] || "") + '</textarea>';
    }
    h += '<div class="tools"><button class="solid wide" data-act="finish">' +
      'Training abschließen und sichern</button></div>';
  }
  return h;
}

/* Die Geräteeinstellung der gewählten Übung, direkt über den Eingabefeldern.
   Ein Tipp öffnet das Feld, ohne dass man den Reiter wechseln muss. */
function exNoteBlock() {
  var n = noteOf(S.exercise), open = S.exNoteFor === S.exercise;
  return '<button class="exnote' + (n ? "" : " blank") + '" data-act="exnote" ' +
    'aria-expanded="' + (open ? "true" : "false") + '">' + svg("regler", 15) +
    '<span>' + (n ? esc(n) : "Geräteeinstellung notieren") + '</span>' +
    svg("stift", 14) + '</button>' +
    (open
      ? '<div class="exnedit"><input id="exNote" data-act="exnoteinput" value="' +
        esc(n) + '" placeholder="Sitz 4, Griff eng, Polster Loch 3" ' +
        'aria-label="Geräteeinstellung für ' + esc(S.exercise) + '"></div>'
      : "");
}

/* Verlauf dieser Übung, aufklappbar über der Speichern-Zeile im Standard-
   Trainingsreiter: die letzten drei früheren Einheiten mit ihren Arbeitssätzen,
   rein lesend, ohne Tippfläche und ohne Löschknopf. Kein Datumskopf je Einheit,
   der Tag steht grau in der Zeile von Satz 1, getrennt werden die Einheiten
   durch eine Haarlinie.

   Der aufgeklappte Zustand hängt wie die Notiz (S.exNoteFor) an der Übung und
   nicht an einem eigenen Schalter: beim Wechsel der Übung klappt der Block
   deshalb von selbst wieder zu und ist kein Teil des Backups.

   Derselbe Block steht seit 1.30.6 auch im Fokus-Modus, dort unten in der Karte
   unter der Eingabe, siehe focusHero(). Abgeschaltet wird er getrennt: exHist
   gilt für den Trainingsreiter, focusHist für den Fokus. Im Fokus ist der Platz
   knapper, ein gemeinsamer Schalter würde die eine Entscheidung für beide
   Ansichten treffen. */
function exHistBlock() {
  /* focusHero() baut nur bei S.focus auf, damit ist der Schalter eindeutig. */
  if (!(S.focus ? S.settings.focusHist : S.settings.exHist) || !S.exercise) return "";
  var days = lastDaysOf(S.exercise, S.date, 3);
  if (!days.length) return "";
  var open = S.exHistFor === S.exercise;
  var h = '<button class="planhead' + (open ? " open" : "") + '" data-act="exhist" ' +
    'aria-expanded="' + (open ? "true" : "false") + '"><b>Verlauf dieser Übung</b>' +
    '<span>letzte ' + days.length + '</span><i class="chev' + (open ? " up" : "") +
    '">' + svg("chev", 15) + '</i></button>';
  if (!open) return h;
  h += '<div class="exhist">';
  days.forEach(function (d, di) {
    if (di) h += '<div class="sep"></div>';
    d.sets.forEach(function (s, si) {
      h += '<div class="hset"><span class="no">' + s.set + '</span>' +
        '<span class="val">' + s.reps + '</span><span class="unit">Reps</span>' +
        '<span class="val kg">' + num(s.weight) + '</span><span class="unit">kg</span>' +
        '<span class="when">' + (si === 0 ? tinyDate(d.day) : "") + '</span>' +
        '<span class="rpe">' + (s.rpe != null ? "RPE " + num(s.rpe) : "") + '</span></div>';
    });
  });
  return h + '</div>';
}

/* Nur noch für den Standard-Trainingsreiter, der Fokus-Modus hat dafür die
   eigenen Knöpfe unten in der Fußzeile. */
/* Ohne Zählung "X von Y" dahinter: die Planübersicht mit Fortschrittsbalken
   direkt über der Übungskarte zeigt die Position im Plan bereits an. */
function planNav() {
  var i = planIndex();
  if (i < 0) return "";
  var list = S.plans[S.plan];
  var prev = i > 0 ? list[i-1] : null;
  var next = i < list.length - 1 ? list[i+1] : null;
  return '<div class="nextnav">' +
    '<button data-act="planstep" data-d="-1"' + (prev ? "" : " disabled") +
    ' aria-label="Vorherige Übung">&#8249;</button>' +
    '<button data-act="planstep" data-d="1"' + (next ? "" : " disabled") + '>' +
    (next ? "Weiter zu " + esc(next.name) : "Letzte Übung im Plan") +
    '</button></div>';
}

/* ---------- Fokus-Modus, 1.7.0 ---------- */
/* Plan und Position, oben im Fokus-Kopf. Anders als logHead() nennt diese Zeile
   den Plannamen mit, weil im Fokus kein Planwähler mehr darüber steht. */
function focusWho() {
  var mins = currentSessionMinutes(S.date);
  if (S.plan && S.plans[S.plan] && S.plans[S.plan].length) {
    var list = S.plans[S.plan], i = planIndex();
    var next = (i >= 0 && i < list.length - 1) ? list[i + 1].name : "";
    return '<div class="who"><b>' + esc(S.plan) + '</b><span class="wholine"><em>' +
      (i >= 0 ? "Übung " + (i + 1) + " von " + list.length
              : list.length + (list.length === 1 ? " Übung" : " Übungen")) +
      (mins ? " · " + mins + " min" : "") + '</em>' +
      (next ? '<i>Next: ' + esc(next) + '</i>' : "") + '</span></div>';
  }
  return '<div class="who"><b>Freies Training</b>' +
    (mins ? '<span>' + mins + ' min</span>' : '') + '</div>';
}

/* Bildschirmfüllender Trainingsbildschirm ohne Reiter, Wochenstreifen oder
   Planauswahl. Nutzt dieselben Datenfelder und denselben Klick-Handler wie
   der normale Trainingsreiter, ist also nur eine andere Ansicht desselben
   Zustands, keine zweite Datenquelle. */
/* Der Fokus-Modus: Kopfzeile mit Zurück und Fortschritt, darunter die Übungskarte
   und der feste Fuß mit Speichern und den beiden Wegen weiter. Bis 1.30.1 stand
   das in einer Funktion mit einer Komplexität von 50, die Entscheidungslogik für
   den rechten Knopf war der größte Teil davon, siehe focusRightButton(). */
function viewFocus() {
  if (S.pickOpen) {
    return '<div class="fx"><div class="fx-body pad">' + viewPicker() + '</div></div>';
  }
  var h = '<div class="fx"><div class="fx-head">' +
    '<button class="back" data-act="focusoff" aria-label="Fokus verlassen">' +
    svg("zurueck", 22) + '</button>' + focusWho() + '</div>' + planProgress() +
    /* Auch hier, der Fokus-Modus zeigt keine Datumszeile: ohne den Hinweis
       bliebe dort völlig unklar, warum nach dem Satz nichts passiert. */
    '<div class="fx-body">' + restOffNote();

  if (!S.exercise) {
    h += '<div class="fx-blank"><div class="hero-ex">Bereit für den ersten Satz</div>' +
      '<p class="notice">Wähle eine Übung, Reps und Gewicht werden dann ' +
      'aus deinem letzten Training vorgeschlagen.</p>' +
      '<button class="save" data-act="pickopen">Übung wählen</button></div></div></div>';
    return h;
  }
  return h + focusHero() + '</div>' + focusFoot() + '</div>';
}
/* Die Übungskarte im Fokus: Ziel, letztes Top Set, Vorschlag, Gewicht, Reps, RPE
   und, wenn eingestellt, Scheiben und Aufwärmrampe. Ohne das schließende Tag
   von fx-body, das setzt viewFocus(). */
function focusHero() {
  var last = lastSession(S.exercise, S.date);
  var tg = planTarget(S.exercise);
  /* "Letztes Top Set" zeigt den besten Arbeitssatz der letzten früheren Einheit,
     nicht deren chronologisch letzten Satz. Ein leichter Auslaufsatz verfälscht
     die Zeile deshalb nicht. */
  var lastSet = last ? bestSet(last.sets) : null;
  var doneN = doneSets(S.exercise, S.date), needN = targetSets(S.exercise);
  var isToday = S.date === todayISO();
  var flat = isToday ? plateau(S.exercise) : 0;
  var curW = deci(S.weight) || 0;
  var wBase = S.warm && S.warmBase > 0 ? S.warmBase : curW;
  var ramp = doneSets(S.exercise, S.date) ? [] : warmupPlan(S.exercise, wBase);
  var split = isBar(S.exercise) ? plateSplit(curW) : null;
  var showPlates = S.settings.focusPlates;
  var fxRng = repRangeShown(S.exercise);

  /* Pillenanzeige aus dem Standard-Trainingsreiter übernommen (.setprog), hier
     anstelle der Textzeile "Satz X von Y": blau der aktuelle, grün die erledigten
     Sätze. Immer needN Pillen, auch wenn mehr Sätze als geplant erfasst wurden -
     der zusätzliche Satz bleibt allein Sache des Speichern-Knopfs. */
  var setBars = "";
  for (var si = 0; si < needN; si++) {
    setBars += '<i class="' + (si < doneN ? "done" : (si === doneN ? "cur" : "")) + '"></i>';
  }

  return '<div class="hero-top">' +
    '<button class="hero-ex tap" data-act="pickopen" title="Andere Übung wählen">' +
    '<span>' + esc(S.exercise) + '</span><i class="chev">' + svg("chev", 16) + '</i></button>' +
    '<div class="setprog"><div class="bars">' + setBars + '</div></div>' +
    '</div>' +
    '<div class="hero-meta">' +
    /* Wie im Standard-Trainingsreiter: bei doppelter Progression die Range
       statt der einen Zielzahl, siehe repRangeShown(). */
    (tg ? "Ziel <b>" + needN + "x " +
      (fxRng ? rangeText(fxRng) : tg.reps) + " Reps</b> mit <b>" +
      num(tg.weight) + " kg</b><br>" : "") +
    (lastSet ? "Letztes Top Set <b>" + lastSet.reps + "x " + num(lastSet.weight) + " kg</b> am " +
      tinyDate(last.day) + (lastSet.rpe != null ? " bei RPE " + num(lastSet.rpe) : "") +
      "" : "Erste Aufzeichnung für diese Übung") +
    /* Kein Rekord im Fokus, siehe BACKLOG. Im normalen Trainingsbildschirm steht
       er weiterhin über planTarget()/bestOf() in derselben Zeile. */
    '</div>' +
    (isToday ? suggestionBlock() : "") +
    (isToday && flat ? '<div class="flag">Seit ' + flat + ' Wochen unverändert bei ' +
      num(lastSet ? lastSet.weight : 0) + ' kg. Zeit für mehr Gewicht, mehr ' +
      'Reps oder eine andere Übung.</div>' : "") +
    exNoteBlock() +
    weightDial(S.exercise) +
    (showPlates && split ? '<div class="plates">Stange ' + num(split.bar) + ' kg, pro Seite ' +
      split.side.map(num).join(' + ') +
      (split.rest > 0.001 ? '<b> und ' + num(split.rest) + ' kg fehlen</b>' : '') +
      '</div>' : "") +
    '<div class="fieldlab">REPS</div>' + focusRepPills() +
    (S.warm ? "" : '<div class="fieldlab">RPE</div>' + rpePills()) +
    (showPlates && ramp.length
      ? '<div class="warmrow"><span>Warmup</span>' +
        ramp.map(function (r, ri) {
          return '<button data-act="warmpick" data-i="' + ri + '">' + num(r.weight) +
            ' kg <s>&times;' + r.reps + '</s></button>';
        }).join("") + '</div>'
      : "") +
    /* Ganz unten, damit Gewicht und Reps oben stehen bleiben: der Verlauf ist
       zum Nachsehen da, nicht zum Eingeben, siehe exHistBlock(). */
    exHistBlock();
}
/* Der Fuß: Abschluss-Nachfrage oder Meldung, Schnell-Rückgängig, Speichern und
   darunter links der Rückweg (Aufwärmen, andere Übung), rechts der Weg weiter. */
function focusFoot() {
  var n = nextSet(), doneN = doneSets(S.exercise, S.date);
  var done = doneN >= targetSets(S.exercise);
  /* Links: Aufwärmsatz nur anbieten, solange noch kein Arbeitssatz dieser Übung
     erfasst ist, danach macht der Umstieg auf ein Aufwärmgewicht keinen Sinn
     mehr - stattdessen Wechsel zu einer anderen Übung. Rechts: sobald ein
     Arbeitssatz erfasst ist, heißt "Überspringen" schon "Nächste Übung", auch
     bevor das Satzziel erreicht ist; die Akzentfarbe kommt erst mit dem Ziel. */
  var leftBtn = S.warm
    ? '<button data-act="warmoff">Doch ein Arbeitssatz</button>'
    : doneN === 0
      ? '<button data-act="warmon">Aufwärmsatz erfassen</button>'
      : '<button data-act="pickopen">Andere Übung</button>';
  return '<div class="fx-foot">' +
    (S.focusEndConfirm ? endWarnBlock() :
    (S.toast ? '<div class="toast">' + S.toast + '</div>' : "") +
    (S.quickUndo && S.undo && S.undo.kind === "newset"
      ? '<button class="undoquick" data-act="undo">' + svg("zurueck", 15) +
        '<span>Letzten Satz löschen</span></button>'
      : "") +
    '<button class="save' + (S.warm ? " warm" : "") + '" data-act="save">' +
    (S.warm ? "Aufwärmsatz speichern" : "Satz " + n + " speichern") + ': ' +
    esc(S.weight) + ' kg × ' + esc(S.reps) + '</button>' +
    '<div class="subacts">' + leftBtn + focusRightButton(doneN, done) + '</div>') + '</div>';
}
/* Der rechte Knopf im Fuß des Fokus-Modus, je nach Stand im Plan */
function focusRightButton(doneN, done) {
  var pIdx = planIndex();
  var inPlan = pIdx >= 0;
  var hasNext = S.plan && S.plans[S.plan] && inPlan &&
    pIdx < S.plans[S.plan].length - 1;
  if (planAllDone()) {
    /* Ist der ganze Plan erledigt, gilt das für jede seiner Übungen, nicht nur
       für die letzte in der Reihenfolge - sonst zeigt nur die letzte Übung den
       Abschluss an, obwohl längst alle Zielsätze stehen. */
    return '<button class="go" data-act="focusfinish">Trainingsplan abschließen</button>';
  } else if (hasNext) {
    return '<button class="' + (done ? "go" : "") + '" data-act="planstep" data-d="1">' +
      (doneN > 0 ? "Nächste Übung" : "Übung überspringen") + '</button>';
  } else if (S.plan && S.plans[S.plan] && S.plans[S.plan].length && !inPlan) {
    /* Übung außerhalb des aktiven Plans gewählt, etwa über "Andere Übung": ihr
       eigenes Satzziel sagt nichts über den Plan aus, der läuft also weiter,
       solange er noch offene Übungen hat. */
    var openItem = nextPlanOpen();
    return openItem
      ? '<button class="go" data-act="planpick" data-v="' + esc(openItem.name) +
        '">Weiter mit Plan</button>'
      : '<button class="go" data-act="focusfinish">Trainingsplan abschließen</button>';
  } else if (done) {
    /* Letzte Übung der Plan-Reihenfolge fertig, aber andere Übungen können noch
       offen sein, etwa nach "Übung überspringen" oder "Andere Übung". Statt
       sofort abzuschließen, erst nachfragen, siehe endWarnBlock() unten. */
    return '<button class="go" data-act="focusfinishask">Trainingsplan abschließen</button>';
  } else {
    return doneN === 0 ? '<button data-act="pickopen">Andere Übung</button>' : "";
  }
}
/* Großer Hinweis statt des sofortigen Abschlusses, wenn beim Antippen von
   "Trainingsplan abschließen" noch andere Übungen des Plans offen sind. */
function endWarnBlock() {
  var n = openPlanCount();
  return '<div class="endwarn"><b>Noch ' + n + (n === 1 ? ' Übung offen' : ' Übungen offen') +
    '</b><p>Training wirklich beenden?</p>' +
    '<div class="row">' +
    '<button data-act="focusfinishcancel">Weiter trainieren</button>' +
    '<button class="go" data-act="focusfinish">Ja, beenden</button>' +
    '</div></div>';
}

/* Punkt 10: bildschirmfüllende Zusammenfassung nach "Trainingsplan abschließen"
   bzw. "Training abschließen und sichern", dieselbe Datengrundlage wie
   trainingSummary(). Nutzt denselben ".fx"-Rahmen wie der Fokus-Modus. */
function viewSummary() {
  var sum = S.summaryData || trainingSummary(S.date);
  var h = '<div class="fx"><div class="fx-head"><div class="who"><b>Training ' +
    'abgeschlossen</b><span>' + longDay(S.date) + '</span></div></div>' +
    '<div class="fx-body pad">' +
    '<div class="hero-ex">Gute Arbeit!</div>' +
    '<div class="hero-meta">' + sum.exCount + (sum.exCount === 1 ? " Übung, " : " Übungen, ") +
    sum.sets + (sum.sets === 1 ? " Satz, " : " Sätze, ") + num(sum.volume) +
    ' kg Gesamtlast' + (sum.mins ? ', ' + sum.mins + ' min Trainingsdauer' : '') + '.</div>';
  if (sum.records.length) {
    h += '<div class="fieldlab">NEUE REKORDE</div><div class="card" style="padding:0">' +
      sum.records.map(function (r) {
        return '<div class="prrow"><span class="nm">' + esc(r.exercise) + '</span>' +
          '<span class="up">' + num(r.weight) + ' kg × ' + r.reps + '</span>' +
          '<span class="fig">vorher ' + num(r.prevWeight) + ' kg × ' + r.prevReps +
          '</span></div>';
      }).join("") + '</div>';
  } else {
    h += '<p class="notice">Keine neuen Rekorde heute, aber jeder Satz zählt.<br><br>' +

  }
  h += '<div class="savearea"><button class="save" data-act="summaryok">Fertig</button>' +
    '</div></div></div>';

}

/* ---------- Pläne, Punkt 8 ---------- */
/* Geplante Sätze je Muskelgruppe über alle im Training eingeblendeten Pläne,
   zum Prüfen, wie sich eigene Pläne kombinieren, bevor trainiert wird. Zählt
   wie volByMuscle(): Primärmuskel voll, jeder Sekundärmuskel halb. Ein Plan mit
   Wochenziel geht so oft ein, wie er pro Woche vorgesehen ist, ohne Ziel einmal.
   Ausgeblendete Pläne bleiben außen vor, die werden gerade nicht trainiert. */
/* Sätze je Muskelgruppe aus einer Liste von Quellen, jede mit Übungen (name,
   sets) und einer Häufigkeit pro Woche. Zählt wie volByMuscle(): Primärmuskel
   voll, jeder Sekundärmuskel halb. Gemeinsame Rechnung für den Pläne-Reiter
   (Pläne mit Wochenziel, siehe planMuscleBlock()) und die Planung (Entwurf mit
   einzelnen Übungen, siehe draftMuscleBlock()). */
function muscleTally(sources) {
  var by = {}, unassigned = [];
  MUSCLE_LIST.forEach(function (m) { by[m] = { total:0, src:{} }; });
  sources.forEach(function (sc) {
    sc.items.forEach(function (i) {
      var mo = muscleOf(i.name);
      if (!mo) { if (unassigned.indexOf(i.name) < 0) unassigned.push(i.name); return; }
      var n = (i.sets > 0 ? i.sets : defaultSets()) * sc.times;
      by[mo.primary].total += n;
      by[mo.primary].src[sc.key] = (by[mo.primary].src[sc.key] || 0) + n;
      mo.secondary.forEach(function (sm) {
        by[sm].total += n * 0.5;
        by[sm].src[sc.key] = (by[sm].src[sc.key] || 0) + n * 0.5;
      });
    });
  });
  return { by:by, unassigned:unassigned };
}
/* Karte mit gestapelten Balken je Muskelgruppe in den Farben der Quellen, Legende,
   Gegenspieler-Paare und der Liste der Übungen ohne Zuordnung.
   opts.showZero: Gruppen ohne Satz rot mit aufführen statt weglassen (Planung).
   opts.flagRatio: ein Paar rot markieren, sobald eine Seite so viel mal mehr hat
   als die andere oder ganz leer ausgeht (Planung). Ohne beides genau die Karte,
   die der Pläne-Reiter seit 1.21.0 zeigt. */
function muscleBars(res, sources, opts) {
  var by = res.by;
  var groups = MUSCLE_LIST.filter(function (m) { return opts.showZero || by[m].total > 0; });
  var max = Math.max.apply(null, MUSCLE_LIST.map(function (m) { return by[m].total; })) || 1;
  var h = '<div class="card"><div class="vol bymuscle" style="margin-top:0">';
  groups.forEach(function (m) {
    h += '<div class="volrow' + (by[m].total ? "" : " zero") + '"><span class="vn">' +
      esc(m) + '</span><div class="vb stack">' +
      sources.filter(function (sc) { return by[m].src[sc.key]; }).map(function (sc) {
        return '<i style="width:' + (by[m].src[sc.key] / max * 100).toFixed(1) +
          '%;background:' + sc.color + '" title="' + esc(sc.label) + ': ' +
          fmtCount(by[m].src[sc.key]) + '"></i>';
      }).join("") + '</div>' +
      '<span class="vv">' + fmtCount(by[m].total) + '</span></div>';
  });
  h += '</div>' +
    '<div class="planlegend">' + sources.map(function (sc) {
      return '<span><span class="pdot" style="background:' + sc.color + '"></span>' +
        esc(sc.label) + (sc.times > 1 ? ' ×' + sc.times : '') + '</span>';
    }).join("") + '</div>';
  /* Dieselben Gegenspieler-Paare wie die Warnung im Verlauf. Im Pläne-Reiter nur
     als Zahlenpaar ohne Schwelle: die Planung soll das Verhältnis zeigen, bewerten
     kann man es erst am tatsächlichen Training. Der Entwurf markiert ab flagRatio,
     dort geht es um genau die Frage, ob der Mix aufgeht. */
  var pairs = MUSCLE_PAIRS.filter(function (pr) {
    return by[pr[0]].total > 0 || by[pr[1]].total > 0;
  });
  if (pairs.length) {
    var flagged = 0;
    h += '<p class="pairline">' + pairs.map(function (pr) {
      var a = by[pr[0]].total, b = by[pr[1]].total, off = false;
      if (opts.flagRatio) off = !a || !b || a / b >= opts.flagRatio || b / a >= opts.flagRatio;
      if (off) flagged++;
      return esc(pr[0]) + ' zu ' + esc(pr[1]) + ' <b' + (off ? ' class="off"' : "") + '>' +
        fmtCount(a) + ' : ' + fmtCount(b) + '</b>';
    }).join('<br>') +
      (flagged ? '<span class="why">Rot ab ' + fmtCount(opts.flagRatio) +
        ' : 1 oder wenn eine Seite leer ausgeht.</span>' : "") + '</p>';
  }
  if (opts.showZero) {
    var zero = MUSCLE_LIST.filter(function (m) { return !by[m].total; });
    if (zero.length) {
      h += '<p class="pairline">Ohne Satz im Entwurf: ' + zero.map(esc).join(', ') + '.</p>';
    }
  }
  if (res.unassigned.length) {
    h += '<p class="pairline">Ohne Muskelgruppe, hier nicht gezählt: ' +
      res.unassigned.map(esc).join(', ') + '. Zuordnen lässt sich das unter Daten, ' +
      'Muskelgruppen.</p>';
  }
  return h + '</div>';
}
function planMuscleBlock() {
  /* Nur Pläne mit einem aktiven Wochenziel (mind. 1): ein sichtbarer Plan ohne
     Ziel wird nicht notwendig regelmäßig trainiert, seine Sätze in die Summe
     zu rechnen würde eine Regelmäßigkeit vorspiegeln, die es nicht gibt. Wer
     hier auftauchen will, setzt sein Wochenziel. Wer nur nachsehen will, wie ein
     anderer Mix aussähe, nimmt den Reiter Planung. */
  var plans = visiblePlans().filter(function (p) {
    return S.plans[p] && S.plans[p].length && weekGoal(p) > 0;
  });
  var sources = plans.map(function (p) {
    return { key:p, label:p, color:planColor(p), times:weekGoal(p), items:S.plans[p] };
  });
  var res = muscleTally(sources);
  var open = secOpen("plansets");
  var h = '<div class="sect"><h2>Sätze je Muskelgruppe' + infoBtn("plansets") + '</h2>' +
    secFold("plansets", "pro Woche") + '</div>' +
    descText("plansets", '<p class="notice">Wochensumme über alle eingeblendeten Pläne mit ' +
      'einem Wochenziel, gezählt wie im Verlauf: Primärmuskel voll, Sekundärmuskel halb, ' +
      'jeder Plan so oft wie sein Wochenziel es vorsieht. Pläne ohne Wochenziel oder ' +
      'ausgeblendete Pläne fehlen, sie laufen ja nicht notwendig regelmäßig. Der Balken ' +
      'zeigt in den Planfarben, welcher Plan wie viel beiträgt. Einen anderen Mix ' +
      'durchspielen, ohne die Wochenziele anzufassen, geht im Reiter Planung.</p>');
  if (!open) return h;
  if (!plans.length) {
    return h + '<p class="notice">Kein eingeblendeter Plan hat ein Wochenziel. Unter ' +
      'Wochenziele oben lässt sich eines setzen.</p>';
  }
  if (!MUSCLE_LIST.some(function (m) { return res.by[m].total > 0; })) {
    return h + '<p class="notice">Kein eingeblendeter Plan mit Wochenziel enthält eine ' +
      'Übung mit Muskelgruppe.</p>';
  }
  return h + muscleBars(res, sources, {});
}

    '<div class="tools"><button class="wide" data-act="planfoldall">' +
    (S.planCardsFold ? "Alle Pläne ausklappen" : "Alle Pläne einklappen") + '</button></div>';

  h += '<div class="sect"><h2>Standardwerte' + infoBtn("standardwerte") + '</h2></div>' +

    '<div class="newrow">' +

  h += '<div class="sect"><h2>Neuer Plan</h2></div>' +
    '<div class="newrow"><input id="newPlan" placeholder="Name, etwa Push Day">' +
    '<button data-act="addplan">Anlegen</button></div>' +
